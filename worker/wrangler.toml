# LP Planner — planner-api Worker (D1 storage + sign-in)
# Secrets are NOT in this file. Set them once with:
#   wrangler secret put GOOGLE_CLIENT_SECRET   (the same secret planner-auth uses)
#   wrangler secret put TOKEN_ENC_KEY          (32 random bytes, base64 — see SETUP.md)

name = "planner-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGIN = "https://zacharypals.github.io"
# Must exactly match an "Authorized redirect URI" on the Google OAuth client.
REDIRECT_URI = "https://zacharypals.github.io/Planner_Web_App_TEST/oauth.html"
# Same OAuth client LP Planner already uses (keeps access to the Drive file for the later import).
GOOGLE_CLIENT_ID = "1050376914317-d9al0irmqsmhkq334rffqg30mbtlguuf.apps.googleusercontent.com"
# Comma-separated. Each person gets their own private data. Removing an email locks it out on the next request.
ALLOWED_EMAILS = "znpals@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "planner-db"
database_id = "40279ea1-b79c-4950-a671-857fefbebf36"
migrations_dir = "migrations"

[triggers]
crons = ["0 10 * * *"]

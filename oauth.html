<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, #5c2d52 0%, #7c3f6e 100%); color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<p>Signing in…</p>
<script>
  // Google redirects here with ?code=…&state=… (or ?error=…). Hand it straight to the app,
  // which checks the state and finishes sign-in with planner-api. Full-page redirect flow:
  // it also works inside the installed iPhone home-screen app, unlike popups.
  location.replace('./#lp_oauth=' + encodeURIComponent(location.search.slice(1)));
</script>
</body>
</html>

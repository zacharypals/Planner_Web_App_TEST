  .main-content { flex: 1; display: flex; overflow: hidden; }

  /* SIDEBAR */

  .week-nav {

  /* CHECKLIST */
  .checklist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .add-btn {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--accent);
    background: none; color: var(--accent); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    transition: all 0.15s;
  }
  .add-btn:hover { background: var(--accent); color: white; }
  .checklist-item {
    display: flex; align-items: flex-start; gap: 8px; padding: 5px 6px;
    border-radius: 6px; transition: background 0.15s;
    cursor: default;
  }
  .checklist-item:hover { background: var(--cream); }
  .checklist-item.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-light); }
  .checklist-item.dragging { opacity: 0.4; }
  .checklist-drag-handle {
    font-size: 12px; color: var(--ink-faint); cursor: grab; opacity: 0;
    transition: opacity 0.15s; flex-shrink: 0; padding: 0 2px;
    user-select: none; margin-top: 3px;
  }
  .checklist-item:hover .checklist-drag-handle { opacity: 0.5; }

  .checklist-item.checked .checklist-label { text-decoration: line-through; color: var(--ink-faint); }
  .check-box {
    width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 3px;

    transition: all 0.15s; margin-top: 2px;
  }
  .check-box.checked { background: var(--accent); border-color: var(--accent); }
  .check-box.checked::after { content: '✓'; color: white; font-size: 10px; }
  .checklist-input {
    flex: 1; border: none; background: transparent; font-size: 12.5px;
    font-family: 'DM Sans', sans-serif; color: var(--ink); outline: none;

  }
  .checklist-input::placeholder { color: var(--ink-faint); }
  .delete-item-btn {

  }

  /* SIDEBAR LINKS */
  .sidebar-links { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 6px; }
  .sidebar-link.daily { display: block; margin: 8px 12px 16px; }
  .sidebar-link {
    display: block; padding: 8px 12px; border-radius: var(--radius-sm); text-decoration: none;

  }
  .sidebar-link.planner { background: var(--accent-light); color: var(--accent); }
  .sidebar-link.planner:hover { background: var(--accent); color: white; }
  .sidebar-link.daily { background: rgba(203,146,56,0.15); color: var(--gold); display: block; margin: 8px 12px 16px; text-decoration: none; }
  .sidebar-link.daily:hover { background: var(--gold); color: white; }

  /* MAIN PANEL */
  .main-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }

  /* WEEKLY CALENDAR */
  .weekly-calendar { height: calc(100vh - 148px); flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  .cal-scroll-wrapper {
    flex: 1; overflow: auto;
  }
  .cal-scroll-wrapper::-webkit-scrollbar { width: 5px; height: 10px; }
  .cal-scroll-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .cal-scroll-wrapper::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 5px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(220px, 1fr));

  .cal-header-cell {

  .cal-header-cell .day-name { color: rgba(255,255,255,0.6); }
  .cal-header-cell .day-date { color: rgba(255,255,255,0.95); font-family: 'Playfair Display', serif; font-size: 18px; margin-top: 2px; }
  .cal-header-cell.today .day-date { color: var(--gold); }
  .cal-day {

  .cal-day:hover { background: var(--accent-light); box-shadow: inset 0 0 0 1px var(--border); }
  .cal-day.today { background: var(--gold-light); }
  .add-task-btn {
    width: 100%; border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
    background: transparent; color: var(--ink-faint); padding: 6px;
    cursor: pointer; font-size: 18px; transition: all 0.15s; display: block;
    margin-top: 6px;
  }
  .add-task-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 8px;

  .day-note-label {

  .day-note-textarea {

  }
  .day-note-textarea:focus { background: rgba(0,0,0,0.06); }
  .day-note-textarea::placeholder { color: var(--ink-faint); font-style: italic; }

  /* ── DAILY HABITS IN PLANNER ── */
  .habit-task-section {
    border-bottom: 1px solid rgba(0,0,0,0.07);
    margin-bottom: 5px;
  }
  .habit-task-label {
    display: flex; align-items: center; gap: 4px;

  .habit-task-row {

    transition: background 0.1s;
  }
  .habit-task-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
  .habit-task-check {

    cursor: pointer; flex-shrink: 0; transition: all 0.12s;

  .habit-selected-date-mobile { display: none; }

    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  }
  .habit-schedule-btn {
    font-size: 10px; font-family: 'DM Sans', sans-serif; font-weight: 500;
    border: 1px solid var(--border); border-radius: 20px;
    padding: 2px 8px; cursor: pointer; background: var(--surface); color: var(--ink-light);
    transition: all 0.12s; white-space: nowrap;
  }
  .habit-schedule-btn.active {
    background: var(--accent); border-color: var(--accent); color: white; font-weight: 600;
  }
  .habit-schedule-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* ── PEOPLE PICKER MODAL ── */
  .people-picker-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 80px; background: rgba(0,0,0,0.25);
    backdrop-filter: blur(2px);
  }
  .people-picker-modal {
    background: var(--paper); border-radius: var(--radius-lg);
    box-shadow: 0 8px 32px var(--shadow-lg);
    width: 300px; max-height: 440px; display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── FITNESS TAB ── */
  .fitness-layout { display: flex; flex: 1; overflow: hidden; height: 100%; }
  .fitness-sidebar {
    width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--paper); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px 12px;
  }
  .fitness-main {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .fitness-day-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .fitness-day-label {
    font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600;
    color: var(--ink); text-align: center; flex: 1;
  }
  .fitness-day-sub {
    font-size: 10px; font-family: 'DM Mono', monospace; color: var(--ink-faint);
    text-align: center; margin-top: 1px;
  }
  /* Workout card */
  .workout-card {
    background: var(--paper); border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px var(--shadow);
    overflow: hidden;
  }
  .workout-card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--tint);
    border-bottom: 1px solid rgba(106,80,167,0.15);
  }
  .workout-name-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--accent);
  }
  /* Exercise block */
  .exercise-block {
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }
  .exercise-block:last-child { border-bottom: none; }
  .exercise-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .exercise-name {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--ink); flex: 1;
  }
  .exercise-meta {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint);
    white-space: nowrap;
  }
  /* Set rows */
  .set-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .set-row:last-child { border-bottom: none; }
  .set-row.done { opacity: 0.55; }
  .set-row-main { display: flex; align-items: center; gap: 6px; width: 100%; }
  .set-note-input {
    width: 100%; font-family: 'DM Sans', sans-serif; font-size: 11px;
    border: none; border-top: 1px solid rgba(0,0,0,0.05); border-radius: 0;
    padding: 2px 4px 3px 26px; background: transparent; color: var(--ink-light);
    outline: none; margin-top: 0;
  }
  .set-note-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .set-note-input:focus { background: rgba(106,80,167,0.04); }
  .set-num {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint);
    width: 18px; flex-shrink: 0; text-align: right;
  }
  .set-input {
    width: 52px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 3px 5px; text-align: center; background: var(--surface); color: var(--ink);
    outline: none;
  }
  .set-input:focus { border-color: var(--accent); }
  .set-label {
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint);
    flex-shrink: 0;
  }
  .set-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all 0.12s; margin-left: 10px;
    background: var(--surface);
  }
  /* v4.5.2: delete ✕ sits alone at the far right, away from the check */
  .set-del-btn { margin-left: auto; background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink-faint); opacity: 0.35; line-height: 1; padding: 6px 4px 6px 10px; }
  .set-del-btn:hover { opacity: 0.8; color: var(--red); }
  .set-check:hover { border-color: var(--accent); background: var(--accent-light); }
  .set-check.done { background: var(--accent); border-color: var(--accent); }
  .set-check.done::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }
  /* Exercise library in sidebar */
  .ex-lib-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 6px; border-radius: var(--radius-sm);
    cursor: default; transition: background 0.1s; font-size: 12px;
    font-family: 'DM Sans', sans-serif; color: var(--ink);
  }
  .ex-lib-item:hover { background: var(--cream); }
  .ex-lib-cat {
    font-size: 9px; font-family: 'DM Mono', monospace; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 6px 2px;
  }
  /* Fitness picker modal */
  .fitness-picker-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 80px; background: rgba(0,0,0,0.25); backdrop-filter: blur(2px);
  }
  .fitness-picker-modal {
    background: var(--paper); border-radius: var(--radius-lg);
    box-shadow: 0 8px 32px var(--shadow-lg);

  /* Fitness completed stats pill */
  .fitness-stat-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-light); border-radius: 20px;
    padding: 2px 8px; font-size: 10px; font-family: 'DM Mono', monospace;
    color: var(--accent); font-weight: 600;
  }
  /* v5.17.0 personal-record badge (header pill) and detail lines (inside the open tile) */
  .pr-pill {
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
    background: var(--gold-light); border: 1px solid var(--gold); border-radius: 20px;

  }
  @media (max-width: 767px) { .pr-pill .pr-txt { display: none; } .pr-pill { padding: 1px 6px; } }  /* phones: trophy only, the open tile says which PR */
  .pr-notes { display: flex; flex-direction: column; gap: 3px; padding: 2px 0 6px; }
  .pr-note { font-size: 11px; color: var(--ink-light); font-family: 'DM Sans', sans-serif; }
  .pr-note b { color: var(--gold); font-weight: 700; }
  /* ── FITNESS CHARTS (v5.19.0) ── */
  .fc-wrap { display: flex; flex-direction: column; gap: 12px; font-family: 'DM Sans', sans-serif; }
  .fc-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .fc-tile { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; min-width: 0; overflow: hidden; box-sizing: border-box; }
  .fc-tile-lb { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-family: 'DM Mono', monospace; }
  .fc-tile-v { font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .fc-tile-sub { font-size: 11px; color: var(--ink-light); }
  .fc-sub-note { font-size: 11px; color: var(--ink-light); margin-top: -6px; }
  .fc-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .fc-card-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .fc-card-hd h3 { margin: 0; font-size: 15px; font-family: 'Playfair Display', serif; color: var(--ink); }
  .fc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fc-chip { border: 1px solid var(--border); background: var(--cream); color: var(--ink-light); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit; min-height: 28px; }
  .fc-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .fc-select, .fc-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); padding: 7px 9px; font-size: 13px; font-family: inherit; min-height: 34px; }
  .fc-readout { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; font-size: 12px; color: var(--ink-light); margin-bottom: 2px; }
  .fc-readout b { color: var(--ink); }
  .fc-readout i, .fc-legend i, .fc-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; flex-shrink: 0; }
  .fc-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-light); }
  .fc-empty { font-size: 12.5px; color: var(--ink-faint); font-style: italic; padding: 8px 0; }
  .fc-note { font-size: 12px; color: var(--ink-light); }
  .fc-note.ok { color: var(--accent); } .fc-note.warn { color: var(--red); }
  .fc-goal { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .fc-goal:first-of-type { border-top: none; padding-top: 0; }
  .fc-goal-hd { display: flex; align-items: center; font-size: 13px; color: var(--ink); } .fc-goal-hd span { color: var(--ink-light); }
  .fc-goal-sub { font-size: 11px; color: var(--ink-faint); }
  .fc-goal-big { font-size: 22px; font-weight: 700; color: var(--ink); } .fc-goal-big small { font-size: 12px; font-weight: 500; color: var(--ink-light); }
  .fc-edit summary { cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 600; padding: 4px 0; }

  /* TASK CARDS */
  .task-card {

  .task-card-header {
    display: flex; align-items: center; gap: 5px; padding: 7px 8px;
    font-size: 12px; font-weight: 500;
  }
  .task-check {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor;
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .task-check.done::after { content: '✓'; font-size: 9px; }
  .task-title-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-size: 11px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    cursor: text; resize: none; overflow: hidden; white-space: pre-wrap;
    word-break: break-word; line-height: 1.3; display: block; padding: 0;
  }
  .task-expand-btn {
    background: none; border: none; cursor: pointer; font-size: 10px;
    opacity: 0.5; flex-shrink: 0; padding: 0 2px;
    color: var(--ink); line-height: 1;
  }
  .task-expand-btn:hover { opacity: 1; }
  .task-delete-btn {
    position: absolute; bottom: 6px; right: 2px;
    background: #e74c3c; border: none; cursor: pointer;
    color: white; border-radius: 6px;
    width: 20px; height: 20px; font-size: 12px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s 0s, visibility 0s 0s;
  }
  .task-card:hover .task-delete-btn {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.2s 1.15s, visibility 0s 1.1s;
  }
  .task-delete-btn:hover { background: #c0392b; }
  .task-delete-btn.confirming {
    width: auto; padding: 0 8px; font-size: 11px; font-weight: 700;
    background: #c0392b; white-space: nowrap; border-radius: 6px;
    visibility: visible; opacity: 1; transition: none;
  }
  .task-delete-btn.confirming:hover { background: #96281b; }
  /* Two-option confirm for repeat tasks (desktop) */
  .task-delete-repeat-confirm {
    position: absolute; top: 4px; right: 4px;
    display: flex; align-items: center; gap: 3px; z-index: 10;
  }
  .task-delete-repeat-btn {
    font-size: 10px; padding: 2px 6px; border-radius: 5px; border: none; cursor: pointer;

    background: var(--border); color: var(--ink-light); line-height: 1;

  .task-mobile-delete-btn {

  }

  .task-details {

  /* TASK CHECKLIST (v5.9.0) */

  /* TASK COLOR PICKER */

    border: 1px solid var(--border); border-radius: 6px; font-size: 11px;

  }
  .countdown-number.done { font-size: 22px; }
  .countdown-info { flex: 1; min-width: 0; }
  .countdown-unit {
    font-family: 'DM Mono', monospace; font-size: 8px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-faint); margin-top: 2px;
  }
  .countdown-title {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .countdown-dates {
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint); margin-top: 1px;
  }
  .countdown-progress-bg {
    height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px;
  }
  .countdown-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .countdown-delete {
    position: absolute; top: 5px; right: 5px; background: none; border: none;
    cursor: pointer; font-size: 10px; color: var(--ink-faint); opacity: 0;
    transition: opacity 0.15s; line-height: 1; padding: 2px 3px; border-radius: 3px;
  }
  .countdown-card:hover .countdown-delete { opacity: 1; }
  .countdown-delete:hover { background: var(--red-light); color: var(--red); opacity: 1 !important; }
  .countdown-add-form {
    background: var(--cream); border-radius: var(--radius-sm); border: 1px solid var(--border);
    padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 7px;
  }
  .countdown-color-swatch {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    transition: transform 0.1s;
  }
  .countdown-color-swatch:hover { transform: scale(1.2); }
  .countdown-color-swatch.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
  .habit-qty-input {
    width: 36px; border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 4px; font-size: 11px; font-family: 'DM Mono', monospace;
    color: var(--ink); background: var(--surface); text-align: center;
    flex-shrink: 0;
  }
  .habit-qty-input:focus { outline: none; border-color: var(--accent); }
  .habit-qty-input::placeholder { color: var(--border); font-size: 10px; }
  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .date-nav-label { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; }

  .goal-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: var(--radius-sm); margin-bottom: 4px; transition: background 0.1s;
    cursor: pointer; border: 1.5px solid transparent;
  }
  .goal-item:hover { background: var(--cream); }
  .goal-item.selected { background: var(--cream); border-color: var(--border); }
  .goal-item.selected .goal-name-input { font-weight: 600; }
  .goal-color-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .goal-check {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border);
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; background: var(--surface);
  }
  .goal-check.checked { border-color: currentColor; }
  .goal-check.checked::after { content: '✓'; font-size: 11px; }
  .goal-name-input {
    flex: 1; border: none; background: transparent; font-size: 12.5px;
    font-family: 'DM Sans', sans-serif; outline: none; color: var(--ink);
    min-width: 0;
  }
  .goal-name-area { display: block; width: 100%; resize: none; overflow: hidden; padding: 0; line-height: 1.3; }
  .goal-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light); margin-top: 2px; }
  .goal-count {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light);
    background: var(--cream); padding: 2px 6px; border-radius: 10px; flex-shrink: 0;
  }

  /* HABIT CALENDAR */
  .habit-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px 24px; background: var(--paper); }
  .habit-header { display: flex; align-items: center; justify-between: space-between; margin-bottom: 16px; gap: 16px; }
  .view-tabs { display: flex; gap: 4px; }
  .view-tab {
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; cursor: pointer; transition: all 0.2s;
    font-family: 'DM Mono', monospace; letter-spacing: 0.05em;
  }
  .view-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .view-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .habit-cal-title {
    font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--ink);
    flex: 1; text-align: center;
  }

  /* MONTHLY HABIT CALENDAR */
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; flex: 1; }
  .month-day-header {
    text-align: center; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); padding: 4px 0; font-weight: 500;
  }
  .month-day-cell {
    border: none; border-radius: var(--radius-sm); background: var(--surface);
    min-height: 80px; padding: 5px; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 3px var(--shadow), 0 0 0 1px rgba(0,0,0,0.04);
  }
  .month-day-cell.other-month { opacity: 0.35; background: var(--cream); box-shadow: none; }
  .month-day-cell.selected-day { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px var(--shadow-md); background: var(--accent-light); }
  .month-day-num { font-size: 11px; font-weight: 500; color: var(--ink-light); margin-bottom: 4px; }
  .month-day-cell.today-cell .month-day-num {
    background: var(--gold); color: white; border-radius: 50%;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }

  /* HABIT DOTS / BARS */
  .habit-dots-row { display: flex; flex-direction: column; gap: 2px; width: 100%; flex: 1; justify-content: flex-end; }
  .habit-dot-wrapper { height: 8px; display: flex; align-items: center; width: 100%; }
  .habit-dot {
    width: 8px; height: 8px; border-radius: 50%;
    transition: all 0.2s;
  }
  .habit-bar {
    height: 7px; border-radius: 3px; width: 100%;
    transition: all 0.2s;
  }

  /* YEARLY/WEEKLY views */
  .yearly-grid { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
  .year-month-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light); margin-bottom: 4px; }
  .year-week-row { display: flex; gap: 2px; flex-wrap: wrap; }
  .year-day-dot {
    width: 14px; height: 14px; border-radius: 4px; background: var(--cream);
    position: relative; cursor: pointer; transition: transform 0.1s;
  }
  .year-day-dot:hover { transform: scale(1.3); }

  .weekly-bars { flex: 1; display: flex; gap: 2px; align-items: flex-end; padding-bottom: 20px; }
  .weekly-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .weekly-bar-col-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-light); margin-top: 4px; }
  .weekly-bar-seg {
    width: 80%; border-radius: 6px; min-height: 10px; transition: height 0.3s;
  }

  /* DAILY VIEW */
  .daily-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .daily-date-display { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; color: var(--ink); }
  .daily-goals-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; justify-content: center; }
  .daily-goal-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 19px; border-radius: var(--radius-md); border: 2.5px solid var(--border);
    background: var(--surface); cursor: pointer; transition: all 0.2s; min-width: 100px;
  }
  .daily-goal-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow-md); }
  .daily-goal-card.checked-today { box-shadow: 0 4px 12px var(--shadow-md); }
  .daily-goal-icon { width: 32px; height: 32px; border-radius: 50%; }
  .daily-goal-name { font-size: 14px; font-weight: 550; text-align: center; }
  .daily-goal-check-big {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }

  /* COLOR PICKER */
  .color-picker-popup {
    position: absolute; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 10px; z-index: 100; display: flex; gap: 6px;
    box-shadow: 0 4px 16px var(--shadow-md); flex-wrap: wrap; width: 130px;
    left: 0; top: 100%; margin-top: 4px;
  }
  .color-swatch {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.selected { border-color: var(--ink); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--paper); border-radius: var(--radius-lg); padding: 28px; width: 340px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.15);
  }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 16px; }
  .modal-input {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; margin-bottom: 12px; background: var(--surface);
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 8px 18px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #533c87; }
  .btn-secondary { background: var(--cream); color: var(--ink-light); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }

  .goal-filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .goal-filter-chip {
    padding: 4px 12px; border-radius: 14px; border: 1.5px solid var(--border);
    font-size: 11px; cursor: pointer; transition: all 0.15s; background: var(--surface);
    display: flex; align-items: center; gap: 4px;
  }
  .goal-filter-chip.active { border-color: var(--accent); background: var(--accent); color: white; }
  .habit-header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

  /* TOOLTIP */
  [data-tooltip] { position: relative; }
  [data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
    background: #2a2538; color: white; padding: 4px 8px; border-radius: 4px;
    font-size: 11px; white-space: nowrap; z-index: 999; pointer-events: none;
  }

  /* SCROLLBAR STYLE */
  .cal-body::-webkit-scrollbar { width: 5px; }
  .cal-body::-webkit-scrollbar-track { background: var(--cream); }
  .cal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ===================== MONTHLY CALENDAR ===================== */
  .monthly-cal-wrap { padding: 20px 24px; min-width: 560px; }
  .monthly-cal-header {
    display: grid; grid-template-columns: repeat(7, 1fr);
    column-gap: 2px; /* match monthly-cal-grid gap so DOW labels stay over their columns */
    margin-bottom: 4px;
  }
  .monthly-dow {
    text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-faint); padding: 4px 0;
    font-family: 'DM Mono', monospace;
  }
  .monthly-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .monthly-cell {
    border: none; border-radius: var(--radius-sm);
    min-height: 110px; padding: 6px 6px 4px; cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s; position: relative;
    background: var(--paper);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
  }
  .monthly-cell:hover { background: var(--accent-light); box-shadow: 0 0 0 1px var(--border), 0 2px 8px var(--shadow); }
  .monthly-cell.empty { background: var(--cream); cursor: default; min-height: 110px; box-shadow: none; }
  .monthly-cell.today { background: var(--gold-light); }
  .monthly-cell.today .monthly-cell-date { color: var(--gold); font-weight: 700; }
  .monthly-cell.drag-over { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-light) !important; }
  .monthly-event-chip { user-select: none; }
  .monthly-event-chip:active { cursor: grabbing; }
  .monthly-cell-date {
    font-family: 'Playfair Display', serif; font-size: 14px; color: var(--ink);
    margin-bottom: 4px;
  }
  .monthly-cell-dow { display: none; } /* mobile only — replaces the separate header row */
  .monthly-cell-events { display: flex; flex-direction: column; gap: 2px; }
  .monthly-event-chip {
    font-size: 10.5px; padding: 2px 6px; border-radius: 5px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: filter 0.1s;
  }
  .monthly-event-chip:hover { filter: brightness(0.92); }
  .chip-time {
    font-family: 'DM Mono', monospace; font-size: 9px; opacity: 0.7; margin-right: 3px;
  }
  .monthly-event-more { font-size: 10px; color: var(--ink-faint); padding: 1px 4px; font-family: 'DM Mono', monospace; }
  .mobile-month-nav { display: none; } /* shown only on mobile — desktop uses the sidebar */
  .month-event-item {
    display: flex; align-items: baseline; gap: 6px; padding: 5px 4px;
    border-radius: 5px; cursor: pointer; transition: background 0.1s;
  }
  .month-event-item:hover { background: var(--cream); }
  .month-event-item.pending { border-left: 3px solid var(--gold); background: var(--gold-light); }
  .month-event-item.pending:hover { background: #faefd8; }
  .invite-badge { font-size: 9px; font-family: 'DM Mono',monospace; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
  .invite-badge.needsAction { background: var(--gold-light); color: var(--gold); border: 1px solid var(--gold); }
  .invite-badge.accepted { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent); }
  .invite-badge.declined { background: var(--red-light); color: var(--red); border: 1px solid var(--red); }
  .invite-response-btns { display: flex; gap: 4px; margin-top: 4px; }
  .invite-btn { font-size: 10px; font-family: 'DM Sans',sans-serif; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: none; cursor: pointer; transition: opacity 0.1s; }
  .invite-btn.accept { background: var(--accent); color: white; }
  .invite-btn.decline { background: var(--red-light); color: var(--red); border: 1px solid var(--red); }
  .invite-btn.tentative { background: var(--gold-light); color: var(--gold); border: 1px solid var(--gold); }
  .month-event-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint); flex-shrink: 0; min-width: 64px; }
  .month-event-time { color: var(--gold); }
  .month-event-title { font-size: 12px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .modal-box { background: var(--paper); border-radius: var(--radius-lg); padding: 28px; width: 360px; box-shadow: 0 12px 48px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
  .modal-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--cream); box-sizing: border-box; }
  .modal-input:focus { outline: none; border-color: var(--accent); }
  .modal-textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--cream); resize: vertical; margin-top: 8px; min-height: 72px; box-sizing: border-box; }
  .modal-textarea:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-btn { padding: 7px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; }
  .modal-btn.primary { background: var(--accent); color: white; }
  .modal-btn.primary:hover { background: #533c87; }
  .modal-btn.secondary { background: var(--cream); color: var(--ink); border: 1px solid var(--border); }
  .modal-btn.secondary:hover { background: var(--border); }
  .modal-btn.danger { background: #fee2e2; color: #c0392b; margin-right: auto; }
  .modal-btn.danger:hover { background: #c0392b; color: white; }


  /* ── SIDEBAR COLLAPSE ── */
  .sidebar-wrap {
    display: flex; flex-direction: row; flex-shrink: 0;
    transition: width 0.25s ease;
    width: 312px; /* 280px sidebar + 32px strip */
  }
  .sidebar-wrap.collapsed { width: 32px; }
  .sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--paper);
    display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    padding: 20px;
  }
  /* Only the weekly planner sidebar gets the collapse treatment */
  .sidebar-wrap > .sidebar {
    width: 280px; min-width: 280px; transition: opacity 0.2s, width 0.25s, padding 0.25s;
  }
  .sidebar-wrap.collapsed > .sidebar {
    opacity: 0; pointer-events: none; width: 0; min-width: 0; padding: 0; overflow: hidden;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .sidebar-toggle-strip {
    width: 32px; min-width: 32px; flex-shrink: 0;
    display: flex; flex-direction: column;
    align-items: center; padding-top: 14px; gap: 8px;
    border-left: none;
    border-right: 1px solid var(--border);
    background: var(--paper);
    cursor: pointer; transition: background 0.15s;
  }
  .sidebar-toggle-strip:hover { background: var(--cream); }
  .sidebar-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--paper); color: var(--ink-light); font-size: 12px;
    transition: all 0.15s; pointer-events: none;
  }
  .sidebar-toggle-strip:hover .sidebar-toggle-btn { background: var(--accent); color: white; border-color: var(--accent); }
  .sidebar-collapsed-label {
    writing-mode: vertical-rl; font-family: 'DM Mono', monospace; font-size: 9px;
    color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.2s 0.15s;
  }
  .sidebar-wrap.collapsed .sidebar-collapsed-label { opacity: 1; }

  /* ── TABLET (768–1024px) ── */
  @media (max-width: 1024px) and (min-width: 768px) {
    .sidebar-wrap { width: 272px; }
    .sidebar { width: 240px; min-width: 240px; }
    .cal-grid { min-width: 560px; }
    .task-card { padding: 6px 8px; }
    .task-title-input { font-size: 16px; } /* 16px prevents iOS auto-zoom */

    /* Prevent horizontal overflow on all mobile views */
    .app { overflow-x: hidden; max-width: 100vw; }
    .main-content { overflow-x: hidden; max-width: 100vw; }
    .habit-main { overflow-x: hidden; max-width: 100vw; }


    /* Set all inputs/textareas to 16px on mobile to prevent iOS zoom */
    input[type="text"], input[type="date"], input[type="color"], textarea,
    .task-title-input, .task-details-input, .checklist-input,
    .pages-title-input, .pages-body, .pages-task-title-input,
    .pages-task-details-input, .sidebar-textarea, .review-textarea {
      font-size: 16px !important;
    }
    .week-review { grid-template-columns: 1fr; }
  }

  /* ── REPEAT PANEL (v4.6.0) ── */
  .rp-panel { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .rp-seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .rp-seg button {
    flex: 1 1 auto; min-height: 30px; padding: 0 8px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-light);
    font: 600 11px 'DM Sans', sans-serif;
  }
  .rp-seg button:hover { border-color: var(--accent); color: var(--accent); }
  .rp-seg button.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .rp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font: 12px 'DM Sans', sans-serif; color: var(--ink); }
  .rp-num {
    width: 48px; min-height: 30px; box-sizing: border-box; text-align: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink);
    font: 12px 'DM Mono', monospace;
  }
  .rp-num:focus, .rp-date:focus { outline: none; border-color: var(--accent); }
  .rp-date {
    min-height: 30px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink); font: 11px 'DM Mono', monospace; padding: 0 6px;
  }

  .wr-btn {
    font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 42px; padding: 0 18px; border-radius: 10px;

  .wr-stat { background: var(--cream); border-radius: var(--radius-md); padding: 12px 10px; text-align: center; }

  .wr-stat span { display: block; font-size: 11px; color: var(--ink-light); margin-top: 3px; line-height: 1.3; }
  .wr-stat em { font-style: normal; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-faint); }
  .wr-sec-label { font: 600 10px 'DM Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .wr-item {
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface);
  }
  .wr-item .t { flex: 1 1 180px; min-width: 0; font-size: 14px; color: var(--ink); }

  }

    width: 100%; box-sizing: border-box; min-height: 40px; padding: 0 11px;

  .wr-done { text-align: center; padding: 22px 10px; color: var(--ink-light); font-size: 14px; }
  .wr-review-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 38px;
    margin: 8px 0 2px; border-radius: var(--radius-md); cursor: pointer; font: 600 13px 'DM Sans', sans-serif;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-light);

  @media (max-width: 767px) {

  /* ── UNDO TOAST (v4.6.0) ── */
  .undo-toast {
    /* v4.7.1 — 9998 sits ABOVE the Weekly Review overlay (9995), which otherwise swallowed the
       click, and below the save-error toast (10000) and sign-in wall (20000). The review leans on
       Undo for Drop and Move, so the toast has to stay reachable while it's open. */
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 9998;
    background: #2a2538; color: #fff; border-radius: 12px; padding: 6px 8px 6px 16px;
    display: flex; align-items: center; gap: 12px; max-width: min(92vw, 460px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35); font-family: 'DM Sans', sans-serif; font-size: 13px;
  }
  .undo-toast.lift { bottom: 96px; }
  .undo-toast-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .undo-toast-btn {
    background: none; border: none; color: #d4c4ff; font-weight: 700; font-size: 14px; cursor: pointer;
    min-height: 44px; padding: 0 14px; border-radius: 8px; font-family: inherit; flex-shrink: 0;
  }
  .undo-toast-btn:hover { background: rgba(255,255,255,0.12); }
  .undo-toast-more { font-size: 11px; opacity: 0.7; flex-shrink: 0; }
  .series-toast { bottom: 84px; flex-wrap: wrap; row-gap: 0; max-width: min(94vw, 540px); }
  .series-toast .undo-toast-label { flex: 1 1 100%; padding-top: 6px; white-space: normal; }

  /* ── FITNESS INTERVAL TIMER (v5.18.0) ── bottom sheet + minimized pill; logic in FitTimer / FitTimerHost.
     z-index 9996 sits above the Weekly Review overlay (9995) and below the undo toast (9998),
     save-error toast (10000) and sign-in wall (20000). */
  .ft-open-btn { background: none; border: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; min-width: 28px; min-height: 28px; opacity: 0.75; flex-shrink: 0; }
  .ft-open-btn:hover { opacity: 1; }
  .ft-scrim { position: fixed; inset: 0; background: rgba(20,16,30,0.45); z-index: 9996; display: flex; align-items: flex-end; justify-content: center; }
  .ft-sheet { width: 100%; max-width: 460px; background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0; padding: 8px 18px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,0.3); font-family: 'DM Sans', sans-serif; }
  .ft-grab { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 8px; }
  .ft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .ft-title { font-size: 15px; font-weight: 700; }
  .ft-sub { font-size: 12px; color: var(--ink-light); }
  .ft-iconbtn { background: none; border: none; cursor: pointer; color: var(--ink-light); font-size: 18px; width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; }
  .ft-iconbtn:hover { background: var(--accent-light); }
  .ft-body { display: flex; align-items: center; gap: 16px; }
  .ft-ring { position: relative; width: 112px; height: 112px; flex-shrink: 0; }
  .ft-ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ft-clock { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ft-clock.paused { opacity: 0.45; }
  .ft-phase { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 999px; font-family: 'DM Sans', sans-serif; }
  .ft-phase.work { background: var(--teal-light); color: var(--teal); }
  .ft-phase.rest { background: var(--gold-light); color: var(--gold); }
  .ft-phase.done { background: var(--accent-light); color: var(--accent); }
  .ft-side { flex: 1; min-width: 0; }
  .ft-setlbl { font-size: 12px; color: var(--ink-light); margin-bottom: 6px; }
  .ft-seg { display: flex; gap: 3px; margin-bottom: 12px; }
  .ft-seg b { height: 6px; border-radius: 2px; min-width: 2px; }
  .ft-ctrls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ft-cbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .ft-cbtn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ft-textbtn { height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }
  .ft-textbtn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ft-form { display: flex; gap: 10px; margin-bottom: 8px; }
  .ft-field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-light); }
  .ft-field input { height: 46px; width: 100%; font-size: 16px; text-align: center; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); color: var(--ink); font-family: 'DM Mono', monospace; }
  .ft-total { font-size: 12px; color: var(--ink-light); min-height: 16px; }
  .ft-err { font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 6px; }
  .ft-start { width: 100%; height: 48px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  .ft-pill { position: fixed; z-index: 9996; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #2a2538; color: #fff; border-radius: 999px; padding: 4px 4px 4px 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); font-family: 'DM Sans', sans-serif; max-width: 94vw; }
  @media (min-width: 768px) { .ft-pill { left: auto; right: 20px; transform: none; } }
  .ft-pill-main { display: flex; align-items: center; gap: 8px; background: none; border: none; color: inherit; cursor: pointer; padding: 6px 8px; min-height: 40px; font-family: inherit; }
  .ft-pill-time { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ft-pill-set { font-size: 12px; opacity: 0.8; white-space: nowrap; }
  .ft-pill-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.14); color: #fff; cursor: pointer; font-size: 15px; flex-shrink: 0; }

  /* ── MOBILE (< 768px) ── */
  @media (max-width: 767px) {
    .undo-toast { bottom: 68px; }
    .series-toast { bottom: 128px; }
    .undo-toast.lift { bottom: 140px; }

    .rp-days .task-repeat-day-btn { width: 38px; height: 38px; font-size: 12px; }
    .rp-apply { min-height: 44px; }
    /* Nav bar */
    .nav-bar { flex-wrap: nowrap; gap: 4px; padding: 6px 10px; position: sticky; top: 0; z-index: 200; }
    .nav-tabs { display: none; } /* hidden — use bottom nav */
    .hdr-color-area { flex: 1; min-width: 0; }
    .nav-brand { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .auth-area { gap: 4px; flex-shrink: 0; }

    .save-status { font-size: 10px; }

    .sidebar { display: none !important; }
    .week-review { display: none !important; }

    .app { height: auto; min-height: 100vh; overflow: visible; }
    .main-content { flex-direction: column; overflow: visible; padding-bottom: 64px; }
    .main-panel { overflow: visible; }
    .habit-main { overflow-x: hidden; overflow-y: auto; height: auto; padding-bottom: 148px; }
    /* 148px = nav (56px) + FAB top-from-nav (80px - 56px = 24px offset) + FAB height (48px) + breathing room (20px) */
    /* Hide weekly desktop panel on mobile — replaced by mobile-day-view */
    .weekly-main-panel { display: none !important; }
    /* Bigger tap targets for task radio and accordion caret on mobile */
    .task-check { width: 16px; height: 16px; padding: 4px; box-sizing: content-box; margin: -4px; margin-right: 0; }
    .task-check.done::after { font-size: 12px; }
    .task-expand-btn { font-size: 14px; padding: 8px 10px; margin: -8px -10px -8px 0; }

      font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700;
      color: var(--ink); text-align: center; flex: 1;
    }

      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light);
      text-align: center;
    }
    .mobile-day-tasks { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .mobile-add-btn {
      margin: 8px 12px; padding: 10px; border-radius: var(--radius-sm);
      border: 1.5px dashed var(--border); background: none;

      font-family: 'DM Sans', sans-serif; transition: all 0.15s;

    .mobile-week-dots {

    /* ── Bottom sheet (sidebar content) ── */

      z-index: 101;

    .mobile-sheet-handle {
      width: 36px; height: 4px; border-radius: 2px; background: var(--border);
      margin: 10px auto 0;
    }
    .mobile-sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .mobile-sheet-title {
      font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--ink);
    }
    .mobile-sheet-close {
      background: none; border: none; font-size: 18px; color: var(--ink-faint); cursor: pointer; padding: 2px 6px;
    }
    .mobile-sheet-body { overflow-y: auto; padding: 12px 16px 24px; flex: 1; }

    .mobile-fab {

      width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent); color: white; border: none;

      display: flex; align-items: center; justify-content: center;

  }
  .mhc-metric-field { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .mhc-metric-label {
    font-size: 9px; font-family: 'DM Mono', monospace; color: var(--ink-faint);

  }
  .mhc-metric-input {

  }
  .mhc-metric-input:focus { border-color: var(--accent); }
  /* On desktop, the sidebar already shows these — hide in HabitChecklist */
  @media (min-width: 768px) { .mhc-metrics-row { display: none; } }

  .monthly-habit-checklist {
    border-top: 1px solid rgba(0,0,0,0.06); padding: 14px 10px 10px;
    background: var(--paper); flex-shrink: 0;
  }
  .monthly-habit-checklist-title {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .monthly-habit-checklist-items { display: flex; flex-direction: column; gap: 8px; }
  .monthly-habit-check-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer;
    background: var(--surface); transition: all 0.15s;
    box-shadow: 0 1px 3px var(--shadow), 0 0 0 1px rgba(0,0,0,0.03);
  }
  .monthly-habit-check-row:hover { box-shadow: 0 2px 8px var(--shadow-md), 0 0 0 1px rgba(0,0,0,0.03); }
  .monthly-habit-check-row.done { opacity: 0.75; }
  .mhc-check {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .mhc-name {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  }

  /* ── PAGES VIEW — Modern Redesign ── */
  .pages-layout { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .pages-sidebar {
    width: 260px; min-width: 260px; height: 100%; background: var(--paper);
    border-right: none;
    box-shadow: 2px 0 8px var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .pages-sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 14px 10px; border-bottom: 1px solid rgba(0,0,0,0.06); flex-shrink: 0;
  }
  .pages-sidebar-title {
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--ink-light); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .pages-sidebar-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .pages-list { padding: 6px 8px 8px; }

  /* Doc list items — card style, no heavy borders */
  .pages-list-item {
    padding: 8px 10px; cursor: pointer;
    border-left: 3px solid transparent; border-radius: 8px;
    margin-bottom: 1px; transition: background 0.12s, border-left-color 0.12s;
    display: flex; align-items: flex-start;
  }
  .pages-list-item.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius: 8px; }
  .pages-list-item:hover { background: var(--cream); }
  .pages-list-item.active { border-left-color: var(--accent); background: var(--accent-light); }
  .pages-list-item-title {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pages-list-item-date {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint); margin-top: 2px;
  }
  .pages-list-item-taskcount {
    font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600;
    color: var(--accent); background: rgba(106,80,167,0.08);
    padding: 1px 7px; border-radius: 20px; display: inline-block; margin-top: 3px;
  }

  /* Section labels */
  .pages-section-label {
    font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
    padding: 12px 10px 5px; border-top: none; margin-top: 0;
  }

  /* Folder rows — modern, no heavy cream bg */
  .pages-folder-row {
    display: flex; align-items: center; padding: 6px 8px 6px 4px;
    cursor: pointer; border-radius: 8px; margin: 1px 0;
    background: transparent; gap: 2px; position: relative;
    transition: background 0.12s;
  }
  .pages-folder-row:hover { background: var(--cream); }
  .pages-folder-row.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius:8px; }
  .pages-folder-row.folder-hover-target { background: var(--accent-light); outline: 2px solid var(--accent); outline-offset:-2px; border-radius:8px; }
  .pages-folder-toggle {
    background: none; border: none; cursor: pointer; padding: 0 3px;
    font-size: 10px; color: var(--ink-faint); flex-shrink: 0; line-height: 1;
  }
  .pages-folder-name {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--ink); flex: 1; min-width: 0; white-space: nowrap;

  }
  .pages-folder-name-input {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--ink); flex: 1; min-width: 0; border: 1.5px solid var(--accent);

  .pages-folder-add-btn {
    background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600;

  }
  .pages-folder-add-btn:hover { opacity: 1; }
  .pages-folder-del-btn {
    background: none; border: none; cursor: pointer; font-size: 12px;

  }
  .pages-folder-row:hover .pages-folder-del-btn { opacity: 0.5; }
  .pages-folder-del-btn:hover { opacity: 1 !important; color: #ef4444; }
  @media (hover: none) {
    .pages-folder-del-btn { opacity: 0.45; }
    .pages-folder-row.swipe-reveal { background: #fef2f2; }
  }
  .pages-doc-delete-btn {
    background: none; border: none; cursor: pointer; font-size: 11px;
    color: var(--border); padding: 2px 4px; opacity: 0; flex-shrink: 0;

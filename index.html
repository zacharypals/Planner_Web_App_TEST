  }
  .pages-list-item:hover .pages-doc-delete-btn { opacity: 0.6; }
  .pages-doc-delete-btn:hover { opacity: 1 !important; color: #ef4444; }

  /* ── Main editor area ── */
  .pages-main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--cream);
  }
  .pages-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink-faint); gap: 16px;
  }
  .pages-empty-icon { font-size: 52px; opacity: 0.2; }
  .pages-empty-text { font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink-light); }

  /* Sticky title header */
  .pages-doc-header {
    flex-shrink: 0; padding: 24px 36px 8px; background: var(--surface);
    border-bottom: none;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .pages-scroll-area {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    background: var(--cream);
  }
  .pages-editor {
    flex-shrink: 0; display: flex; flex-direction: column; padding: 24px 36px 0;
  }

  /* Title input — modern sans-serif, large weight */
  .pages-title-input {
    font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700;
    color: var(--ink); border: none; background: transparent; outline: none;
    width: 100%; margin-bottom: 6px; line-height: 1.3;
  }
  .pages-title-input::placeholder { color: var(--border); }

  /* Meta line */
  .pages-doc-meta {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint);
    margin-bottom: 16px; padding-bottom: 12px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    border-bottom: none;
  }

  /* ── Toolbar — floating rounded card ── */
  .pages-toolbar {
    display: flex; gap: 1px; flex-wrap: wrap;
    padding: 4px 0; background: transparent;
    border: none; border-top: 1px solid rgba(0,0,0,0.06);
    margin-top: 6px;
  }
  .pages-toolbar-btn {
    padding: 5px 9px; border-radius: 6px; border: none; background: none;
    cursor: pointer; font-size: 13px; color: var(--ink-light);
    transition: all 0.12s; min-width: 30px; text-align: center;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
  }
  .pages-toolbar-btn:hover { background: var(--cream); color: var(--ink); }
  .pages-toolbar-btn.active { background: var(--accent-light); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .pages-toolbar-sep { width: 1px; background: rgba(0,0,0,0.08); margin: 3px 3px; align-self: stretch; }

  /* ── Rich text body ── */
  .pages-body {
    min-height: 240px; padding: 18px 20px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--surface); outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.75; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.05);
  }
  .pages-body:focus { box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 2px var(--accent); }
  .pages-body:focus-within { box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 2px var(--accent); }
  /* ── Quill editor body (v5.0.0) ── */
  .pages-body.ql-container { height: auto; font: inherit; }
  .pages-body .ql-editor { padding: 0; min-height: 200px; height: auto; overflow: visible; font: inherit; line-height: inherit; color: inherit; }
  .pages-body .ql-editor.ql-blank::before { left: 0; right: 0; color: var(--ink-faint); font-style: normal; }
  .pages-body .ql-editor p { margin: 6px 0; }
  .pages-body .ql-editor h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; margin: 16px 0 8px; color: var(--ink); letter-spacing: -0.02em; }
  .pages-body .ql-editor h2 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
  .pages-body .ql-editor h3 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; margin: 10px 0 5px; color: var(--ink); }
  .pages-body .ql-editor ol { padding-left: 0; margin: 2px 0; }
  .pages-body .ql-editor li { margin: 2px 0; padding-left: 1.7em; }
  .pages-body .ql-editor li > .ql-ui:before { width: 1.3em; margin-left: -1.7em; margin-right: .4em; font-size: 1.05em; }
  .pages-body .ql-editor li[data-list=unchecked] > .ql-ui { color: var(--ink-light); }
  .pages-body .ql-editor li[data-list=checked] > .ql-ui { color: var(--accent); }
  .pages-body .ql-editor li[data-list=checked] { text-decoration: line-through; opacity: 0.5; }
  .pages-body .ql-editor li[data-list=bullet] > .ql-ui { color: var(--ink-light); }
  .pages-body .ql-editor li.ql-indent-1:not(.ql-direction-rtl) { padding-left: calc(1.7em + 1.5em); }
  .pages-body .ql-editor li.ql-indent-2:not(.ql-direction-rtl) { padding-left: calc(1.7em + 3.0em); }
  .pages-body .ql-editor li.ql-indent-3:not(.ql-direction-rtl) { padding-left: calc(1.7em + 4.5em); }
  .pages-body .ql-editor li.ql-indent-4:not(.ql-direction-rtl) { padding-left: calc(1.7em + 6.0em); }
  .pages-body .ql-editor li.ql-indent-5:not(.ql-direction-rtl) { padding-left: calc(1.7em + 7.5em); }
  .pages-body .ql-editor li.ql-indent-6:not(.ql-direction-rtl) { padding-left: calc(1.7em + 9.0em); }
  .pages-body .ql-editor li.ql-indent-7:not(.ql-direction-rtl) { padding-left: calc(1.7em + 10.5em); }
  .pages-body .ql-editor li.ql-indent-8:not(.ql-direction-rtl) { padding-left: calc(1.7em + 12.0em); }
  .pages-body .ql-editor a { color: var(--accent); text-decoration: underline; }
  .pages-body .ql-editor s { text-decoration: line-through; opacity: 0.5; }
  .pages-body .ql-editor blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 0 2px 14px; color: var(--ink-light); }
  .pages-body .ql-editor img { max-width: 100%; }
  .pages-body .ql-editor code { font-family: 'DM Mono', monospace; font-size: 0.88em; background: rgba(127,127,127,0.2); border-radius: 4px; padding: 1px 5px; }
  /* Toolbar popovers (colour, highlight, font, size, align) */
  .pages-pop { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); padding: 10px; width: 258px; max-height: 70vh; overflow-y: auto; }
  .pages-pop-title { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin: 13px 2px 6px; }
  .pages-pop-title:first-child { margin-top: 0; }
  .pages-pop-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pages-swatch { height: 34px; border-radius: 8px; border: 1px solid rgba(127,127,127,0.35); cursor: pointer; padding: 0; font: 700 14px 'DM Sans', sans-serif; color: var(--ink); }
  .pages-swatch.on { box-shadow: 0 0 0 2px var(--accent); }
  .pages-pop-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; min-height: 40px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--ink); }
  .pages-pop-item:hover { background: var(--cream); }
  .pages-pop-item.on { background: var(--accent-light); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .pages-pop-clear { margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: 1px dashed var(--border); background: none; color: var(--ink-light); cursor: pointer; font-size: 12px; }
  .pages-body h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; margin: 16px 0 8px; color: var(--ink); letter-spacing: -0.02em; }
  .pages-body h2 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
  .pages-body h3 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; margin: 10px 0 5px; color: var(--ink); }
  .pages-body ul, .pages-body ol { padding-left: 22px; margin: 6px 0; }
  .pages-body li { margin: 4px 0; }
  .pages-body a { color: var(--accent); text-decoration: underline; }
  .pages-body blockquote {
    border-left: 3px solid var(--accent); padding: 8px 14px; margin: 10px 0;
    color: var(--ink-light); font-style: italic; background: var(--cream); border-radius: 0 8px 8px 0;
  }
  .pages-body p { margin: 6px 0; }
  .pages-body s { text-decoration: line-through; opacity: 0.5; }

  /* Checklist */
  .pages-body ul.pages-checklist { list-style: none; padding-left: 4px; margin: 6px 0; }
  .pages-body ul.pages-checklist ul.pages-checklist { padding-left: 24px; }
  .pages-body li.pages-chk-li {
    display: flex; align-items: baseline; gap: 6px;
    padding: 2px 0; min-height: 22px; cursor: text; line-height: 1.6;
  }
  .pages-chk-input {
    flex-shrink: 0; width: 14px; height: 14px; margin: 0; margin-top: 3px;
    cursor: pointer; accent-color: var(--accent);
  }
  li.pages-chk-li.checked { text-decoration: line-through; opacity: 0.5; }

  /* ── Tasks section ── */
  .pages-tasks-section {
    padding: 0 36px 48px; background: transparent; flex-shrink: 0;
    border-top: none;
  }
  .pages-tasks-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .pages-tasks-title {
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .pages-task-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 8px;
    background: var(--surface); border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04);
    transition: box-shadow 0.2s;
  }
  .pages-task-item:hover { box-shadow: 0 4px 12px rgba(106,80,167,0.1), 0 0 0 1px rgba(106,80,167,0.15); }
  .pages-task-check {
    width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px;
    flex-shrink: 0; background: var(--surface); cursor: pointer; margin-top: 2px;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .pages-task-check.done { background: var(--accent); border-color: var(--accent); }
  .pages-task-check.done::after { content: '✓'; color: white; font-size: 9px; }
  .pages-task-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pages-task-title-input {
    border: none; background: transparent; outline: none; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); font-weight: 500;
  }
  .pages-task-title-input.done { text-decoration: line-through; opacity: 0.45; }
  .pages-task-date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pages-task-date-input {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light);
    border: 1px solid rgba(0,0,0,0.08); border-radius: var(--radius-sm); padding: 2px 8px;
    background: var(--cream); cursor: pointer;
  }
  .pages-task-date-input:focus { outline: none; border-color: var(--accent); }
  .pages-task-date-badge {
    font-family: 'DM Mono', monospace; font-size: 10px;
    background: rgba(106,80,167,0.1); color: var(--accent);
    padding: 2px 8px; border-radius: 20px;
  }
  .pages-task-details-input {
    border: none; background: transparent; outline: none; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--ink-light);
    min-height: 18px; line-height: 1.5;
  }
  .pages-task-details-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .pages-task-delete {
    background: none; border: none; color: var(--border); cursor: pointer;
    font-size: 14px; padding: 0 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0;
  }
  .pages-task-item:hover .pages-task-delete { opacity: 1; }
  .pages-task-item:hover .pages-task-delete:hover { color: #ef4444; }

  /* Project task badge */
  .project-task-badge {
    font-family: 'DM Sans', monospace; font-size: 9px; font-weight: 600;
    color: var(--accent); background: rgba(106,80,167,0.08);
    padding: 1px 6px; border-radius: 20px; display: inline-flex; align-items: center; gap: 3px;
    margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── Sidebar collapse strip ── */
  .pages-sidebar-wrap {
    display: flex; flex-direction: row; flex-shrink: 0;
    transition: width 0.25s ease; width: 292px;
  }
  .pages-sidebar-wrap.collapsed { width: 32px; }
  .pages-sidebar-wrap > .pages-sidebar { width: 260px; min-width: 260px; transition: opacity 0.2s; }
  .pages-sidebar-wrap.collapsed > .pages-sidebar { opacity: 0; pointer-events: none; width: 0; min-width: 0; padding: 0; overflow: hidden; }
  .pages-toggle-strip {
    width: 32px; min-width: 32px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 8px;
    border-right: 1px solid rgba(0,0,0,0.06); background: var(--surface);
    cursor: pointer; transition: background 0.15s;
  }
  .pages-toggle-strip:hover { background: var(--cream); }
  .pages-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08);
    background: var(--surface); color: var(--ink-faint); font-size: 12px; pointer-events: none;
  }
  .pages-toggle-strip:hover .pages-toggle-btn { background: var(--accent); color: white; border-color: var(--accent); }

  /* Mobile pages */
  @media (max-width: 767px) {
    .pages-sidebar-wrap { display: none !important; }
    .pages-toggle-strip { display: none !important; }
    .pages-editor { padding: 14px 16px 0; }
    .pages-tasks-section { padding: 0 16px 80px; }
    .pages-doc-header { padding: 10px 16px 6px; box-shadow: none; }
    .pages-mobile-back { display: block; }
    .pages-mobile-list { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
    .pages-main { height: calc(100dvh - 48px - 56px); flex: 0 0 auto; }
  }
  @media (min-width: 768px) {
    .pages-mobile-back { display: none !important; }
    .pages-mobile-list { display: none !important; }
    .pages-empty { display: flex; }
  }

  /* Desktop sidebar toggle shows on all non-mobile */
  @media (min-width: 768px) {
    .mobile-day-view, .mobile-sheet, .mobile-sheet-overlay,
    .mobile-fab, .mobile-bottom-nav { display: none !important; }
  }

  /* ═══════════════════════════════════════════════════════════════
     v3.13.0 LOOK REFRESH — layout & component styling borrowed from
     Finance Pal. Colors and fonts are unchanged. Everything for the
     refresh lives in this block so it can be tuned or removed in one place.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --card-border: 1px solid var(--border);
    --card-shadow: 0 1px 3px rgba(35,30,51,0.07);
  }

  /* ── Top bar: soft translucent tabs, ghost buttons ── */
  .nav-tab {
    text-transform: none; letter-spacing: 0.01em; font-size: 14px;
    padding: 8px 14px; color: rgba(255,255,255,0.75);
  }
  .nav-tab:hover { background: rgba(255,255,255,0.10); color: #fff; }
  .nav-tab.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }
  .auth-btn, .auth-btn.sync {
    border: none; background: rgba(255,255,255,0.14); color: #fff;
    padding: 6px 12px; font-size: 13px;
  }
  .auth-btn:hover, .auth-btn.sync:hover { background: rgba(255,255,255,0.24); color: #fff; border: none; }
  .auth-btn.danger:hover { background: rgba(255,255,255,0.24); }

  /* ── Desktop: content floats as cards on the cream page ── */
  @media (min-width: 768px) {
    .nav-bar { height: 56px; padding: 0 20px; }
    .main-content, .fitness-layout { padding: 16px; gap: 16px; }

    /* Sidebars become cards (toggle strip lives inside the card) */
    .sidebar-wrap, .pages-sidebar-wrap, .fitness-sidebar {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow); overflow: hidden;
    }
    .sidebar-wrap > .sidebar, .pages-sidebar-wrap > .pages-sidebar { box-shadow: none; }
    .sidebar-toggle-strip, .pages-toggle-strip {
      border-right: none; border-left: 1px solid var(--border); background: var(--paper);
    }
    .pages-sidebar-wrap > .pages-sidebar { border-right: none; }
    .fitness-sidebar { border-right: var(--card-border); }

    /* Weekly planner: calendar + review as two stacked cards */
    .weekly-main-panel { gap: 16px; }
    .weekly-calendar {
      height: calc(100vh - 56px - 32px - 112px);
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .cal-grid { column-gap: 0; }
    .cal-header-cell { border-radius: 0; border-right: 1px solid rgba(255,255,255,0.12); }
    .cal-grid > .cal-header-cell:nth-child(7) { border-right: none; }
    .cal-day { border-right: 1px solid var(--border); }
    .cal-day:last-child { border-right: none; }
    .week-review {
      margin: 0; border: var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
    }

    /* Habit tracker & Pages main areas are cards */
    .habit-main, .pages-main {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .pages-doc-header { box-shadow: none; border-bottom: 1px solid var(--border); background: transparent; }

    /* Monthly calendar card */
    .monthly-cal-wrap {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
      padding: 16px 20px 20px; margin: 0;
    }
  }

  /* ── Monthly calendar: clean table grid instead of floating tiles ── */
  .monthly-cal-header { column-gap: 0; }
  .monthly-cal-grid {
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .monthly-cell { border-radius: 0; box-shadow: none; }
  .monthly-cell:hover { box-shadow: none; }
  .monthly-cell.empty { background: var(--cream); }

  /* ── Segmented control (Habit view switcher) ── */
  .view-tabs {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--cream); border-radius: var(--radius-sm);
  }
  .view-tab {
    border: none; background: transparent; border-radius: 6px;
    padding: 5px 12px; color: var(--ink-light);
  }
  .view-tab:hover:not(.active) { background: transparent; color: var(--ink); }
  .view-tab.active {
    background: var(--paper); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 3px rgba(35,30,51,0.12);
  }

  /* ── Chips ── */
  .goal-filter-chip {
    border-radius: 999px; border-width: 1px; font-size: 12px; padding: 4px 12px;
    background: var(--paper);
  }

  /* ── Buttons, inputs, text areas ── */
  .btn, .modal-btn { border-radius: var(--radius-md); font-weight: 600; padding: 9px 16px; }
  .btn-secondary, .modal-btn.secondary { background: var(--cream); border: 1px solid transparent; color: var(--ink); }
  .btn-secondary:hover, .modal-btn.secondary:hover { background: var(--cream); border-color: var(--border); }
  .sidebar-textarea, .modal-input, .modal-textarea, .review-textarea, .pages-body {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .pages-body { border-radius: var(--radius-md); }
  .sidebar-textarea:focus, .modal-input:focus, .modal-textarea:focus,
  .review-textarea:focus, .pages-body:focus, .pages-body:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,80,167,0.12);
  }

  /* ── Modals & popovers: same card language ── */
  .modal, .modal-box, .people-picker-modal, .task-ctx-menu {
    border: var(--card-border); border-radius: var(--radius-lg);
  }

  /* ── Mobile ── */
  @media (max-width: 767px) {
    .mobile-bottom-nav { box-shadow: none; border-top: 1px solid var(--border); }
    .mobile-bottom-nav-btn { font-size: 11px; color: var(--ink-light); }
    .mobile-bottom-nav-btn.active { color: var(--accent); font-weight: 600; }
    .mobile-day-nav { box-shadow: none; border-bottom: 1px solid var(--border); }
    .mobile-week-dots { box-shadow: none; border-top: 1px solid var(--border); margin-top: auto; }
    .mobile-day-tasks {
      flex: 0 1 auto; margin: 12px; padding: 12px;
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .monthly-cal-wrap {
      background: var(--paper); border: var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow); margin: 10px; padding: 10px 8px 12px;
      min-width: 0; /* let all 7 days fit inside the card on phones */
    }
    .monthly-cal-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .monthly-event-chip .chip-time { display: none; } /* narrow cells: show the title, not the time */
  }

  /* ═══════════════════════════════════════════════════════════════
     v4.2.0 GOALS — Goals tab, timeline, goal tasks in the week, mobile nav "More".
     All goal styles use the gl- prefix.
     ═══════════════════════════════════════════════════════════════ */
  .gl-wrap { flex: 1; display: flex; gap: 16px; padding: 16px; overflow: hidden; min-height: 0; }
  .gl-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 1px 3px rgba(35,30,51,0.07); }
  .gl-side { width: 300px; flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .gl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .gl-side { transition: width 0.18s ease, padding 0.18s ease; }
  .gl-side-body { display: flex; flex-direction: column; gap: 12px; }
  .gl-side-strip { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .gl-side.collapsed { width: 52px; padding: 12px 0; overflow: hidden; }
  .gl-side.collapsed .gl-side-body { display: none; }
  .gl-side.collapsed .gl-side-strip { display: flex; }
  .gl-side-toggle { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-light); cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }
  .gl-side-toggle:hover { background: var(--cream); color: var(--ink); }
  .gl-side-vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--ink); margin: 4px 0; }
  .gl-side-dot { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; padding: 0; flex-shrink: 0; }
  .gl-h2 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--ink); }
  .gl-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-light); }
  .gl-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .gl-btn:hover { background: var(--cream); }
  .gl-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .gl-btn.primary:hover { filter: brightness(1.08); }
  .gl-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-light); }
  .gl-btn.danger { color: var(--red); }
  .gl-chip { font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-light); cursor: pointer; }
  .gl-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .gl-goal-card { text-align: left; width: 100%; font-family: 'DM Sans', sans-serif; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; cursor: pointer; display: block; color: var(--ink); }
  .gl-goal-card:hover { box-shadow: 0 2px 8px var(--shadow-md); }
  .gl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .gl-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--neutral-bg); }
  .gl-bar > div { height: 100%; border-radius: 3px; }
  .gl-health { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .gl-health.ontrack { color: #22573c; background: #e3f1e9; }
  .gl-health.atrisk { color: #7a4f00; background: #fbf0d6; }
  .gl-health.behind { color: #b03a2e; background: #fbe9e7; }
  .gl-health.upcoming, .gl-health.parked { color: #6a6678; background: var(--neutral-bg); }
  .gl-health.done { color: #fff; background: var(--accent); }
  .gl-mono { font-family: 'DM Mono', monospace; }
  .gl-input { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
  .gl-input:focus { border-color: var(--accent); }
  .gl-inline { font-family: 'DM Sans', sans-serif; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; outline: none; min-width: 0; }
  .gl-inline:hover { border-color: var(--border); }
  .gl-inline:focus { border-color: var(--accent); background: var(--surface); }
  .gl-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--ink-faint); background: var(--surface); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; padding: 0; }
  .gl-check.on { background: var(--accent); border-color: var(--accent); }
  .gl-ms { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .gl-ms-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .gl-grip { border: none; background: none; cursor: grab; color: var(--ink-faint); font-size: 14px; letter-spacing: -2px; width: 20px; height: 28px; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .gl-grip:hover { color: var(--ink-light); }
  .gl-ms.dragging { opacity: 0.45; }
  .gl-ms-drop { height: 3px; border-radius: 2px; background: var(--accent); margin: -2px 0; }
  .gl-caret { border: none; background: none; cursor: pointer; color: var(--ink-light); font-size: 11px; width: 22px; height: 28px; padding: 0; }
  .gl-task { display: flex; align-items: center; gap: 8px; min-height: 38px; border-top: 1px solid var(--neutral-line); padding: 2px 10px 2px 40px; position: relative; }
  .gl-x { border: none; background: none; cursor: pointer; color: var(--ink-faint); font-size: 13px; padding: 4px 6px; opacity: 0; }
  .gl-task:hover .gl-x, .gl-ms-head:hover .gl-x { opacity: 1; }
  .gl-sched { font-family: 'DM Sans', sans-serif; font-size: 12px; border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; border: 1px dashed var(--ink-faint); background: transparent; color: var(--ink-light); }
  .gl-sched.set { border: none; background: #f3e9f8; color: #6a3a87; font-weight: 600; }
  .gl-pop { position: absolute; z-index: 300; right: 8px; top: calc(100% - 2px); width: 290px; background: var(--paper); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px var(--shadow-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .gl-daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .gl-daybtn { font-family: 'DM Sans', sans-serif; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 0; font-size: 11px; color: var(--ink); cursor: pointer; line-height: 1.3; }
  .gl-daybtn.on { border: 2px solid var(--accent); background: var(--cream); font-weight: 600; }
  .gl-daybtn.today { color: var(--accent); font-weight: 600; }
  /* Timeline */
  .gl-tl-scroll { overflow-x: auto; }
  .gl-tl { display: flex; min-width: 900px; }
  .gl-tl-labels { width: 250px; flex-shrink: 0; border-right: 1px solid var(--grid-line); }
  .gl-tl-area { flex: 1; position: relative; min-width: 640px; }
  .gl-tl-head { height: 38px; border-bottom: 1px solid var(--grid-line); display: flex; align-items: center; }
  .gl-tl-row { position: relative; border-bottom: 1px solid var(--grid-line); }
  .gl-tl-row.goal { height: 46px; }
  .gl-tl-row.ms { height: 34px; }
  .gl-tl-row.task { height: 28px; }
  .gl-tl-lab { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; overflow: hidden; }
  .gl-tl-lab span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gl-tl-bar { position: absolute; border-radius: 9px; cursor: pointer; overflow: hidden; box-sizing: border-box; }
  /* v4.7.0 — drag to reschedule */
  .gl-tl-bar.grab { cursor: grab; touch-action: none; }
  .gl-tl-bar.dragging { cursor: grabbing; overflow: visible; box-shadow: 0 2px 10px rgba(35,30,51,0.28); z-index: 4; }
  .gl-tl-grip { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; }
  .gl-tl-grip.l { left: 0; } .gl-tl-grip.r { right: 0; }
  .gl-tl-bar.grab:hover .gl-tl-grip { background: rgba(255,255,255,0.45); box-shadow: inset 0 0 0 1px rgba(35,30,51,0.22); }
  .gl-tl-drag-tip {
    /* Fixed dark chip, like .undo-toast — var(--ink) flips to near-white in dark mode,
       which left white text on a light pill. Do not swap this back to --ink. */
    position: absolute; top: -4px; z-index: 6; pointer-events: none;
    background: #2a2538; color: #fff; border-radius: 6px; padding: 2px 7px; white-space: nowrap;
    font-family: 'DM Mono', monospace; font-size: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .gl-tl-dia { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); box-sizing: border-box; pointer-events: none; }
  .gl-tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; z-index: 2; }
  .gl-tl-todaytag { position: absolute; top: 3px; font-family: 'DM Mono', monospace; font-size: 9px; line-height: 12px; background: var(--gold); color: var(--ink); padding: 2px 7px; border-radius: 999px; z-index: 3; pointer-events: none; }
  .gl-seg { display: flex; background: var(--cream); border-radius: 10px; padding: 3px; }
  .gl-seg button { font-family: 'DM Sans', sans-serif; border: none; background: transparent; font-size: 13px; padding: 5px 11px; border-radius: 8px; color: var(--ink-light); cursor: pointer; }
  .gl-seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(35,30,51,0.12); }
  .gl-upnext { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .gl-mobile-only { display: none; }
  /* Goal tasks inside the Weekly Planner */
  .gl-wtask { border-radius: var(--radius-md); margin-bottom: 8px; padding: 7px 8px; font-size: 12px; position: relative; cursor: grab; border: 1px solid transparent; }
  .gl-wtask .gl-wtask-row { display: flex; align-items: flex-start; gap: 6px; }
  .gl-wtask .gl-wtask-title { flex: 1; min-width: 0; font-weight: 500; font-size: 11px; line-height: 1.3; word-break: break-word; }
  .gl-wtask.done .gl-wtask-title { text-decoration: line-through; opacity: 0.55; }
  .gl-wtask-rule { display: block; margin: 4px 0 0 20px; font-size: 10.5px; font-weight: 600; line-height: 1.3; }
  .gl-wtask-rule .gl-bar { height: 4px; margin-top: 3px; }
  .gl-rule { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; margin: 2px 0 6px; background: var(--tint); border: 1px solid var(--neutral-line); border-radius: 8px; }
  .gl-rule-label { font-size: 11px; color: var(--ink-faint); font-family: 'DM Mono', monospace; }
  .gl-rule-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .gl-wtask-pill { display: inline-block; margin: 4px 0 0 20px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .gl-wtask-more { border: none; background: none; cursor: pointer; color: var(--ink-light); font-size: 13px; padding: 0 2px; line-height: 1; opacity: 0; }
  .gl-wtask:hover .gl-wtask-more { opacity: 1; }
  .gl-wtask .task-check { margin-top: 1px; }
  .gl-wtask-menu { position: absolute; z-index: 400; top: 100%; right: 0; width: 220px; background: var(--paper); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px var(--shadow-lg); padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: default; }
  .gl-next { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; width: 100%; font-family: 'DM Sans', sans-serif; color: var(--ink); }
  .gl-next:hover { box-shadow: 0 2px 8px var(--shadow-md); }
  .gl-next.late { background: #fdf3f1; border-color: #f0c9c3; }
  /* Mobile "More" sheet */
  .more-sheet-overlay { position: fixed; inset: 0; background: rgba(35,30,51,0.35); z-index: 95; }
  .more-sheet { position: fixed; left: 0; right: 0; bottom: 56px; z-index: 96; background: var(--paper); border-radius: 18px 18px 0 0; padding: 10px 16px 12px; box-shadow: 0 -8px 24px rgba(35,30,51,0.18); }
  .more-sheet-btn { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; border: none; background: transparent; font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink); text-align: left; cursor: pointer; border-bottom: 1px solid var(--neutral-line); }
  .more-sheet-btn:last-child { border-bottom: none; }
  .more-sheet-btn.active { color: var(--accent); font-weight: 600; }
  .mobile-bottom-nav-btn svg { display: block; }
  @media (max-width: 767px) {
    .gl-wrap { flex-direction: column; padding: 12px; gap: 12px; overflow: visible; padding-bottom: 80px; }
    .gl-side { width: auto; overflow: visible; }
    .gl-side.collapsed { width: auto; padding: 16px; overflow: visible; }
    .gl-side.collapsed .gl-side-body { display: flex; }
    .gl-side.collapsed .gl-side-strip { display: none; }
    .gl-main { overflow: visible; }
    .gl-desktop-only { display: none !important; }
    .gl-mobile-only { display: flex; }
    .gl-x, .gl-wtask-more { opacity: 1; }
    .gl-wtask .gl-wtask-title { font-size: 15px; }
    .gl-wtask { padding: 10px 10px; cursor: default; }
    .gl-wtask-pill { font-size: 11px; }
    .gl-pop { position: fixed; left: 12px; right: 12px; top: auto; bottom: 72px; width: auto; }
    .gl-wtask-menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: 72px; width: auto; padding: 12px; }
    .gl-task { padding-left: 14px; }
    .gl-ms-head > input.gl-inline { flex-basis: calc(100% - 70px) !important; }
    .gl-input, .gl-inline { font-size: 16px; } /* 16px prevents iOS auto-zoom */
  }
  @media (min-width: 768px) { .more-sheet, .more-sheet-overlay { display: none !important; } }
  /* ═══════════════════════════════════════════════════════════════
     v4.4.0 DARK MODE — "Dusk Violet" dark. Active when <html data-theme="dark">
     (set by the head script + App). Light mode is untouched by this block.
     ═══════════════════════════════════════════════════════════════ */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --cream: #14121b;
    --paper: #1d1b25;
    --surface: #26232f;
    --ink: #e8e6ef;
    --ink-light: #aeacb8;
    --ink-faint: #75727f;
    --accent: #876cca;
    --accent-light: #302844;
    --gold: #e5b15b;
    --gold-light: #2d220f;
    --border: #383541;
    --shadow: rgba(0,0,0,0.25);
    --shadow-md: rgba(0,0,0,0.35);
    --shadow-lg: rgba(0,0,0,0.45);
    --card-shadow: 0 1px 3px rgba(0,0,0,0.35);
    --red-light: #381f1b; --blue-light: #152839; --purple-light: #2c2135;
    --orange-light: #362113; --teal-light: #0d2d25;
    --tint: #3a3154;
    --neutral-bg: #312f37;
    --neutral-line: #29282e;
    --grid-line: #5b5965;
    --tile-empty: #2e2b37;
    --tile-multi: #6b6880;
    --tile-num: #8e8b99;
    --hc-pct: 58%;

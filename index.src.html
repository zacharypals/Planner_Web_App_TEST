        </div>
      </div>
    </div>
  );
}

function GoalsView({ goals, setGoals, pagesData, countdowns, setCountdowns, selectedId, setSelectedId, onOpenPage, habitGoals, fitnessExercises, habitCompletions, fitnessLog, mctx }) {
  const today = glToday();
  const [statusTab, setStatusTab] = useState('active');
  const [sideCollapsed, setSideCollapsedRaw] = useState(() => lsGet('glSideCollapsed') === '1'); // desktop only; per device
  const setSideCollapsed = (v) => { lsSet('glSideCollapsed', v ? '1' : '0'); setSideCollapsedRaw(v); };
  const list = Array.isArray(goals) ? goals : [];
  const sel = selectedId ? list.find(g => g.id === selectedId) : null;
  const counts = { active: 0, parked: 0, done: 0 };
  list.forEach(g => { counts[g.status] = (counts[g.status] || 0) + 1; });

  // Keep "Show in Countdowns" goals mirrored into the countdowns list (ids prefixed 'goal-').
  useEffect(() => {
    if (!setCountdowns) return;
    const cur = Array.isArray(countdowns) ? countdowns : [];
    const want = list.filter(g => g.showCountdown && g.targetDate && g.status !== 'done')
      .map(g => ({ id: 'goal-' + g.id, title: g.title || 'Goal', startDate: g.startDate || today, endDate: g.targetDate, color: g.color }));
    const others = cur.filter(c => !String(c.id).startsWith('goal-'));
    const next = [...others, ...want];
    if (JSON.stringify(next) !== JSON.stringify(cur)) setCountdowns(next);
  }, [goals]);

  function changeGoal(gid, fn) { setGoals(gs => glPatchGoal(gs, gid, fn)); }
  function newGoal() {
    if (counts.active >= GL_SOFT_LIMIT && !window.confirm(`You already have ${counts.active} active goals (soft limit ${GL_SOFT_LIMIT}). Add another anyway?`)) return;
    const g = glNewGoal(list);
    setGoals(gs => [...gs, g]);
    setStatusTab('active');
    setSelectedId(g.id);
  }

  const shownList = list.filter(g => g.status === statusTab);
  const upcoming = [];
  list.filter(g => g.status === 'active').forEach(g => (g.milestones || []).forEach(m => { if (!m.done) upcoming.push({ g, m }); }));
  upcoming.sort((a, b) => (a.m.dueDate || '9999').localeCompare(b.m.dueDate || '9999'));
  const weekStart = getWeekStart(new Date());
  const weekKeys = Array.from({ length: 7 }, (_, i) => fmtLocal(addDays(weekStart, i)));
  const byDay = glTasksByDay(list.filter(g => g.status !== 'done'));
  const weekItems = weekKeys.flatMap(k => byDay[k] || []);

  return (
    <div className="gl-wrap">
      <aside className={`gl-card gl-side ${sel ? 'gl-desktop-only' : ''} ${sideCollapsed ? 'collapsed' : ''}`} aria-label="Goals list">
        <div className="gl-side-strip">
          <button className="gl-side-toggle" aria-label="Expand goals list" title="Expand goals list" onClick={() => setSideCollapsed(false)}>›</button>
          <span className="gl-side-vlabel">Goals</span>
          {list.filter(g => g.status === 'active').map(g => (
            <button key={g.id} className="gl-side-dot" title={g.title || 'Untitled goal'} aria-label={'Open ' + (g.title || 'goal')}
              style={{ background: g.color, boxShadow: sel && sel.id === g.id ? `0 0 0 2px #fff, 0 0 0 4px ${g.color}` : 'none' }}
              onClick={() => setSelectedId(g.id)} />
          ))}
          <button className="gl-side-toggle" aria-label="New goal" title="New goal" onClick={newGoal} style={{ marginTop: 4 }}>+</button>
        </div>
        <div className="gl-side-body">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
          <span className="gl-h2" style={{ fontSize: 22 }}>Goals</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <button className="gl-btn primary" onClick={newGoal}>+ New goal</button>
            <button className="gl-side-toggle gl-desktop-only" aria-label="Collapse goals list" title="Collapse goals list" onClick={() => setSideCollapsed(true)}>‹</button>
          </div>
        </div>
        <div role="tablist" aria-label="Goal status" style={{ display: 'flex', gap: 6 }}>
          {['active', 'parked', 'done'].map(s => (
            <button key={s} role="tab" aria-selected={statusTab === s} className={`gl-chip ${statusTab === s ? 'on' : ''}`} onClick={() => setStatusTab(s)}>
              {s[0].toUpperCase() + s.slice(1)} {counts[s] || 0}
            </button>
          ))}
        </div>
        {!shownList.length && (
          <div style={{ fontSize: 13, color: 'var(--ink-light)', padding: '8px 2px', lineHeight: 1.5 }}>
            {statusTab === 'active' ? 'No active goals yet. Start one with + New goal.' : statusTab === 'parked' ? 'Nothing parked.' : 'No finished goals yet.'}
          </div>
        )}
        {shownList.map(g => {
          const h = glHealth(g, today);
          const m = glNextMilestone(g);
          const doneMs = (g.milestones || []).filter(x => x.done).length;
          const late = m && glMsOverdue(m, today);
          return (
            <button key={g.id} className="gl-goal-card" onClick={() => setSelectedId(g.id)}
              style={{ border: sel && sel.id === g.id ? `2px solid ${g.color}` : undefined }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span className="gl-dot" style={{ background: g.color }} />
                <span style={{ flex: 1, minWidth: 0, fontWeight: 600, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{g.title || 'Untitled goal'}</span>
                <GlHealthPill h={h} />
              </div>
              <div className="gl-bar" style={{ margin: '9px 0 6px', background: glTint(g.color, 0.15) }}><div style={{ width: Math.round(h.p * 100) + '%', background: g.color }} /></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--ink-light)' }}>
                <span>{Math.round(h.p * 100)}% · {doneMs} of {(g.milestones || []).length} milestones</span>
                <span className="gl-mono">{glShort(g.targetDate)}</span>
              </div>
              {g.status === 'active' && m && (
                <div style={{ marginTop: 6, fontSize: 12, color: late ? '#b03a2e' : 'var(--ink)', fontWeight: late ? 600 : 400 }}>
                  {late ? `${m.title || 'Milestone'} · ${glDays(m.dueDate, today)} days overdue`
                    : <><span style={{ color: 'var(--ink-light)' }}>Next:</span> {m.title || 'Untitled milestone'}{m.dueDate ? ` · due ${glShort(m.dueDate)}` : ''}</>}
                </div>
              )}
              {g.status === 'active' && (
                <GlLinksRow compact goal={g} habitGoals={habitGoals} fitnessExercises={fitnessExercises} mctx={mctx}
                  habitCompletions={habitCompletions} fitnessLog={fitnessLog} weekStart={getWeekStart(new Date())} />
              )}
            </button>
          );
        })}
        {statusTab === 'active' && counts.active > 0 && (
          <div style={{ fontSize: 12, color: counts.active > GL_SOFT_LIMIT ? '#7a4f00' : 'var(--ink-light)', background: counts.active > GL_SOFT_LIMIT ? '#fbf0d6' : 'var(--cream)', borderRadius: 8, padding: '8px 10px' }}>
            {counts.active} active of a soft limit of {GL_SOFT_LIMIT}{counts.active > GL_SOFT_LIMIT ? ' — consider parking one' : ''}
          </div>
        )}
        </div>
      </aside>

      <main className="gl-main">
        {sel ? (
          <GlDetail key={sel.id} goal={sel} pagesData={pagesData} onOpenPage={onOpenPage}
            habitGoals={habitGoals} fitnessExercises={fitnessExercises} mctx={mctx}
            habitCompletions={habitCompletions} fitnessLog={fitnessLog}
            onChange={fn => changeGoal(sel.id, fn)}
            onBack={() => setSelectedId(null)}
            onDelete={() => { setGoals(gs => gs.filter(g => g.id !== sel.id)); setSelectedId(null); }} />
        ) : (
          <>
            <GlTimeline goals={list} onOpenGoal={setSelectedId} onChangeGoal={changeGoal} />

            {weekItems.length > 0 && (
              <section className="gl-card gl-mobile-only" style={{ flexDirection: 'column', overflow: 'hidden' }}>
                <div className="gl-label" style={{ padding: '12px 14px 6px' }}>This week · goal tasks</div>
                {weekItems.map(({ goal, ms, task }) => (
                  <label key={task.id} style={{ display: 'flex', alignItems: 'center', gap: 12, minHeight: 48, padding: '0 14px', borderTop: '1px solid var(--neutral-line)', cursor: 'pointer' }}>
                    <input type="checkbox" checked={!!task.done} style={{ width: 20, height: 20, accentColor: goal.color }}
                      onChange={() => setGoals(gs => glPatchTask(gs, goal.id, ms.id, task.id, { done: !task.done }))} />
                    <span style={{ flex: 1, fontSize: 15, textDecoration: task.done ? 'line-through' : 'none', color: task.done ? 'var(--ink-light)' : 'var(--ink)' }}>{task.title || 'Untitled task'}</span>
                    <span style={{ fontSize: 11, fontWeight: 600, color: glInk(goal.color), background: glTint(goal.color, 0.16), padding: '2px 8px', borderRadius: 999 }}>{DAYS[parseLocal(task.scheduledDate).getDay()]}</span>
                  </label>
                ))}
              </section>
            )}

            {upcoming.length > 0 && (
              <section className="gl-card" style={{ padding: '14px 16px', flexShrink: 0 }}>
                <div className="gl-h2" style={{ fontSize: 18, marginBottom: 10 }}>Coming up</div>
                <div className="gl-upnext">
                  {upcoming.slice(0, 8).map(({ g, m }) => {
                    const late = glMsOverdue(m, today);
                    const tag = late ? `Overdue · ${glDays(m.dueDate, today)} day${glDays(m.dueDate, today) === 1 ? '' : 's'}`
                      : m.startDate && m.startDate > today ? `Starts ${glShort(m.startDate)}`
                      : m.dueDate ? `Due ${glShort(m.dueDate)}` : 'No due date';
                    const t = m.tasks || [];
                    return (
                      <button key={m.id} onClick={() => setSelectedId(g.id)} className="gl-goal-card"
                        style={{ background: late ? 'var(--red-light)' : 'var(--surface)', borderColor: late ? '#f0c9c3' : undefined }}>
                        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: late ? '#b03a2e' : 'var(--ink-light)' }}>{tag}</div>
                        <div style={{ fontWeight: 600, fontSize: 14, margin: '4px 0 2px', display: 'flex', alignItems: 'center', gap: 6 }}>
                          <span className="gl-dot" style={{ background: g.color, width: 8, height: 8 }} />{m.title || 'Untitled milestone'}
                        </div>
                        <div style={{ fontSize: 12, color: 'var(--ink-light)' }}>{g.title || 'Goal'}{t.length ? ` · ${t.filter(x => x.done).length} of ${t.length} tasks` : ''}</div>
                      </button>
                    );
                  })}
                </div>
              </section>
            )}
          </>
        )}
      </main>
    </div>
  );
}

function App() {
  const [page, setPageRaw] = useState(() => sessionStorage.getItem('lp_page') || 'planner');
  const setPage = (p) => { sessionStorage.setItem('lp_page', p); setPageRaw(p); };
  const [navColor, setNavColor] = useSynced('navColor', '#3a2960');
  const [calHeaderColor, setCalHeaderColor] = useSynced('calHeaderColor', '#523e82');
  // weekData as STORED (weeks + any copies you changed) and repeatSeries (repeating tasks stored once, v5.5.0).
  // Screens never see these two directly: they get `weekData` (the generated copies merged in) and a
  // setWeekData that folds their edits back into the stored form. With no series this is a pass-through.
  const [weekDataStored, setWeekDataStored] = useSynced('weekData', {});
  const [repeatSeries, setRepeatSeries] = useSynced('repeatSeries', {});
  const storedRef = useRef(weekDataStored), seriesRef = useRef(repeatSeries);
  useEffect(() => { storedRef.current = weekDataStored; }, [weekDataStored]);
  useEffect(() => { seriesRef.current = repeatSeries; }, [repeatSeries]);
  const viewCacheRef = useRef(null);
  if (!viewCacheRef.current) viewCacheRef.current = { ser: new Map(), weeks: new Map(), ver: 0 };
  const viewTodayKey = fmtLocal(new Date());
  const weekData = React.useMemo(
    () => repeatExpandAll(weekDataStored, repeatSeries, viewTodayKey, viewCacheRef.current),
    [weekDataStored, repeatSeries, viewTodayKey]);
  const setWeekData = useCallback((fn) => {
    const st = storedRef.current, se = seriesRef.current;
    if (!Object.keys(se || {}).length) {                        // no series: exactly the old behaviour
      const nx = typeof fn === 'function' ? fn(st) : fn;
      if (nx !== st) { storedRef.current = nx; setWeekDataStored(nx); }
      return;
    }
    const view = repeatExpandAll(st, se, fmtLocal(new Date()), viewCacheRef.current);
    const next = typeof fn === 'function' ? fn(view) : fn;
    if (next === view) return;
    const r = repeatCollapse(next, view, st, se);
    if (r.series !== se) { seriesRef.current = r.series; setRepeatSeries(r.series); }
    if (r.stored !== st) { storedRef.current = r.stored; setWeekDataStored(r.stored); }
  }, []);
  // Run a repeating-task operation on the STORED data (fn(stored, series) -> {stored, series} | null) and
  // register an Undo that puts back only the weeks and series it touched. Returns the result (or null).
  const commitSeries = (ns, nse) => {
    if (nse !== seriesRef.current) { seriesRef.current = nse; setRepeatSeries(nse); }
    if (ns !== storedRef.current) { storedRef.current = ns; setWeekDataStored(ns); }
  };
  const seriesRun = useCallback((label, fn) => {
    const st = storedRef.current, se = seriesRef.current;
    const r = fn(st, se);
    if (!r || (r.stored === st && r.series === se)) return null;
    commitSeries(r.stored, r.series);
    const wk = Object.keys({ ...st, ...r.stored }).filter(k => st[k] !== r.stored[k]);
    const sk = Object.keys({ ...se, ...r.series }).filter(k => se[k] !== r.series[k]);
    Undo.push(label, () => {
      const ns = { ...storedRef.current }, nse = { ...seriesRef.current };
      wk.forEach(k => { if (st[k] === undefined) delete ns[k]; else ns[k] = st[k]; });
      sk.forEach(k => { if (se[k] === undefined) delete nse[k]; else nse[k] = se[k]; });
      commitSeries(ns, nse);
    });
    return r;
  }, []);
  const [pagesData, setPagesData] = useSynced('pagesData', []); // [{id,title,body,createdAt,lastModified,folderId,order,tasks:[]}]
  const [foldersData, setFoldersData] = useSynced('foldersData', []); // [{id,name,expanded,order}]
  const [selectedPagesId, setSelectedPagesIdRaw] = useState(() => sessionStorage.getItem('lp_selectedPagesId') || null);
  const setSelectedPagesId = (id) => { if(id) sessionStorage.setItem('lp_selectedPagesId', id); else sessionStorage.removeItem('lp_selectedPagesId'); setSelectedPagesIdRaw(id); };
  const [habitGoals, setHabitGoals] = useSynced('habitGoals', [
    {id:'g1', name:'Daily Pages', color:'#2d5a3d'},
  ]);
  const [habitCompletions, setHabitCompletions] = useSynced('habitCompletions', {});
  const [habitMetrics, setHabitMetrics] = useSynced('habitMetrics', {}); // {[dateKey]: {weight:'', cals:''}}
  const [habitQty, setHabitQty] = useSynced('habitQty', {}); // {[dateKey]: {[goalId]: qty}}
  const [habitNotes, setHabitNotes] = useSynced('habitNotes', {}); // {[dateKey]: {[goalId]: notes}}
  const [weightTarget, setWeightTarget] = useSynced('weightTarget', '');
  const [calsTarget, setCalsTarget] = useSynced('calsTarget', '');
  const [monthlyGoals, setMonthlyGoals] = useSynced('monthlyGoals', {});
  const [peopleDirectory, setPeopleDirectory] = useSynced('peopleDirectory', []); // [{id, name}] — master list across weeks
  const [fitnessLog, setFitnessLog] = useSynced('fitnessLog', {}); // {[dateKey]: [{id, name, exercises:[{id, exerciseId, sets:[{id,reps,weight,done}]}]}]}
  const [fitnessExercises, setFitnessExercises] = useSynced('fitnessExercises', []); // [{id, name, category}] library
  const [fitnessCompare, setFitnessCompare] = useSynced('fitnessCompare', []); // v5.19.0 saved Fitness > Charts comparisons [{id,name,metric,untagged,groups:[{id,name,subs,exerciseIds}]}]
  const [fitnessGoals, setFitnessGoals] = useSynced('fitnessGoals', []); // [{id, exerciseId, period, target, unit}]
  const [countdowns, setCountdowns] = useSynced('countdowns', []); // [{id, title, startDate, endDate, color}]
  const [goals, setGoals] = useSynced('goals', []); // [{id,title,why,color,status,startDate,targetDate,milestones:[{id,title,startDate,dueDate,done,tasks:[{id,title,scheduledDate,done}]}]}] — see GOALS section
  // Weight / calorie readings and their targets, bundled for the goal views (v4.8.0)
  // v5.11.0: the fitness log and exercise library ride along so goal rules can read them
  const mctx = { metrics: habitMetrics, weightTarget, calsTarget, fitnessLog, fitnessExercises, habitGoals, habitCompletions, habitQty };
  // Complete weight milestones whose condition is met (7-day average, 3+ readings since the goal began) and
  // tasks / milestones whose training rule is met by the Fitness log (v5.11.0).
  // Debounced; writes only when something changed. The Undo toast reopens it and holds auto-complete.
  useEffect(() => {
    const t = setTimeout(() => {
      const asOf = new Date(); asOf.setHours(0, 0, 0, 0);
      const ctx = { metrics: habitMetrics, weightTarget, calsTarget, fitnessLog, fitnessExercises, habitGoals, habitCompletions, habitQty };
      const r = glAutoComplete(goals, ctx, asOf);
      if (r.goals === goals) return;
      setGoals(gs => glAutoComplete(gs, ctx, asOf).goals);
      r.reached.forEach(x => Undo.push(`Reached: ${x.title || (x.kind === 'task' ? 'task' : 'milestone')}`, () => x.kind === 'task'
        ? setGoals(gs => glPatchTask(gs, x.gid, x.mid, x.tid, { done: false }))
        : setGoals(gs => glPatchGoal(gs, x.gid, g =>
            glPatchMs(g, x.mid, m => ({ ...m, done: false, completedAt: null, autoDone: false, metricHold: true, ruleHold: true }))))));
    }, 2500);
    return () => clearTimeout(t);
  }, [goals, habitMetrics, weightTarget, fitnessLog, fitnessExercises, habitGoals, habitCompletions, habitQty]);
  // Keep "never ends" repeating tasks topped up as time passes (v4.6.0). Debounced; only writes when something was added.
  useEffect(() => {
    const t = setTimeout(() => {
      const next = repeatExtend(weekData, fmtLocal(new Date()));
      if (next !== weekData) setWeekData(wd => (wd === weekData ? next : repeatExtend(wd, fmtLocal(new Date()))));
    }, 2500);
    return () => clearTimeout(t);
  }, [weekData]);
  const [selectedGoalId, setSelectedGoalIdRaw] = useState(() => sessionStorage.getItem('lp_selectedGoalId') || null);
  const setSelectedGoalId = (id) => { if(id) sessionStorage.setItem('lp_selectedGoalId', id); else sessionStorage.removeItem('lp_selectedGoalId'); setSelectedGoalIdRaw(id); };
  const openGoal = (id) => { setSelectedGoalId(id || null); setPage('goals'); };
  const [moreOpen, setMoreOpen] = useState(false); // mobile bottom-nav "More" sheet
  const [reviewOpen, setReviewOpen] = useState(false); // Weekly Review overlay (v4.7.0)
  // v4.4.0: theme preference — 'auto' (follow device) | 'light' | 'dark'; per device, like the swipe toggle
  const [themePref, setThemePref] = useState(() => { try { return localStorage.getItem('lp_theme') || 'auto'; } catch { return 'auto'; } });
  useEffect(() => {
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const apply = () => {
      const dark = themePref === 'dark' || (themePref === 'auto' && !!(mq && mq.matches));
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (window.Chart && window.Chart.defaults) {
        window.Chart.defaults.color = dark ? '#aeacb8' : '#666';
        window.Chart.defaults.borderColor = dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.1)';
      }
    };
    apply();
    try { localStorage.setItem('lp_theme', themePref); } catch {}
    if (themePref === 'auto' && mq) {
      if (mq.addEventListener) { mq.addEventListener('change', apply); return () => mq.removeEventListener('change', apply); }
      if (mq.addListener) { mq.addListener(apply); return () => mq.removeListener(apply); }
    }
  }, [themePref]);
  const cycleTheme = () => setThemePref(p => p === 'auto' ? 'light' : p === 'light' ? 'dark' : 'auto');
  const themeLabel = themePref === 'auto' ? '◐ Auto' : themePref === 'light' ? '☀ Light' : '☾ Dark';

  // Auth & sync state
  const [authUser, setAuthUser] = useState(null); // {name, email, picture}
  const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'saved', 'merged', 'ERR:<message>'
  const [online, setOnline] = useState(typeof navigator === 'undefined' || navigator.onLine !== false);
  useEffect(() => {
    const on = () => { setOnline(true); try { Sync.pull?.(); if (Sync.pendingCount?.()) Sync.flush?.({ manual: true }); } catch {} };
    const off = () => setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  const [saveRetrying, setSaveRetrying] = useState(false); // true while manual retry is in flight
  const [authError, setAuthError] = useState(false); // true when the session ended — edits wait on this device
  const [authLoading, setAuthLoading] = useState(true); // true while session restore + first load is in progress on mount
  const [signInError, setSignInError] = useState(''); // shown on the sign-in wall
  const [loadError, setLoadError] = useState('');     // first load on this device failed (e.g. offline)
  const [googleReauth, setGoogleReauth] = useState(false); // Calendar needs a fresh Google sign-in
  const [syncing, setSyncing] = useState(false);
  const [pullRefreshing, setPullRefreshing] = useState(false);
  const [pullDisplayY, setPullDisplayY] = useState(0);
  const pullStartY = useRef(0);
  const pullDeltaY = useRef(0);
  const pullActive = useRef(false);
  const savedTimerRef = useRef(null);
  const [me, setMe] = useState(null);                 // /api/me: backup status, Drive/Calendar permission
  const [showData, setShowData] = useState(false);    // Data & backups panel
  const [suggestImport, setSuggestImport] = useState(false);
  async function refreshMe() { try { setMe(await api('/api/me')); } catch {} }

  // Sync engine → UI. The error toast stays until a save actually succeeds.
  useEffect(() => {
    Sync.onStatus = ({ kind, message }) => {
      if (kind === 'saving') { clearTimeout(savedTimerRef.current); setSaveStatus(s => s.startsWith('ERR:') ? s : 'saving'); }
      else if (kind === 'saved' || kind === 'merged') {
        clearTimeout(savedTimerRef.current);
        setSaveStatus(kind); setAuthError(false);
        savedTimerRef.current = setTimeout(() => setSaveStatus(''), kind === 'merged' ? 4000 : 2000);
      }
      else if (kind === 'error') { clearTimeout(savedTimerRef.current); setSaveStatus('ERR:' + (message || 'Sync failed')); }
      else if (kind === 'idle') setSaveStatus(s => (s.startsWith('ERR:') && Sync.pendingCount()) ? s : (s === 'saved' || s === 'merged' ? s : ''));
    };
    Sync.onAuthLost = () => setAuthError(true);
    _onGoogleReauth = (v) => setGoogleReauth(v);
    return () => { Sync.onStatus = null; Sync.onAuthLost = null; _onGoogleReauth = null; };
  }, []);

  // Apply a Calendar pull without clobbering edits made while it ran: only the weeks the
  // pull actually changed are replaced. The sync engine then uploads just those weeks.
  function applyCalendarResult(before, after) {
    const changed = {};
    for (const wk of Object.keys(after)) if (JSON.stringify(after[wk]) !== JSON.stringify(before[wk])) changed[wk] = after[wk];
    if (Object.keys(changed).length) setWeekData(prev => ({ ...prev, ...changed }));
  }

  // Silently pull new Google Calendar events after the first load so events are current on
  // app open without tapping "Sync Calendar". Throttled to once per 5 minutes.
  async function autoSyncCalendar(currentWeekData) {
    if (Date.now() - _lastCalSyncMs < 5 * 60 * 1000) return;
    if (!(await ensureGoogleToken())) return;
    _lastCalSyncMs = Date.now();
    try {
      const result = await pullNewFromCalendar(currentWeekData);
      if (!result || (result.added === 0 && result.updated === 0 && !(result.durFixed > 0))) return;
      applyCalendarResult(currentWeekData, result.newWeekData);
      console.log(`Auto calendar sync: ${result.added} added, ${result.updated} updated`);
    } catch (e) {
      console.log('Auto calendar sync skipped:', e?.message);
    }
  }

  // Each useSynced() value syncs itself — there is no list of keys to keep in step anymore.

  // Fitness → Habit sync (runs at App level so it fires on ALL pages, not just Habit page)
  useEffect(() => {
    // Support both old single linkedExerciseId and new linkedExerciseIds array
    const linkedGoals = habitGoals.filter(g =>
      g.linkedExerciseId || (g.linkedExerciseIds && g.linkedExerciseIds.length > 0)
    );
    if (linkedGoals.length === 0) return;

    let newCompletions = null;
    let newQty = null;

    Object.keys(fitnessLog).forEach(dk => {
      const raw = fitnessLog[dk] || [];
      const exList = (raw[0] && Array.isArray(raw[0].exercises))
        ? raw.flatMap(w => w.exercises || [])
        : raw;

      linkedGoals.forEach(habit => {
        // Normalize to array, migrate old single-id field transparently
        const linkedIds = (habit.linkedExerciseIds && habit.linkedExerciseIds.length > 0)
          ? habit.linkedExerciseIds
          : (habit.linkedExerciseId ? [habit.linkedExerciseId] : []);
        if (linkedIds.length === 0) return;

        let total = 0;
        exList.forEach(ex => {
          if (!linkedIds.includes(ex.exerciseId)) return;
          const libEx = fitnessExercises.find(e => e.id === ex.exerciseId);
          const isCardio = libEx?.category === 'Cardio';
          ex.sets.filter(s => s.done).forEach(s => {
            total += isCardio ? (parseFloat(s.dist) || 0) : (parseFloat(s.reps) || 0);
          });
        });

        if (total > 0) {
          if (!newCompletions) newCompletions = {...habitCompletions};
          const arr = newCompletions[dk] || [];
          if (!arr.includes(habit.id)) newCompletions[dk] = [...arr, habit.id];

          if (!newQty) newQty = {...habitQty};
          const dayQty = {...(newQty[dk] || {})};
          const existingTotal = qtyTotal(dayQty[habit.id]);
          if (Math.abs(total - existingTotal) > 0.001) {
            const rounded = Math.round(total * 100) / 100;
            dayQty[habit.id] = [{id: genLiId(), amount: rounded, note: 'fitness sync', ts: Date.now()}];
            newQty[dk] = dayQty;
          }
        }
      });
    });

    if (newCompletions) setHabitCompletions(newCompletions);
    if (newQty) setHabitQty(newQty);
  }, [fitnessLog, habitGoals]);

  // On mount: finish a Google sign-in redirect if we're returning from one, then load data.
  // authLoading must end on EVERY path — the sign-in wall (or the app) appears afterwards.
  async function bootSession() {
    setLoadError('');
    try {
      let profile = null;
      try { profile = await completeSignInFromRedirect(); }
      catch (e) { setSignInError(e.message); }
      if (!getSession()) return;   // not signed in → sign-in wall
      profile = profile || readProfile() || { name: getSavedEmail(), email: getSavedEmail(), picture: null };
      const r = await Sync.start(getSavedEmail());
      setAuthUser(profile);
      setSignInError('');
      setAuthError(false);
      if (r && r.values) ensureGoogleToken().then(() => autoSyncCalendar(
        repeatExpandAll(r.values.weekData || {}, r.values.repeatSeries || {}, fmtLocal(new Date()), null)));
      refreshMe();
      if (r && r.empty) { setSuggestImport(true); setShowData(true); }   // brand-new account: offer the Drive import
    } catch (e) {
      if (e && e.isAuth) {
        clearSession();
        setAuthUser(null);
        setSignInError(e.code === 'not_allowed' ? SIGNIN_ERRORS.not_allowed : 'Your session ended — please sign in again.');
      } else {
        setLoadError((e && e.message) || 'Could not load your planner');
      }
    } finally {
      setAuthLoading(false);
    }
  }
  useEffect(() => { bootSession(); }, []);

  // Keep devices in step: upload on hide/close, pull other devices' changes when the app comes
  // back into view and every 30s while it's open, and keep the Calendar token fresh.
  useEffect(() => {
    if (!authUser) return;
    function flushNow() {
      _bodyFlushRef.fn?.();          // pending Pages text → storage
      Sync.captureAllFromStorage();  // React may not have re-rendered the latest keystrokes yet
      Sync.flush({ keepalive: true });
    }
    function refreshGoogleSoon() {
      const exp = parseInt(lsGet('gtoken_exp') || '0', 10);
      if (!getToken() || exp - Date.now() < 4 * 60 * 1000) ensureGoogleToken(true);
    }
    function onVisibility() {
      if (document.visibilityState === 'hidden') flushNow();
      else { Sync.pull(); refreshGoogleSoon(); }
    }
    function onOnline() { Sync.flush({ manual: true }); Sync.pull(); }
    window.addEventListener('pagehide', flushNow);
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('online', onOnline);
    const poll = setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      Sync.pull();
      refreshGoogleSoon();
    }, 30000);
    return () => {
      window.removeEventListener('pagehide', flushNow);
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('online', onOnline);
      clearInterval(poll);
    };
  }, [authUser]);

  function handleSignIn() { startSignIn(); }

  async function handleSignOut() {
    _bodyFlushRef.fn?.();
    Sync.captureAllFromStorage();
    if (Sync.pendingCount()) await Sync.flush({ manual: true });
    if (Sync.pendingCount() && !window.confirm("Some changes haven't uploaded yet (no connection?).\n\nSigning out removes them from this device. Sign out anyway?")) return;
    try { await api('/auth/logout', { method: 'POST' }); } catch {}
    Sync.wipeLocal();
    clearSession(); clearEmail(); clearToken(); lsDel('profile');
    window.location.reload();
  }

  async function handleSyncCalendar() {
    setSyncing(true);
    if (!(await ensureGoogleToken())) {
      setSyncing(false);
      alert("Google Calendar isn't connected right now.\n\nTap \"Reconnect Calendar\" (or sign out and back in), then try again.");
      return;
    }
    try {
      const result = await pullNewFromCalendar(weekData);
      if (!result) {
        alert('Calendar sync failed: could not reach Google Calendar.\n\nMake sure:\n1. Google Calendar API is enabled in Cloud Console\n2. You signed in and approved Calendar access on the consent screen\n3. Try signing out and back in');
      } else if (result.added > 0 || result.updated > 0 || result.durFixed > 0) {
        applyCalendarResult(weekData, result.newWeekData);   // only the changed weeks; the sync engine uploads them
        const parts = [];
        if (result.added > 0) {
          // Build human-readable date labels so the user knows where to navigate
          const dateLabels = [...new Set(result.addedDates)].map(d => {
            const o = parseLocal(d);
            return o ? `${MONTHS[o.getMonth()].slice(0, 3)} ${o.getDate()}` : d;
          });
          parts.push(`${result.added} new event${result.added===1?'':'s'} added`);
          if (dateLabels.length) parts.push(`(${dateLabels.join(', ')})`);
        }
        if (result.updated > 0) parts.push(`${result.updated} event${result.updated===1?'':'s'} updated`);
        alert('✓ ' + parts.join(' ') + ' from Google Calendar.');
      } else {
        alert('✓ All caught up — no changes to import from Google Calendar.');
      }
    } catch (e) {
      const msg = e?.message || 'Unknown error';
      alert(`Calendar sync failed: ${msg}\n\nMake sure:\n1. Google Calendar API is enabled in Cloud Console\n2. You signed in and approved Calendar access\n3. Try signing out and back in`);
    }
    setSyncing(false);
  }

  async function handlePullRefresh() {
    if (pullRefreshing) return;
    setPullRefreshing(true);
    try {
      // Read the running version dynamically from the document comment
      const runningMatch = document.documentElement.outerHTML.match(/LP Planner v([\d.]+)/);
      const RUNNING_VERSION = runningMatch ? runningMatch[1] : '0.0.0';
      try {
        const res = await fetch(window.location.pathname + '?v=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
        });
        const html = await res.text();
        const deployedMatch = html.match(/LP Planner v([\d.]+)/);
        if (deployedMatch && deployedMatch[1] !== RUNNING_VERSION) {
          // New version detected — upload anything pending, then hard-reload
          if (authUser) { _bodyFlushRef.fn?.(); Sync.captureAllFromStorage(); await Sync.flush({ manual: true }); }
          window.location.reload(true);
          return;
        }
      } catch (e) {
        // Network issue checking version — continue with data sync only
      }
      if (authUser) {
        await Sync.pull();
        await Sync.flush({ manual: true });
      }
    } finally {
      setPullRefreshing(false);
    }
  }

  const isErr = saveStatus.startsWith('ERR:') && online;   // offline is expected, not an error
  const errDetail = isErr ? saveStatus.slice(4) : '';
  const saveLabel = saveStatus === 'saving' ? '↑ Saving…'
    : saveStatus === 'saved' ? '✓ Saved'
    : saveStatus === 'merged' ? '⇄ Merged'
    : isErr ? '✗ Save error'
    : '';
  const saveClass = isErr ? 'error' : (saveStatus === 'merged' ? 'saved' : saveStatus);

  return (
    <div className="app">
      <UndoToast lift={isErr || !!authError} />
      <FitTimerHost lift={isErr || !!authError} />
      {/* ── SAVE ERROR TOAST — bottom, persistent until save actually succeeds ── */}
      {(isErr || authError) && (
        <div className="save-error-toast" style={{
          position:'fixed', bottom: 0, left:0, right:0, zIndex:10000,
          background: authError ? '#7c2d52' : '#7f1d1d',
          color:'white', padding:'14px 18px',
          fontFamily:"'DM Sans',sans-serif", fontSize:13,
          display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
          boxShadow:'0 -2px 16px rgba(0,0,0,0.35)',
          borderTop: authError ? '1px solid rgba(255,255,255,0.15)' : '1px solid rgba(255,100,100,0.3)',
        }}>
          <div style={{display:'flex',flexDirection:'column',gap:3,minWidth:0}}>
            <span style={{fontWeight:700,fontSize:13}}>
              {authError ? '⚠️ Signed out — your changes are waiting on this device' : '⚠️ Changes not synced yet'}
            </span>
            {!authError && errDetail && (
              <span style={{fontSize:11,opacity:0.7,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{errDetail}</span>
            )}
            <span style={{fontSize:11,opacity:0.6}}>
              {authError ? 'Sign in again to upload them.' : 'Your changes are saved on this device and will upload automatically — or tap Retry.'}
            </span>
          </div>
          <button
            disabled={saveRetrying}
            onClick={async () => {
              if (authError) {
                // Session ended — sign in again (full-page redirect; queued edits are kept on this device)
                startSignIn();
              } else {
                setSaveRetrying(true);
                await Sync.flush({ manual: true });
                setSaveRetrying(false);
              }
            }}
            style={{
              background: saveRetrying ? 'rgba(255,255,255,0.15)' : 'white',
              color: authError ? '#7c2d52' : '#7f1d1d',
              border:'none', borderRadius:8,
              padding:'8px 18px', cursor: saveRetrying ? 'default' : 'pointer',
              fontWeight:700, fontSize:13,
              fontFamily:"'DM Sans',sans-serif", whiteSpace:'nowrap', flexShrink:0,
              minWidth:90, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
              opacity: saveRetrying ? 0.7 : 1,
              transition:'opacity 0.15s',
            }}>
            {saveRetrying
              ? <><span style={{display:'inline-block',animation:'spin 0.8s linear infinite'}}>↻</span> Retrying…</>
              : authError ? 'Sign in again' : 'Retry'
            }
          </button>
        </div>
      )}
      {showData && authUser && (
        <DataPanel me={me} refreshMe={refreshMe} suggestImport={suggestImport}
          onClose={() => { setShowData(false); setSuggestImport(false); }} />
      )}
      {/* ── AUTH LOADING SCREEN — shown while silent session restore is in progress ── */}
      {authLoading && (
        <div style={{
          position:'fixed', inset:0, zIndex:20000,
          background:'linear-gradient(135deg, #322353 0%, #473473 100%)',
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14,
        }}>
          <span style={{fontSize:32,color:'rgba(255,255,255,0.85)',display:'inline-block',animation:'spin 1.1s linear infinite'}}>↻</span>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:'rgba(255,255,255,0.55)'}}>Loading your planner…</span>
        </div>
      )}
      {/* ── SIGN-IN WALL — blocks all app content; no data access or edits without signing in ── */}
      {!authLoading && !authUser && (
        <div style={{
          position:'fixed', inset:0, zIndex:20000,
          background:'linear-gradient(135deg, #322353 0%, #473473 100%)',
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24,
        }}>
          <div style={{
            background:'rgba(255,255,255,0.09)', borderRadius:20,
            border:'1px solid rgba(255,255,255,0.15)', padding:'40px 36px',
            maxWidth:380, width:'100%', display:'flex', flexDirection:'column',
            alignItems:'center', gap:20, boxShadow:'0 16px 64px rgba(0,0,0,0.3)',
          }}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:'rgba(255,255,255,0.95)',letterSpacing:'0.02em'}}>
              ✦ LP Planner
            </div>
            {loadError ? (
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:'rgba(255,255,255,0.8)',textAlign:'center',lineHeight:1.65}}>
                Couldn't load your planner ({loadError}). Your data is safe — check your connection and try again.
              </div>
            ) : (
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:'rgba(255,255,255,0.75)',textAlign:'center',lineHeight:1.65}}>
                Sign in with Google to access your planner. Your data is stored privately in your LP Planner account and is only accessible when you're signed in.
              </div>
            )}
            {signInError && !loadError && (
              <div style={{background:'rgba(220,74,58,0.25)',border:'1px solid rgba(255,140,120,0.45)',borderRadius:10,padding:'10px 14px',
                fontFamily:"'DM Sans',sans-serif",fontSize:13,color:'white',textAlign:'center',lineHeight:1.5,width:'100%'}}>
                {signInError}
              </div>
            )}
            <div style={{
              background:'rgba(0,0,0,0.15)', borderRadius:10, padding:'12px 16px',
              border:'1px solid rgba(255,255,255,0.1)',
              fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'rgba(255,255,255,0.55)',
              textAlign:'center', lineHeight:1.55,
            }}>
              🔒 Sign-in is required to protect your data. Without it, any changes you make locally can be silently overwritten the next time you log in.
            </div>
            <button onClick={loadError ? () => { setAuthLoading(true); bootSession(); } : handleSignIn} style={{
              background:'white', color:'#3a2960', border:'none', borderRadius:10,
              padding:'13px 32px', fontFamily:"'DM Sans',sans-serif", fontWeight:700,
              fontSize:15, cursor:'pointer', width:'100%', letterSpacing:'0.01em',
              boxShadow:'0 4px 16px rgba(0,0,0,0.2)', transition:'transform 0.15s',
            }}
            onMouseOver={e=>e.currentTarget.style.transform='scale(1.02)'}
            onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}>
              {loadError ? 'Try again' : 'Sign in with Google'}
            </button>
          </div>
        </div>
      )}

// FITNESS VIEW
// ─────────────────────────────────────────────
const FITNESS_CATEGORIES = ['Strength','Cardio','Mobility','Sport','Other'];
const UNCATEGORIZED = 'Other';

// ── PERSONAL RECORDS (v5.17.0) ──
// Derived from the fitness log on every render; nothing is stored, so there is no sync or backup surface.
// Only DONE sets count. "Earlier" means a strictly earlier day (log keys sort as YYYY-MM-DD), and an exercise
// needs at least one earlier day with a done set before anything can beat it, so first-ever logs earn nothing.
//   Weight PR   — a set heavier than every earlier set (weighted sets only; needs an earlier weighted set).
//   Reps PR     — more reps than any earlier set at that weight or heavier (bodyweight sets compare to all earlier sets).
//   Distance PR — a single set longer than any earlier set (Cardio).
//   Pace PR     — best min/mi, on sets of PR_MIN_PACE_DIST miles or more (a 0.1 mi dash is not a pace record),
//                 compared in whole seconds so a badge never reads "was 9:31, now 9:31".
const PR_MIN_PACE_DIST = 1;
function prSetNums(s) {
  return { r: parseFloat(s.reps) || 0, w: parseFloat(s.weight) || 0, d: parseFloat(s.dist) || 0, t: flMins(s.time) };
}
// exerciseId -> [{ dk, sets:[{r,w,d,t}] }], oldest day first, done sets with real numbers only
function prBuildIndex(fitnessLog) {
  const out = {};
  Object.keys(fitnessLog || {}).sort().forEach(dk => {
    const byEx = {};
    flDayExs(fitnessLog[dk]).forEach(ex => {
      (ex.sets || []).forEach(s => {
        if (!s || !s.done) return;
        const n = prSetNums(s);
        if (!(n.r > 0 || n.d > 0)) return;
        (byEx[ex.exerciseId] = byEx[ex.exerciseId] || []).push(n);
      });
    });
    Object.keys(byEx).forEach(id => { (out[id] = out[id] || []).push({ dk, sets: byEx[id] }); });
  });
  return out;
}
// "M:SS" for decimal minutes, rounding the total seconds first so it can never print "9:60"
function prPaceText(mins) {
  const total = Math.round(mins * 60);
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}
// The records one exercise entry set on day dk. Returns [{ kind, label, text }] (empty when none).
function prForEntry(index, exerciseId, dk, sets, isCardio) {
  const prior = [];
  (index[exerciseId] || []).forEach(day => { if (day.dk < dk) day.sets.forEach(n => prior.push(n)); });
  if (!prior.length) return [];
  const mine = (sets || []).filter(s => s && s.done).map(prSetNums);
  if (!mine.length) return [];
  const out = [];
  if (isCardio) {
    const priorDist = prior.reduce((m, n) => Math.max(m, n.d), 0);
    const myDist = mine.reduce((m, n) => Math.max(m, n.d), 0);
    if (priorDist > 0 && myDist > priorDist) {
      out.push({ kind: 'dist', label: 'Distance PR', text: `${+myDist.toFixed(2)} mi, was ${+priorDist.toFixed(2)}` });
    }
    const paces = list => list.filter(n => n.d >= PR_MIN_PACE_DIST && n.t > 0).map(n => n.t / n.d);
    const pp = paces(prior), mp = paces(mine);
    if (pp.length && mp.length) {
      const was = Math.min(...pp), now = Math.min(...mp);
      if (Math.round(now * 60) < Math.round(was * 60)) {
        out.push({ kind: 'pace', label: 'Pace PR', text: `${prPaceText(now)} /mi, was ${prPaceText(was)}` });
      }
    }
    return out;
  }
  const priorMaxW = prior.reduce((m, n) => Math.max(m, n.w), 0);
  let bestW = null, bestR = null;
  mine.forEach(n => {
    if (n.r <= 0) return;
    if (n.w > 0 && priorMaxW > 0 && n.w > priorMaxW) {
      if (!bestW || n.w > bestW.w) bestW = { w: n.w, r: n.r, was: priorMaxW };
      return;
    }
    const compare = prior.filter(p => p.w >= n.w);
    if (!compare.length) return;
    const was = compare.reduce((m, p) => Math.max(m, p.r), 0);
    if (n.r > was && (!bestR || n.r > bestR.r)) bestR = { r: n.r, w: n.w, was };
  });
  if (bestW) out.push({ kind: 'weight', label: 'Weight PR', text: `${+bestW.w.toFixed(2)} lb × ${+bestW.r.toFixed(2)}, was ${+bestW.was.toFixed(2)} lb` });
  if (bestR) out.push({ kind: 'reps', label: 'Reps PR', text: bestR.w > 0 ? `${bestR.r} reps at ${+bestR.w.toFixed(2)} lb, was ${bestR.was}` : `${bestR.r} reps, was ${bestR.was}` });
  return out;
}

// ── FITNESS CHARTS DATA (v5.19.0) ──
// The Charts tab is derived from the fitness log, the exercise library and the goal rules. The only stored thing is
// the list of saved Compare setups (fitnessCompare). Weeks are Sun–Sat like the rest of the app and are named by their
// Sunday as a local 'YYYY-MM-DD' (fmtLocal). Only DONE sets count. Charts are plain inline SVG (no Chart.js), so they
// follow the light/dark theme through CSS variables and keep working offline.
const FC_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4'];   // Compare groups, in this fixed order
function fcWeeks(n, today) {   // n week keys, oldest first, ending with the week that holds `today`
  const start = getWeekStart(today);
  return Array.from({ length: n }, (_, i) => fmtLocal(addDays(start, -7 * (n - 1 - i))));
}
function fcWeekOf(dk) { const d = parseLocal(dk); return d ? fmtLocal(getWeekStart(d)) : ''; }
// One bucket per week for the exercises matchFn accepts. Volume follows the exercise tile (reps x weight, or reps when
// there is no weight); est. 1RM is the best Epley estimate from sets of 1 to 12 reps; pace is total minutes / total miles.
function fcWeekly(fitnessLog, matchFn, weeks) {
  const idx = {};
  weeks.forEach((w, i) => { idx[w] = i; });
  const out = weeks.map(() => ({ vol: 0, sets: 0, reps: 0, top: 0, orm: 0, mi: 0, mins: 0, paceMi: 0, paceMin: 0, days: new Set() }));
  Object.keys(fitnessLog || {}).forEach(dk => {
    const i = idx[fcWeekOf(dk)];
    if (i === undefined) return;
    flDayExs(fitnessLog[dk]).forEach(ex => {
      if (!matchFn(ex.exerciseId)) return;
      (ex.sets || []).forEach(s => {
        if (!s || !s.done) return;
        const n = prSetNums(s);
        if (!(n.r > 0 || n.d > 0 || n.t > 0)) return;
        const b = out[i];
        b.sets += 1; b.reps += n.r; b.vol += n.w > 0 ? n.r * n.w : n.r;
        if (n.w > b.top) b.top = n.w;
        if (n.w > 0 && n.r >= 1 && n.r <= 12) b.orm = Math.max(b.orm, n.w * (1 + n.r / 30));
        b.mi += n.d; b.mins += n.t;
        if (n.d > 0 && n.t > 0) { b.paceMi += n.d; b.paceMin += n.t; }
        b.days.add(dk);
      });
    });
  });
  return out;
}
function fcDur(mins) { const m = Math.round(mins); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`; }
const FC_METRICS = {
  vol:  { label: 'Volume',    kind: 'bar',  get: b => b.vol,                             fmt: v => `${Math.round(v).toLocaleString()} lb`, ax: v => (v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : String(+v.toFixed(1))) },
  sets: { label: 'Sets',      kind: 'bar',  get: b => b.sets,                            fmt: v => `${Math.round(v)} ${Math.round(v) === 1 ? 'set' : 'sets'}` },
  reps: { label: 'Total reps', kind: 'bar', get: b => b.reps,                            fmt: v => `${Math.round(v)} reps` },
  top:  { label: 'Top weight', kind: 'line', get: b => (b.top > 0 ? b.top : null),       fmt: v => `${+v.toFixed(1)} lb` },
  orm:  { label: 'Est. 1RM',  kind: 'line', get: b => (b.orm > 0 ? b.orm : null),        fmt: v => `${Math.round(v)} lb` },
  mi:   { label: 'Miles',     kind: 'bar',  get: b => b.mi,                              fmt: v => `${+v.toFixed(1)} mi` },
  mins: { label: 'Duration',  kind: 'bar',  get: b => b.mins,                            fmt: v => fcDur(v), ax: v => String(Math.round(v)) },
  pace: { label: 'Pace',      kind: 'line', get: b => (b.paceMi > 0 && b.paceMin > 0 ? b.paceMin / b.paceMi : null), fmt: v => `${prPaceText(v)} /mi`, ax: v => prPaceText(v), rev: true },
  ses:  { label: 'Sessions',  kind: 'bar',  get: b => b.days.size,                       fmt: v => `${Math.round(v)} ${Math.round(v) === 1 ? 'session' : 'sessions'}` },
};
// Metrics worth offering for one exercise: only those with any data in the range (so a bodyweight lift never offers
// Volume / Top weight / 1RM, and a time-only cardio exercise never offers Miles / Pace)
function fcAvail(weekly, isCardio) {
  const keys = isCardio ? ['mi', 'mins', 'pace', 'ses'] : ['vol', 'sets', 'reps', 'top', 'orm'];
  return keys.filter(k => weekly.some(b => { const v = FC_METRICS[k].get(b); return v !== null && v > 0; }));
}
// The exercise logged most recently (a good default for the trend chart)
function fcLastExercise(fitnessLog, fitnessExercises) {
  const have = new Set((fitnessExercises || []).map(e => e.id));
  const keys = Object.keys(fitnessLog || {}).sort().reverse();
  for (const dk of keys) {
    for (const ex of flDayExs(fitnessLog[dk]).slice().reverse()) {
      if (have.has(ex.exerciseId) && (ex.sets || []).some(s => s && s.done)) return ex.exerciseId;
    }
  }
  return (fitnessExercises && fitnessExercises[0] && fitnessExercises[0].id) || '';
}
// Every PR in the log, newest day first: [{ dk, exerciseId, name, cardio, kind, label, text }]
// Uses the same rules as the 🏆 badges on the exercise tiles (prForEntry), so the tile, the badges and the list always agree.
// One row per exercise per day per kind (an exercise logged twice in a day is not listed twice).
function fcPrList(fitnessLog, fitnessExercises, prIndex) {
  const lib = {};
  (fitnessExercises || []).forEach(e => { lib[e.id] = e; });
  const out = [];
  Object.keys(fitnessLog || {}).sort().reverse().forEach(dk => {
    const seen = new Set();
    flDayExs(fitnessLog[dk]).forEach(ex => {
      const e = lib[ex.exerciseId];
      const cardio = !!e && e.category === 'Cardio';
      prForEntry(prIndex, ex.exerciseId, dk, ex.sets, cardio).forEach(pr => {
        const key = ex.exerciseId + '|' + pr.kind;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ dk, exerciseId: ex.exerciseId, name: e ? e.name : 'Deleted exercise', cardio, kind: pr.kind, label: pr.label, text: pr.text });
      });
    });
  });
  return out;
}
// One row per exercise: its most recent PR day, with every kind it set that day joined ("Weight PR + Reps PR").
// Input is fcPrList (newest first); output keeps newest first.
function fcPrByExercise(list) {
  const out = [], at = {};
  (list || []).forEach(p => {

  const pickId = subPick ? '' : (logged.some(e => e.id === exId) ? exId : fcLastExercise(fitnessLog, logged));
  const pickEx = exs.find(e => e.id === pickId);
  const subCardio = subExs.filter(e => e.category === 'Cardio').length;
  const isCardio = subPick ? (subExs.length > 0 && subCardio === subExs.length) : (!!pickEx && pickEx.category === 'Cardio');
  const subMixed = !!subPick && subCardio > 0 && subCardio < subExs.length;
  const weekly = React.useMemo(() => fcWeekly(fitnessLog, subIds ? (id => subIds.has(id)) : (id => id === pickId), weeks), [fitnessLog, pickId, subIds, weeks]);
  // A subcategory adds things up (no Top weight / Est. 1RM, which only make sense for one lift); a mix of cardio and strength shares Sets, Duration and Sessions
  const avail = subMixed
    ? ['sets', 'mins', 'ses'].filter(k => weekly.some(b => { const v = FC_METRICS[k].get(b); return v !== null && v > 0; }))
    : (subPick ? fcAvail(weekly, isCardio).filter(k => k !== 'top' && k !== 'orm') : fcAvail(weekly, isCardio));
  const mk = avail.includes(metricKey) ? metricKey : avail[0];
  const M = mk ? FC_METRICS[mk] : null;
  // goals
  const fctx = { fitnessLog, fitnessExercises: exs, habitGoals, habitCompletions, habitQty };
  const goalItems = React.useMemo(() => fcGoalItems(goals, fctx, todayKey), [goals, fitnessLog, exs, habitGoals, habitCompletions, habitQty, todayKey]);
  // compare
  const cres = React.useMemo(() => fcCompare(cur, cur.metric, fitnessLog, exs, weeks), [cur, fitnessLog, exs, weeks]);
  const subs = ruleSubs(exs);
  const setC = patch => setCmp({ ...cur, ...patch });
  const setG = (gi, patch) => setC({ groups: cur.groups.map((g, i) => i === gi ? { ...g, ...patch } : g) });
  const isSaved = !!cur.id && saved.some(s => s.id === cur.id);
  function saveCmp() {
    const name = (cur.name || '').trim() || 'My comparison';
    const rec = { id: isSaved ? cur.id : 'cmp_' + Date.now().toString(36), name, metric: cur.metric, untagged: !!cur.untagged, groups: cur.groups.map(g => ({ id: g.id, name: g.name, subs: g.subs || [], exerciseIds: g.exerciseIds || [] })) };
    setFitnessCompare(isSaved ? saved.map(s => s.id === rec.id ? rec : s) : [...saved, rec]);
    setCmp(rec);
  }
  function delCmp() { setFitnessCompare(saved.filter(s => s.id !== cur.id)); setCmp(null); }
  const clone = o => JSON.parse(JSON.stringify(o));
  const mUnit = k => FC_METRICS[k].fmt;

  return (
    <div className="fc-wrap">
      <div className="fc-tiles">
        {[['Sessions', t1.sessions, t0.sessions, ''], ['Strength sets', t1.sets, t0.sets, ''], ['Miles', t1.miles, t0.miles, ''], ['PRs', t1.prs, t0.prs, '🏆 ']].map(([lb, a, b, ic]) => {
          const isPr = lb === 'PRs';
          const inner = (<>
            <div className="fc-tile-lb">{lb}{isPr && a > 0 ? <span className="fc-tile-chev">{prOpen ? '▴' : '▾'}</span> : null}</div>
            <div className="fc-tile-v">{ic}{a}</div>
            <div className="fc-tile-sub">Last week: {b}</div>
            {isPr && prNames.length > 0 && <div className="fc-tile-pr">{prNames.slice(0, 2).join(', ')}{prNames.length > 2 ? ` +${prNames.length - 2}` : ''}</div>}
          </>);
          return isPr && a > 0
            ? <button key={lb} className="fc-tile fc-tile-btn" aria-expanded={prOpen} onClick={() => setPrOpen(o => !o)}>{inner}</button>
            : <div key={lb} className="fc-tile">{inner}</div>;
        })}
      </div>
      {prOpen && prWeek.length > 0 && (
        <div className="fc-card fc-pr-week">
          <div className="fc-card-hd"><h3>PRs this week</h3></div>
          {prWeek.map((p, i) => <FcPrRow key={i} pr={p} onOpenDay={onOpenDay} todayKey={todayKey} />)}
        </div>
      )}
      <div className="fc-sub-note">This week so far, Sun–Sat. Sessions = days with a finished set.</div>

      <section className="fc-card">
        <div className="fc-card-hd"><h3>Trends</h3>
          <FcChips items={[{ k: 8, label: '8w' }, { k: 12, label: '12w' }, { k: 26, label: '26w' }]} value={range} onPick={setRange} />
        </div>
        {logged.length === 0 ? <div className="fc-empty">Finish a few sets and your trends show up here.</div> : (<>
          <select className="fc-select" value={subPick || pickId} onChange={e => { setExId(e.target.value); setMetricKey(''); }}>
            {loggedSubs.length > 0 && (
              <optgroup label="By subcategory (all exercises added up)">
                {loggedSubs.map(s => <option key={s} value={'sub:' + ruleSubKey(s)}>{s}</option>)}
              </optgroup>
            )}
            <optgroup label="Single exercise">
              {logged.map(e => <option key={e.id} value={e.id}>{e.name}{e.subcategory ? ` · ${e.subcategory}` : ''}</option>)}
            </optgroup>
          </select>
          {subPick && <div className="fc-sub-note" style={{ marginTop: 4 }}>{subLabel}: {subExs.map(e => e.name).join(', ')}</div>}
          {M ? (<>
            <FcChips items={avail.map(k => ({ k, label: FC_METRICS[k].label }))} value={mk} onPick={setMetricKey} />
            <FcChart labels={wlabels} series={[{ name: M.label, color: isCardio ? 'var(--teal)' : 'var(--accent)', values: weekly.map(M.get) }]} kind={M.kind} fmtVal={M.fmt} axFmt={M.ax} rev={M.rev} />
            {M.rev && <div className="fc-sub-note">Faster is higher.</div>}
          </>) : <div className="fc-empty">Nothing logged for this {subPick ? 'subcategory' : 'exercise'} in the last {range} weeks.</div>}
        </>)}
      </section>

      <section className="fc-card">
        <div className="fc-card-hd"><h3>Goal progress</h3></div>
        {goalItems.length === 0
          ? <div className="fc-empty">Milestones with a Fitness or Habit rule show their progress here. Add a rule to a milestone in Goals.</div>
          : goalItems.map(it => <FcGoalCard key={it.gid + it.mid} item={it} />)}
      </section>

      <section className="fc-card">
        <div className="fc-card-hd"><h3>Compare</h3></div>
        <div className="fc-sub-note" style={{ marginTop: 0 }}>Group subcategories (or single exercises) and compare them week by week.</div>
        <div className="fc-chips">
          {presets.map(p => <button key={p.id} className={`fc-chip${cur.id === p.id ? ' on' : ''}`} onClick={() => setCmp(clone(p))}>{p.name}</button>)}
          {saved.map(p => <button key={p.id} className={`fc-chip${cur.id === p.id ? ' on' : ''}`} onClick={() => setCmp(clone(p))}>★ {p.name}</button>)}
          <button className="fc-chip" onClick={() => setCmp(blank())}>+ New</button>
        </div>
        <FcChips items={FC_ADD_METRICS.map(k => ({ k, label: FC_METRICS[k].label }))} value={cur.metric} onPick={k => setC({ metric: k })} />
        {cres.groups.some(g => g.values.some(v => v > 0))
          ? <FcChart labels={wlabels} series={cres.groups.map(g => ({ name: g.name, color: g.color, values: g.values }))} kind="bar" fmtVal={mUnit(cur.metric)} axFmt={FC_METRICS[cur.metric].ax} />
          : <div className="fc-empty">No finished sets in these groups for the last {range} weeks.</div>}
        <div className="fc-legend">{cres.groups.map((g, i) => <span key={i}><i style={{ background: g.color }} />{g.name}</span>)}</div>
        {cres.overlap.length > 0 && <div className="fc-note warn">Counted in more than one group: {cres.overlap.slice(0, 4).join(', ')}{cres.overlap.length > 4 ? '…' : ''}. Those sets are added to each group.</div>}
        <details className="fc-edit" open={!isSaved && !presets.some(p => p.id === cur.id)}>
          <summary>Edit groups</summary>
          <input className="fc-input" placeholder="Name this comparison" value={cur.name || ''} onChange={e => setC({ name: e.target.value })} />
          {cur.groups.map((g, gi) => (
            <div key={g.id || gi} className="fc-group">
              <div className="fc-group-hd">
                <i className="fc-dot" style={{ background: FC_COLORS[gi] }} />
                <input className="fc-input" placeholder={`Group ${gi + 1} name`} value={g.name || ''} onChange={e => setG(gi, { name: e.target.value })} />
                {cur.groups.length > 1 && <button className="fc-x" aria-label="Remove group" onClick={() => setC({ groups: cur.groups.filter((_, i) => i !== gi) })}>✕</button>}
              </div>
              <div className="fc-chips">
                {subs.map(s => {
                  const on = (g.subs || []).some(x => ruleSubKey(x) === ruleSubKey(s));
                  return <button key={s} className={`fc-chip${on ? ' on' : ''}`} onClick={() => setG(gi, { subs: on ? g.subs.filter(x => ruleSubKey(x) !== ruleSubKey(s)) : [...(g.subs || []), s] })}>{s}</button>;
                })}
                {(g.exerciseIds || []).map(id => { const e = exs.find(x => x.id === id); return e ? <button key={id} className="fc-chip on" onClick={() => setG(gi, { exerciseIds: g.exerciseIds.filter(x => x !== id) })}>{e.name} ✕</button> : null; })}
              </div>
              <select className="fc-select" value="" onChange={e => { if (e.target.value) setG(gi, { exerciseIds: [...(g.exerciseIds || []), e.target.value] }); }}>
                <option value="">+ Add a single exercise…</option>
                {exs.filter(e => !(g.exerciseIds || []).includes(e.id)).sort((a, b) => a.name.localeCompare(b.name)).map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
          ))}
          <div className="fc-actions">
            {cur.groups.length < FC_COLORS.length && <button className="fc-btn" onClick={() => setC({ groups: [...cur.groups, { id: 'g' + Math.random().toString(36).slice(2, 7), name: '', subs: [], exerciseIds: [] }] })}>+ Add group</button>}
            <label className="fc-check"><input type="checkbox" checked={!!cur.untagged} onChange={e => setC({ untagged: e.target.checked })} /> Show “Untagged” strength</label>
          </div>
          <div className="fc-actions">
            <button className="fc-btn primary" onClick={saveCmp}>{isSaved ? 'Save changes' : '★ Save comparison'}</button>
            {isSaved && <button className="fc-btn danger" onClick={delCmp}>Delete</button>}
          </div>
        </details>
      </section>

      <section className="fc-card">
        <div className="fc-card-hd"><h3>Recent PRs</h3>
          <FcChips items={[{ k: 'all', label: 'All' }, { k: 'strength', label: 'Strength' }, { k: 'cardio', label: 'Cardio' }]} value={prFilter} onPick={k => { setPrFilter(k); setPrOlder(false); }} />
        </div>
        {prFiltered.length === 0
          ? <div className="fc-empty">{prAll.length === 0 ? 'No PRs yet. They show up when you beat an earlier best (your first log of an exercise sets the baseline).' : 'No PRs in this filter.'}</div>
          : (<>
            {prShownRows.length === 0 && <div className="fc-empty">No PRs in the last {FC_PR_DAYS} days.</div>}
            {prShownRows.map((p, i) => <FcPrRow key={i} pr={p} onOpenDay={onOpenDay} todayKey={todayKey} />)}
            {prHidden > 0 && !prOlder && <button className="fc-btn" onClick={() => setPrOlder(true)}>Show older ({prHidden})</button>}
            {prOlder && prHidden > 0 && <button className="fc-btn" onClick={() => setPrOlder(false)}>Show fewer</button>}
            <div className="fc-sub-note" style={{ marginTop: 0 }}>Each exercise's latest PR · tap one to open that day.</div>
          </>)}
      </section>
    </div>
  );
}

function FitnessView({ fitnessLog, setFitnessLog, fitnessExercises, setFitnessExercises, fitnessGoals, setFitnessGoals, goals, habitGoals, habitCompletions, habitQty, fitnessCompare, setFitnessCompare }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [selectedDate, setSelectedDate] = useState(today);
  const [fitView, setFitView] = useState('week');
  const [showExPicker, setShowExPicker] = useState(null);
  const [dragEx, setDragEx] = useState(null); // {exId, fromDk, exerciseId}
  const [dragOverDk, setDragOverDk] = useState(null);
  const [dragOverExId, setDragOverExId] = useState(null); // for day-view reorder
  const [showLibManager, setShowLibManager] = useState(false);
  const [showGoalManager, setShowGoalManager] = useState(false);
  const [goalsCollapsed, setGoalsCollapsed] = useState(false);
  const prIndex = React.useMemo(() => prBuildIndex(fitnessLog), [fitnessLog]); // v5.17.0 PR history, derived
  // Collapsed/expanded state for Day-view exercise tiles is stored on the exercise
  // itself (ex.collapsed in fitnessLog) so it survives tab switches, reloads, and
  // syncs across devices with the rest of the log.
  function toggleExCollapsed(dk, exId) {
    setDayExs(dk, exs=>exs.map(e=>e.id!==exId?e:{...e, collapsed:!e.collapsed}));
  }

  const pendingSetFocus = useRef(null); // key: `${dk}-${exId}-${setId}`
  const setFirstInputRefs = useRef({}); // key -> DOM input element
  const touchDragActiveRef = useRef(false); // true while a touch-based exercise drag (mobile) is in progress

  const dateKey = fmt(selectedDate);
  const weekStart = getWeekStart(selectedDate);
  const weekDays = Array.from({length:7}, (_,i) => addDays(weekStart, i));
  const viewYear = selectedDate.getFullYear();
  const viewMonth = selectedDate.getMonth();
  const firstDayOfMonth = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  // ── Period helpers ──────────────────────────────────────────────────────
  function periodStart(period, refDate) {
    const d = refDate || today;
    if (period==='week') return fmt(getWeekStart(d));
    if (period==='month') return fmt(new Date(d.getFullYear(), d.getMonth(), 1));
    return fmt(new Date(d.getFullYear(), 0, 1));
  }
  function periodEnd(period, refDate) {
    const d = refDate || today;
    if (period==='week') return fmt(addDays(getWeekStart(d),6));
    if (period==='month') return fmt(new Date(d.getFullYear(), d.getMonth()+1, 0));
    return fmt(new Date(d.getFullYear(), 11, 31));
  }
  function prevPeriodEnd(period, refDate) {
    const d = refDate || today;
    if (period==='week') return fmt(addDays(getWeekStart(d),-1));
    if (period==='month') return fmt(new Date(d.getFullYear(), d.getMonth(), 0));
    return fmt(new Date(d.getFullYear()-1, 11, 31));
  }

  // ── Goal versioning helpers ─────────────────────────────────────────────
  // Get the active goal version for a given exercise+period on a reference date
  function getActiveGoalVersion(exerciseId, period, refDate) {
    const refDk = fmt(refDate || today);
    return fitnessGoals.find(g =>
      g.exerciseId === exerciseId &&
      g.period === period &&
      (!g.startDate || g.startDate <= refDk) &&
      (!g.endDate || g.endDate >= refDk)
    ) || null;
  }

  // Get all unique exercise+period combos across all goal versions
  function getGoalFamilies() {
    const seen = new Set();
    const families = [];
    fitnessGoals.forEach(g => {
      const key = g.exerciseId + '|' + g.period;
      if (!seen.has(key)) { seen.add(key); families.push({exerciseId:g.exerciseId, period:g.period}); }
    });
    return families;
  }

  // Auto-roll: for each family, if no version is active this period, create one from the latest version
  function ensureAutoRoll(period, refDate) {
    const pStart = periodStart(period, refDate);
    const pEnd = periodEnd(period, refDate);
    const families = getGoalFamilies().filter(f => f.period === period);
    const toAdd = [];
    families.forEach(({exerciseId, period:p}) => {
      const active = fitnessGoals.find(g =>
        g.exerciseId===exerciseId && g.period===p &&
        (!g.startDate||g.startDate<=pEnd) && (!g.endDate||g.endDate>=pStart)
      );
      if (!active) {
        // Find most recent version before this period
        const prev = fitnessGoals
          .filter(g => g.exerciseId===exerciseId && g.period===p && (!g.startDate||g.startDate<pStart))
          .sort((a,b)=>(b.startDate||'0').localeCompare(a.startDate||'0'))[0];
        if (prev) {
          toAdd.push({
            id: 'fg'+Date.now()+Math.random().toString(36).slice(2,6),
            exerciseId, period:p, target:prev.target, unit:prev.unit,
            startDate: pStart, endDate: null,
          });
        }
      }
    });
    if (toAdd.length > 0) {
      setFitnessGoals(gs => [...gs, ...toAdd]);
    }
  }

  // Run auto-roll for current view's period on mount and when view/date changes
  useEffect(() => {
    if (fitView==='week') ensureAutoRoll('week', selectedDate);
    else if (fitView==='month') ensureAutoRoll('month', selectedDate);
    else if (fitView==='year') ensureAutoRoll('year', selectedDate);
    // Day view shows week goals
    else ensureAutoRoll('week', selectedDate);
  }, [fitView, dateKey, fitnessGoals.length]);

  // Get goals active during a given period range [startDk, endDk]
  function getGoalsForPeriod(period, startDk, endDk) {
    return fitnessGoals.filter(g =>
      g.period === period &&
      (!g.startDate || g.startDate <= endDk) &&
      (!g.endDate || g.endDate >= startDk)
    );
  }

  // ── Goal CRUD ────────────────────────────────────────────────────────────
  function addGoalVersion(exerciseId, period, target, unit, startDk) {
    if (!exerciseId || !target) return;
    const newStart = startDk || periodStart(period);
    // End any currently-active version at prevPeriodEnd
    setFitnessGoals(gs => {
      const updated = gs.map(g => {
        if (g.exerciseId!==exerciseId || g.period!==period) return g;
        const eDk = fmt(today);
        const isActive = (!g.startDate||g.startDate<=eDk) && (!g.endDate||g.endDate>=eDk);
        if (isActive && (!g.endDate || g.endDate > prevPeriodEnd(period))) {
          return {...g, endDate: prevPeriodEnd(period)};
        }
        return g;
      });
      return [...updated, {
        id:'fg'+Date.now(), exerciseId, period,
        target:parseFloat(target), unit,
        startDate: newStart, endDate: null,
      }];
    });
  }

  function editGoalInPlace(id, patch) {
    setFitnessGoals(gs => gs.map(g => g.id===id ? {...g,...patch} : g));
  }

  function endGoal(id) {
    setFitnessGoals(gs => gs.map(g => g.id===id ? {...g, endDate:prevPeriodEnd(g.period)} : g));
  }

  function deleteGoalVersion(id) {
    setFitnessGoals(gs => gs.filter(g => g.id!==id));
  }

  // ── Log helpers (flat: day → [exercise entries]) ────────────────────────
  function getDayExercises(dk) {
    const raw = fitnessLog[dk] || [];
    if (raw.length===0) return [];
    if (raw[0] && Array.isArray(raw[0].exercises)) return raw.flatMap(w=>w.exercises||[]);
    return raw;
  }
  function setDayExs(dk, fn) {
    setFitnessLog(log => {
      // Derive cur from `log` (latest state), NOT from getDayExercises(dk) which
      // closes over the stale `fitnessLog` render snapshot. Without this, rapid
      // successive updates (adding sets, toggling done, editing reps) each capture
      // the same stale snapshot and later writes silently overwrite earlier ones.
      const raw = log[dk] || [];
      const cur = (raw[0] && Array.isArray(raw[0].exercises)) ? raw.flatMap(w=>w.exercises||[]) : raw;
      const next = typeof fn==='function' ? fn(cur) : fn;
      return {...log, [dk]: next};
    });
  }
  function addExerciseToDay(dk, exerciseId) {
    const libEx = fitnessExercises.find(e=>e.id===exerciseId);
    if (!libEx) return;
    const newEx = {id:'ex'+Date.now(), exerciseId, sets:[{id:'s'+Date.now(), reps:'', weight:'', dist:'', time:'', done:false}]};
    setDayExs(dk, exs=>[...exs, newEx]);
    if (fitView!=='day') { setSelectedDate(new Date(dk+'T00:00:00')); setFitView('day'); }
  }
  function deleteExercise(dk, exId) {
    const cur = getDayExercises(dk);
    const idx = cur.findIndex(e => e.id === exId);
    const ex = cur[idx];
    setDayExs(dk, exs=>exs.filter(e=>e.id!==exId));
    if (ex) {
      const nm = (fitnessExercises.find(l => l.id === ex.exerciseId) || {}).name || 'exercise';
      Undo.push(`Removed ${nm}`, () => {
        setDayExs(dk, exs => {
          if (exs.some(e => e.id === exId)) return exs;
          const next = [...exs];
          next.splice(Math.min(idx, next.length), 0, ex);
          return next;
        });
      });
    }
  }
  function reorderExercises(dk, fromExId, toExId) {
    if (fromExId === toExId) return;
    setDayExs(dk, exs => {
      const from = exs.findIndex(e=>e.id===fromExId);
      const to   = exs.findIndex(e=>e.id===toExId);
      if (from===-1||to===-1) return exs;
      const next = [...exs];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  }
  function moveExercise(fromDk, toDk, exId) {
    if (fromDk===toDk) return;
    setFitnessLog(log => {
      const fromExs = (()=>{ const r=log[fromDk]||[]; return (r[0]&&Array.isArray(r[0].exercises))?r.flatMap(w=>w.exercises||[]):r; })();
      const toExs   = (()=>{ const r=log[toDk]||[];   return (r[0]&&Array.isArray(r[0].exercises))?r.flatMap(w=>w.exercises||[]):r; })();
      const ex = fromExs.find(e=>e.id===exId);
      if (!ex) return log;
      return {
        ...log,
        [fromDk]: fromExs.filter(e=>e.id!==exId),
        [toDk]:   [...toExs, {...ex, id:'ex'+Date.now()}],
      };
    });
  }
  function updateSet(dk, exId, setId, patch) {
    setDayExs(dk, exs=>exs.map(e=>e.id!==exId?e:{...e,sets:e.sets.map(s=>s.id!==setId?s:{...s,...patch})}));
  }
  function addSet(dk, exId, focusAfter) {
    const newId = 's'+Date.now();
    setDayExs(dk, exs=>exs.map(e=>e.id!==exId?e:{...e,sets:[...e.sets,{id:newId,reps:'',weight:'',dist:'',time:'',note:'',done:false}]}));
    if (focusAfter) pendingSetFocus.current = `${dk}-${exId}-${newId}`;
  }
  useEffect(() => {
    if (pendingSetFocus.current) {
      const el = setFirstInputRefs.current[pendingSetFocus.current];
      if (el) { el.focus(); pendingSetFocus.current = null; }
    }
  });
  function deleteSet(dk, exId, setId) {
    const exNow = getDayExercises(dk).find(e => e.id === exId);
    const sIdx = exNow ? exNow.sets.findIndex(s => s.id === setId) : -1;
    const setObj = sIdx >= 0 ? exNow.sets[sIdx] : null;
    setDayExs(dk, exs=>exs.map(e=>e.id!==exId?e:{...e,sets:e.sets.filter(s=>s.id!==setId)}));
    if (setObj) Undo.push(`Deleted set ${sIdx + 1}`, () => {
      setDayExs(dk, exs => exs.map(e => {
        if (e.id !== exId || e.sets.some(s => s.id === setId)) return e;
        const sets = [...e.sets];
        sets.splice(Math.min(sIdx, sets.length), 0, setObj);
        return { ...e, sets };
      }));
    });
  }

  // ── Library helpers ──────────────────────────────────────────────────────
  function addExercise(name, category, subcategory) {
    if (!name.trim()) return;
    const id='e'+Date.now();
    const sub=(subcategory||'').trim();   // v5.11.0: optional tag such as Run / Bike, used by goal rules
    setFitnessExercises(es=>[...es,{id,name:name.trim(),category:category||UNCATEGORIZED,...(sub?{subcategory:sub}:{})}]);
    return id;
  }
  function updateExercise(id, patch) { setFitnessExercises(es=>es.map(e=>e.id===id?{...e,...patch}:e)); }
  function deleteExercise_lib(id) {
    const idx = fitnessExercises.findIndex(e => e.id === id);
    const ex = fitnessExercises[idx];
    setFitnessExercises(es=>es.filter(e=>e.id!==id));
    if (ex) Undo.push(`Deleted "${(ex.name||'exercise').slice(0,40)}" from library`, () => {
      setFitnessExercises(es => {
        if (es.some(e => e.id === id)) return es;
        const next = [...es];
        next.splice(Math.min(idx, next.length), 0, ex);
        return next;
      });
    });
  }

  // ── Progress calculation ─────────────────────────────────────────────────
  function goalProgressFull(goal, refDate) {
    const now = refDate||new Date(); if(!refDate) now.setHours(0,0,0,0);
    let startDk, endDk, totalDays, periodStartDate, periodEndDate;
    if (goal.period==='week') {
      const ws=getWeekStart(now);
      periodStartDate=ws; periodEndDate=addDays(ws,6);
      startDk=fmt(ws); endDk=fmt(periodEndDate);
      totalDays=7;
    } else if (goal.period==='month') {
      const y=now.getFullYear(),m=now.getMonth();
      periodStartDate=new Date(y,m,1); periodEndDate=new Date(y,m+1,0);
      startDk=fmt(periodStartDate); endDk=fmt(periodEndDate);
      totalDays=periodEndDate.getDate();
    } else {
      periodStartDate=new Date(now.getFullYear(),0,1); periodEndDate=new Date(now.getFullYear(),11,31);
      startDk=fmt(periodStartDate); endDk=fmt(periodEndDate);
      totalDays=365+(now.getFullYear()%4===0?1:0);
    }
    // Clamp to goal's own startDate/endDate
    if (goal.startDate && goal.startDate>startDk) startDk=goal.startDate;
    if (goal.endDate && goal.endDate<endDk) endDk=goal.endDate;
    // Elapsed days: use today clamped to the viewed period so past periods show 100%,
    // future periods show 0%, and the current period shows actual progress.
    const todayMs=today.getTime();
    const elapsedDays = todayMs < periodStartDate.getTime() ? 0
      : todayMs > periodEndDate.getTime() ? totalDays
      : Math.floor((todayMs - periodStartDate.getTime()) / 86400000) + 1;
    let total=0;
    const sessionDays=new Set(); // for 'sessions' unit — track unique days with ≥1 done set
    Object.entries(fitnessLog).forEach(([dk,raw])=>{
      if (dk<startDk||dk>endDk) return;
      const exList=(raw&&raw[0]&&Array.isArray(raw[0].exercises))?raw.flatMap(w=>w.exercises||[]):(raw||[]);
      exList.forEach(ex=>{
        if (ex.exerciseId!==goal.exerciseId) return;
        const doneSets=ex.sets.filter(s=>s.done);
        if (goal.unit==='sets') total+=doneSets.length;
        else if (goal.unit==='reps') total+=doneSets.reduce((a,s)=>a+(parseFloat(s.reps)||0),0);
        else if (goal.unit==='volume') total+=doneSets.reduce((a,s)=>a+(parseFloat(s.reps)||0)*(parseFloat(s.weight)||0),0);
        else if (goal.unit==='distance') total+=doneSets.reduce((a,s)=>a+(parseFloat(s.dist)||0),0);
        else if (goal.unit==='sessions') { if(doneSets.length>0) sessionDays.add(dk); }
      });
    });
    if (goal.unit==='sessions') total=sessionDays.size;
    const actual=Math.round(total*10)/10;
    const periodPct=Math.round((elapsedDays/totalDays)*100);
    const targetPace=Math.round((elapsedDays/totalDays)*goal.target*10)/10;
    const expectedAtPace=elapsedDays>0?Math.round((actual/elapsedDays*totalDays)*10)/10:0;
    const aheadBehind=actual-targetPace;
    return {actual,periodPct,targetPace,expectedAtPace,aheadBehind,startDk,endDk};
  }

  // ── Stats helpers ────────────────────────────────────────────────────────
  function exStats(ex) {
    const doneSets=ex.sets.filter(s=>s.done);
    const hasWeight=doneSets.some(s=>parseFloat(s.weight)>0);
    const totalReps=doneSets.reduce((acc,s)=>acc+(parseFloat(s.reps)||0),0);
    const volume=doneSets.reduce((acc,s)=>{const r=parseFloat(s.reps)||0,w=parseFloat(s.weight)||0;return acc+(w>0?r*w:r);},0);
    return {done:doneSets.length,total:ex.sets.length,volume:Math.round(volume),hasWeight,totalReps:Math.round(totalReps)};
  }
  function exName(exerciseId) { return fitnessExercises.find(e=>e.id===exerciseId)?.name||'Unknown'; }

  // Parse "M:SS" or legacy decimal string → decimal minutes
  function parseTimeInput(val) {
    if (!val && val !== 0) return 0;
    const s = String(val).trim();
    if (s.includes(':')) {
      const parts = s.split(':');
      const mins = parseFloat(parts[0]) || 0;
      const secs = parseFloat(parts[1]) || 0;
      return mins + secs / 60;
    }
    return parseFloat(s) || 0;
  }
  // Format decimal minutes → "M:SS"
  function formatPace(decimalMins) {
    if (!decimalMins || decimalMins <= 0) return null;
    const mins = Math.floor(decimalMins);
    const secs = Math.round((decimalMins - mins) * 60);
    return `${mins}:${String(secs).padStart(2,'0')}`;
  }

  const categorized=FITNESS_CATEGORIES.reduce((acc,cat)=>{
    const items=fitnessExercises.filter(e=>(e.category||UNCATEGORIZED)===cat);
    if(items.length) acc[cat]=items;
    return acc;
  },{});

  // ── Goal progress bar renderer (shared across views) ────────────────────
  function renderGoalBar(goal, refDate, showDelete) {
    const {actual,periodPct,targetPace,expectedAtPace,aheadBehind}=goalProgressFull(goal,refDate);
    const pct=Math.min(100,(actual/goal.target)*100),done=pct>=100,ahead=aheadBehind>=0;
    return (
      <div key={goal.id} style={{
        padding:'10px 12px', marginBottom:8,
        background:'var(--surface)', borderRadius:'var(--radius-sm)',
        border:`1px solid ${done?'var(--gold)':ahead?'var(--accent)':'var(--border)'}`,
        boxShadow:'0 1px 3px var(--shadow)',
      }}>

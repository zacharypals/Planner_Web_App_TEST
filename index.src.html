  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{display:'flex',gap:4,alignItems:'stretch',minHeight:160}}>
        {days.map((d,i)=>{
          const dk=fmt(d);
          const isToday=isSameDay(d,today);
          const isSelected=isSameDay(d,selected);
          return (
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer',gap:6}}
              onClick={()=>onDayClick(new Date(d))}>
              <div style={{textAlign:'center',fontFamily:"'DM Mono',monospace",fontSize:11,color:isToday?'var(--gold)':isSelected?'var(--accent)':'var(--ink-light)',fontWeight:(isToday||isSelected)?700:400,lineHeight:1.4}}>
                {DAYS[d.getDay()]}<br/>
                <span style={{fontSize:13,fontFamily:"'Playfair Display',serif"}}>{d.getDate()}</span>
              </div>
              <div style={{flex:1,width:'100%',display:'flex',flexDirection:'column',gap:2,background:'var(--cream)',borderRadius:8,padding:4,border:isToday?'2px solid var(--gold)':isSelected?'2px solid var(--accent)':'1px solid var(--border)'}}>
                {goals.map(g=>{
                  const done=(completions[dk]||[]).includes(g.id);
                  const isSingle = goals.length === 1;
                  const qtyRaw = (isSingle && qty) ? (qty[dk]||{})[g.id] : null;
                  const qtyVal = qtyRaw != null ? qtyTotal(qtyRaw) : 0;
                  const liNotes = qtyRaw ? normalizeQty(qtyRaw).map(li=>li.note).filter(Boolean) : [];
                  const notesVal = (isSingle && notes) ? (notes[dk]||{})[g.id] || '' : '';
                  const noteLines = notesVal.split('\n').slice(0,4).filter(l=>l.trim());
                  return (
                    <div key={g.id} style={{
                      borderRadius:4,
                      background:done?g.color:'transparent',
                      border:done?'none':'1px solid var(--border)',
                      opacity:done?0.9:0.4,
                      minHeight: isSingle ? 40 : 14,
                      flexShrink:0,
                      padding: isSingle ? '4px 6px' : 0,
                      display: isSingle ? 'flex' : 'block',
                      flexDirection:'column', justifyContent:'flex-start', gap:1,
                      overflow:'hidden',
                    }}>
                      {isSingle && !!qtyVal && (
                        <div style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,color:done?'white':hcText(g.color),lineHeight:1.3}}>{(g.qtyMode||'qty')==='$'?'$':''}{qtyVal}</div>
                      )}
                      {isSingle && liNotes.map((n,i)=>(
                        <div key={i} style={{fontSize:9,fontFamily:"'DM Sans',sans-serif",color:done?'rgba(255,255,255,0.85)':'var(--ink-light)',lineHeight:1.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{n}</div>
                      ))}
                      {isSingle && noteLines.map((l,li)=>(
                        <div key={'n'+li} style={{fontSize:9,fontFamily:"'DM Sans',sans-serif",color:done?'rgba(255,255,255,0.85)':'var(--ink-light)',lineHeight:1.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l}</div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function YearlyView({date, selected, goals, completions, today, onDayClick}) {
  const year=date.getFullYear();
  const months=Array.from({length:12},(_,m)=>m);
  return (
    <div style={{overflowY:'visible'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        {months.map(m=>{
          const firstDay=new Date(year,m,1);
          const startPad=firstDay.getDay();
          const daysInMonth=new Date(year,m+1,0).getDate();
          const cells=[];
          for(let i=0;i<startPad;i++) cells.push(null);
          for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,m,d));
          while(cells.length%7!==0) cells.push(null);
          return (
            <div key={m}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:13,marginBottom:6,color:'var(--ink)'}}>{MONTHS[m]}</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
                {DAYS.map(d=><div key={d} style={{fontSize:8,textAlign:'center',color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace"}}>{d[0]}</div>)}
                {cells.map((d,i)=>{
                  if(!d) return <div key={i} />;
                  const dk=fmt(d);
                  const done=goals.filter(g=>(completions[dk]||[]).includes(g.id));
                  const isToday=isSameDay(d,today);
                  const isSelected=isSameDay(d,selected);
                  const bgColor = done.length===0 ? 'var(--tile-empty)' : done.length===1 ? done[0].color : 'var(--tile-multi)';
                  const tileOpacity = done.length>0 ? 0.85 : 1;
                  const numColor = done.length>0 ? 'rgba(255,255,255,0.9)' : 'var(--tile-num)';
                  return (
                    <div key={i} style={{
                      width:'100%',paddingTop:'100%',borderRadius:2,background:bgColor,
                      opacity: tileOpacity,
                      outline:isToday?'2px solid var(--gold)':isSelected?'2px solid var(--accent)':'none',
                      cursor:'pointer',position:'relative'
                    }} onClick={()=>onDayClick(new Date(d))}
                      title={`${MONTHS[m].slice(0,3)} ${d.getDate()}`}>
                      <span style={{
                        position:'absolute',bottom:1,right:2,
                        fontSize:6,lineHeight:1,
                        color: numColor,
                        fontFamily:"'DM Mono',monospace",
                        pointerEvents:'none',userSelect:'none'
                      }}>{d.getDate()}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// MONTHLY CALENDAR
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// v5.16.0 — TIME BLOCKS
// Optional time on tasks: `startTime` 'HH:MM' + `durMin` minutes (events keep `eventTime`; goal tasks use the same two fields).
// Anything without a time behaves exactly as before. The week view has a per-device List / Time blocks switch (localStorage 'weekView').
// Time blocks view: each day is an hourly column; Habits / Goals / No time are small buttons above the day that open a popover
// (desktop) or a bottom sheet (phone), so the grid never moves. Desktop drag/resize use pointer events; HTML5 drag from the
// No-time list drops onto the grid. Defaults: tasks 30 min, events 60 min.
// ─────────────────────────────────────────────
const TB_VIEW_LS = 'weekView';
const TB_DURS = [15, 30, 45, 60, 90, 120, 180, 240];
function tbMin(s) { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); if (!m) return null; const v = (+m[1]) * 60 + (+m[2]); return v < 1440 ? v : null; }
function tbStr(min) { const v = Math.max(0, Math.min(1439, Math.round(min))); return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); }
// End clock for Google Calendar (clamped to 23:59 so an event never runs past midnight)
function tbEndClock(startStr, durMin) { const a = tbMin(startStr); if (a == null) return '00:00'; return tbStr(Math.min(a + (durMin > 0 ? durMin : 60), 1439)); }
function tbFmt12(min) { const h = Math.floor(min / 60) % 24, m = min % 60; return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h >= 12 ? 'p' : 'a'); }
function tbDurLabel(d) { return d < 60 ? d + ' min' : (Math.floor(d / 60) + ' h' + (d % 60 ? ' ' + (d % 60) + ' min' : '')); }
function tbTaskStart(t) { return t.isEvent ? t.eventTime : t.startTime; }
function tbTaskDur(t) { return t.durMin > 0 ? t.durMin : (t.isEvent ? 60 : 30); }
// Side-by-side lanes for overlapping items
function tbLayout(items) {
  const s = [...items].sort((a, b) => a.start - b.start || b.dur - a.dur);
  const res = []; let cl = [], end = -1, laneEnds = [];
  const flush = () => { const n = laneEnds.length || 1; cl.forEach(r => { r.n = n; }); res.push(...cl); cl = []; laneEnds = []; end = -1; };
  s.forEach(it => {
    if (cl.length && it.start >= end) flush();
    let lane = laneEnds.findIndex(e => e <= it.start);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(it.start + it.dur); } else laneEnds[lane] = it.start + it.dur;
    end = Math.max(end, it.start + it.dur);
    cl.push({ it, lane, n: 1 });
  });
  flush();
  return res;
}
// Visible hour range: 6am–midnight, stretched to fit anything outside it (v5.22.0: was 7am–8pm)
function tbRangeOf(models) {
  let lo = 6 * 60, hi = 24 * 60;
  models.forEach(m => m.items.forEach(i => { lo = Math.min(lo, i.start); hi = Math.max(hi, i.start + i.dur); }));
  return { h0: Math.max(0, Math.floor(lo / 60)), h1: Math.min(24, Math.ceil(hi / 60)) };
}
function useWeekView() {
  const [, bump] = React.useReducer(x => x + 1, 0);
  React.useEffect(() => {
    const h = () => bump();
    window.addEventListener('lp-weekview', h);
    return () => window.removeEventListener('lp-weekview', h);
  }, []);
  const view = lsGet(TB_VIEW_LS) === 'blocks' ? 'blocks' : 'list';
  const set = v => { lsSet(TB_VIEW_LS, v === 'blocks' ? 'blocks' : 'list'); window.dispatchEvent(new Event('lp-weekview')); };
  return [view, set];
}
function TbViewSwitch({ view, onChange }) {
  return (
    <div className="tb-switch" role="group" aria-label="Week view">
      <button className={view === 'list' ? 'on' : ''} onClick={() => onChange('list')}>List</button>
      <button className={view === 'blocks' ? 'on' : ''} onClick={() => onChange('blocks')}>Time blocks</button>
    </div>

}
// Start time + length controls (used in the expanded task card, goal tasks and the item popover)
function TbTimeRow({ start, dur, defaultDur = 30, onChange }) {
  const shown = dur > 0 ? dur : defaultDur;
  const opts = (TB_DURS.includes(shown) ? TB_DURS : [...TB_DURS, shown]).sort((a, b) => a - b);
  const lab = { fontSize: 10, color: 'var(--ink-faint)', fontFamily: "'DM Mono',monospace" };
  return (
    <div className="tb-timerow">
      <span style={lab}>Time:</span>
      <TimeSelect value={start || ''} onChange={v => onChange(v ? { startTime: v, ...(dur > 0 ? {} : { durMin: defaultDur }) } : { startTime: '' })} />
      {start ? (
        <>
          <span style={lab}>Length:</span>
          <select className="task-time-input" style={{ padding: '3px 2px' }} value={shown} onChange={e => onChange({ durMin: +e.target.value })}>
            {opts.map(d => <option key={d} value={d}>{tbDurLabel(d)}</option>)}
          </select>
        </>

}
function TbPopover({ anchor, width = 300, hidden, onClose, title, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const down = e => {
      if (e.target && e.target.closest && e.target.closest('[data-tb-pill]')) return;   // the pill toggles itself
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    const key = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('pointerdown', down, true);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('pointerdown', down, true); document.removeEventListener('keydown', key); };
  }, [onClose]);
  const vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.max(8, Math.min(anchor.left, vw - width - 8));
  const top = Math.min(anchor.bottom + 4, Math.max(8, vh - 380));
  return (
    <div ref={ref} className={`tb-pop ${hidden ? 'hide' : ''}`} style={{ left, top, width, maxHeight: vh - top - 12 }}>
      <div className="tb-pop-head"><span>{title}</span><button className="tb-x" onClick={onClose} aria-label="Close">✕</button></div>
      {children}
    </div>
  );
}
function TbSheet({ tabs, tab, onTab, onClose, title, children }) {

            </div>
          ) : <span style={{ fontWeight: 600, fontSize: 14 }}>{title}</span>}
          <button className="tb-x" onClick={onClose} aria-label="Close">✕</button>

}
// The hourly grid shared by the desktop week and the phone day.
// days: [{ key, today, items:[{k, kind, id, start, dur, title, done, event, bg, color}] }]
function TbGrid({ days, hourPx, h0, h1, labelEvery, canDrag, header, dropActive, scrollKey, onOpen, onToggle, onPlace, onCreate, onDropMin }) {
  const scrollRef = useRef(null), gridRef = useRef(null), st = useRef(null);
  const [drag, setDrag] = useState(null);                 // { k, day, start, dur }
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);
  const H = (h1 - h0) * hourPx;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const px = m => (m - h0 * 60) / 60 * hourPx;
  useEffect(() => {
    const el = scrollRef.current; if (!el) return;
    const starts = days.flatMap(d => d.items.map(i => i.start));
    const nm = new Date(); const cur = nm.getHours() * 60 + nm.getMinutes();
    const target = starts.length ? Math.min(...starts) : (days.some(d => d.today) ? Math.max(cur - 60, 0) : 8 * 60);
    el.scrollTop = Math.max(0, px(target - 30));
  }, [scrollKey]);
  const snap = m => Math.round(m / 15) * 15;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const minAt = (colEl, y) => h0 * 60 + (y - colEl.getBoundingClientRect().top) / hourPx * 60;
  function down(e, it, dayKey, mode) {
    if (!canDrag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.stopPropagation();
    const el = e.currentTarget;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    const colEl = el.closest('.tb-col');
    const grab = e.clientY - (colEl.getBoundingClientRect().top + px(it.start));
    st.current = { it, dayKey, mode, x0: e.clientX, y0: e.clientY, grab, moved: false, start: it.start, dur: it.dur, day: dayKey };
  }
  function move(e) {
    const s = st.current; if (!s) return;
    if (!s.moved && Math.abs(e.clientX - s.x0) < 4 && Math.abs(e.clientY - s.y0) < 4) return;
    s.moved = true;
    const cols = [...gridRef.current.querySelectorAll('.tb-col')];
    const col = cols.find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX < r.right; }) || cols.find(c => c.dataset.day === s.day);
    if (s.mode === 'move') {
      const m = snap(minAt(col, e.clientY - s.grab));
      s.start = clamp(m, h0 * 60, h1 * 60 - s.dur); s.day = col.dataset.day;
    } else {
      const end = snap(minAt(col, e.clientY));
      s.dur = clamp(end - s.start, 15, h1 * 60 - s.start);
    }
    setDrag({ k: s.it.k, day: s.day, start: s.start, dur: s.dur });
  }
  function up(e) {
    const s = st.current; st.current = null; if (!s) return;
    setDrag(null);
    if (!s.moved) { if (s.mode === 'move') { const r = e.currentTarget.getBoundingClientRect(); onOpen(s.it, s.dayKey, { left: r.left, top: r.top, bottom: r.bottom }); } return; }
    onPlace(s.it, s.dayKey, s.day, s.start, s.dur);
  }
  function cancel() { st.current = null; setDrag(null); }
  const labels = [];
  for (let h = h0; h <= h1; h += labelEvery) labels.push(h);
  return (
    <div className="tb-scroll" ref={scrollRef}>
      {header}
      <div className="tb-grid" ref={gridRef} style={{ gridTemplateColumns: `38px repeat(${days.length}, minmax(0,1fr))` }}>
        <div className="tb-gutter" style={{ height: H }}>
          {labels.map(h => <span key={h} className="tb-gl" style={{ top: (h - h0) * hourPx }}>{h === 24 ? '' : tbFmt12(h * 60)}</span>)}
        </div>
        {days.map(d => {
          const list = d.items.filter(i => !(drag && drag.k === i.k));
          if (drag && drag.day === d.key) {
            const src = days.flatMap(x => x.items).find(i => i.k === drag.k);
            if (src) list.push({ ...src, start: drag.start, dur: drag.dur, dragging: true });
          }
          return (
            <div key={d.key} data-day={d.key} className={`tb-col ${d.today ? 'today' : ''}`} style={{ height: H }}
              onDoubleClick={e => {
                if (!canDrag || !onCreate || (e.target.closest && e.target.closest('.tb-block'))) return;
                onCreate(d.key, clamp(Math.floor(minAt(e.currentTarget, e.clientY) / 15) * 15, h0 * 60, h1 * 60 - 15), e);
              }}
              onDragOver={e => { if (dropActive) e.preventDefault(); }}
              onDrop={e => {
                if (!dropActive || !onDropMin) return;
                e.preventDefault();
                onDropMin(d.key, clamp(Math.floor(minAt(e.currentTarget, e.clientY) / 15) * 15, h0 * 60, h1 * 60 - 15));
              }}>
              {labels.slice(0, -1).map(h => <div key={h} className="tb-hl" style={{ top: (h - h0) * hourPx }} />)}
              {tbLayout(list).map(({ it, lane, n }) => {
                const h = Math.max(it.dur / 60 * hourPx - 2, 13);
                const bg = it.kind === 'goal' ? `color-mix(in srgb, ${it.color} 24%, var(--surface))` : it.bg;
                return (
                  <div key={it.k} className={`tb-block ${canDrag ? 'canDrag' : ''} ${it.dragging ? 'dragging' : ''} ${it.done ? 'done' : ''}`}
                    tabIndex={0}
                    style={{ top: px(it.start) + 1, height: h, left: `calc(${lane / n * 100}% + 1px)`, width: `calc(${100 / n}% - 2px)`, background: bg, borderLeft: `3px solid ${it.kind === 'goal' ? it.color : 'rgba(0,0,0,0.28)'}` }}
                    onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const r = e.currentTarget.getBoundingClientRect(); onOpen(it, d.key, { left: r.left, top: r.top, bottom: r.bottom }); } }}
                    onClick={canDrag ? undefined : e => { const r = e.currentTarget.getBoundingClientRect(); onOpen(it, d.key, { left: r.left, top: r.top, bottom: r.bottom }); }}
                    onPointerDown={e => down(e, it, d.key, 'move')} onPointerMove={move} onPointerUp={up} onPointerCancel={cancel}>
                    <div className="tb-b-title">
                      {!it.event && <button className={`tb-chk ${it.done ? 'on' : ''}`} aria-label={it.done ? 'Mark not done' : 'Mark done'}
                        onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); onToggle(it, d.key); }}>{it.done ? '✓' : ''}</button>}
                      {it.event ? '📅 ' : ''}{it.title || '(untitled)'}
                    </div>
                    {h >= 34 && <div className="tb-b-time">{tbFmt12(it.start)}–{tbFmt12(it.start + it.dur)}</div>}
                    {canDrag && <div className="tb-resize" onPointerDown={e => down(e, it, d.key, 'resize')} onPointerMove={move} onPointerUp={up} onPointerCancel={cancel} />}
                  </div>
                );
              })}
              {d.today && nowMin >= h0 * 60 && nowMin <= h1 * 60 && <div className="tb-now" style={{ top: px(nowMin) }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function TbPills({ d, openSec, onPick, onAdd, mobile }) {
  const on = s => openSec === s;
  return (
    <div className={`tb-pills ${mobile ? 'tb-pills-m' : ''}`}>
      {d.habitsTotal > 0 && <button data-tb-pill className={`tb-pill ${on('habits') ? 'on' : ''} ${d.habitsDone === d.habitsTotal ? 'all' : ''}`} onClick={e => onPick('habits', e.currentTarget)}>Habits {d.habitsDone}/{d.habitsTotal}</button>}
      {d.goalsTotal > 0 && <button data-tb-pill className={`tb-pill ${on('goals') ? 'on' : ''} ${d.goalsDone === d.goalsTotal ? 'all' : ''}`} onClick={e => onPick('goals', e.currentTarget)}>Goals {d.goalsDone}/{d.goalsTotal}</button>}
      <button data-tb-pill className={`tb-pill ${on('notime') ? 'on' : ''}`} onClick={e => onPick('notime', e.currentTarget)}>{d.untimed.length ? `No time ${d.untimed.length}` : '+ Task'}</button>
      {mobile && <button className="tb-pill" onClick={onAdd}>＋ Time block</button>}
    </div>

}
function TbWeek({ ctx }) {
  const [pop, setPop] = useState(null);   // { sec, dayKey, anchor, ref?, created? }
  const { days } = ctx, { h0, h1 } = ctx.range;
  const close = () => {
    if (pop && pop.created) ctx.pruneEmpty(pop.ref, pop.dayKey);
    setPop(null);
  };
  useEffect(() => { if (pop && pop.sec === 'item' && !ctx.itemExists(pop.ref, pop.dayKey)) setPop(null); });
  function pick(sec, dayKey, el) {
    const r = el.getBoundingClientRect();
    setPop(p => (p && p.sec === sec && p.dayKey === dayKey) ? null : { sec, dayKey, anchor: { left: r.left, top: r.top, bottom: r.bottom } });
  }
  function openItem(it, dayKey, anchor) { setPop({ sec: 'item', dayKey, ref: { kind: it.kind, id: it.id }, anchor }); }
  function create(dayKey, min, e) {
    const ref = ctx.createTimed(dayKey, min);
    setPop({ sec: 'item', dayKey, ref, created: true, anchor: { left: e.clientX, top: e.clientY, bottom: e.clientY } });
  }
  const model = pop ? days.find(x => x.key === pop.dayKey) : null;
  const head = (
    <div className="tb-head" style={{ gridTemplateColumns: `38px repeat(${days.length}, minmax(0,1fr))` }}>
      <div />
      {days.map(d => (
        <div key={d.key} className={`tb-head-day ${d.today ? 'today' : ''}`}>
          <div className={`cal-header-cell tb-hcell ${d.today ? 'today' : ''}`} style={{ background: ctx.headerBg }}>
            <div className="day-name">{ctx.dayName(d)}</div>
            <div className="day-date">{d.date.getDate()}</div>
          </div>
          <TbPills d={d} openSec={pop && pop.dayKey === d.key ? pop.sec : null} onPick={(sec, el) => pick(sec, d.key, el)} />
        </div>
      ))}
    </div>
  );
  const secTitle = !pop || !model ? '' : ({ habits: 'Habits', goals: 'Goals', notime: 'No time', item: 'Time block' }[pop.sec]) + ' · ' + ctx.dayName(model) + ' ' + model.date.getDate();
  return (
    <div className="tb-wrap">
      <div className="tb-viewbar">
        <TbViewSwitch view={ctx.view} onChange={ctx.setView} />
        <span className="tb-hint">Drag a block to move it · drag its bottom edge to resize · double-click empty space to add</span>
      </div>
      <TbGrid days={days} hourPx={30} h0={h0} h1={h1} labelEvery={2} canDrag header={head} scrollKey={ctx.scrollKey}
        dropActive={ctx.dropActive} onOpen={openItem} onToggle={ctx.toggleDone} onPlace={ctx.place} onCreate={create} onDropMin={ctx.dropMin} />
      {pop && model && (
        <TbPopover anchor={pop.anchor} width={pop.sec === 'item' ? 330 : 310} hidden={ctx.dropActive} onClose={close} title={secTitle}>
          {pop.sec === 'habits' && ctx.renderHabits(model)}
          {pop.sec === 'goals' && ctx.renderGoals(model)}
          {pop.sec === 'notime' && ctx.renderNoTime(model)}
          {pop.sec === 'item' && ctx.renderItem(pop.ref, pop.dayKey)}
        </TbPopover>
      )}
    </div>
  );
}
function TbDay({ ctx }) {
  const [sheet, setSheet] = useState(null);   // { tab, ref?, created? }
  const d = ctx.day, { h0, h1 } = ctx.range;
  const close = () => { if (sheet && sheet.created) ctx.pruneEmpty(sheet.ref, d.key); setSheet(null); };
  useEffect(() => { if (sheet && sheet.tab === 'item' && !ctx.itemExists(sheet.ref, d.key)) setSheet(null); });
  const tabs = [];
  if (d.habitsTotal > 0) tabs.push({ id: 'habits', label: `Habits ${d.habitsDone}/${d.habitsTotal}` });
  if (d.goalsTotal > 0) tabs.push({ id: 'goals', label: `Goals ${d.goalsDone}/${d.goalsTotal}` });
  tabs.push({ id: 'notime', label: d.untimed.length ? `No time ${d.untimed.length}` : '+ Task' });
  function addBlock() {
    const nm = new Date(); const cur = nm.getHours() * 60 + nm.getMinutes();
    const min = d.today ? Math.min(Math.ceil((cur + 1) / 30) * 30, 23 * 60) : 9 * 60;
    const ref = ctx.createTimed(d.key, min);
    setSheet({ tab: 'item', ref, created: true });
  }
  return (
    <div className="tb-day">
      <TbPills d={d} mobile openSec={sheet ? sheet.tab : null} onPick={sec => setSheet({ tab: sec })} onAdd={addBlock} />
      <TbGrid days={[d]} hourPx={46} h0={h0} h1={h1} labelEvery={1} canDrag={false} scrollKey={ctx.scrollKey}
        onOpen={it => setSheet({ tab: 'item', ref: { kind: it.kind, id: it.id } })} onToggle={ctx.toggleDone} onPlace={ctx.place} />
      {sheet && (
        <TbSheet tabs={sheet.tab === 'item' ? null : tabs} tab={sheet.tab} onTab={t => setSheet({ tab: t })} onClose={close} title="Time block">
          {sheet.tab === 'habits' && ctx.renderHabits(d)}
          {sheet.tab === 'goals' && ctx.renderGoals(d)}
          {sheet.tab === 'notime' && ctx.renderNoTime(d)}
          {sheet.tab === 'item' && ctx.renderItem(sheet.ref, d.key)}
        </TbSheet>
      )}
    </div>
  );
}

function TimeSelect({ value, onChange }) {
  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
  const mins = ['00','05','10','15','20','25','30','35','40','45','50','55'];
  const [h, m] = value ? value.split(':') : ['',''];
  function setH(newH) { onChange(newH ? `${newH}:${m||'00'}` : ''); }
  function setM(newM) { onChange(h ? `${h}:${newM}` : ''); }
  return (
    <div style={{display:'flex',gap:2,alignItems:'center'}}>
      <select className="task-time-input" style={{padding:'3px 2px',width:52}}
        value={h||''} onChange={e=>setH(e.target.value)}>
        <option value="">--</option>
        {hours.map(hh=><option key={hh} value={hh}>{hh}</option>)}
      </select>
      <span style={{color:'var(--ink-faint)',fontWeight:'bold'}}>:</span>
      <select className="task-time-input" style={{padding:'3px 2px',width:48}}
        value={m||''} onChange={e=>setM(e.target.value)}>
        {mins.map(mm=><option key={mm} value={mm}>{mm}</option>)}
      </select>
      {value && <button onClick={()=>onChange('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--ink-faint)',fontSize:11,padding:'0 2px'}}>✕</button>}
    </div>
  );
}

function MonthlyCalendar({ weekData, setWeekData, monthlyGoals, setMonthlyGoals }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [viewDate, setViewDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [selectedDate, setSelectedDate] = useState(null);
  const [showEventModal, setShowEventModal] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null); // {dayKey, taskId} or null
  const [eventForm, setEventForm] = useState({title:'', time:'', date:'', details:'', invitees:''});
  const [dragInfo, setDragInfo] = useState(null); // {eventId, fromDayKey}
  const [dragOverDay, setDragOverDay] = useState(null);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [sheetOpen, setSheetOpen] = useState(false);

  function handleDragStart(ev, eventId, fromDayKey) {
    setDragInfo({eventId, fromDayKey});
    ev.dataTransfer.effectAllowed = 'move';
  }
  function handleDragOver(ev, toDayKey) {
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    setDragOverDay(toDayKey);
  }
  function handleDrop(ev, toDayKey) {
    ev.preventDefault();
    setDragOverDay(null);
    if (!dragInfo || dragInfo.fromDayKey === toDayKey) { setDragInfo(null); return; }
    const {eventId, fromDayKey} = dragInfo;
    setDragInfo(null);
    setWeekData(wd => {
      const updated = JSON.parse(JSON.stringify(wd));
      let movedTask = null;
      // Remove from old day
      Object.keys(updated).forEach(wk => {
        const tasks = (updated[wk].tasks||{})[fromDayKey];
        if (tasks) {
          const idx = tasks.findIndex(t => t.id === eventId);
          if (idx !== -1) {
            movedTask = {...tasks[idx]};
            updated[wk].tasks[fromDayKey] = tasks.filter(t => t.id !== eventId);
          }
        }
      });
      if (!movedTask) return wd;
      // Add to new day
      const newDateObj = new Date(toDayKey + 'T00:00:00');
      const newWeekKey = fmt(getWeekStart(newDateObj));
      if (!updated[newWeekKey]) updated[newWeekKey] = {proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{}};
      if (!updated[newWeekKey].tasks) updated[newWeekKey].tasks = {};
      if (!updated[newWeekKey].tasks[toDayKey]) updated[newWeekKey].tasks[toDayKey] = [];
      updated[newWeekKey].tasks[toDayKey].push(movedTask);
      // Update Google Calendar if signed in
      if (movedTask.gcalId && getToken()) updateEventInCalendar(movedTask.gcalId, movedTask, toDayKey);
      return updated;
    });
  }

  const yearMonthKey = `${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`;

  function getMonthGoals() { return monthlyGoals[yearMonthKey] || []; }
  function addMonthGoal() {
    setMonthlyGoals(mg => ({...mg, [yearMonthKey]: [...(mg[yearMonthKey]||[]), {id:Date.now().toString(), name:'', done:false}]}));
  }
  function updateMonthGoal(id, patch) {
    setMonthlyGoals(mg => ({...mg, [yearMonthKey]: (mg[yearMonthKey]||[]).map(g=>g.id===id?{...g,...patch}:g)}));
  }
  function deleteMonthGoal(id) {
    setMonthlyGoals(mg => ({...mg, [yearMonthKey]: (mg[yearMonthKey]||[]).filter(g=>g.id!==id)}));
  }

  // Get all events from weekData for a given dateKey
  function getEventsForDay(dateKey) {
    const events = [];
    Object.values(weekData).forEach(wd => {
      const tasks = (wd.tasks || {})[dateKey] || [];
      tasks.filter(t => t.isEvent).forEach(t => events.push({...t, dayKey: dateKey}));
    });
    return events;
  }

  // Get all events in the current month, sorted chronologically
  function getAllMonthEvents() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const events = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const dk = fmt(date);
      getEventsForDay(dk).forEach(e => events.push({...e, date}));
    }
    events.sort((a,b) => {
      const da = a.date - b.date;
      if (da !== 0) return da;
      return (a.eventTime||'99:99').localeCompare(b.eventTime||'99:99');
    });
    return events;
  }

  function openAddEvent(dateKey) {
    setSelectedDate(dateKey);
    setEditingEvent(null);
    setEventForm({title:'', time:'', date:dateKey, details:'', invitees:''});
    setShowEventModal(true);
  }

  function openEditEvent(ev) {
    setEditingEvent({dayKey: ev.dayKey, taskId: ev.id});
    setEventForm({title: ev.title||'', time: ev.eventTime||'', date: ev.dayKey||'', details: ev.details||'', invitees:(ev.invitees||[]).join(', ')});
    setShowEventModal(true);
  }

  function saveEvent() {
    if (!eventForm.title.trim()) return;
    if (editingEvent) {
      const newDayKey = eventForm.date || editingEvent.dayKey;
      const dateChanged = newDayKey !== editingEvent.dayKey;
      setWeekData(wd => {
        const updated = JSON.parse(JSON.stringify(wd)); // deep clone
        // Remove from old day
        Object.keys(updated).forEach(wk => {
          const tasks = (updated[wk].tasks || {})[editingEvent.dayKey];
          if (tasks) {
            const idx = tasks.findIndex(t => t.id === editingEvent.taskId);
            if (idx !== -1) {
              const updatedTask = {...tasks[idx], title:eventForm.title, eventTime:eventForm.time, details:eventForm.details, invitees:eventForm.invitees.split(',').map(s=>s.trim()).filter(Boolean)};
              if (dateChanged) {
                // Remove from old day
                updated[wk].tasks[editingEvent.dayKey] = tasks.filter(t => t.id !== editingEvent.taskId);
                // Add to new day/week
                const newDateObj = new Date(newDayKey + 'T00:00:00');
                const newWeekKey = fmt(getWeekStart(newDateObj));
                if (!updated[newWeekKey]) updated[newWeekKey] = {proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{}};
                if (!updated[newWeekKey].tasks[newDayKey]) updated[newWeekKey].tasks[newDayKey] = [];
                updated[newWeekKey].tasks[newDayKey].push(updatedTask);
              } else {
                updated[wk].tasks[editingEvent.dayKey][idx] = updatedTask;
              }
              if (updatedTask.gcalId && getToken()) {
                updateEventInCalendar(updatedTask.gcalId, updatedTask, newDayKey);
              }
            }
          }
        });
        return updated;
      });
    } else {
      // Add new event to the correct week in weekData
      const targetDate = eventForm.date || selectedDate;
      const dateObj = new Date(targetDate + 'T00:00:00');
      const weekKey = fmt(getWeekStart(dateObj));
      const newTask = {
        id: Date.now().toString(), title: eventForm.title, details: eventForm.details, invitees:eventForm.invitees.split(',').map(s=>s.trim()).filter(Boolean),
        done: false, expanded: false, colorIndex: 3, isEvent: true, eventTime: eventForm.time,
        gcalId: null,
      };
      setWeekData(wd => {
        const cur = wd[weekKey] || {proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{}};
        const dayTasks = (cur.tasks||{})[targetDate] || [];
        return {...wd, [weekKey]: {...cur, tasks: {...(cur.tasks||{}), [targetDate]: [...dayTasks, newTask]}}};
      });
      // Push to Google Calendar and store gcalId back
      if (getToken()) {
        pushEventToCalendar(newTask, targetDate).then(gcalId => {
          if (gcalId) {
            setWeekData(wd => {
              const updated = {...wd};
              const tasks = (updated[weekKey]?.tasks || {})[targetDate];
              if (tasks) {
                updated[weekKey] = {...updated[weekKey], tasks: {...updated[weekKey].tasks,
                  [targetDate]: tasks.map(t => t.id===newTask.id ? {...t, gcalId} : t)
                }};
              }
              return updated;
            });
          } else {
            console.warn('Calendar push returned no ID — event may not have synced');
          }
        }).catch(e => {
          console.error('Calendar push error:', e);
          alert('Event saved locally, but could not push to Google Calendar:\n' + (e?.message || 'Unknown error') + '\n\nTry signing out and back in to refresh your Google permissions.');
        });
      }
    }
    setShowEventModal(false);
    setEditingEvent(null);
  }

  function deleteEvent(ev) {
    // Remove from Google Calendar if signed in and has gcalId
    if (ev.gcalId && getToken()) deleteEventFromCalendar(ev.gcalId);
    setWeekData(wd => {
      const updated = {...wd};
      Object.keys(updated).forEach(wk => {
        const tasks = (updated[wk].tasks || {})[ev.dayKey];
        if (tasks) {
          updated[wk] = {...updated[wk], tasks: {...updated[wk].tasks,
            [ev.dayKey]: tasks.filter(t => t.id !== ev.id)
          }};
        }
      });
      return updated;
    });
  }

  // Build calendar grid
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const monthEvents = getAllMonthEvents();

  const sidebarContent = (
    <>
      {/* Month Nav */}
      <div className="week-nav">
        <button className="nav-arrow" onClick={()=>setViewDate(d=>new Date(d.getFullYear(), d.getMonth()-1, 1))}>‹</button>
        <span className="week-nav-label">{MONTHS[month]} {year}</span>
        <button className="nav-arrow" onClick={()=>setViewDate(d=>new Date(d.getFullYear(), d.getMonth()+1, 1))}>›</button>
      </div>

      <a className="sidebar-link daily" href="https://penzu.com">✍️ Daily Pages</a>

      {/* Monthly Goals */}
      <div className="sidebar-section">
        <div className="checklist-header">
          <div className="sidebar-section-title">Monthly Goals:</div>
          <button className="add-btn" onClick={addMonthGoal}>+</button>
        </div>
        {getMonthGoals().map(g=>(
          <div key={g.id} className={`checklist-item ${g.done?'checked':''}`}>
            <div className={`check-box ${g.done?'checked':''}`} onClick={()=>updateMonthGoal(g.id,{done:!g.done})} />
            <input className="checklist-input" placeholder="Goal…" value={g.name}
              onChange={e=>updateMonthGoal(g.id,{name:e.target.value})} />
            <button className="delete-item-btn" onClick={()=>deleteMonthGoal(g.id)}>✕</button>
          </div>
        ))}
      </div>

      {/* Events this month */}
      <div className="sidebar-section" style={{flex:1}}>
        <div className="sidebar-section-title">Events This Month</div>
        {monthEvents.length === 0 && (
          <div style={{fontSize:11,color:'var(--ink-faint)',fontStyle:'italic',marginTop:4}}>No events yet</div>
        )}
        {monthEvents.map(ev=>{
          const isPending = ev.calendarInvite && ev.responseStatus === 'needsAction';
          const isDeclined = ev.responseStatus === 'declined';
          function handleRespond(response, e) {
            e.stopPropagation();
            if (!ev.gcalId) return;
            respondToCalendarInvite(ev.gcalId, response).then(() => {
              setWeekData(wd => {
                const updated = JSON.parse(JSON.stringify(wd));
                Object.values(updated).forEach(week => {
                  Object.values(week.tasks || {}).forEach(tasks => {
                    const t = tasks.find(t => t.gcalId === ev.gcalId);
                    if (t) { t.responseStatus = response; t.calendarInvite = true; }
                  });
                });
                return updated;
              });
            }).catch(err => alert('Could not respond: ' + err.message));
          }
          return (
            <div key={ev.id} className={`month-event-item ${isPending?'pending':''}`} onClick={()=>openEditEvent(ev)}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div className="month-event-date">
                    {MONTHS[ev.date.getMonth()].slice(0,3)} {ev.date.getDate()}
                    {ev.eventTime && <span className="month-event-time"> {ev.eventTime}</span>}
                  </div>
                  {ev.calendarInvite && (
                    <span className={`invite-badge ${ev.responseStatus||'needsAction'}`}>
                      {ev.responseStatus==='accepted'?'✓ accepted':ev.responseStatus==='declined'?'✗ declined':ev.responseStatus==='tentative'?'? maybe':'📨 invited'}
                    </span>
                  )}
                </div>
                <div className="month-event-title" style={{opacity:isDeclined?0.45:1}}>{ev.title||<em style={{opacity:0.5}}>Untitled</em>}</div>
                {isPending && (
                  <div className="invite-response-btns" onClick={e=>e.stopPropagation()}>
                    <button className="invite-btn accept" onClick={e=>handleRespond('accepted',e)}>✓ Accept</button>
                    <button className="invite-btn tentative" onClick={e=>handleRespond('tentative',e)}>? Maybe</button>
                    <button className="invite-btn decline" onClick={e=>handleRespond('declined',e)}>✗ Decline</button>
                  </div>
                )}
              </div>
              <button className="delete-item-btn" style={{marginLeft:'auto',flexShrink:0,opacity:0.4,fontSize:13,color:'var(--red)',alignSelf:'flex-start'}}
                onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0.4}
                onClick={e=>{
                  e.stopPropagation();
                  if(window.confirm(`Delete "${ev.title||'Untitled'}"?`)) deleteEvent(ev);
                }}>✕</button>
            </div>
          );
        })}
      </div>
    </>
  );

  return (
    <div className="main-content">
      {/* DESKTOP SIDEBAR (collapsible) */}
      <div className={`sidebar-wrap ${sidebarCollapsed ? 'collapsed' : ''}`}>
        <div className="sidebar" style={{overflowY:'auto'}}>
          {sidebarContent}
        </div>
        <div className="sidebar-toggle-strip" onClick={()=>setSidebarCollapsed(c=>!c)}
          title={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}>
          <div className="sidebar-toggle-btn">{sidebarCollapsed ? '›' : '‹'}</div>
          <span className="sidebar-collapsed-label">Monthly</span>
        </div>
      </div>

      {/* MAIN CALENDAR GRID */}
      <div className="main-panel" style={{overflowY:'auto'}}>
        <div className="monthly-cal-wrap">
          {/* Mobile month navigation — desktop uses the sidebar nav instead */}
          <div className="mobile-month-nav">
            <button className="nav-arrow" onClick={()=>setViewDate(d=>new Date(d.getFullYear(), d.getMonth()-1, 1))}>‹</button>
            <span className="mobile-month-label">{MONTHS[month]} {year}</span>
            <button className="nav-arrow" onClick={()=>setViewDate(d=>new Date(d.getFullYear(), d.getMonth()+1, 1))}>›</button>
          </div>
          {/* Day-of-week headers */}
          <div className="monthly-cal-header">
            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>(
              <div key={d} className="monthly-dow">{d}</div>
            ))}
          </div>
          {/* Grid */}
          <div className="monthly-cal-grid">
            {cells.map((d,i)=>{
              if (!d) return (
                <div key={'e'+i} className="monthly-cell empty">
                  <div className="monthly-cell-dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i%7]}</div>
                </div>
              );
              const dk = fmt(d);
              const isToday = isSameDay(d, today);
              const dayEvents = getEventsForDay(dk);
              const isDragOver = dragOverDay === dk;
              return (
                <div key={dk}
                  className={`monthly-cell ${isToday?'today':''} ${isDragOver?'drag-over':''}`}
                  onClick={()=>openAddEvent(dk)}
                  onDragOver={e=>handleDragOver(e,dk)}
                  onDragLeave={()=>setDragOverDay(null)}
                  onDrop={e=>handleDrop(e,dk)}>
                  <div className="monthly-cell-dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</div>
                  <div className="monthly-cell-date">{d.getDate()}</div>
                  <div className="monthly-cell-events">
                    {dayEvents.slice(0,3).map(ev=>(
                      <div key={ev.id} className="monthly-event-chip"
                        style={{background: taskBg(ev.colorIndex??3), cursor:'grab', opacity: dragInfo?.eventId===ev.id ? 0.4 : 1}}
                        draggable
                        onDragStart={e=>{e.stopPropagation();handleDragStart(e,ev.id,dk);}}
                        onDragEnd={()=>{setDragInfo(null);setDragOverDay(null);}}
                        onClick={e=>{e.stopPropagation();if(!dragInfo)openEditEvent(ev);}}>
                        {ev.eventTime && <span className="chip-time">{ev.eventTime}</span>}
                        {ev.title||'…'}
                      </div>
                    ))}
                    {dayEvents.length > 3 && (
                      <div className="monthly-event-more">+{dayEvents.length-3} more</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* MOBILE: Bottom sheet overlay */}
      <div className={`mobile-sheet-overlay ${sheetOpen?'open':''}`} onClick={()=>setSheetOpen(false)} />
      <div className={`mobile-sheet ${sheetOpen?'open':''}`}>
        <div className="mobile-sheet-handle" />
        <div className="mobile-sheet-header">
          <span className="mobile-sheet-title">{MONTHS[month]} {year}</span>
          <button className="mobile-sheet-close" onClick={()=>setSheetOpen(false)}>✕</button>
        </div>
        <div className="mobile-sheet-body">
          {sidebarContent}
        </div>
      </div>

      {/* MOBILE: FAB to open sheet */}
      <button className="mobile-fab" onClick={()=>setSheetOpen(o=>!o)} title="Monthly goals & events">☰</button>

      {/* EVENT MODAL */}
      {showEventModal && (()=>{
        const editTask = editingEvent
          ? Object.values(weekData).flatMap(wd=>Object.values(wd.tasks||{}).flat()).find(t=>t.id===editingEvent.taskId)
          : null;
        const isPending = editTask?.calendarInvite && editTask?.responseStatus==='needsAction';
        function handleModalRespond(response) {
          if (!editTask?.gcalId) return;
          respondToCalendarInvite(editTask.gcalId, response).then(()=>{
            setWeekData(wd=>{
              const updated=JSON.parse(JSON.stringify(wd));
              Object.values(updated).forEach(week=>Object.values(week.tasks||{}).forEach(tasks=>{
                const t=tasks.find(t=>t.gcalId===editTask.gcalId);
                if(t){t.responseStatus=response;t.calendarInvite=true;}
              }));
              return updated;
            });
            setShowEventModal(false);
          }).catch(err=>alert('Could not respond: '+err.message));
        }
        return (
        <div className="modal-backdrop" onClick={()=>setShowEventModal(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">{editingEvent ? 'Edit Event' : `Add Event — ${selectedDate}`}</div>
            <input className="modal-input" placeholder="Event title…"
              value={eventForm.title} onChange={e=>setEventForm(f=>({...f,title:e.target.value}))}
              autoFocus />
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8}}>
              <label style={{fontSize:12,color:'var(--ink-faint)'}}>Date:</label>
              <input type="date" className="task-time-input"
                value={eventForm.date||''}
                onChange={e=>setEventForm(f=>({...f,date:e.target.value}))} />
              <label style={{fontSize:12,color:'var(--ink-faint)'}}>Time:</label>
              <TimeSelect value={eventForm.time} onChange={v=>setEventForm(f=>({...f,time:v}))} />
            </div>
            <textarea className="modal-textarea" placeholder="Details (optional)…"
              value={eventForm.details} onChange={e=>setEventForm(f=>({...f,details:e.target.value}))} rows={3} />
            <div style={{marginTop:8}}>
              <label style={{fontSize:12,color:'var(--ink-faint)',display:'block',marginBottom:4}}>
                Invite (comma-separated emails):
              </label>
              <input className="modal-input" placeholder="friend@email.com, other@email.com…"
                value={eventForm.invitees}
                onChange={e=>setEventForm(f=>({...f,invitees:e.target.value}))}
                style={{marginTop:0,fontSize:12}} />
              <div style={{fontSize:10,color:'var(--ink-faint)',marginTop:3,fontStyle:'italic'}}>
                Google Calendar will send invitations to these addresses.
              </div>
            </div>
            {editTask?.calendarInvite && (
              <div style={{marginTop:10,padding:'8px 10px',borderRadius:'var(--radius-sm)',
                background: isPending?'var(--gold-light)':'var(--accent-light)',
                border:`1px solid ${isPending?'var(--gold)':'var(--accent)'}`}}>
                {isPending ? (<>
                  <div style={{fontSize:11,fontFamily:"'DM Mono',monospace",color:'var(--gold)',fontWeight:700,marginBottom:6}}>
                    📨 You've been invited — respond:
                  </div>
                  <div className="invite-response-btns">
                    <button className="invite-btn accept" onClick={()=>handleModalRespond('accepted')}>✓ Accept</button>
                    <button className="invite-btn tentative" onClick={()=>handleModalRespond('tentative')}>? Maybe</button>
                    <button className="invite-btn decline" onClick={()=>handleModalRespond('declined')}>✗ Decline</button>
                  </div>
                </>) : (
                  <div style={{fontSize:11,fontFamily:"'DM Mono',monospace"}}>
                    Your RSVP: <span className={`invite-badge ${editTask.responseStatus}`}>
                      {editTask.responseStatus==='accepted'?'✓ accepted':editTask.responseStatus==='declined'?'✗ declined':'? maybe'}
                    </span>
                    <button style={{marginLeft:8,fontSize:10,background:'none',border:'none',cursor:'pointer',color:'var(--ink-faint)',textDecoration:'underline'}}
                      onClick={()=>setWeekData(wd=>{const u=JSON.parse(JSON.stringify(wd));Object.values(u).forEach(wk=>Object.values(wk.tasks||{}).forEach(ts=>{const t=ts.find(t=>t.gcalId===editTask.gcalId);if(t)t.responseStatus='needsAction';}));return u;})}>
                      Change
                    </button>
                  </div>
                )}
              </div>
            )}
            <div className="modal-actions">
              {editingEvent && (
                <button className="modal-btn danger" onClick={()=>{
                  deleteEvent({id:editingEvent.taskId, dayKey:editingEvent.dayKey});
                  setShowEventModal(false);
                }}>Delete</button>
              )}
              <button className="modal-btn secondary" onClick={()=>setShowEventModal(false)}>Cancel</button>
              <button className="modal-btn primary" onClick={saveEvent}>Save</button>
            </div>
          </div>
        </div>
        );
      })()}
    </div>
  );
}

const OLD_THEME_COLORS = { '#5c2d52': '#3a2960', '#7c3f6e': '#523e82' };
function themeColor(c) { return OLD_THEME_COLORS[(c || '').toLowerCase()] || c; }

const HEADER_PRESETS = [
  '#1e3d29','#2d5a3d','#1a3a4a','#3b2a4a',
  '#4a2a2a','#4a3a1a','#2a2a4a','#1a4a3a',
  '#000000','#2c2c2c','#5a4a3a','#3a3a5a',
];

function ColorPickerPopover({ color, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();

  useEffect(() => {
    function handleClick(e) { if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  return (
    <div ref={ref} className="hdr-color-wrap">
      <button className="hdr-color-btn" title="Change header color" onClick={()=>setOpen(o=>!o)}>
        🎨
      </button>
      {open && (
        <div className="hdr-color-popover">
          <div className="hdr-color-presets">
            {HEADER_PRESETS.map(c=>(
              <div key={c} className={`hdr-preset-swatch ${color===c?'active':''}`}
                style={{background:c}}
                onClick={()=>{onChange(c); setOpen(false);}} />
            ))}
          </div>
          <div className="hdr-color-custom">
            <label>Custom</label>
            <input type="color" value={color} onChange={e=>onChange(e.target.value)} />
          </div>
        </div>
      )}
    </div>
  );
}

// METRICS VIEW
// ─────────────────────────────────────────────
function MetricsView({ metrics, weightTarget, setWeightTarget, calsTarget, setCalsTarget, onBack }) {

  function dflt30() {
    const end = new Date(); end.setHours(0,0,0,0);
    // vvv this is where you set the days back default in the Weight/Cal Charts
    const start = new Date(end); start.setDate(start.getDate() - 20); // 21 days total (today + 20 back)
    return { start: fmt(start), end: fmt(end) };
  }
  const [dateRange, setDateRange] = useState(dflt30);
  const weightChartRef = useRef(null);
  const calsChartRef   = useRef(null);
  const weightChartInst = useRef(null);
  const calsChartInst   = useRef(null);

  // Build an array of dateKeys in range
  function getDatesInRange(startStr, endStr) {
    const dates = [];
    const cursor = new Date(startStr + 'T00:00:00');
    const end    = new Date(endStr   + 'T00:00:00');
    while (cursor <= end) { dates.push(fmt(new Date(cursor))); cursor.setDate(cursor.getDate()+1); }
    return dates;
  }

  // Outlier filter: remove points > 3 IQR from median
  function filterOutliers(vals) {
    const nums = vals.filter(v => v !== null);
    if (nums.length < 4) return vals;
    const sorted = [...nums].sort((a,b)=>a-b);
    const q1 = sorted[Math.floor(sorted.length*0.25)];
    const q3 = sorted[Math.floor(sorted.length*0.75)];
    const iqr = q3 - q1;
    const lo = q1 - 3*iqr, hi = q3 + 3*iqr;
    return vals.map(v => (v !== null && v >= lo && v <= hi) ? v : null);
  }

  // For axis bounds only: strip outliers using standard 1.5×IQR so extreme values
  // (e.g. fasting zeros) don't dominate the scale. Data points still plot, just off-screen.
  function boundsVals(vals) {
    const nums = vals.filter(v => v !== null);
    if (nums.length < 4) return nums;
    const sorted = [...nums].sort((a,b)=>a-b);
    const q1 = sorted[Math.floor(sorted.length*0.25)];
    const q3 = sorted[Math.floor(sorted.length*0.75)];
    const iqr = q3 - q1;
    const lo = q1 - 1.5*iqr, hi = q3 + 1.5*iqr;
    return nums.filter(v => v >= lo && v <= hi);
  }

  // 3-day simple moving average
  function sma3(vals) {
    return vals.map((_, i) => {
      const window = vals.slice(Math.max(0, i-2), i+1).filter(v => v !== null);
      return window.length > 0 ? Math.round((window.reduce((a,b)=>a+b,0)/window.length)*10)/10 : null;
    });
  }

  // Compute tight Y-axis bounds: ~10% pad around the non-outlier data range
  function yBounds(vals, floorZero) {
    const nums = boundsVals(vals);
    if (nums.length === 0) return floorZero ? {min:0, max:100} : {min:0, max:100};
    const lo = Math.min(...nums), hi = Math.max(...nums);
    const range = hi - lo;
    // Pad: 12% of range, minimum 2 units so a flat line still shows context
    const pad = Math.max(range * 0.12, 2);
    return {
      min: floorZero ? Math.max(0, Math.floor(lo - pad)) : Math.floor(lo - pad),
      max: Math.ceil(hi + pad)
    };
  }

  function buildCharts() {
    const dates = getDatesInRange(dateRange.start, dateRange.end);
    const labels = dates.map(dk => {
      const d = new Date(dk+'T00:00:00');
      return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
    });

    const rawWeight = dates.map(dk => {
      const v = parseFloat((metrics[dk]||{}).weight);
      return isNaN(v) ? null : v;
    });
    const rawCals = dates.map(dk => {
      const v = parseFloat((metrics[dk]||{}).cals);
      return isNaN(v) ? null : v;
    });
    const weightVals = filterOutliers(rawWeight);
    const calsVals   = filterOutliers(rawCals);
    const smaVals    = sma3(weightVals);
    const wTarget    = parseFloat(weightTarget);
    const cTarget    = parseFloat(calsTarget);

    const wBounds = yBounds(weightVals, false);
    const cBounds = yBounds(calsVals, true);

    // Weight: floor the min so target is always visible (1 unit below target)
    if (!isNaN(wTarget)) {
      wBounds.min = Math.min(wBounds.min, Math.floor(wTarget - 1));
    }
    // Cals: ensure target line is always within the visible range
    if (!isNaN(cTarget)) {
      cBounds.min = Math.min(cBounds.min, Math.floor(cTarget * 0.95));
      cBounds.max = Math.max(cBounds.max, Math.ceil(cTarget * 1.05));
    }

    const commonOpts = {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 14 } },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y !== null ? ctx.parsed.y : '—')
          }
        }
      },
      elements: { point: { radius: 3, hoverRadius: 5 }, line: { tension: 0.35 } },
      scales: {
        x: {
          ticks: { font: { family: 'DM Mono', size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 14 },
          grid: { color: 'rgba(0,0,0,0.06)' }
        },
        y: { ticks: { font: { family: 'DM Mono', size: 10 } }, grid: { color: 'rgba(0,0,0,0.06)' } }
      }
    };

    // Weight chart
    if (weightChartInst.current) weightChartInst.current.destroy();
    const wCtx = weightChartRef.current?.getContext('2d');
    if (wCtx) {
      const wDatasets = [
        {
          label: 'Weight',
          data: weightVals,
          borderColor: '#6a50a7',
          backgroundColor: 'rgba(106,80,167,0.10)',
          fill: true,
          spanGaps: true,
          borderWidth: 2,
        },
        {
          label: '3-day avg',
          data: smaVals,
          borderColor: '#e0a800',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5,3],
          pointRadius: 0,
          spanGaps: true,
        },
      ];
      if (!isNaN(wTarget)) {
        wDatasets.push({
          label: `Target (${wTarget})`,
          data: dates.map(()=>wTarget),
          borderColor: '#c0392b',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [8,4],
          pointRadius: 0,
        });
      }
      weightChartInst.current = new Chart(wCtx, {
        type: 'line',
        data: { labels, datasets: wDatasets },
        options: { ...commonOpts,
          scales: { ...commonOpts.scales,
            y: { ...commonOpts.scales.y, min: wBounds.min, max: wBounds.max }
          }
        }
      });
    }

    // Cals chart
    if (calsChartInst.current) calsChartInst.current.destroy();
    const cCtx = calsChartRef.current?.getContext('2d');
    if (cCtx) {
      const cDatasets = [
        {
          label: 'Cal/Pts',
          data: calsVals,
          borderColor: '#2471a3',
          backgroundColor: 'rgba(36,113,163,0.10)',
          fill: true,
          spanGaps: true,
          borderWidth: 2,
        },
      ];
      if (!isNaN(cTarget)) {
        cDatasets.push({
          label: `Target (${cTarget})`,
          data: dates.map(()=>cTarget),
          borderColor: '#7d3c98',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [8,4],
          pointRadius: 0,
        });
      }
      calsChartInst.current = new Chart(cCtx, {
        type: 'line',
        data: { labels, datasets: cDatasets },
        options: { ...commonOpts,
          scales: { ...commonOpts.scales,
            y: { ...commonOpts.scales.y, min: cBounds.min, max: cBounds.max }
          }
        }
      });
    }
  }

  useEffect(() => {
    // Wait a tick for canvases to be in DOM
    const t = setTimeout(buildCharts, 50);
    return () => { clearTimeout(t); if(weightChartInst.current) weightChartInst.current.destroy(); if(calsChartInst.current) calsChartInst.current.destroy(); };
  }, [metrics, dateRange, weightTarget, calsTarget]);

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--cream)'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 20px',background:'var(--paper)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <button onClick={onBack}
          style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:13,fontFamily:"'DM Sans',sans-serif",padding:'0 4px',display:'flex',alignItems:'center',gap:4}}>
          ‹ Habits
        </button>
        <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:15,fontWeight:700,color:'var(--ink)',flex:1}}>Metrics</span>
        {/* Date range */}
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>
          <input type="date" value={dateRange.start}
            onChange={e=>setDateRange(r=>({...r,start:e.target.value}))}
            style={{fontFamily:"'DM Mono',monospace",fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',background:'var(--surface)',color:'var(--ink)'}} />
          <span style={{fontSize:11,color:'var(--ink-faint)'}}>–</span>
          <input type="date" value={dateRange.end}
            onChange={e=>setDateRange(r=>({...r,end:e.target.value}))}
            style={{fontFamily:"'DM Mono',monospace",fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',background:'var(--surface)',color:'var(--ink)'}} />
        </div>
      </div>

      {/* Charts scroll area */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 16px 32px',display:'flex',flexDirection:'column',gap:24}}>

        {/* Weight Chart */}
        <div style={{background:'var(--paper)',borderRadius:10,padding:'16px',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700,color:'var(--ink)'}}>Weight</span>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:'var(--ink-faint)'}}>Target:</span>
              <input type="number" step="0.1"
                value={weightTarget}
                onChange={e=>setWeightTarget(e.target.value)}
                placeholder="—"
                style={{width:64,fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,
                        border:'1px solid var(--border)',borderRadius:5,padding:'3px 6px',
                        background:'var(--surface)',color:'#c0392b',textAlign:'center'}} />
            </div>
          </div>
          <div style={{height:220,position:'relative'}}>
            <canvas ref={weightChartRef} />
          </div>
        </div>

        {/* Cal/Pts Chart */}
        <div style={{background:'var(--paper)',borderRadius:10,padding:'16px',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700,color:'var(--ink)'}}>Cal / Pts</span>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:'var(--ink-faint)'}}>Target:</span>
              <input type="number" step="1"
                value={calsTarget}
                onChange={e=>setCalsTarget(e.target.value)}
                placeholder="—"
                style={{width:72,fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,
                        border:'1px solid var(--border)',borderRadius:5,padding:'3px 6px',
                        background:'var(--surface)',color:'#7d3c98',textAlign:'center'}} />
            </div>
          </div>
          <div style={{height:220,position:'relative'}}>
            <canvas ref={calsChartRef} />
          </div>
        </div>

      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// DATA & BACKUPS — import / restore from Google Drive, nightly backup status
// ─────────────────────────────────────────────
const MAX_DOC_BYTES = 1900000;

async function driveListImportable() {
  const token = await ensureGoogleToken();
  if (!token) throw new Error('Google is not connected — tap "Reconnect Google" first');
  const q = "trashed=false and (name='planner-data.json' or name contains 'lp-planner-backup-')";
  const url = 'https://www.googleapis.com/drive/v3/files?' + new URLSearchParams({
    q, orderBy: 'modifiedTime desc', pageSize: '60', fields: 'files(id,name,modifiedTime,size)',
  }).toString();
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error(res.status === 403 ? 'Google Drive access not granted — tap "Reconnect Google" and allow Drive' : 'Could not list Drive files (' + res.status + ')');
  const d = await res.json();
  const files = (d.files || []).filter(f => f.name === 'planner-data.json' || /^lp-planner-backup-\d{4}-\d{2}-\d{2}(-manual-\d{4})?\.json$/.test(f.name));
  // The live app's file first, then backups newest first
  return files.sort((a, b) => (a.name === 'planner-data.json' ? -1 : b.name === 'planner-data.json' ? 1 : (b.modifiedTime > a.modifiedTime ? 1 : -1)));
}

async function driveDownloadJson(id) {
  const token = await ensureGoogleToken();
  if (!token) throw new Error('Google is not connected');
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media`, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('Could not download the file (' + res.status + ')');
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error("That file isn't valid planner data"); }
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error("That file isn't planner data");
  return { data, bytes: text.length };
}

function summarizePlannerData(d) {
  const keys = (o) => (o && typeof o === 'object' && !Array.isArray(o)) ? Object.keys(o) : [];
  const len = (a) => Array.isArray(a) ? a.length : 0;
  let tasks = 0;
  for (const wk of keys(d.weekData)) for (const day of keys(d.weekData[wk] && d.weekData[wk].tasks)) tasks += len(d.weekData[wk].tasks[day]);
  const known = Object.keys(Sync.reg).filter(k => k in d);
  const tooBig = [];
  for (const coll of known) {
    const docs = syncSplit(coll, d[coll]);
    for (const id of Object.keys(docs)) {
      const n = JSON.stringify(docs[id] === undefined ? null : docs[id]).length;
      if (n > MAX_DOC_BYTES) tooBig.push(`${coll} ${id.replace(/^p:/, '')} (${(n / 1e6).toFixed(1)} MB)`);
    }
  }
  return {
    known: known.length,
    savedAt: d._backupAt || d._savedAt || null,
    rows: [
      ['Weeks', keys(d.weekData).length], ['Tasks & events', tasks], ['Pages', len(d.pagesData)],
      ['Habits', len(d.habitGoals)], ['Days with habit check-offs', keys(d.habitCompletions).length],
      ['Workout days', keys(d.fitnessLog).length], ['Exercises in library', len(d.fitnessExercises)],
      ['Countdowns', len(d.countdowns)],
    ],
    tooBig,
  };
}

function fileLabel(f) {
  if (f.name === 'planner-data.json') return 'Live app data (planner-data.json)';
  const m = f.name.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return f.name;
  const day = `${MONTHS[parseInt(m[2], 10) - 1].slice(0, 3)} ${parseInt(m[3], 10)}, ${m[1]}`;
  const t = f.name.match(/-manual-(\d{2})(\d{2})\.json$/);
  if (!t) return `Nightly backup · ${day}`;
  const h = parseInt(t[1], 10);
  return `Manual backup · ${day}, ${h % 12 || 12}:${t[2]} ${h < 12 ? 'AM' : 'PM'}`;
}
function fmtWhen(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function DataPanel({ me, refreshMe, suggestImport, onClose }) {
  const [files, setFiles] = useState(null);
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [picked, setPicked] = useState(null);     // { file, data, bytes, summary }
  const [progress, setProgress] = useState(null); // { done, total }
  const [result, setResult] = useState(null);
  const driveOk = !me || me.drive_ok !== false;
  const b = me && me.backup;

  async function findFiles() {
    setErr(''); setBusy('list'); setPicked(null); setResult(null);
    try { setFiles(await driveListImportable()); }
    catch (e) { setErr(e.message); }
    setBusy('');
  }
  async function pick(f) {
    setErr(''); setBusy('download:' + f.id); setResult(null);
    try {
      const { data, bytes } = await driveDownloadJson(f.id);
      const summary = summarizePlannerData(data);
      if (!summary.known) throw new Error("That file doesn't contain any planner data");
      setPicked({ file: f, data, bytes, summary });
    } catch (e) { setErr(e.message); }
    setBusy('');
  }
  async function doImport() {
    if (!picked) return;
    if (picked.summary.tooBig.length) { setErr('Some items are over the 1.9 MB limit: ' + picked.summary.tooBig.join(', ')); return; }
    if (!window.confirm(`Replace ALL data in this app with "${fileLabel(picked.file)}"?\n\nAnything in this app that isn't in that file will be removed. The file in Google Drive is not changed.`)) return;
    setErr(''); setBusy('import'); setProgress({ done: 0, total: 0 });
    try {
      const r = await Sync.importAll(picked.data, (done, total) => setProgress({ done, total }));
      setResult(r);
    } catch (e) { setErr('Import stopped: ' + e.message + '. You can run it again safely.'); }
    setBusy(''); setProgress(null);
  }
  async function backupNow() {
    setErr(''); setBusy('backup');
    try { await api('/api/backup', { method: 'POST' }); }
    catch (e) { if (e.code === 'too_soon') setErr('A backup just ran — try again in a few seconds.'); }
    await refreshMe();
    setBusy('');
  }

  const box = { background: 'var(--cream)', borderRadius: 'var(--radius-md)', padding: '12px 14px', fontSize: 13, lineHeight: 1.5 };
  const h = { fontFamily: "'Playfair Display',serif", fontSize: 15, fontWeight: 600, margin: '18px 0 8px' };
  const small = { fontSize: 12, color: 'var(--ink-light)' };
  const backupColor = !b ? 'var(--ink-light)' : b.status === 'ok' ? 'var(--accent)' : b.status === 'skipped_empty' ? 'var(--ink-light)' : 'var(--red)';
  const backupText = !b ? 'No backup yet — the first one runs tonight.'
    : b.status === 'ok' ? `✓ ${fmtWhen(b.at)} · ${b.file}`
    : b.status === 'skipped_empty' ? `Skipped ${fmtWhen(b.at)} — nothing to back up yet`
    : `✗ ${fmtWhen(b.at)} — ${b.error || 'failed'}`;

  return (
    <div className="modal-backdrop" onClick={busy === 'import' ? undefined : onClose}>
      <div className="modal-box data-panel" onClick={e => e.stopPropagation()}
        style={{ width: 'min(560px, 94vw)', maxHeight: '88vh', overflowY: 'auto' }}>
        <div className="modal-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <span>Data &amp; backups</span>
          {busy !== 'import' && <button className="modal-btn secondary" onClick={onClose} style={{ padding: '4px 10px' }}>Close</button>}
        </div>

        {!driveOk && (
          <div style={{ ...box, background: '#fdf3dc', color: '#8a6200', marginTop: 8 }}>
            Google Drive access isn't granted, so backups and imports can't run.
            <div style={{ marginTop: 8 }}><button className="modal-btn primary" onClick={startSignIn}>Reconnect Google</button></div>
          </div>
        )}

        <div style={h}>Nightly backup to Google Drive</div>
        <div style={box}>
          <div style={{ color: backupColor, fontWeight: 600 }}>{backupText}</div>
          <div style={{ ...small, marginTop: 6 }}>
            Runs every night around 3 AM into the <b>LP Planner Backups</b> folder in your Google Drive. “Back up now” saves its own separate copy (the newest 5 are kept) and never replaces the nightly one.
            Keeps the last 7 days plus the 1st of each month for a year.
          </div>
          <button className="modal-btn primary" style={{ marginTop: 10 }} disabled={!!busy || !driveOk} onClick={backupNow}>
            {busy === 'backup' ? 'Backing up…' : 'Back up now'}
          </button>
        </div>

        <div style={h}>Import or restore from Google Drive</div>
        {suggestImport && !result && (
          <div style={{ ...box, background: 'var(--gold-light)', marginBottom: 10 }}>
            This app is empty. Import your planner from Google Drive to get started — pick <b>Live app data</b> below.
          </div>
        )}
        <div style={small}>Replaces everything in this app with the file you choose. The file itself is never changed.</div>
        <button className="modal-btn secondary" style={{ marginTop: 10 }} disabled={!!busy || !driveOk} onClick={findFiles}>
          {busy === 'list' ? 'Looking…' : files ? 'Refresh list' : 'Find files in Google Drive'}
        </button>

        {files && files.length === 0 && <div style={{ ...small, marginTop: 10 }}>No planner files found in your Drive.</div>}
        {files && files.length > 0 && (
          <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 6 }}>
            {files.map(f => (
              <button key={f.id} disabled={!!busy} onClick={() => pick(f)}
                style={{ textAlign: 'left', padding: '10px 12px', borderRadius: 'var(--radius-sm)', cursor: busy ? 'default' : 'pointer',
                  border: picked && picked.file.id === f.id ? '1.5px solid var(--accent)' : '1px solid var(--border)',
                  background: picked && picked.file.id === f.id ? 'var(--accent-light)' : 'var(--paper)', fontFamily: "'DM Sans',sans-serif" }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{fileLabel(f)}</div>
                <div style={small}>
                  {busy === 'download:' + f.id ? 'Opening…' : `Saved ${fmtWhen(Date.parse(f.modifiedTime))} · ${Math.max(1, Math.round((+f.size || 0) / 1024))} KB`}
                </div>
              </button>
            ))}
          </div>
        )}

        {picked && !result && (
          <div style={{ ...box, marginTop: 12 }}>
            <div style={{ fontWeight: 600, marginBottom: 6 }}>{fileLabel(picked.file)} contains:</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '2px 16px', fontSize: 13 }}>
              {picked.summary.rows.map(([k, v]) => (<React.Fragment key={k}><span>{k}</span><span style={{ fontVariantNumeric: 'tabular-nums', textAlign: 'right' }}>{v}</span></React.Fragment>))}
            </div>
            {picked.summary.tooBig.length > 0 && (
              <div style={{ color: 'var(--red)', marginTop: 8 }}>Too large to save (over 1.9 MB): {picked.summary.tooBig.join(', ')}. Remove pasted images from those first.</div>
            )}
            {progress ? (
              <div style={{ marginTop: 10 }}>
                <div style={{ height: 8, background: 'var(--border)', borderRadius: 4, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: `${progress.total ? Math.round(100 * progress.done / progress.total) : 5}%`, background: 'var(--accent)', transition: 'width 0.2s' }} />
                </div>
                <div style={{ ...small, marginTop: 4 }}>Uploading {progress.done} of {progress.total}… keep the app open.</div>
              </div>
            ) : (
              <button className="modal-btn primary" style={{ marginTop: 12, background: 'var(--red)' }} disabled={!!busy} onClick={doImport}>
                Replace my data with this file
              </button>
            )}
          </div>
        )}

        {result && (
          <div style={{ ...box, marginTop: 12, background: result.mismatches.length ? '#fdf3dc' : 'var(--accent-light)' }}>
            {result.mismatches.length === 0
              ? <><b style={{ color: 'var(--accent)' }}>✓ Import complete and verified.</b> Everything in the app now matches the file ({result.changes} item{result.changes === 1 ? '' : 's'} uploaded).</>
              : <><b>Imported, but these didn't match the file:</b> {result.mismatches.join(', ')}. Your data is still saved — tell Claude which ones so it can check.</>}
          </div>
        )}

        {err && <div style={{ ...box, marginTop: 12, background: 'var(--red-light)', color: 'var(--red)' }}>{err}</div>}
      </div>
    </div>
  );
}

// ── Pages editor: stored HTML ⇄ Quill delta ─────────────────────────────────────────────
// Pages keep saving the app's original HTML dialect (so TEST and live read each other's pages):
//   checklist: <ul class="pages-checklist"><li class="pages-chk-li [checked]" data-checked="true|false"><input type=checkbox class="pages-chk-input" [checked]> text</li></ul>
function pagesHtmlToDelta(quill, html) {
  const Delta = Quill.import('delta');
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html').body;
  const BLOCK = /^(P|DIV|H[1-6]|BLOCKQUOTE|UL|OL|LI|PRE)$/;
  const isListEl = n => n.nodeType === 1 && (n.tagName === 'UL' || n.tagName === 'OL');
  const alignOf = el => { const a = el.style && el.style.textAlign; return (a === 'center' || a === 'right' || a === 'justify') ? { align: a } : {}; };
  let out = new Delta();
  const inline = (nodes) => {
    const box = doc.ownerDocument.createElement('div');
    nodes.forEach(n => box.appendChild(n.cloneNode(true)));
    let d = box.innerHTML.trim() === '' ? new Delta() : quill.clipboard.convert({ html: box.innerHTML });
    const ops = d.ops.slice();                       // drop a trailing newline the converter may add
    const last = ops[ops.length - 1];
    if (last && typeof last.insert === 'string' && last.insert.endsWith('\n') && !last.attributes) {
      last.insert = last.insert.slice(0, -1); if (!last.insert) ops.pop();
    }
    return new Delta(ops.map(o => typeof o.insert === 'string' ? { ...o, insert: o.insert.replace(/ /g, ' ') } : o));
  };
  const line = (nodes, attrs) => {
    let d = inline(nodes);
    if (d.length() === 0 && nodes.length && !nodes.some(n => n.nodeType === 1 && n.querySelector && n.querySelector('img')) && nodes.every(n => n.nodeType !== 3 || !n.textContent.trim())) d = new Delta();
    out = out.concat(d).insert('\n', attrs && Object.keys(attrs).length ? attrs : undefined);
  };
  const walk = (parent, extra) => {
    let buf = [];
    const flush = () => {
      if (buf.length && (buf.some(n => n.nodeType === 1) || buf.some(n => n.textContent.trim()))) line(buf, extra);
      buf = [];
    };
    for (const n of Array.from(parent.childNodes)) {
      if (n.nodeType === 1 && BLOCK.test(n.tagName)) {
        flush();
        const t = n.tagName;
        if (isListEl(n)) lists(n, 0, null);
        else if (t === 'BLOCKQUOTE') walk(n, { ...(extra || {}), ...alignOf(n), blockquote: true });
        else if (/^H[1-6]$/.test(t)) line(Array.from(n.childNodes), { ...(extra || {}), ...alignOf(n), header: +t[1] });
        else if (Array.from(n.childNodes).some(c => c.nodeType === 1 && BLOCK.test(c.tagName))) walk(n, { ...(extra || {}), ...alignOf(n) });
        else line(Array.from(n.childNodes), { ...(extra || {}), ...alignOf(n) });
      } else buf.push(n);
    }
    flush();
  };
  const lists = (ul, depth, inheritedCheck) => {
    const check = inheritedCheck || ul.classList.contains('pages-checklist');
    for (const li of Array.from(ul.childNodes)) {
      if (isListEl(li)) { lists(li, depth + 1, check); continue; }      // <ul><ul> produced by execCommand('indent')
      if (li.nodeType !== 1 || li.tagName !== 'LI') continue;
      const box = li.querySelector(':scope > input[type=checkbox]');
      const isCheck = check || li.classList.contains('pages-chk-li') || !!box;
      let kind = ul.tagName === 'OL' ? 'ordered' : 'bullet';
      if (isCheck) {
        const done = li.getAttribute('data-checked') === 'true' || li.classList.contains('checked') || (box && box.hasAttribute('checked'));
        kind = done ? 'checked' : 'unchecked';
      }
      const own = Array.from(li.childNodes).filter(c => !isListEl(c) && !(c.nodeType === 1 && c.tagName === 'INPUT'));
      line(own, { list: kind, ...(depth ? { indent: depth } : {}), ...alignOf(li) });
      for (const c of Array.from(li.childNodes)) if (isListEl(c)) lists(c, depth + 1, isCheck && c.classList.contains('pages-checklist') ? true : null);
    }
  };
  walk(doc, null);
  if (out.length() === 0) return new Delta().insert('\n');
  return out;
}

function pagesEsc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pagesDeltaToHtml(delta) {
  const lines = []; let cur = [];
  for (const op of delta.ops) {
    if (typeof op.insert === 'string') {
      const parts = op.insert.split('\n');
      parts.forEach((txt, i) => {
        if (txt) cur.push({ t: txt, a: op.attributes || {} });
        if (i < parts.length - 1) { lines.push({ segs: cur, a: op.attributes || {} }); cur = []; }
      });
    } else if (op.insert && op.insert.image) cur.push({ img: op.insert.image });
  }
  if (cur.length) lines.push({ segs: cur, a: {} });       // text after the last newline (shouldn't happen in Quill)
  const seg = s => {
    if (s.img) return '<img src="' + pagesEsc(s.img) + '">';
    let h = pagesEsc(s.t), a = s.a;
    if (a.code) h = '<code>' + h + '</code>';
    if (a.strike) h = '<s>' + h + '</s>';
    if (a.underline) h = '<u>' + h + '</u>';
    if (a.italic) h = '<i>' + h + '</i>';
    if (a.bold) h = '<b>' + h + '</b>';
    const st = [];
    if (a.color) st.push('color:' + a.color);
    if (a.background) st.push('background-color:' + a.background);
    if (a.size) st.push('font-size:' + a.size);
    if (a.font) st.push('font-family:' + a.font);
    if (st.length) h = '<span style="' + pagesEsc(st.join(';')) + '">' + h + '</span>';
    if (a.link) h = '<a href="' + pagesEsc(String(a.link)) + '">' + h + '</a>';
    return h;
  };
  let html = '', stack = [];     // stack of open lists: { tag, check }
  const closeTo = n => { while (stack.length > n) { html += '</li></' + stack.pop().tag + '>'; } };
  for (const L of lines) {
    const a = L.a, body = L.segs.map(seg).join('');
    const al = a.align ? ' style="text-align:' + a.align + '"' : '';
    if (a.list) {
      const check = a.list === 'checked' || a.list === 'unchecked';
      const tag = a.list === 'ordered' ? 'ol' : 'ul';
      const d = a.indent || 0;
      closeTo(d + 1);
      if (stack.length === d + 1 && (stack[d].tag !== tag || stack[d].check !== check)) closeTo(d);
      if (stack.length === d + 1) html += '</li>';
      while (stack.length < d + 1) {
        const top = stack.length === d, c = top ? check : false, t = top ? tag : 'ul';
        html += '<' + t + (c ? ' class="pages-checklist"' : '') + '>';
        stack.push({ tag: t, check: c });
        if (stack.length < d + 1) html += '<li>';
      }
      if (check) {
        const done = a.list === 'checked';
        html += '<li class="pages-chk-li' + (done ? ' checked' : '') + '" data-checked="' + done + '"' + al + '><input type="checkbox" class="pages-chk-input" contenteditable="false"' + (done ? ' checked' : '') + '> ' + body;
      } else html += '<li' + al + '>' + body;
      continue;
    }
    closeTo(0);
    if (a.header) html += '<h' + a.header + al + '>' + (body || '<br>') + '</h' + a.header + '>';
    else if (a.blockquote) html += '<blockquote' + al + '>' + (body || '<br>') + '</blockquote>';
    else html += '<p' + al + '>' + (body || '<br>') + '</p>';
  }
  closeTo(0);
  return html;
}

// The editor itself. Remounted (key=docId) for each page; the page's saved HTML is read once on mount.
function PagesQuill({ docId, html, apiRef, onInput, onFmt, onText, onGone }) {
  const hostRef = useRef(null);
  const cb = useRef({});
  cb.current = { onInput, onFmt, onText, onGone };
  const missing = typeof Quill === 'undefined';
  useEffect(() => {
    const host = hostRef.current;
    if (!host || missing) return;
    pagesQuillSetup();
    const q = new Quill(host, {
      formats: ['bold', 'italic', 'underline', 'strike', 'code', 'header', 'blockquote', 'list', 'indent', 'link', 'image', 'color', 'background', 'size', 'font', 'align'],
      placeholder: 'Start writing…',
      modules: { toolbar: false, history: { userOnly: true, delay: 1000, maxStack: 200 } },
    });
    q.setContents(pagesHtmlToDelta(q, html), 'silent');
    q.history.clear();
    // Pasted web text often carries black/white colours that vanish in the other mode — drop those, keep deliberate colours.
    const Delta = Quill.import('delta');
    const plain = c => { const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || ''); if (!m) return /^(black|white)$/i.test(c || ''); const r = +m[1], g = +m[2], b = +m[3]; return (r < 45 && g < 45 && b < 45) || (r > 210 && g > 210 && b > 210); };
    q.clipboard.addMatcher(Node.ELEMENT_NODE, (node, delta) => {
      const strip = {};
      if (plain(node.style && node.style.color)) strip.color = null;
      if (plain(node.style && node.style.backgroundColor)) strip.background = null;
      return Object.keys(strip).length ? delta.compose(new Delta().retain(delta.length(), strip)) : delta;
    });
    const api = {
      quill: q,
      getHtml() {
        const ops = q.getContents().ops;
        if (ops.length === 1 && ops[0].insert === '\n' && !ops[0].attributes) return '';
        return pagesDeltaToHtml(q.getContents());
      },
    };
    apiRef.current = api;
    cb.current.onText(q.getText());
    q.on('text-change', (d, o, source) => {
      cb.current.onText(q.getText());
      if (source !== 'user') return;
      cb.current.onInput();
      cb.current.onFmt(q.getFormat());
    });
    q.on('selection-change', r => { if (r) cb.current.onFmt(q.getFormat(r)); });
    return () => {
      let h = null;
      try { h = api.getHtml(); } catch {}
      if (apiRef.current === api) apiRef.current = null;
      cb.current.onGone(docId, h);
      host.innerHTML = ''; host.className = 'pages-body';
    };
  }, []); // eslint-disable-line
  if (missing) return <div className="pages-body" style={{color:'var(--red)'}}>The editor didn't load — check your connection and reload the page.</div>;
  return <div ref={hostRef} className="pages-body" />;
}

function PagesView({ pagesData, setPagesData, foldersData, setFoldersData, weekData, setWeekData, selectedId, setSelectedId }) {
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileView, setMobileView] = useState(() => selectedId ? 'editor' : 'list');
  const quillApi = useRef(null);
  const getBodyHtml = () => (quillApi.current ? quillApi.current.getHtml() : null);
  const [qFmt, setQFmt] = useState({});
  const [qPop, setQPop] = useState(null);     // open toolbar popover: { kind, x, y }
  const titleRef = useRef(null);
  const debounceRef = useRef(null);
  // Always-current ref to selectedId so flush fn closure never goes stale
  const selectedIdRef = useRef(selectedId);
  useEffect(() => { selectedIdRef.current = selectedId; }, [selectedId]);
  const [wordCount, setWordCount] = useState(0);
  const [showNewMenu, setShowNewMenu] = useState(null); // null=closed, 'top'=top-level, folderId=folder menu
  const [expandedFolders, setExpandedFolders] = useState({});
  const [editingFolderId, setEditingFolderId] = useState(null);
  const [editingFolderName, setEditingFolderName] = useState('');
  const [recentCollapsed, setRecentCollapsed] = useState(false);
  // Drag state — use ref for dragItem so it's always fresh in event handlers
  const dragItemRef = useRef(null); // {type:'doc'|'folder', id}
  const [swipeDeleteId, setSwipeDeleteId] = useState(null); // folder id being swiped to delete
  const swipeTouchStart = useRef(null); // {x, y} of touch start
  const longPressTimer = useRef(null); // timer for long-press rename
  const [dragOverId, setDragOverId] = useState(null);
  const [folderHoverTarget, setFolderHoverTarget] = useState(null);
  const folderHoverTimer = useRef(null);

  // Register a synchronous body flush function so App can call it before any sync upload.
  // This writes the current editor HTML directly to localStorage immediately, bypassing
  // the 300ms debounce. Called by beforeunload, visibilitychange, and doc switching.
  useEffect(() => {
    _bodyFlushRef.fn = () => {
      if (debounceRef.current) { clearTimeout(debounceRef.current); debounceRef.current = null; }
      const id = selectedIdRef.current;
      const html = getBodyHtml();
      if (!id || html == null) return;
      const now = new Date().toISOString();
      // Write directly to local storage synchronously so the hide/close upload picks it up
      try {
        const stored = lsGet('pagesData');
        const pages = stored ? JSON.parse(stored) : [];
        const updated = pages.map(d => d.id === id ? {...d, body: html, lastModified: now} : d);
        lsSet('pagesData', JSON.stringify(updated));
      } catch {}
      // Also update React state so the sync engine sees the change
      setPagesData(p => p.map(d => d.id === id ? {...d, body: html, lastModified: now} : d));
    };
    return () => { _bodyFlushRef.fn = null; };
  }, []); // eslint-disable-line — setPagesData is stable

  // The editor calls this as it goes away (switching pages, leaving Pages) so the last keystrokes aren't lost.
  function flushDocBody(id, html) {
    if (!debounceRef.current) return;
    clearTimeout(debounceRef.current);
    debounceRef.current = null;
    if (!id || html == null) return;
    const now = new Date().toISOString();
    try {
      const stored = lsGet('pagesData');
      const pages = stored ? JSON.parse(stored) : [];
      lsSet('pagesData', JSON.stringify(pages.map(d => d.id === id ? {...d, body: html, lastModified: now} : d)));
    } catch {}
    setPagesData(p => p.map(d => d.id === id ? {...d, body: html, lastModified: now} : d));
  }

  function countWords(text) {
    return text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
  }

  const selectedDoc = pagesData.find(d => d.id === selectedId) || null;

  // ── Folder helpers ───────────────────────────────────────
  function createFolder(parentFolderId) {
    const id = 'folder_' + Date.now();
    const siblings = foldersData.filter(f => (f.parentFolderId || null) === (parentFolderId || null));
    const maxOrder = siblings.reduce((m, f) => Math.max(m, f.order ?? 0), -1);
    setFoldersData(f => [...f, { id, name: 'New Folder', parentFolderId: parentFolderId || null, order: maxOrder + 1 }]);
    setExpandedFolders(e => ({...e, [id]: true, ...(parentFolderId ? {[parentFolderId]: true} : {})}));
    setEditingFolderId(id);
    setEditingFolderName('New Folder');
    setShowNewMenu(null);
  }

  function updateFolder(id, patch) {
    setFoldersData(f => f.map(folder => folder.id === id ? {...folder, ...patch} : folder));
  }

  function deleteFolder(id) {
    const folder = foldersData.find(f => f.id === id);
    if (!folder) return;
    const parentId = folder.parentFolderId || null;
    if (!window.confirm('Delete folder? Contents will move to the parent level.')) return;
    // Move docs inside this folder up to parent
    setPagesData(p => p.map(d => d.folderId === id ? {...d, folderId: parentId} : d));
    // Move child folders up to parent, then remove this folder
    setFoldersData(f => f
      .map(f2 => f2.parentFolderId === id ? {...f2, parentFolderId: parentId} : f2)
      .filter(f2 => f2.id !== id)
    );
  }

  // ── Doc helpers ──────────────────────────────────────────
  function createDoc(folderId) {
    const id = 'doc_' + Date.now();
    const now = new Date().toISOString();
    const siblings = pagesData.filter(d => (d.folderId || null) === (folderId || null));
    const minOrder = siblings.reduce((m, d) => Math.min(m, d.order ?? 0), 0);
    const newDoc = { id, title: '', body: '', createdAt: now, lastModified: now, folderId: folderId || null, order: minOrder - 1, tasks: [] };
    setPagesData(p => [...p, newDoc]);
    setSelectedId(id);
    setMobileView('editor');
    if (folderId) setExpandedFolders(e => ({...e, [folderId]: true}));
    setShowNewMenu(null);
    setTimeout(() => titleRef.current?.focus(), 50);
  }

  function updateDoc(id, patch) {
    const now = new Date().toISOString();
    setPagesData(p => p.map(d => d.id === id ? { ...d, ...patch, lastModified: now } : d));
  }

  function deleteDoc(id) {
    if (!window.confirm('Delete this document?')) return;
    const doc = pagesData.find(d => d.id === id);
    if (doc) {
      (doc.tasks || []).filter(t => t.scheduledDate).forEach(t => removeTaskFromWeek(t.id, t.scheduledDate));
    }
    setPagesData(p => p.filter(d => d.id !== id));
    if (selectedId === id) { setSelectedId(null); setMobileView('list'); }
  }

  function updateTask(docId, taskId, patch) {
    const now = new Date().toISOString();
    setPagesData(p => p.map(d => {
      if (d.id !== docId) return d;
      const oldTask = (d.tasks||[]).find(t => t.id === taskId);
      const updatedTask = { ...oldTask, ...patch };
      if (patch.scheduledDate !== undefined) {
        const oldDate = oldTask?.scheduledDate;
        const newDate = patch.scheduledDate;
        if (oldDate && oldDate !== newDate) removeTaskFromWeek(taskId, oldDate);
        if (newDate) scheduleTaskToWeek({...updatedTask, projectDocId: d.id}, d.title || 'Untitled', newDate);
      } else if (oldTask?.scheduledDate) {
        scheduleTaskToWeek({...updatedTask, projectDocId: d.id}, d.title || 'Untitled', oldTask.scheduledDate);
      }
      return { ...d, lastModified: now, tasks: (d.tasks||[]).map(t => t.id === taskId ? updatedTask : t) };
    }));
  }

  function deleteTask(docId, taskId) {
    const doc = pagesData.find(d => d.id === docId);
    const task = doc?.tasks?.find(t => t.id === taskId);
    if (task?.scheduledDate) removeTaskFromWeek(taskId, task.scheduledDate);
    setPagesData(p => p.map(d => d.id === docId
      ? { ...d, tasks: (d.tasks||[]).filter(t => t.id !== taskId) }
      : d
    ));
  }

  function scheduleTaskToWeek(task, docTitle, dateStr) {
    const dateObj = new Date(dateStr + 'T00:00:00');
    const weekKey = fmt(getWeekStart(dateObj));
    setWeekData(wd => {
      const wk = wd[weekKey] || { proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{} };
      const dayTasks = (wk.tasks||{})[dateStr] || [];
      const existing = dayTasks.find(t => t.id === task.id) || {};
      const filtered = dayTasks.filter(t => t.id !== task.id);
      const newEntry = {
        ...existing, id: task.id, title: task.title, done: task.done,
        details: task.details || '', priority: task.priority || false,
        colorIndex: task.colorIndex || 0, isProjectTask: true,
        projectDocId: task.id && task.projectDocId ? task.projectDocId : (task.id || ''),
        projectTitle: docTitle,
      };
      return { ...wd, [weekKey]: { ...wk, tasks: { ...(wk.tasks||{}), [dateStr]: [...filtered, newEntry] } } };
    });
  }

  function removeTaskFromWeek(taskId, dateStr) {
    const dateObj = new Date(dateStr + 'T00:00:00');
    const weekKey = fmt(getWeekStart(dateObj));
    setWeekData(wd => {
      if (!(wd[weekKey]?.tasks?.[dateStr])) return wd;
      return { ...wd, [weekKey]: { ...wd[weekKey], tasks: { ...wd[weekKey].tasks,
        [dateStr]: wd[weekKey].tasks[dateStr].filter(t => t.id !== taskId)
      }}};
    });
  }

  // ── Editor (Quill) ───────────────────────────────────────────────────────────────────
  function onBodyInput() {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      debounceRef.current = null;
      const html = getBodyHtml(), id = selectedIdRef.current;
      if (html != null && id) updateDoc(id, { body: html });
    }, 300);
  }
  function qDo(fn) {
    const q = quillApi.current && quillApi.current.quill;
    if (!q) return;
    q.focus();
    fn(q);
    setQFmt(q.getFormat());
  }
  const qToggle = name => qDo(q => q.format(name, !q.getFormat()[name], 'user'));
  const qHeader = n => qDo(q => q.format('header', q.getFormat().header === n ? false : n, 'user'));
  const qNormal = () => qDo(q => { q.format('header', false, 'user'); q.format('blockquote', false, 'user'); q.format('list', false, 'user'); });
  const qList = type => qDo(q => {
    const cur = q.getFormat().list;
    const on = type === 'check' ? (cur === 'checked' || cur === 'unchecked') : cur === type;
    q.format('list', on ? false : (type === 'check' ? 'unchecked' : type), 'user');
  });
  function qOpenPop(kind, e) {
    const r = e.currentTarget.getBoundingClientRect();
    setQPop(p => (p && p.kind === kind) ? null : { kind, x: r.left, y: r.bottom + 6 });
  }
  const qSet = (name, value) => { qDo(q => q.format(name, value || false, 'user')); setQPop(null); };
  useEffect(() => {
    if (!qPop) return;
    const close = e => { if (e.type === 'mousedown' && e.target.closest && e.target.closest('.pages-pop, .pages-toolbar')) return; setQPop(null); };
    const esc = e => { if (e.key === 'Escape') setQPop(null); };
    document.addEventListener('mousedown', close); document.addEventListener('keydown', esc); window.addEventListener('scroll', close, true); window.addEventListener('resize', close);
    return () => { document.removeEventListener('mousedown', close); document.removeEventListener('keydown', esc); window.removeEventListener('scroll', close, true); window.removeEventListener('resize', close); };
  }, [qPop]);
  const qNoQuote = v => String(v || '').replace(/["']/g, '');
  const qQuote = () => qDo(q => q.format('blockquote', !q.getFormat().blockquote, 'user'));
  const qLink = () => qDo(q => {
    const r = q.getSelection(true);
    const cur = q.getFormat(r).link;
    let url = prompt('Enter URL (leave blank to remove the link):', cur || 'https://');
    if (url === null) return;
    url = url.trim();
    if (!url || url === 'https://') { if (r.length) q.formatText(r.index, r.length, 'link', false, 'user'); return; }
    if (!/^([a-z][a-z0-9+.-]*:)/i.test(url)) url = 'https://' + url;
    if (r.length) q.formatText(r.index, r.length, 'link', url, 'user');
    else { q.insertText(r.index, url, { link: url }, 'user'); q.setSelection(r.index + url.length, 0); }
  });
  const qClear = () => qDo(q => {
    const r = q.getSelection(true);
    if (r.length) q.removeFormat(r.index, r.length, 'user');
    else { const [line] = q.getLine(r.index); if (line) q.removeFormat(q.getIndex(line), Math.max(line.length() - 1, 0), 'user'); }
  });
  // Swipe a list row right/left to indent/outdent (touch).
  const swipeRef = useRef(null);
  function onEditorTouchStart(e) { swipeRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
  function onEditorTouchEnd(e) {
    const st = swipeRef.current; swipeRef.current = null;
    const q = quillApi.current && quillApi.current.quill;
    if (!st || !q) return;
    const dx = e.changedTouches[0].clientX - st.x, dy = Math.abs(e.changedTouches[0].clientY - st.y);
    if (Math.abs(dx) >= 44 && dy < 30 && q.getFormat().list) { q.format('indent', dx > 0 ? '+1' : '-1', 'user'); setQFmt(q.getFormat()); }
  }

  const fmtDocDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`;
  };

  // ── Drag and Drop ────────────────────────────────────────
  function clearFolderTimer() {
    if (folderHoverTimer.current) { clearTimeout(folderHoverTimer.current); folderHoverTimer.current = null; }
  }

  function handleDragStartPages(e, type, id) {
    dragItemRef.current = { type, id };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', id); // required for Firefox
  }

  function handleDragEndPages() {
    dragItemRef.current = null;
    setDragOverId(null);
    setFolderHoverTarget(null);
    clearFolderTimer();
  }

  function handleDragOverPages(e, targetType, targetId) {
    e.preventDefault();
    e.stopPropagation();
    const item = dragItemRef.current;
    if (!item) return;
    setDragOverId(targetId);
    // Folder hover: doc dragged over a folder for 1.5s → move into folder
    if ((item.type === 'doc' || item.type === 'folder') && targetType === 'folder' && item.id !== targetId) {
      if (folderHoverTarget !== targetId) {
        setFolderHoverTarget(targetId);
        clearFolderTimer();
        folderHoverTimer.current = setTimeout(() => {
          if (item.type === 'doc') {
            setPagesData(p => p.map(d => d.id === item.id ? {...d, folderId: targetId} : d));
          } else {
            // Prevent circular nesting: don't nest a folder into its own descendant
            const isDescendant = (checkId, ancestorId) => {
              let f = foldersData.find(x => x.id === checkId);
              while (f) {
                if (f.parentFolderId === ancestorId) return true;
                f = foldersData.find(x => x.id === f.parentFolderId);
              }
              return false;
            };
            if (!isDescendant(targetId, item.id)) {
              setFoldersData(fs => fs.map(f => f.id === item.id ? {...f, parentFolderId: targetId} : f));
            }
          }
          setExpandedFolders(ex => ({...ex, [targetId]: true}));
          setFolderHoverTarget(null);
          setDragOverId(null);
          dragItemRef.current = null;
        }, 1500);
      }
    } else {
      if (folderHoverTarget) { setFolderHoverTarget(null); clearFolderTimer(); }
    }
  }

  function handleDropPages(e, targetType, targetId) {
    e.preventDefault();
    e.stopPropagation();
    clearFolderTimer();
    const item = dragItemRef.current;
    if (!item || item.id === targetId) { handleDragEndPages(); return; }

    if (item.type === 'doc' && targetType === 'doc') {
      // Reorder docs: move dragged doc to position of target doc (same folderId context)
      const dragDoc = pagesData.find(d => d.id === item.id);
      const targetDoc = pagesData.find(d => d.id === targetId);
      if (dragDoc && targetDoc && dragDoc.folderId === targetDoc.folderId) {
        // Get all docs in this context, sorted by order
        const siblings = pagesData
          .filter(d => (d.folderId || null) === (dragDoc.folderId || null))
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const fromIdx = siblings.findIndex(d => d.id === item.id);
        const toIdx = siblings.findIndex(d => d.id === targetId);
        if (fromIdx !== -1 && toIdx !== -1) {
          const reordered = [...siblings];
          reordered.splice(fromIdx, 1);
          reordered.splice(toIdx, 0, dragDoc);
          // Reassign clean sequential orders
          setPagesData(p => p.map(d => {
            const newIdx = reordered.findIndex(r => r.id === d.id);
            return newIdx !== -1 ? {...d, order: newIdx} : d;
          }));
        }
      }
    } else if (item.type === 'folder' && targetType === 'folder') {
      // Reorder folders
      const sorted = [...foldersData].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      const fromIdx = sorted.findIndex(f => f.id === item.id);
      const toIdx = sorted.findIndex(f => f.id === targetId);
      if (fromIdx !== -1 && toIdx !== -1) {
        const reordered = [...sorted];
        const [moved] = reordered.splice(fromIdx, 1);
        reordered.splice(toIdx, 0, moved);
        setFoldersData(reordered.map((f, i) => ({...f, order: i})));
      }
    } else if (item.type === 'doc' && targetType === 'folder') {
      // Drop doc onto folder header = move into folder
      setPagesData(p => p.map(d => d.id === item.id ? {...d, folderId: targetId} : d));
      setExpandedFolders(ex => ({...ex, [targetId]: true}));
    } else if (item.type === 'folder' && targetType === 'folder') {
      // Drop folder onto another folder = nest it (if not creating a cycle)
      const isDescendant = (checkId, ancestorId) => {
        let f = foldersData.find(x => x.id === checkId);
        while (f) {
          if (f.parentFolderId === ancestorId) return true;
          f = foldersData.find(x => x.id === f.parentFolderId);
        }
        return false;
      };
      if (!isDescendant(targetId, item.id)) {
        setFoldersData(fs => fs.map(f => f.id === item.id ? {...f, parentFolderId: targetId} : f));
        setExpandedFolders(ex => ({...ex, [targetId]: true}));
      }
    }
    handleDragEndPages();
  }

  // ── Computed lists ───────────────────────────────────────
  const recentDocs = [...pagesData]
    .sort((a, b) => new Date(b.lastModified || b.createdAt) - new Date(a.lastModified || a.createdAt))
    .slice(0, 6);

  const sortedFolders = [...foldersData]
    .filter(f => !f.parentFolderId)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const unfolderedDocs = pagesData
    .filter(d => !d.folderId)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  // ── Reusable inline renderers (not components — avoids hook-in-function issues) ──
  function renderDocRow(doc, depth) {
    depth = depth || 0;
    const isAct = selectedId === doc.id;
    const isOver = dragOverId === doc.id;
    const indentPx = depth > 0 ? 10 + depth * 14 : 10;
    // Subtle depth tint: each level adds a touch of warm beige
    // Each depth level gets a distinct pale hue (matches folder row tints below)
    const depthBg = depth === 0 ? 'transparent'
      : depth === 1 ? 'rgba(45,90,61,0.13)'    // pale green
      : depth === 2 ? 'rgba(37,113,163,0.13)'  // pale blue
      : depth === 3 ? 'rgba(180,100,0,0.07)'   // pale amber
      : 'rgba(125,60,152,0.07)';               // pale purple
    return (
      <div key={doc.id}
        className={`pages-list-item ${isAct ? 'active' : ''} ${isOver ? 'drag-over' : ''}`}
        style={{ paddingLeft: indentPx, borderLeft: depth > 0 ? '2px solid var(--border)' : '3px solid transparent', background: isAct ? undefined : depthBg }}
        onClick={() => { setSelectedId(doc.id); setMobileView('editor'); }}
        draggable
        onDragStart={e => handleDragStartPages(e, 'doc', doc.id)}
        onDragEnd={handleDragEndPages}
        onDragOver={e => handleDragOverPages(e, 'doc', doc.id)}
        onDrop={e => handleDropPages(e, 'doc', doc.id)}
      >
        <span style={{fontSize:12, marginRight:5, opacity:0.85, flexShrink:0}}>📄</span>
        <div style={{flex:1, minWidth:0}}>
          <div className="pages-list-item-title">{doc.title || 'Untitled'}</div>
          <div className="pages-list-item-date">{fmtDocDate(doc.lastModified || doc.createdAt)}</div>
          {(doc.tasks||[]).length > 0 && (
            <div className="pages-list-item-taskcount">
              {(doc.tasks||[]).filter(t=>t.done).length}/{(doc.tasks||[]).length} tasks
            </div>
          )}
        </div>
        <button
          className="pages-doc-delete-btn"
          title="Delete document"
          onClick={e => { e.stopPropagation(); deleteDoc(doc.id); }}
        >✕</button>
      </div>
    );
  }

  function renderFolderRow(folder, depth) {
    depth = depth || 0;
    const isExpanded = expandedFolders[folder.id] ?? false;
    const isOver = dragOverId === folder.id;
    const isHoverTarget = folderHoverTarget === folder.id;
    const docsInFolder = pagesData
      .filter(d => d.folderId === folder.id)
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const childFolders = foldersData
      .filter(f => f.parentFolderId === folder.id)
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const isEditingName = editingFolderId === folder.id;
    const isFolderMenuOpen = showNewMenu === folder.id;
    const indentPx = depth * 14;

    return (
      <div key={folder.id}>
        <div
          className={`pages-folder-row ${isOver ? 'drag-over' : ''} ${isHoverTarget ? 'folder-hover-target' : ''} ${swipeDeleteId === folder.id ? 'swipe-reveal' : ''}`}
          style={{
            paddingLeft: 6 + indentPx,
            background: depth === 0 ? 'var(--cream)'
              : depth === 1 ? 'rgba(45,90,61,0.20)'    // pale green
              : depth === 2 ? 'rgba(37,113,163,0.20)'  // pale blue
              : depth === 3 ? 'rgba(180,100,0,0.12)'   // pale amber
              : 'rgba(125,60,152,0.12)',                // pale purple
          }}
          draggable
          onDragStart={e => { e.stopPropagation(); handleDragStartPages(e, 'folder', folder.id); }}
          onDragEnd={handleDragEndPages}
          onDragOver={e => handleDragOverPages(e, 'folder', folder.id)}
          onDrop={e => handleDropPages(e, 'folder', folder.id)}
          onTouchStart={e => {
            swipeTouchStart.current = {x: e.touches[0].clientX, y: e.touches[0].clientY};
            // Long-press to rename (500ms)
            longPressTimer.current = setTimeout(() => {
              setEditingFolderId(folder.id);
              setEditingFolderName(folder.name);
              longPressTimer.current = null;
            }, 500);
          }}
          onTouchMove={e => {
            if (!swipeTouchStart.current) return;
            const dx = e.touches[0].clientX - swipeTouchStart.current.x;
            const dy = Math.abs(e.touches[0].clientY - swipeTouchStart.current.y);
            if (dy > 10) { clearTimeout(longPressTimer.current); return; } // vertical scroll, cancel
            if (dx < -50) { clearTimeout(longPressTimer.current); setSwipeDeleteId(folder.id); }
            else if (dx > 10) { clearTimeout(longPressTimer.current); setSwipeDeleteId(null); }
          }}
          onTouchEnd={() => {
            clearTimeout(longPressTimer.current);
            swipeTouchStart.current = null;
          }}
        >
          <button className="pages-folder-toggle"
            onClick={e => { e.stopPropagation(); setExpandedFolders(ex => ({...ex, [folder.id]: !isExpanded})); }}>
            {isExpanded ? '▾' : '▸'}
          </button>
          <span style={{fontSize:13, marginRight:4, flexShrink:0}}>📁</span>
          {isEditingName ? (
            <input
              className="pages-folder-name-input"
              value={editingFolderName}
              autoFocus
              onChange={e => setEditingFolderName(e.target.value)}
              onBlur={() => { updateFolder(folder.id, {name: editingFolderName || 'Untitled Folder'}); setEditingFolderId(null); }}
              onKeyDown={e => {
                if (e.key === 'Enter') { updateFolder(folder.id, {name: editingFolderName || 'Untitled Folder'}); setEditingFolderId(null); }
                if (e.key === 'Escape') { setEditingFolderId(null); }
              }}
              onClick={e => e.stopPropagation()}
            />
          ) : (
            <span className="pages-folder-name"
              onDoubleClick={e => { e.stopPropagation(); setEditingFolderId(folder.id); setEditingFolderName(folder.name); }}
              title="Double-click to rename">
              {folder.name}
            </span>
          )}
          <span style={{fontSize:10, color:'var(--ink-faint)', marginLeft:4, fontFamily:"'DM Mono',monospace", flexShrink:0}}>({docsInFolder.length + childFolders.length})</span>
          <div style={{marginLeft:'auto', display:'flex', gap:2, flexShrink:0, position:'relative'}}>
            <button className="pages-folder-add-btn" title="New item in folder"
              onClick={e => { e.stopPropagation(); setShowNewMenu(isFolderMenuOpen ? null : folder.id); }}>+</button>
            {isFolderMenuOpen && (
              <>
                <div style={{position:'fixed',inset:0,zIndex:99}} onClick={() => setShowNewMenu(null)} />
                <div style={{
                  position:'absolute', top:'calc(100% + 4px)', right:0, zIndex:100,
                  background:'var(--paper)', border:'1px solid var(--border)', borderRadius:8,
                  boxShadow:'0 4px 16px rgba(0,0,0,0.12)', overflow:'hidden', minWidth:150,
                }}>
                  <button className="task-ctx-btn" onClick={e => { e.stopPropagation(); createDoc(folder.id); }}>📄 New Document</button>
                  <button className="task-ctx-btn" onClick={e => { e.stopPropagation(); createFolder(folder.id); }}>📁 New Folder</button>
                </div>
              </>
            )}
            <button className="pages-folder-del-btn" title="Delete folder"
              onClick={e => { e.stopPropagation(); setSwipeDeleteId(null); deleteFolder(folder.id); }}>🗑</button>
            {swipeDeleteId === folder.id && (
              <button onClick={e => { e.stopPropagation(); setSwipeDeleteId(null); deleteFolder(folder.id); }}
                style={{background:'#dc2626',color:'white',border:'none',borderRadius:6,padding:'2px 10px',
                  fontSize:12,fontFamily:"'DM Sans',sans-serif",cursor:'pointer',fontWeight:600,flexShrink:0}}>
                Delete
              </button>
            )}
          </div>
          {isHoverTarget && (
            <div style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:10,color:'var(--accent)',fontFamily:"'DM Mono',monospace",pointerEvents:'none',background:'var(--accent-light)',padding:'1px 4px',borderRadius:3}}>
              → folder
            </div>
          )}
        </div>
        {isExpanded && childFolders.map(child => renderFolderRow(child, depth + 1))}
        {isExpanded && docsInFolder.map(doc => renderDocRow(doc, depth + 1))}
      </div>
    );
  }

  // ── New menu dropdown (shared) ───────────────────────────
  function renderNewMenu() {
    if (showNewMenu !== 'top') return null;
    return (
      <>
        <div style={{position:'fixed',inset:0,zIndex:99}} onClick={() => setShowNewMenu(null)} />
        <div style={{
          position:'absolute', top:'calc(100% + 4px)', right:0, zIndex:100,
          background:'var(--paper)', border:'1px solid var(--border)', borderRadius:8,
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)', overflow:'hidden', minWidth:150,
        }}>
          <button className="task-ctx-btn" onClick={() => createDoc(null)}>📄 New Document</button>
          <button className="task-ctx-btn" onClick={() => createFolder(null)}>📁 New Folder</button>
        </div>
      </>
    );
  }

  // ── Sidebar content ──────────────────────────────────────
  const sidebarInner = (
    <div className="pages-sidebar">
      <div className="pages-sidebar-header">
        <span className="pages-sidebar-title">Pages</span>
        <div style={{position:'relative'}}>
          <button className="add-btn" onClick={() => setShowNewMenu(s => s === 'top' ? null : 'top')} title="New…">+</button>
          {renderNewMenu()}
        </div>
      </div>

      <div className="pages-sidebar-scroll">
      {recentDocs.length > 0 && (
        <div>
          <div className="pages-section-label" style={{cursor:'pointer',userSelect:'none',display:'flex',alignItems:'center',justifyContent:'space-between'}} onClick={()=>setRecentCollapsed(c=>!c)}>
            <span>Recent</span>
            <span style={{fontSize:9,opacity:0.5,transition:'transform 0.15s',transform:recentCollapsed?'rotate(-90deg)':'rotate(0deg)'}}>▼</span>
          </div>
          {!recentCollapsed && recentDocs.map(doc => (
            <div key={doc.id}
              className={`pages-list-item ${selectedId===doc.id?'active':''}`}
              style={{paddingLeft:10}}
              onClick={() => { setSelectedId(doc.id); setMobileView('editor'); }}
            >
              <span style={{fontSize:12, marginRight:5, opacity:0.85, flexShrink:0}}>📄</span>
              <div style={{flex:1, minWidth:0}}>
                <div className="pages-list-item-title">{doc.title || 'Untitled'}</div>
                <div className="pages-list-item-date">{fmtDocDate(doc.lastModified || doc.createdAt)}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="pages-section-label" style={{marginTop: recentDocs.length > 0 ? 4 : 0}}>All Pages</div>
      <div className="pages-list">
        {pagesData.length === 0 && foldersData.length === 0 && (
          <div style={{padding:'16px',fontSize:12,color:'var(--ink-faint)',fontFamily:"'DM Sans',sans-serif"}}>
            No pages yet — tap + to create one
          </div>
        )}
        {sortedFolders.map(folder => renderFolderRow(folder))}
        {unfolderedDocs.map(doc => renderDocRow(doc, false))}
      </div>
      </div>
    </div>
  );

  return (
    <div className="main-content" style={{overflow:'hidden'}}>

      <div className={`pages-sidebar-wrap ${sidebarCollapsed?'collapsed':''}`}>
        {sidebarInner}
        <div className="pages-toggle-strip" onClick={()=>setSidebarCollapsed(c=>!c)}>
          <div className="pages-toggle-btn">{sidebarCollapsed?'›':'‹'}</div>
        </div>
      </div>

      <div className="pages-main">

        {mobileView === 'list' && (
          <div className="pages-mobile-list">
            <div className="pages-sidebar-header" style={{padding:'14px 16px 10px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span className="pages-sidebar-title">Pages</span>
              <div style={{position:'relative'}}>
                <button className="add-btn" onClick={() => setShowNewMenu(s => s === 'top' ? null : 'top')} title="New…">+</button>
                {renderNewMenu()}
              </div>
            </div>
            <div className="pages-list" style={{flex:1,overflowY:'auto'}} onClick={e => { if(swipeDeleteId && !e.target.closest('.pages-folder-row')) setSwipeDeleteId(null); }}>
              {pagesData.length === 0 && foldersData.length === 0 && (
                <div style={{padding:'24px 16px',fontSize:13,color:'var(--ink-faint)',fontFamily:"'DM Sans',sans-serif",textAlign:'center'}}>
                  No pages yet — tap + to create one
                </div>
              )}
              {recentDocs.length > 0 && <div className="pages-section-label">Recent</div>}
              {recentDocs.map(doc => (
                <div key={doc.id}
                  className={`pages-list-item ${selectedId===doc.id?'active':''}`}
                  style={{paddingLeft:10}}
                  onClick={() => { setSelectedId(doc.id); setMobileView('editor'); }}
                >
                  <span style={{fontSize:12, marginRight:5, opacity:0.85, flexShrink:0}}>📄</span>
                  <div style={{flex:1, minWidth:0}}>
                    <div className="pages-list-item-title">{doc.title || 'Untitled'}</div>
                    <div className="pages-list-item-date">{fmtDocDate(doc.lastModified || doc.createdAt)}</div>
                  </div>
                </div>
              ))}
              {(pagesData.length > 0 || foldersData.length > 0) && <div className="pages-section-label">All Pages</div>}
              {sortedFolders.map(folder => renderFolderRow(folder, 0))}
              {unfolderedDocs.map(doc => renderDocRow(doc, false))}
            </div>
          </div>
        )}

        {(!selectedDoc && mobileView !== 'list') && (
          <div className="pages-empty">
            <div className="pages-empty-icon">📝</div>
            <div className="pages-empty-text">Select a page or create a new one</div>
            <button className="add-btn" style={{width:32,height:32,fontSize:18}} onClick={() => createDoc(null)}>+</button>
          </div>
        )}

        {selectedDoc && (
          <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
            <div className="pages-mobile-back">
              <button onClick={()=>{setSelectedId(null);setMobileView('list');}} style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',padding:'10px 16px 0',fontFamily:"'DM Sans',sans-serif",fontSize:13,display:'flex',alignItems:'center',gap:4}}>
                ‹ All Pages
              </button>
            </div>

            {/* Title + toolbar — fixed sibling, never scrolls */}
            <div className="pages-doc-header">
              <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:4}}>
                <input ref={titleRef} className="pages-title-input"
                  placeholder="Untitled"
                  value={selectedDoc.title}
                  onChange={e=>updateDoc(selectedDoc.id, {title: e.target.value})}
                />
                <button onClick={()=>deleteDoc(selectedDoc.id)}
                  style={{background:'none',border:'none',color:'var(--ink-faint)',cursor:'pointer',fontSize:16,padding:'4px',flexShrink:0,marginTop:6}}
                  title="Delete document">🗑</button>
              </div>
              <div className="pages-doc-meta">
                Created {fmtDocDate(selectedDoc.createdAt)}
                {selectedDoc.folderId && (() => {
                  // Build full path e.g. "Parent > Child"
                  const path = [];
                  let fid = selectedDoc.folderId;
                  while (fid) {
                    const f = foldersData.find(x => x.id === fid);
                    if (!f) break;
                    path.unshift(f.name);
                    fid = f.parentFolderId;
                  }
                  return path.length > 0 ? <span style={{marginLeft:8,opacity:0.6}}>· 📁 {path.join(' › ')}</span> : null;
                })()}
              </div>
              {/* Toolbar — sticky in header so it's always visible */}
              <div style={{padding:'8px 0 0'}}>
                <div className="pages-toolbar">
                  <button className="pages-toolbar-btn" onMouseDown={e=>{e.preventDefault();qDo(q=>q.history.undo());}} title="Undo">↶</button>
                  <button className="pages-toolbar-btn" onMouseDown={e=>{e.preventDefault();qDo(q=>q.history.redo());}} title="Redo">↷</button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.bold?' active':'')} onMouseDown={e=>{e.preventDefault();qToggle('bold');}} title="Bold"><b>B</b></button>
                  <button className={'pages-toolbar-btn'+(qFmt.italic?' active':'')} onMouseDown={e=>{e.preventDefault();qToggle('italic');}} title="Italic"><i>I</i></button>
                  <button className={'pages-toolbar-btn'+(qFmt.underline?' active':'')} onMouseDown={e=>{e.preventDefault();qToggle('underline');}} title="Underline"><u>U</u></button>
                  <button className={'pages-toolbar-btn'+(qFmt.strike?' active':'')} onMouseDown={e=>{e.preventDefault();qToggle('strike');}} title="Strikethrough"><s>S</s></button>
                  <button className={'pages-toolbar-btn'+(qFmt.code?' active':'')} onMouseDown={e=>{e.preventDefault();qToggle('code');}} title="Inline code"><span style={{fontFamily:"'DM Mono',monospace",fontSize:12}}>&lt;/&gt;</span></button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.font?' active':'')} onMouseDown={e=>{e.preventDefault();qOpenPop('font',e);}} title="Font">Font ▾</button>
                  <button className={'pages-toolbar-btn'+(qFmt.size?' active':'')} onMouseDown={e=>{e.preventDefault();qOpenPop('size',e);}} title="Font size">Size ▾</button>
                  <button className={'pages-toolbar-btn'+(qFmt.color?' active':'')} onMouseDown={e=>{e.preventDefault();qOpenPop('color',e);}} title="Text colour"><span style={{fontWeight:700,lineHeight:1,borderBottom:'3px solid '+(qFmt.color||'var(--ink-light)')}}>A</span></button>
                  <button className={'pages-toolbar-btn'+(qFmt.background?' active':'')} onMouseDown={e=>{e.preventDefault();qOpenPop('bg',e);}} title="Highlight"><span style={{fontWeight:600,padding:'0 4px',borderRadius:3,background:qFmt.background||'rgba(250, 204, 21, 0.4)'}}>ab</span></button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.header===1?' active':'')} onMouseDown={e=>{e.preventDefault();qHeader(1);}} title="Heading 1">H1</button>
                  <button className={'pages-toolbar-btn'+(qFmt.header===2?' active':'')} onMouseDown={e=>{e.preventDefault();qHeader(2);}} title="Heading 2">H2</button>
                  <button className={'pages-toolbar-btn'+(qFmt.header===3?' active':'')} onMouseDown={e=>{e.preventDefault();qHeader(3);}} title="Heading 3">H3</button>
                  <button className="pages-toolbar-btn" onMouseDown={e=>{e.preventDefault();qNormal();}} title="Normal text">¶</button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.list==='bullet'?' active':'')} onMouseDown={e=>{e.preventDefault();qList('bullet');}} title="Bullet list">• —</button>
                  <button className={'pages-toolbar-btn'+(qFmt.list==='ordered'?' active':'')} onMouseDown={e=>{e.preventDefault();qList('ordered');}} title="Numbered list">1.</button>
                  <button className={'pages-toolbar-btn'+((qFmt.list==='checked'||qFmt.list==='unchecked')?' active':'')} onMouseDown={e=>{e.preventDefault();qList('check');}} title="Checklist">☑</button>
                  <button className={'pages-toolbar-btn'+(qFmt.blockquote?' active':'')} onMouseDown={e=>{e.preventDefault();qQuote();}} title="Quote">"</button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.align?' active':'')} onMouseDown={e=>{e.preventDefault();qOpenPop('align',e);}} title="Alignment">≡ ▾</button>
                  <div className="pages-toolbar-sep"/>
                  <button className={'pages-toolbar-btn'+(qFmt.link?' active':'')} onMouseDown={e=>{e.preventDefault();qLink();}} title="Link">🔗</button>
                  <button className="pages-toolbar-btn" onMouseDown={e=>{e.preventDefault();qClear();}} title="Clear formatting">✕</button>
                </div>
                {qPop && ReactDOM.createPortal(
                  <div className="pages-pop" onMouseDown={e=>e.preventDefault()}
                    style={{position:'fixed', zIndex:9000, left:Math.max(8, Math.min(qPop.x, window.innerWidth-270)), top:Math.min(qPop.y, window.innerHeight-120)}}>
                    {qPop.kind === 'color' && (<>
                      {PAGES_TEXT_COLORS.map(g => (
                        <div key={g.title}>
                          <div className="pages-pop-title">{g.title}</div>
                          <div className="pages-pop-grid">
                            {g.colors.map(c => <button key={c} className={'pages-swatch'+(qFmt.color && qFmt.color.toLowerCase()===c?' on':'')} style={{background:c}} onMouseDown={e=>{e.preventDefault();qSet('color',c);}} title={c}/>)}
                          </div>
                        </div>
                      ))}
                      <button className="pages-pop-clear" onMouseDown={e=>{e.preventDefault();qSet('color',false);}}>Default colour</button>
                    </>)}
                    {qPop.kind === 'bg' && (<>
                      <div className="pages-pop-title">Highlight</div>
                      <div className="pages-pop-grid">
                        {PAGES_HIGHLIGHTS.map(c => <button key={c} className={'pages-swatch'+(qFmt.background===c?' on':'')} style={{background:c}} onMouseDown={e=>{e.preventDefault();qSet('background',c);}}>Ab</button>)}
                      </div>
                      <button className="pages-pop-clear" onMouseDown={e=>{e.preventDefault();qSet('background',false);}}>No highlight</button>
                    </>)}
                    {qPop.kind === 'font' && PAGES_FONTS.map(f => (
                      <button key={f.label} className={'pages-pop-item'+(qNoQuote(qFmt.font)===f.value?' on':'')} style={{fontFamily:f.css}} onMouseDown={e=>{e.preventDefault();qSet('font',f.value);}}>{f.label}</button>
                    ))}
                    {qPop.kind === 'size' && PAGES_SIZES.map(z => (
                      <button key={z.label} className={'pages-pop-item'+((qFmt.size||'')===z.value?' on':'')} style={{fontSize:z.value||'14px'}} onMouseDown={e=>{e.preventDefault();qSet('size',z.value);}}>{z.label}</button>
                    ))}
                    {qPop.kind === 'align' && PAGES_ALIGNS.map(a => (
                      <button key={a.label} className={'pages-pop-item'+((qFmt.align||'')===a.value?' on':'')} style={{textAlign:a.value||'left'}} onMouseDown={e=>{e.preventDefault();qSet('align',a.value);}}>{a.label}</button>
                    ))}
                  </div>, document.body)}
              </div>
            </div>
            {/* Scrollable area — flex:1, bounded by pages-main overflow:hidden */}
            <div className="pages-scroll-area">
            <div className="pages-editor">


              <div onTouchStart={onEditorTouchStart} onTouchEnd={onEditorTouchEnd}>
                <PagesQuill key={selectedDoc.id} docId={selectedDoc.id} html={selectedDoc.body} apiRef={quillApi}
                  onInput={onBodyInput} onFmt={setQFmt} onText={t=>setWordCount(countWords(t))} onGone={flushDocBody} />
              </div>
              <div style={{textAlign:'right',fontFamily:"'DM Mono',monospace",fontSize:10,color:'var(--ink-faint)',padding:'4px 2px',marginTop:2}}>
                {wordCount} {wordCount===1?'word':'words'}
              </div>
            </div>

            {/* Project tasks were retired in v5.2.0 (Goals replaced them). Old tasks stay visible and
                editable until deleted; there is no way to add new ones. The section disappears when empty. */}
            {(selectedDoc.tasks||[]).length > 0 && (
            <div className="pages-tasks-section">
              <div className="pages-tasks-header">
                <span className="pages-tasks-title">Tasks</span>
                <span style={{fontSize:11,color:'var(--ink-faint)',fontFamily:"'DM Sans',sans-serif"}}>Older project tasks — new ones now live in Goals</span>
              </div>
              {(selectedDoc.tasks||[]).map(task => (
                <div key={task.id} className="pages-task-item"
                  style={task.priority ? {background:'var(--prio-bg)', borderColor:'#fca5a5'} : {}}>
                  <div className={`pages-task-check ${task.done?'done':''}`}
                    onClick={()=>updateTask(selectedDoc.id, task.id, {done:!task.done})} />
                  <div className="pages-task-body">
                    <div style={{display:'flex',alignItems:'center',gap:4}}>
                      <input className={`pages-task-title-input ${task.done?'done':''}`}
                        placeholder="Task…" value={task.title}
                        onChange={e=>updateTask(selectedDoc.id, task.id, {title:e.target.value})}
                        style={{flex:1}} />
                      <button
                        onClick={e=>{e.stopPropagation();updateTask(selectedDoc.id,task.id,{priority:!task.priority});}}
                        title={task.priority?'Remove priority':'Mark as priority'}
                        style={{background:'none',border:'none',cursor:'pointer',fontSize:14,
                          color:task.priority?'#dc2626':'var(--ink-faint)',padding:'0 2px',flexShrink:0}}>
                        {task.priority?'★':'☆'}
                      </button>
                    </div>
                    <textarea className="pages-task-details-input"
                      placeholder="Details (optional)…" value={task.details||''} rows={1}
                      onChange={e=>updateTask(selectedDoc.id, task.id, {details:e.target.value})}
                      style={{resize:'vertical'}} />
                    <div className="pages-task-date-row">
                      <span style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace"}}>📅</span>
                      <input type="date" className="pages-task-date-input"
                        value={task.scheduledDate||''}
                        onChange={e=>updateTask(selectedDoc.id, task.id, {scheduledDate:e.target.value, projectDocId:selectedDoc.id})} />
                      {task.scheduledDate && (
                        <button onClick={()=>updateTask(selectedDoc.id, task.id, {scheduledDate:''})}
                          style={{background:'none',border:'none',color:'var(--ink-faint)',cursor:'pointer',fontSize:11,padding:'0 2px'}}>✕</button>
                      )}
                    </div>
                  </div>
                  <button className="pages-task-delete"
                    onClick={()=>deleteTask(selectedDoc.id, task.id)}>✕</button>
                </div>
              ))}
            </div>
            )}
            </div>{/* end pages-scroll-area */}
          </div>
        )}

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>

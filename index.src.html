          <span style={{fontSize:12,fontFamily:"'DM Sans',sans-serif",fontWeight:700,color:'var(--ink)'}}>{exName(goal.exerciseId)}</span>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--ink-light)',fontWeight:600}}>{actual.toLocaleString()} / {goal.target.toLocaleString()} {goal.unit}</span>
            <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,
              padding:'1px 5px',borderRadius:3,
              background:ahead?'var(--accent-light)':'rgba(220,74,58,0.1)',
              color:ahead?'var(--accent)':'var(--red)'}}>
              {ahead?'▲':'▼'}{Math.abs(Math.round(aheadBehind))}
            </span>
            {done&&<span>🎉</span>}
          </div>
        </div>
        <div className="fitness-goal-bar-bg" style={{position:'relative',height:7,borderRadius:4}}>
          <div style={{position:'absolute',top:0,left:0,height:'100%',width:`${periodPct}%`,background:'rgba(0,0,0,0.07)',borderRadius:4,zIndex:0}}/>
          <div className={`fitness-goal-bar-fill ${done?'done':''}`} style={{width:`${Math.min(100,pct)}%`,height:'100%',borderRadius:4,position:'relative',zIndex:1}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:4,gap:8}}>
          <span style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)'}}>
            Should be: <b style={{color:ahead?'var(--accent)':'var(--red)'}}>{goal.unit==='sessions'?Math.round(targetPace):targetPace.toLocaleString()}</b>
          </span>
          <span style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)'}}>
            On pace for: <b style={{color:'var(--ink)'}}>{goal.unit==='sessions'?Math.round(expectedAtPace):expectedAtPace.toLocaleString()}</b> / {goal.target.toLocaleString()}
          </span>
        </div>
      </div>
    );
  }

  // ── Exercise block renderer ──────────────────────────────────────────────

                e.stopPropagation();

              }}

                if(e.pointerType!=='touch'||!touchDragActiveRef.current) return;
                e.preventDefault();
                const el=document.elementFromPoint(e.clientX,e.clientY);
                const tile=el&&el.closest('[data-ex-id]');
                setDragOverExId(tile?tile.getAttribute('data-ex-id'):null);
              }}
              onPointerUp={e=>{
                if(e.pointerType!=='touch'||!touchDragActiveRef.current) return;
                e.preventDefault();
                touchDragActiveRef.current=false;
                if(dragEx?.exId && dragOverExId && dragOverExId!==dragEx.exId){
                  reorderExercises(dk, dragEx.exId, dragOverExId);

                WebkitTouchCallout:'none',touchAction:'none'}}

            <span title={isCollapsed?'Expand':'Collapse'}

            </span>

          {stats.done>0&&<span className="fitness-stat-pill">{stats.done}/{stats.total} sets{stats.totalReps>0&&` · ${stats.totalReps} reps`}{stats.hasWeight&&stats.volume>0&&` · ${stats.volume.toLocaleString()} lbs`}</span>}

          <button onClick={e=>{e.stopPropagation();deleteExercise(dk,ex.id);}}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--ink-faint)',padding:'0 2px',lineHeight:1,opacity:0.5}}>✕</button>
        </div>
        {!isCollapsed && <div className="exercise-block">
          {prs.length>0&&<div className="pr-notes">{prs.map(p=><div key={p.kind} className="pr-note">🏆 <b>{p.label}</b> · {p.text}</div>)}</div>}
          <div style={{display:'flex',alignItems:'center',gap:6,padding:'2px 0 4px',borderBottom:'1px solid var(--border)',marginBottom:2}}>

              <span className="set-label" style={{width:44,textAlign:'center'}}>Sec</span>
              <span className="set-label" style={{width:56,textAlign:'center'}}>min/mi</span></>)
            :(<><span className="set-label" style={{width:52,textAlign:'center'}}>Reps</span>
              <span className="set-label" style={{visibility:'hidden'}}>×</span>
              <span className="set-label" style={{width:52,textAlign:'center'}}>Weight</span>
              <span className="set-label" style={{visibility:'hidden'}}>lbs</span></>)}

                  <input type="number" min="0" step="0.01" className="set-input" placeholder="—" value={set.dist||''}

                    onChange={e=>updateSet(dk,ex.id,set.id,{dist:e.target.value})} onKeyDown={handleEnter} style={{width:60,opacity:set.done?0.6:1}}/>

                        value={tSecs}
                        onChange={e=>{const m=tMins||'0'; updateSet(dk,ex.id,set.id,{time:m+':'+e.target.value});}}
                        onKeyDown={handleEnter}
                        style={{width:44,textAlign:'center',opacity:set.done?0.6:1}}/>
                    </>);
                  })()}
                  <span className="set-label" style={{width:56,textAlign:'center',fontWeight:pace?700:400,color:pace?'var(--gold)':'var(--ink-faint)',fontSize:pace?11:9}}>{pace||'—'}</span>
                </>):(<>
                  <input type="number" min="0" className="set-input" placeholder="—" value={set.reps||''}
                    ref={el=>setFirstInputRefs.current[focusKey]=el}
                    onChange={e=>updateSet(dk,ex.id,set.id,{reps:e.target.value})} onKeyDown={handleEnter} style={{opacity:set.done?0.6:1}}/>
                  <span className="set-label">×</span>
                  <input type="number" min="0" className="set-input" placeholder="—" value={set.weight||''}
                    onChange={e=>updateSet(dk,ex.id,set.id,{weight:e.target.value})} onKeyDown={handleEnter} style={{opacity:set.done?0.6:1}}/>
                  <span className="set-label">lbs</span>
                </>)}
                <div className={`set-check ${set.done?'done':''}`} onClick={()=>updateSet(dk,ex.id,set.id,{done:!set.done})}/>
                <button className="set-del-btn" aria-label="Delete set" onClick={()=>deleteSet(dk,ex.id,set.id)}>✕</button>

          <div style={{paddingTop:6}}>

              style={{background:'none',border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',fontSize:10,color:'var(--ink-light)',padding:'2px 8px',fontFamily:"'DM Sans',sans-serif"}}>
              + Set
            </button>
          </div>
        </div>}
      </div>
      </div>
    );
  }

  return (
    <div className="fitness-layout">
      {/* SIDEBAR */}
      <div className="fitness-sidebar">
        <div className="fitness-day-nav" style={{marginBottom:12}}>

            if(fitView==='day') setSelectedDate(d=>addDays(d,-1));
            else if(fitView==='week') setSelectedDate(d=>addDays(d,-7));
            else if(fitView==='month') setSelectedDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1));

          <div style={{textAlign:'center'}}>
            <div className="fitness-day-label" style={{fontSize:12}}>
              {fitView==='day'?`${DAYS[selectedDate.getDay()].slice(0,3)}, ${MONTHS[selectedDate.getMonth()].slice(0,3)} ${selectedDate.getDate()}`
               :fitView==='week'?`${MONTHS[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()} – ${MONTHS[addDays(weekStart,6).getMonth()].slice(0,3)} ${addDays(weekStart,6).getDate()}`

          const PERIOD_ORDER={week:0,month:1,year:2};

                          <div style={{display:'flex',alignItems:'center',gap:4}}>

                          <div className={`fitness-goal-bar-fill ${done?'done':''}`} style={{width:`${Math.min(100,pct)}%`,position:'relative',zIndex:1}}/>
                        </div>
                        <div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',lineHeight:1.6}}>
                          <div>{actual.toLocaleString()} / {goal.target.toLocaleString()} {goal.unit} · {periodPct}% thru {goal.period}{done&&' 🎉'}</div>
                          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                            <span style={{color:'var(--ink-light)'}}>should be: <b style={{color:ahead?'var(--accent)':'var(--red)'}}>{targetPace.toLocaleString()}</b></span>
                            <span>on pace for: <b style={{color:'var(--ink)'}}>{expectedAtPace.toLocaleString()}</b></span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          );
        })()}

        <div style={{borderTop:'1px solid var(--border)',marginTop:8,paddingTop:8}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Exercise Library</span>

            <div key={cat}>

                <div key={ex.id} className="ex-lib-item">

                </div>

            <button key={v} className={`fitness-view-tab ${fitView===v?'active':''}`}

          ))}

        <div style={{display:fitView==='charts'?'none':'flex',alignItems:'center',gap:8}}>
          <button className="nav-arrow" style={{flexShrink:0}} onClick={()=>{
            if(fitView==='day') setSelectedDate(d=>addDays(d,-1));
            else if(fitView==='week') setSelectedDate(d=>addDays(d,-7));
            else if(fitView==='month') setSelectedDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1));

          <div className="fitness-day-label" style={{flex:1,fontSize:14}}>

            else if(fitView==='week') setSelectedDate(d=>addDays(d,7));
            else if(fitView==='month') setSelectedDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1));

        {fitView==='day'&&(()=>{

        {fitView==='week'&&(<>
          <div className="fitness-week-grid">

                  <div className="fitness-week-col-body">
                    {dayExs.map(ex=>{

            const wGoals=getGoalsForPeriod('week',pStart,pEnd);

            const isCurrentWeek=fmt(getWeekStart(today))===fmt(getWeekStart(selectedDate));

                  <div key={dk} className={`fitness-month-cell ${isToday?'today':''} ${dragOverDk===dk?'drag-over':''}`}

                    onDragOver={e=>{e.preventDefault();setDragOverDk(dk);}}
                    onDragLeave={()=>setDragOverDk(null)}

          </div>
          {(()=>{
            const pStart=periodStart('month',selectedDate),pEnd=periodEnd('month',selectedDate);
            const mGoals=getGoalsForPeriod('month',pStart,pEnd);
            if(!mGoals.length) return null;
            const isCurrentMonth=viewYear===today.getFullYear()&&viewMonth===today.getMonth();
            const monthElapsedPct=isCurrentMonth?Math.round(Math.min(today.getDate(),daysInMonth)/daysInMonth*100):
              selectedDate<today?100:0;
            return (
              <div style={{background:'var(--paper)',borderRadius:'var(--radius-md)',border:'1px solid var(--border)',padding:'12px 16px',marginTop:12}}>

                  <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.06em'}}>

          const pStart=periodStart('year',selectedDate),pEnd=periodEnd('year',selectedDate);

          const totalDaysInYear=365+(viewYear%4===0?1:0);
          const isCurrentYear=viewYear===today.getFullYear();
          const isFutureYear=viewYear>today.getFullYear();
          const dayOfYear=isCurrentYear?Math.floor((today-new Date(viewYear,0,1))/86400000)+1:

              {yGoals.map(goal=>{
                const {actual,periodPct,targetPace,expectedAtPace,aheadBehind}=goalProgressFull(goal,selectedDate);

                // Build monthly breakdown
                const monthlyData=Array.from({length:12},(_,mi)=>{
                  const mStart=fmt(new Date(viewYear,mi,1)),mEnd=fmt(new Date(viewYear,mi+1,0));

                    exList.forEach(ex=>{
                      if(ex.exerciseId!==goal.exerciseId) return;
                      ex.sets.filter(s=>s.done).forEach(s=>{
                        if(goal.unit==='sets') mTotal+=1;
                        else if(goal.unit==='reps') mTotal+=parseFloat(s.reps)||0;
                        else mTotal+=(parseFloat(s.reps)||0)*(parseFloat(s.weight)||0);
                      });
                    });
                  });
                  return Math.round(mTotal);
                });
                const maxMonth=Math.max(...monthlyData,1);
                const monthlyTarget=Math.round(goal.target/12);
                return (
                  <div key={goal.id} style={{background:'var(--paper)',borderRadius:'var(--radius-lg)',border:'1px solid var(--border)',padding:'16px',boxShadow:'0 1px 4px var(--shadow)'}}>

                        <div style={{fontSize:11,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',marginTop:2}}>
                          Goal: {goal.target.toLocaleString()} {goal.unit} in {viewYear}
                        </div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:700,color:done?'var(--gold)':ahead?'var(--accent)':'var(--red)'}}>
                          {Math.round(pct)}%
                        </div>
                        <div style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)'}}>
                          {actual.toLocaleString()} / {goal.target.toLocaleString()} {goal.unit}
                        </div>
                      </div>
                    </div>
                    {/* Overall progress bar */}
                    <div className="fitness-goal-bar-bg" style={{position:'relative',height:10,borderRadius:5,marginBottom:4}}>
                      <div style={{position:'absolute',top:0,left:0,height:'100%',width:`${periodPct}%`,background:'rgba(0,0,0,0.08)',borderRadius:5,zIndex:0}}/>
                      <div className={`fitness-goal-bar-fill ${done?'done':''}`} style={{width:`${Math.min(100,pct)}%`,height:'100%',borderRadius:5,position:'relative',zIndex:1}}/>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:16,fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)'}}>
                      <span>Should be at: <b style={{color:ahead?'var(--accent)':'var(--red)'}}>{targetPace.toLocaleString()}</b></span>
                      <span>On pace for: <b style={{color:'var(--ink)'}}>{expectedAtPace.toLocaleString()}</b></span>
                    </div>
                    {/* Monthly bar chart */}
                    <div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Monthly breakdown</div>
                    <div style={{display:'flex',gap:3,alignItems:'flex-end',height:60}}>
                      {monthlyData.map((val,mi)=>{
                        const barH=Math.max(2,Math.round((val/maxMonth)*56));
                        const isFuture=new Date(viewYear,mi+1,0)>today;
                        const isCurrentMonth=mi===today.getMonth()&&viewYear===today.getFullYear();
                        return (
                          <div key={mi} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                            <div style={{fontSize:8,fontFamily:"'DM Mono',monospace",color:val>monthlyTarget?'var(--accent)':'var(--ink-faint)',fontWeight:val>0?700:400,lineHeight:1}}>
                              {val>0?val:''}
                            </div>
                            <div style={{width:'100%',height:barH,
                              background:isFuture?'var(--cream)':isCurrentMonth?'var(--accent)':val>=monthlyTarget?'var(--teal)':'var(--blue)',
                              borderRadius:'2px 2px 0 0',position:'relative'}}>
                              {/* Target line */}
                              {monthlyTarget>0&&(
                                <div style={{position:'absolute',bottom:`${Math.round((monthlyTarget/maxMonth)*56)-barH}px`,left:0,right:0,height:1,background:'rgba(203,146,56,0.6)',}}/>
                              )}
                            </div>
                            <div style={{fontSize:7,fontFamily:"'DM Mono',monospace",color:isCurrentMonth?'var(--accent)':'var(--ink-faint)',fontWeight:isCurrentMonth?700:400}}>
                              {MONTHS[mi].slice(0,1)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{fontSize:8,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',marginTop:4,display:'flex',alignItems:'center',gap:6}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:2}}><span style={{width:8,height:8,background:'var(--teal)',borderRadius:1,display:'inline-block'}}/>≥monthly target</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:2}}><span style={{width:8,height:8,background:'var(--blue)',borderRadius:1,display:'inline-block'}}/>below target</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:2}}><span style={{width:8,height:1,background:'rgba(203,146,56,0.6)',display:'inline-block'}}/>monthly target</span>
                    </div>
                    {goal.endDate&&<div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',marginTop:8}}>Ends: {goal.endDate}</div>}
                  </div>
                );
              })}
            </div>
          );
        })()}
      </div>

      {showExPicker&&<ExercisePicker exercises={fitnessExercises}
        onAdd={exerciseId=>{addExerciseToDay(showExPicker.dk,exerciseId);setShowExPicker(null);}}
        onAddNew={(name,category)=>{const id=addExercise(name,category);if(id)setTimeout(()=>{addExerciseToDay(showExPicker.dk,id);setShowExPicker(null);},50);}}
        onClose={()=>setShowExPicker(null)}/>}
      {showLibManager&&<ExerciseLibraryManager exercises={fitnessExercises} onAdd={addExercise} onUpdate={updateExercise} onDelete={deleteExercise_lib} onClose={()=>setShowLibManager(false)}/>}
      {showGoalManager&&<GoalManager goals={fitnessGoals} exercises={fitnessExercises}
        onAddVersion={addGoalVersion} onEdit={editGoalInPlace} onEnd={endGoal} onDelete={deleteGoalVersion}
        periodStart={periodStart} periodEnd={periodEnd} prevPeriodEnd={prevPeriodEnd}
        onClose={()=>setShowGoalManager(false)}/>}
    </div>
  );
}



// ─────────────────────────────────────────────
// GOAL MANAGER — add/remove fitness goals
// ─────────────────────────────────────────────
function GoalManager({ goals, exercises, onAddVersion, onEdit, onEnd, onDelete, periodStart, periodEnd, prevPeriodEnd, onClose }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [exId, setExId] = useState(exercises[0]?.id||'');
  const [period, setPeriod] = useState('week');
  const [target, setTarget] = useState('');
  const [unit, setUnit] = useState('reps');
  const [editingId, setEditingId] = useState(null);
  const [editTarget, setEditTarget] = useState('');
  const [editUnit, setEditUnit] = useState('reps');
  const [editEndDate, setEditEndDate] = useState('');
  const [confirmEdit, setConfirmEdit] = useState(null); // id awaiting retroactive edit confirm
  const [confirmDelete, setConfirmDelete] = useState(null);

  // Group by exercise+period, show only current/recent versions
  const families = [];
  const seen = new Set();
  goals.forEach(g => {
    const key = g.exerciseId+'|'+g.period;
    if (!seen.has(key)) { seen.add(key); families.push(key); }
  });

  function startEdit(g) {
    setEditingId(g.id);
    setEditTarget(String(g.target));
    setEditUnit(g.unit);
    setEditEndDate(g.endDate||'');
  }

  function saveEdit(g) {
    const newTarget = parseFloat(editTarget);
    if (!newTarget) return;
    const targetChanged = newTarget !== g.target || editUnit !== g.unit;
    if (targetChanged) {
      setConfirmEdit(g.id); // show confirmation before applying
    } else {
      onEdit(g.id, {endDate: editEndDate||null, unit:editUnit});
      setEditingId(null);
    }
  }

  function confirmEditApply(id) {
    onEdit(id, {target:parseFloat(editTarget), unit:editUnit, endDate:editEndDate||null});
    setEditingId(null);
    setConfirmEdit(null);
  }

  return (
    <div className="fitness-picker-overlay" onClick={onClose}>
      <div className="fitness-picker-modal" style={{width:380,maxHeight:560}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'14px 16px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,color:'var(--ink)'}}>Fitness Goals</span>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--ink-faint)',lineHeight:1}}>✕</button>
        </div>

        {/* Confirm retroactive edit warning */}
        {confirmEdit && (
          <div style={{margin:'8px 12px',padding:'10px 12px',background:'#fef3cd',border:'1px solid #f6c23e',borderRadius:'var(--radius-sm)'}}>
            <div style={{fontSize:12,fontFamily:"'DM Sans',sans-serif",fontWeight:600,color:'#856404',marginBottom:6}}>
              ⚠️ Retroactive edit
            </div>
            <div style={{fontSize:11,fontFamily:"'DM Sans',sans-serif",color:'#856404',marginBottom:8}}>
              Changing the target will retroactively affect how all past weeks/months are measured. Use "New Version" instead to only change future periods.
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>confirmEditApply(confirmEdit)}
                style={{background:'#856404',color:'white',border:'none',borderRadius:4,padding:'4px 12px',cursor:'pointer',fontSize:11,fontWeight:600}}>
                Edit retroactively
              </button>
              <button onClick={()=>setConfirmEdit(null)}
                style={{background:'none',border:'1px solid #856404',color:'#856404',borderRadius:4,padding:'4px 12px',cursor:'pointer',fontSize:11}}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {/* Existing goal versions */}
        <div style={{flex:1,overflowY:'auto',padding:'8px 12px'}}>
          {goals.length===0&&<div style={{fontSize:12,color:'var(--ink-faint)',fontStyle:'italic',padding:'4px'}}>No goals yet</div>}
          {families.map(key => {
            const [eId, per] = key.split('|');
            const exLabel = exercises.find(e=>e.id===eId)?.name||'Unknown';
            const versions = goals.filter(g=>g.exerciseId===eId&&g.period===per)
              .sort((a,b)=>(b.startDate||'0').localeCompare(a.startDate||'0'));
            return (
              <div key={key} style={{marginBottom:10}}>
                <div style={{fontSize:11,fontFamily:"'DM Sans',sans-serif",fontWeight:700,color:'var(--ink)',
                  borderBottom:'1px solid var(--border)',paddingBottom:3,marginBottom:4,display:'flex',justifyContent:'space-between'}}>
                  <span>{exLabel}</span>
                  <span style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'capitalize'}}>{per}</span>
                </div>
                {versions.map(g => {
                  const isActive = (!g.startDate||g.startDate<=fmt(today))&&(!g.endDate||g.endDate>=fmt(today));
                  const isEditing = editingId===g.id;
                  return (
                    <div key={g.id} style={{padding:'6px 8px',marginBottom:4,background:isActive?'var(--accent-light)':g.endDate?'var(--cream)':'var(--surface)',
                      borderRadius:'var(--radius-sm)',border:`1px solid ${isActive?'var(--accent)':'var(--border)'}`}}>
                      {isEditing ? (
                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                          <div style={{display:'flex',gap:6,alignItems:'center'}}>
                            <input type="number" value={editTarget} onChange={e=>setEditTarget(e.target.value)}
                              style={{width:70,fontSize:12,fontFamily:"'DM Mono',monospace",border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',outline:'none'}}/>
                            <select value={editUnit} onChange={e=>setEditUnit(e.target.value)}
                              style={{flex:1,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',background:'var(--surface)',outline:'none'}}>
                              <option value="reps">Reps</option>
                              <option value="sets">Sets</option>
                              <option value="volume">Volume (lbs)</option>
                              <option value="distance">Distance (mi)</option>
                              <option value="sessions">Sessions</option>
                            </select>
                          </div>
                          <div style={{display:'flex',gap:6,alignItems:'center'}}>
                            <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',flexShrink:0}}>End date:</span>
                            <input type="date" value={editEndDate} onChange={e=>setEditEndDate(e.target.value)}
                              style={{flex:1,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',outline:'none'}}/>
                          </div>
                          <div style={{display:'flex',gap:6}}>
                            <button onClick={()=>saveEdit(g)}
                              style={{background:'var(--accent)',color:'white',border:'none',borderRadius:4,padding:'3px 10px',cursor:'pointer',fontSize:11,fontWeight:600}}>Save</button>
                            <button onClick={()=>setEditingId(null)}
                              style={{background:'none',border:'1px solid var(--border)',borderRadius:4,padding:'3px 8px',cursor:'pointer',fontSize:11}}>Cancel</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:12,fontFamily:"'DM Mono',monospace",fontWeight:600,color:'var(--ink)'}}>
                              {g.target.toLocaleString()} {g.unit}
                            </div>
                            <div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)'}}>
                              {g.startDate||'∞'} → {g.endDate||'ongoing'}
                              {isActive&&<span style={{marginLeft:6,color:'var(--accent)',fontWeight:700}}>● active</span>}
                            </div>
                          </div>
                          <button onClick={()=>startEdit(g)} title="Edit in place"
                            style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--ink-faint)',padding:'0 3px',lineHeight:1}}>✏️</button>
                          {isActive&&(
                            <button onClick={()=>onEnd(g.id)} title="End after this period"
                              style={{background:'none',border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',fontSize:10,color:'var(--ink-faint)',padding:'2px 5px',lineHeight:1}}>
                              End
                            </button>
                          )}
                          <button onClick={()=>{if(confirmDelete===g.id){onDelete(g.id);setConfirmDelete(null);}else setConfirmDelete(g.id);}}
                            onMouseLeave={()=>setConfirmDelete(null)}
                            style={{background:confirmDelete===g.id?'var(--red)':'none',color:confirmDelete===g.id?'white':'var(--ink-faint)',
                              border:'none',borderRadius:confirmDelete===g.id?4:0,cursor:'pointer',fontSize:confirmDelete===g.id?10:13,
                              padding:confirmDelete===g.id?'2px 5px':'0 2px',fontFamily:"'DM Sans',sans-serif"}}>
                            {confirmDelete===g.id?'Delete?':'✕'}
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
                {/* New version button for existing families */}
                {isActive(eId,per)&&(
                  <button onClick={()=>{
                    const latest=versions[0];
                    if(latest){onAddVersion(eId,per,latest.target,latest.unit);}
                  }}
                  style={{background:'none',border:'1px dashed var(--border)',borderRadius:4,cursor:'pointer',
                    fontSize:10,color:'var(--ink-light)',padding:'3px 8px',width:'100%',fontFamily:"'DM Sans',sans-serif",marginTop:2}}
                  title={`Start a new version from next ${per}`}>
                    + New version (from next {per})
                  </button>
                )}
              </div>
            );
          })}
        </div>

        {/* Add brand new goal */}
        <div style={{padding:'10px 12px 12px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>New goal:</div>
          {exercises.length===0 ? (
            <div style={{fontSize:12,color:'var(--ink-faint)',fontStyle:'italic'}}>Add exercises to the library first</div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              <select value={exId} onChange={e=>setExId(e.target.value)}
                style={{width:'100%',fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'5px 8px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
                {exercises.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
              <div style={{display:'flex',gap:6}}>
                <select value={period} onChange={e=>setPeriod(e.target.value)}
                  style={{flex:1,fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'5px 6px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
                  <option value="week">Per Week</option>
                  <option value="month">Per Month</option>
                  <option value="year">Per Year</option>
                </select>
                <select value={unit} onChange={e=>setUnit(e.target.value)}
                  style={{flex:1,fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'5px 6px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
                  <option value="reps">Reps</option>
                  <option value="sets">Sets</option>
                  <option value="volume">Volume (lbs)</option>
                  <option value="distance">Distance (mi)</option>
                  <option value="sessions">Sessions</option>
                </select>
              </div>
              <div style={{display:'flex',gap:6}}>
                <input type="number" min="1" value={target} onChange={e=>setTarget(e.target.value)}
                  placeholder="Target amount"
                  style={{flex:1,fontSize:12,fontFamily:"'DM Mono',monospace",border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'5px 8px',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}/>
                <button onClick={()=>{if(exId&&target){onAddVersion(exId,period,target,unit);setTarget('');}}}
                  disabled={!exId||!target}
                  style={{background:exId&&target?'var(--accent)':'var(--border)',border:'none',borderRadius:'var(--radius-sm)',
                    padding:'5px 16px',cursor:exId&&target?'pointer':'default',fontSize:12,fontWeight:600,
                    color:exId&&target?'white':'var(--ink-faint)'}}>
                  Add
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  function isActive(exerciseId, period) {
    const dk=fmt(today);
    return goals.some(g=>g.exerciseId===exerciseId&&g.period===period&&(!g.startDate||g.startDate<=dk)&&(!g.endDate||g.endDate>=dk));
  }
}


function ExercisePicker({ exercises, onAdd, onAddNew, onClose }) {
  const [search, setSearch] = useState('');
  const [newName, setNewName] = useState('');
  const [newCat, setNewCat] = useState('Strength');
  const searchRef = useRef();
  useEffect(() => { setTimeout(() => searchRef.current?.focus(), 50); }, []);

  const filtered = exercises.filter(e =>
    e.name.toLowerCase().includes(search.toLowerCase())
  );

  const grouped = FITNESS_CATEGORIES.reduce((acc, cat) => {
    const items = filtered.filter(e => (e.category || 'Other') === cat)
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true }));   // v4.5.5: A→Z within each group
    if (items.length) acc[cat] = items;
    return acc;
  }, {});

  return (
    <div className="fitness-picker-overlay" onClick={onClose}>
      <div className="fitness-picker-modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'14px 16px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,color:'var(--ink)'}}>Add Exercise</span>
          <button onClick={onClose}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--ink-faint)',lineHeight:1,padding:'0 2px'}}>✕</button>
        </div>
        <div style={{padding:'8px 12px 4px',flexShrink:0}}>
          <input ref={searchRef} value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search exercises…"
            style={{width:'100%',fontSize:12,fontFamily:"'DM Sans',sans-serif",
              border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',
              padding:'5px 9px',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
          />
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'4px 8px'}}>
          {exercises.length === 0 && (
            <div style={{fontSize:12,color:'var(--ink-faint)',fontStyle:'italic',padding:'8px 4px'}}>
              No exercises in library yet — add one below
            </div>
          )}
          {Object.entries(grouped).map(([cat, items]) => (
            <div key={cat}>
              <div className="ex-lib-cat">{cat}</div>
              {items.map(ex => (
                <div key={ex.id}
                  style={{display:'flex',alignItems:'center',padding:'7px 6px',borderRadius:6,cursor:'pointer',transition:'background 0.1s'}}
                  onClick={()=>onAdd(ex.id)}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--cream)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{fontSize:13,fontFamily:"'DM Sans',sans-serif",color:'var(--ink)',flex:1}}>{ex.name}</span>
                  <span style={{fontSize:10,color:'var(--accent)',fontFamily:"'DM Mono',monospace"}}>+ Add</span>
                </div>
              ))}
            </div>
          ))}
        </div>
        {/* New exercise */}
        <div style={{padding:'8px 12px 6px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>+ New exercise:</div>
          <div style={{display:'flex',gap:6}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter' && newName.trim()) onAddNew(newName.trim(), newCat); if(e.key==='Escape') onClose(); }}
              placeholder="Exercise name"
              style={{flex:1,fontSize:12,fontFamily:"'DM Sans',sans-serif",
                border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',
                padding:'5px 8px',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
            />
            <select value={newCat} onChange={e=>setNewCat(e.target.value)}
              style={{fontSize:11,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',
                borderRadius:'var(--radius-sm)',padding:'4px 6px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
              {FITNESS_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div style={{padding:'6px 12px 12px',display:'flex',justifyContent:'flex-end',flexShrink:0}}>
          <button onClick={()=>{ if(newName.trim()) onAddNew(newName.trim(), newCat); }}
            disabled={!newName.trim()}
            style={{background:newName.trim()?'var(--accent)':'var(--border)',border:'none',
              borderRadius:'var(--radius-sm)',padding:'5px 16px',cursor:newName.trim()?'pointer':'default',
              fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif",
              color:newName.trim()?'white':'var(--ink-faint)',transition:'all 0.15s'}}>
            Add New
          </button>
        </div>
      </div>
    </div>
  );
}

// EXERCISE LIBRARY MANAGER
// ─────────────────────────────────────────────
function ExerciseLibraryManager({ exercises, onAdd, onUpdate, onDelete, onClose }) {
  const [newName, setNewName] = useState('');
  const [newCat, setNewCat] = useState('Strength');
  const [newSub, setNewSub] = useState('');
  const [editId, setEditId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const existingSubs = ruleSubs(exercises);   // v5.11.0: subcategory suggestions
  const subInputStyle = {width:60,minWidth:0,flexShrink:1,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',
    background:'var(--surface)',color:'var(--ink)',outline:'none',boxSizing:'border-box'};

  const grouped = FITNESS_CATEGORIES.reduce((acc, cat) => {
    const items = exercises.filter(e => (e.category || 'Other') === cat);
    if (items.length) acc[cat] = items;
    return acc;
  }, {});

  return (
    <div className="fitness-picker-overlay" onClick={onClose}>
      <div className="fitness-picker-modal" style={{width:360,maxHeight:520}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'14px 16px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,color:'var(--ink)'}}>Exercise Library</span>
          <button onClick={onClose}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--ink-faint)',lineHeight:1}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'8px 12px'}}>
          {exercises.length === 0 && (
            <div style={{fontSize:12,color:'var(--ink-faint)',fontStyle:'italic',padding:'8px 4px'}}>No exercises yet</div>
          )}
          {Object.entries(grouped).map(([cat, items]) => (
            <div key={cat} style={{marginBottom:8}}>
              <div className="ex-lib-cat">{cat}</div>
              {items.map(ex => (
                <div key={ex.id} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 4px',borderRadius:6}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--cream)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                  onBlur={e=>{ if(editId===ex.id && !e.currentTarget.contains(e.relatedTarget)) setEditId(null); }}>
                  {editId === ex.id ? (
                    <>
                      <input autoFocus value={ex.name}
                        onChange={e=>onUpdate(ex.id,{name:e.target.value})}
                        onKeyDown={e=>{ if(e.key==='Enter'||e.key==='Escape') setEditId(null); }}
                        style={{flex:1,fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--accent)',
                          borderRadius:4,padding:'3px 6px',outline:'none',background:'var(--surface)',color:'var(--ink)'}}
                      />
                      <select value={ex.category||'Other'} onChange={e=>onUpdate(ex.id,{category:e.target.value})}
                        style={{fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',
                          background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
                        {FITNESS_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                      <input list="lp-subcats" placeholder="Sub" title="Subcategory (optional), e.g. Run or Bike" aria-label="Subcategory"
                        value={ex.subcategory||''} onChange={e=>onUpdate(ex.id,{subcategory:e.target.value})}
                        onKeyDown={e=>{ if(e.key==='Enter'||e.key==='Escape') setEditId(null); }}
                        style={subInputStyle}/>
                    </>
                  ) : (
                    <>
                      <span style={{flex:1,fontSize:12,fontFamily:"'DM Sans',sans-serif",color:'var(--ink)'}}>{ex.name}
                        {ex.subcategory
                          ? <span onClick={()=>setEditId(ex.id)} title="Edit subcategory" style={{marginLeft:6,fontSize:10,color:'var(--ink-light)',background:'var(--neutral-bg)',borderRadius:999,padding:'1px 6px',cursor:'pointer'}}>{ex.subcategory}</span>
                          : cat==='Cardio' && <span onClick={()=>setEditId(ex.id)} title="Add a subcategory, e.g. Run or Bike" style={{marginLeft:6,fontSize:10,color:'var(--ink-faint)',border:'1px dashed var(--border)',borderRadius:999,padding:'0 6px',cursor:'pointer'}}>+ sub</span>}</span>
                      <button onClick={()=>setEditId(ex.id)}
                        style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--ink-faint)',padding:'0 3px'}}>✏️</button>
                      <button onClick={()=>{ if(confirmId===ex.id){onDelete(ex.id);setConfirmId(null);}else setConfirmId(ex.id); }}
                        onMouseLeave={()=>setConfirmId(null)}
                        style={{background:confirmId===ex.id?'var(--red)':'none',color:confirmId===ex.id?'white':'var(--ink-faint)',
                          border:'none',cursor:'pointer',fontSize:confirmId===ex.id?10:13,
                          borderRadius:confirmId===ex.id?4:0,padding:confirmId===ex.id?'2px 5px':'0 2px',
                          fontFamily:"'DM Sans',sans-serif"}}>
                        {confirmId===ex.id?'Delete?':'✕'}
                      </button>
                    </>
                  )}
                </div>
              ))}
            </div>
          ))}
        </div>
        {/* Add new */}
        <div style={{padding:'8px 12px 12px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Add exercise:</div>
          <div style={{display:'flex',gap:6}}>
            <datalist id="lp-subcats">{existingSubs.map(s=><option key={s} value={s}/>)}</datalist>
            <input value={newName} onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter'&&newName.trim()){onAdd(newName.trim(),newCat,newSub);setNewName('');setNewSub('');} }}
              placeholder="Name"
              style={{flex:1,minWidth:0,fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',
                borderRadius:'var(--radius-sm)',padding:'5px 8px',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
            />
            <select value={newCat} onChange={e=>setNewCat(e.target.value)}
              style={{fontSize:11,border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',
                padding:'4px 6px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}>
              {FITNESS_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <input list="lp-subcats" placeholder="Sub" title="Subcategory (optional), e.g. Run or Bike" aria-label="Subcategory"
              value={newSub} onChange={e=>setNewSub(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter'&&newName.trim()){onAdd(newName.trim(),newCat,newSub);setNewName('');setNewSub('');} }}
              style={subInputStyle}/>
            <button onClick={()=>{ if(newName.trim()){onAdd(newName.trim(),newCat,newSub);setNewName('');setNewSub('');} }}
              disabled={!newName.trim()}
              style={{background:newName.trim()?'var(--accent)':'var(--border)',border:'none',
                borderRadius:'var(--radius-sm)',padding:'5px 12px',cursor:newName.trim()?'pointer':'default',
                fontSize:12,fontWeight:600,color:newName.trim()?'white':'var(--ink-faint)'}}>
              Add
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Pages editor: formatting options ─────────────────────────────────────────────────────
// Text colours: mid-tones read on both light and dark pages; the darker/lighter rows are for one mode.

function pagesQuillSetup() {      // once: store colour/size/font/align as inline styles (what the saved HTML uses)

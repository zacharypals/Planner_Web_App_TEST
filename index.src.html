    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
    padding: 12px 10px 5px; border-top: none; margin-top: 0;
  }

  /* Folder rows — modern, no heavy cream bg */
  .pages-folder-row {
    display: flex; align-items: center; padding: 6px 8px 6px 4px;
    cursor: pointer; border-radius: 8px; margin: 1px 0;
    background: transparent; gap: 2px; position: relative;
    transition: background 0.12s;
  }
  .pages-folder-row:hover { background: var(--cream); }
  .pages-folder-row.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius:8px; }
  .pages-folder-row.folder-hover-target { background: var(--accent-light); outline: 2px solid var(--accent); outline-offset:-2px; border-radius:8px; }
  .pages-folder-toggle {
    background: none; border: none; cursor: pointer; padding: 0 3px;
    font-size: 10px; color: var(--ink-faint); flex-shrink: 0; line-height: 1;
  }
  .pages-folder-name {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--ink); flex: 1; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pages-folder-name-input {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--ink); flex: 1; min-width: 0; border: 1.5px solid var(--accent);
    border-radius: 5px; padding: 1px 5px; background: var(--surface); outline: none;
  }
  .pages-folder-add-btn {
    background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--accent); padding: 0 4px; line-height: 1; opacity: 0.6; flex-shrink: 0;
  }
  .pages-folder-add-btn:hover { opacity: 1; }
  .pages-folder-del-btn {
    background: none; border: none; cursor: pointer; font-size: 12px;
    color: var(--ink-faint); padding: 0 2px; opacity: 0; flex-shrink: 0; transition: opacity 0.1s;
  }
  .pages-folder-row:hover .pages-folder-del-btn { opacity: 0.5; }
  .pages-folder-del-btn:hover { opacity: 1 !important; color: #ef4444; }
  @media (hover: none) {
    .pages-folder-del-btn { opacity: 0.45; }
    .pages-folder-row.swipe-reveal { background: #fef2f2; }
  }
  .pages-doc-delete-btn {
    background: none; border: none; cursor: pointer; font-size: 11px;
    color: var(--border); padding: 2px 4px; opacity: 0; flex-shrink: 0;
    transition: opacity 0.1s; border-radius: 4px; line-height: 1; align-self: center;
  }
  .pages-list-item:hover .pages-doc-delete-btn { opacity: 0.6; }
  .pages-doc-delete-btn:hover { opacity: 1 !important; color: #ef4444; }

  /* ── Main editor area ── */
  .pages-main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--cream);
  }
  .pages-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink-faint); gap: 16px;
  }
  .pages-empty-icon { font-size: 52px; opacity: 0.2; }
  .pages-empty-text { font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink-light); }

  /* Sticky title header */
  .pages-doc-header {
    flex-shrink: 0; padding: 24px 36px 8px; background: var(--surface);
    border-bottom: none;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .pages-scroll-area {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    background: var(--cream);
  }
  .pages-editor {
    flex-shrink: 0; display: flex; flex-direction: column; padding: 24px 36px 0;
  }

  /* Title input — modern sans-serif, large weight */
  .pages-title-input {
    font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700;
    color: var(--ink); border: none; background: transparent; outline: none;
    width: 100%; margin-bottom: 6px; line-height: 1.3;
  }
  .pages-title-input::placeholder { color: var(--border); }

  /* Meta line */
  .pages-doc-meta {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint);
    margin-bottom: 16px; padding-bottom: 12px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    border-bottom: none;
  }

  /* ── Toolbar — floating rounded card ── */
  .pages-toolbar {
    display: flex; gap: 1px; flex-wrap: wrap;
    padding: 4px 0; background: transparent;
    border: none; border-top: 1px solid rgba(0,0,0,0.06);
    margin-top: 6px;
  }
  .pages-toolbar-btn {
    padding: 5px 9px; border-radius: 6px; border: none; background: none;
    cursor: pointer; font-size: 13px; color: var(--ink-light);
    transition: all 0.12s; min-width: 30px; text-align: center;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
  }
  .pages-toolbar-btn:hover { background: var(--cream); color: var(--ink); }
  .pages-toolbar-btn.active { background: var(--accent-light); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .pages-toolbar-sep { width: 1px; background: rgba(0,0,0,0.08); margin: 3px 3px; align-self: stretch; }

  /* ── Rich text body ── */
  .pages-body {
    min-height: 240px; padding: 18px 20px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--surface); outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.75; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.05);
  }
  .pages-body:focus { box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 2px var(--accent); }
  .pages-body:focus-within { box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 2px var(--accent); }
  /* ── Quill editor body (v5.0.0) ── */
  .pages-body.ql-container { height: auto; font: inherit; }
  .pages-body .ql-editor { padding: 0; min-height: 200px; height: auto; overflow: visible; font: inherit; line-height: inherit; color: inherit; }
  .pages-body .ql-editor.ql-blank::before { left: 0; right: 0; color: var(--ink-faint); font-style: normal; }
  .pages-body .ql-editor p { margin: 6px 0; }
  .pages-body .ql-editor h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; margin: 16px 0 8px; color: var(--ink); letter-spacing: -0.02em; }
  .pages-body .ql-editor h2 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
  .pages-body .ql-editor h3 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; margin: 10px 0 5px; color: var(--ink); }
  .pages-body .ql-editor ol { padding-left: 0; margin: 2px 0; }
  .pages-body .ql-editor li { margin: 2px 0; padding-left: 1.7em; }
  .pages-body .ql-editor li > .ql-ui:before { width: 1.3em; margin-left: -1.7em; margin-right: .4em; font-size: 1.05em; }
  .pages-body .ql-editor li[data-list=unchecked] > .ql-ui { color: var(--ink-light); }
  .pages-body .ql-editor li[data-list=checked] > .ql-ui { color: var(--accent); }
  .pages-body .ql-editor li[data-list=checked] { text-decoration: line-through; opacity: 0.5; }
  .pages-body .ql-editor li[data-list=bullet] > .ql-ui { color: var(--ink-light); }
  .pages-body .ql-editor li.ql-indent-1:not(.ql-direction-rtl) { padding-left: calc(1.7em + 1.5em); }
  .pages-body .ql-editor li.ql-indent-2:not(.ql-direction-rtl) { padding-left: calc(1.7em + 3.0em); }
  .pages-body .ql-editor li.ql-indent-3:not(.ql-direction-rtl) { padding-left: calc(1.7em + 4.5em); }
  .pages-body .ql-editor li.ql-indent-4:not(.ql-direction-rtl) { padding-left: calc(1.7em + 6.0em); }
  .pages-body .ql-editor li.ql-indent-5:not(.ql-direction-rtl) { padding-left: calc(1.7em + 7.5em); }
  .pages-body .ql-editor li.ql-indent-6:not(.ql-direction-rtl) { padding-left: calc(1.7em + 9.0em); }
  .pages-body .ql-editor li.ql-indent-7:not(.ql-direction-rtl) { padding-left: calc(1.7em + 10.5em); }
  .pages-body .ql-editor li.ql-indent-8:not(.ql-direction-rtl) { padding-left: calc(1.7em + 12.0em); }
  .pages-body .ql-editor a { color: var(--accent); text-decoration: underline; }
  .pages-body .ql-editor s { text-decoration: line-through; opacity: 0.5; }
  .pages-body .ql-editor blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 0 2px 14px; color: var(--ink-light); }
  .pages-body .ql-editor img { max-width: 100%; }
  .pages-body .ql-editor code { font-family: 'DM Mono', monospace; font-size: 0.88em; background: rgba(127,127,127,0.2); border-radius: 4px; padding: 1px 5px; }
  /* Toolbar popovers (colour, highlight, font, size, align) */
  .pages-pop { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); padding: 10px; width: 258px; max-height: 70vh; overflow-y: auto; }
  .pages-pop-title { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin: 13px 2px 6px; }
  .pages-pop-title:first-child { margin-top: 0; }
  .pages-pop-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pages-swatch { height: 34px; border-radius: 8px; border: 1px solid rgba(127,127,127,0.35); cursor: pointer; padding: 0; font: 700 14px 'DM Sans', sans-serif; color: var(--ink); }
  .pages-swatch.on { box-shadow: 0 0 0 2px var(--accent); }
  .pages-pop-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; min-height: 40px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--ink); }
  .pages-pop-item:hover { background: var(--cream); }
  .pages-pop-item.on { background: var(--accent-light); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .pages-pop-clear { margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: 1px dashed var(--border); background: none; color: var(--ink-light); cursor: pointer; font-size: 12px; }
  .pages-body h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; margin: 16px 0 8px; color: var(--ink); letter-spacing: -0.02em; }
  .pages-body h2 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
  .pages-body h3 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; margin: 10px 0 5px; color: var(--ink); }
  .pages-body ul, .pages-body ol { padding-left: 22px; margin: 6px 0; }
  .pages-body li { margin: 4px 0; }
  .pages-body a { color: var(--accent); text-decoration: underline; }
  .pages-body blockquote {
    border-left: 3px solid var(--accent); padding: 8px 14px; margin: 10px 0;
    color: var(--ink-light); font-style: italic; background: var(--cream); border-radius: 0 8px 8px 0;
  }
  .pages-body p { margin: 6px 0; }
  .pages-body s { text-decoration: line-through; opacity: 0.5; }

  /* Checklist */
  .pages-body ul.pages-checklist { list-style: none; padding-left: 4px; margin: 6px 0; }
  .pages-body ul.pages-checklist ul.pages-checklist { padding-left: 24px; }
  .pages-body li.pages-chk-li {
    display: flex; align-items: baseline; gap: 6px;
    padding: 2px 0; min-height: 22px; cursor: text; line-height: 1.6;
  }
  .pages-chk-input {
    flex-shrink: 0; width: 14px; height: 14px; margin: 0; margin-top: 3px;
    cursor: pointer; accent-color: var(--accent);
  }
  li.pages-chk-li.checked { text-decoration: line-through; opacity: 0.5; }

  /* ── Tasks section ── */
  .pages-tasks-section {
    padding: 0 36px 48px; background: transparent; flex-shrink: 0;
    border-top: none;
  }
  .pages-tasks-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .pages-tasks-title {
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .pages-task-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 8px;
    background: var(--surface); border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04);
    transition: box-shadow 0.2s;
  }
  .pages-task-item:hover { box-shadow: 0 4px 12px rgba(106,80,167,0.1), 0 0 0 1px rgba(106,80,167,0.15); }
  .pages-task-check {
    width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px;
    flex-shrink: 0; background: var(--surface); cursor: pointer; margin-top: 2px;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .pages-task-check.done { background: var(--accent); border-color: var(--accent); }
  .pages-task-check.done::after { content: '✓'; color: white; font-size: 9px; }
  .pages-task-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pages-task-title-input {
    border: none; background: transparent; outline: none; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); font-weight: 500;
  }
  .pages-task-title-input.done { text-decoration: line-through; opacity: 0.45; }
  .pages-task-date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pages-task-date-input {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-light);
    border: 1px solid rgba(0,0,0,0.08); border-radius: var(--radius-sm); padding: 2px 8px;
    background: var(--cream); cursor: pointer;
  }
  .pages-task-date-input:focus { outline: none; border-color: var(--accent); }
  .pages-task-date-badge {
    font-family: 'DM Mono', monospace; font-size: 10px;
    background: rgba(106,80,167,0.1); color: var(--accent);
    padding: 2px 8px; border-radius: 20px;
  }
  .pages-task-details-input {
    border: none; background: transparent; outline: none; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--ink-light);
    min-height: 18px; line-height: 1.5;
  }
  .pages-task-details-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .pages-task-delete {
    background: none; border: none; color: var(--border); cursor: pointer;
    font-size: 14px; padding: 0 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0;
  }
  .pages-task-item:hover .pages-task-delete { opacity: 1; }
  .pages-task-item:hover .pages-task-delete:hover { color: #ef4444; }

  /* Project task badge */
  .project-task-badge {
    font-family: 'DM Sans', monospace; font-size: 9px; font-weight: 600;
    color: var(--accent); background: rgba(106,80,167,0.08);
    padding: 1px 6px; border-radius: 20px; display: inline-flex; align-items: center; gap: 3px;
    margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── Sidebar collapse strip ── */
  .pages-sidebar-wrap {
    display: flex; flex-direction: row; flex-shrink: 0;
    transition: width 0.25s ease; width: 292px;
  }
  .pages-sidebar-wrap.collapsed { width: 32px; }
  .pages-sidebar-wrap > .pages-sidebar { width: 260px; min-width: 260px; transition: opacity 0.2s; }
  .pages-sidebar-wrap.collapsed > .pages-sidebar { opacity: 0; pointer-events: none; width: 0; min-width: 0; padding: 0; overflow: hidden; }
  .pages-toggle-strip {
    width: 32px; min-width: 32px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 8px;
    border-right: 1px solid rgba(0,0,0,0.06); background: var(--surface);
    cursor: pointer; transition: background 0.15s;
  }
  .pages-toggle-strip:hover { background: var(--cream); }
  .pages-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08);
    background: var(--surface); color: var(--ink-faint); font-size: 12px; pointer-events: none;
  }
  .pages-toggle-strip:hover .pages-toggle-btn { background: var(--accent); color: white; border-color: var(--accent); }

  /* Mobile pages */
  @media (max-width: 767px) {
    .pages-sidebar-wrap { display: none !important; }
    .pages-toggle-strip { display: none !important; }
    .pages-editor { padding: 14px 16px 0; }
    .pages-tasks-section { padding: 0 16px 80px; }
    .pages-doc-header { padding: 10px 16px 6px; box-shadow: none; }
    .pages-mobile-back { display: block; }
    .pages-mobile-list { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
    .pages-main { height: calc(100dvh - 48px - 56px); flex: 0 0 auto; }
  }
  @media (min-width: 768px) {
    .pages-mobile-back { display: none !important; }
    .pages-mobile-list { display: none !important; }
    .pages-empty { display: flex; }
  }

  /* Desktop sidebar toggle shows on all non-mobile */
  @media (min-width: 768px) {
    .mobile-day-view, .mobile-sheet, .mobile-sheet-overlay,
    .mobile-fab, .mobile-bottom-nav { display: none !important; }
  }

  /* ═══════════════════════════════════════════════════════════════
     v3.13.0 LOOK REFRESH — layout & component styling borrowed from
     Finance Pal. Colors and fonts are unchanged. Everything for the
     refresh lives in this block so it can be tuned or removed in one place.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --card-border: 1px solid var(--border);
    --card-shadow: 0 1px 3px rgba(35,30,51,0.07);
  }

  /* ── Top bar: soft translucent tabs, ghost buttons ── */
  .nav-tab {
    text-transform: none; letter-spacing: 0.01em; font-size: 14px;
    padding: 8px 14px; color: rgba(255,255,255,0.75);
  }
  .nav-tab:hover { background: rgba(255,255,255,0.10); color: #fff; }
  .nav-tab.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }
  .auth-btn, .auth-btn.sync {
    border: none; background: rgba(255,255,255,0.14); color: #fff;
    padding: 6px 12px; font-size: 13px;
  }
  .auth-btn:hover, .auth-btn.sync:hover { background: rgba(255,255,255,0.24); color: #fff; border: none; }
  .auth-btn.danger:hover { background: rgba(255,255,255,0.24); }

  /* ── Desktop: content floats as cards on the cream page ── */
  @media (min-width: 768px) {
    .nav-bar { height: 56px; padding: 0 20px; }
    .main-content, .fitness-layout { padding: 16px; gap: 16px; }

    /* Sidebars become cards (toggle strip lives inside the card) */
    .sidebar-wrap, .pages-sidebar-wrap, .fitness-sidebar {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow); overflow: hidden;
    }
    .sidebar-wrap > .sidebar, .pages-sidebar-wrap > .pages-sidebar { box-shadow: none; }
    .sidebar-toggle-strip, .pages-toggle-strip {
      border-right: none; border-left: 1px solid var(--border); background: var(--paper);
    }
    .pages-sidebar-wrap > .pages-sidebar { border-right: none; }
    .fitness-sidebar { border-right: var(--card-border); }

    /* Weekly planner: calendar + review as two stacked cards */
    .weekly-main-panel { gap: 16px; }
    .weekly-calendar {
      height: calc(100vh - 56px - 32px - 112px);
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .cal-grid { column-gap: 0; }
    .cal-header-cell { border-radius: 0; border-right: 1px solid rgba(255,255,255,0.12); }
    .cal-grid > .cal-header-cell:nth-child(7) { border-right: none; }
    .cal-day { border-right: 1px solid var(--border); }
    .cal-day:last-child { border-right: none; }
    .week-review {
      margin: 0; border: var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
    }

    /* Habit tracker & Pages main areas are cards */
    .habit-main, .pages-main {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .pages-doc-header { box-shadow: none; border-bottom: 1px solid var(--border); background: transparent; }

    /* Monthly calendar card */
    .monthly-cal-wrap {
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
      padding: 16px 20px 20px; margin: 0;
    }
  }

  /* ── Monthly calendar: clean table grid instead of floating tiles ── */
  .monthly-cal-header { column-gap: 0; }
  .monthly-cal-grid {
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .monthly-cell { border-radius: 0; box-shadow: none; }
  .monthly-cell:hover { box-shadow: none; }
  .monthly-cell.empty { background: var(--cream); }

  /* ── Segmented control (Habit view switcher) ── */
  .view-tabs {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--cream); border-radius: var(--radius-sm);
  }
  .view-tab {
    border: none; background: transparent; border-radius: 6px;
    padding: 5px 12px; color: var(--ink-light);
  }
  .view-tab:hover:not(.active) { background: transparent; color: var(--ink); }
  .view-tab.active {
    background: var(--paper); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 3px rgba(35,30,51,0.12);
  }

  /* ── Chips ── */
  .goal-filter-chip {
    border-radius: 999px; border-width: 1px; font-size: 12px; padding: 4px 12px;
    background: var(--paper);
  }

  /* ── Buttons, inputs, text areas ── */
  .btn, .modal-btn { border-radius: var(--radius-md); font-weight: 600; padding: 9px 16px; }
  .btn-secondary, .modal-btn.secondary { background: var(--cream); border: 1px solid transparent; color: var(--ink); }
  .btn-secondary:hover, .modal-btn.secondary:hover { background: var(--cream); border-color: var(--border); }
  .sidebar-textarea, .modal-input, .modal-textarea, .review-textarea, .pages-body {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .pages-body { border-radius: var(--radius-md); }
  .sidebar-textarea:focus, .modal-input:focus, .modal-textarea:focus,
  .review-textarea:focus, .pages-body:focus, .pages-body:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,80,167,0.12);
  }

  /* ── Modals & popovers: same card language ── */
  .modal, .modal-box, .people-picker-modal, .task-ctx-menu {
    border: var(--card-border); border-radius: var(--radius-lg);
  }

  /* ── Mobile ── */
  @media (max-width: 767px) {
    .mobile-bottom-nav { box-shadow: none; border-top: 1px solid var(--border); }
    .mobile-bottom-nav-btn { font-size: 11px; color: var(--ink-light); }
    .mobile-bottom-nav-btn.active { color: var(--accent); font-weight: 600; }
    .mobile-day-nav { box-shadow: none; border-bottom: 1px solid var(--border); }
    .mobile-week-dots { box-shadow: none; border-top: 1px solid var(--border); margin-top: auto; }
    .mobile-day-tasks {
      flex: 0 1 auto; margin: 12px; padding: 12px;
      background: var(--paper); border: var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    }
    .monthly-cal-wrap {
      background: var(--paper); border: var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow); margin: 10px; padding: 10px 8px 12px;
      min-width: 0; /* let all 7 days fit inside the card on phones */
    }
    .monthly-cal-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .monthly-event-chip .chip-time { display: none; } /* narrow cells: show the title, not the time */
  }

  /* ═══════════════════════════════════════════════════════════════
     v4.2.0 GOALS — Goals tab, timeline, goal tasks in the week, mobile nav "More".
     All goal styles use the gl- prefix.
     ═══════════════════════════════════════════════════════════════ */
  .gl-wrap { flex: 1; display: flex; gap: 16px; padding: 16px; overflow: hidden; min-height: 0; }
  .gl-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 1px 3px rgba(35,30,51,0.07); }
  .gl-side { width: 300px; flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .gl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .gl-side { transition: width 0.18s ease, padding 0.18s ease; }
  .gl-side-body { display: flex; flex-direction: column; gap: 12px; }
  .gl-side-strip { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .gl-side.collapsed { width: 52px; padding: 12px 0; overflow: hidden; }
  .gl-side.collapsed .gl-side-body { display: none; }
  .gl-side.collapsed .gl-side-strip { display: flex; }
  .gl-side-toggle { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-light); cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }
  .gl-side-toggle:hover { background: var(--cream); color: var(--ink); }
  .gl-side-vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--ink); margin: 4px 0; }
  .gl-side-dot { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; padding: 0; flex-shrink: 0; }
  .gl-h2 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--ink); }
  .gl-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-light); }
  .gl-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .gl-btn:hover { background: var(--cream); }
  .gl-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .gl-btn.primary:hover { filter: brightness(1.08); }
  .gl-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-light); }
  .gl-btn.danger { color: var(--red); }
  .gl-chip { font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-light); cursor: pointer; }
  .gl-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .gl-goal-card { text-align: left; width: 100%; font-family: 'DM Sans', sans-serif; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; cursor: pointer; display: block; color: var(--ink); }
  .gl-goal-card:hover { box-shadow: 0 2px 8px var(--shadow-md); }
  .gl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .gl-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--neutral-bg); }
  .gl-bar > div { height: 100%; border-radius: 3px; }
  .gl-health { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .gl-health.ontrack { color: #22573c; background: #e3f1e9; }
  .gl-health.atrisk { color: #7a4f00; background: #fbf0d6; }
  .gl-health.behind { color: #b03a2e; background: #fbe9e7; }
  .gl-health.upcoming, .gl-health.parked { color: #6a6678; background: var(--neutral-bg); }
  .gl-health.done { color: #fff; background: var(--accent); }
  .gl-mono { font-family: 'DM Mono', monospace; }
  .gl-input { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
  .gl-input:focus { border-color: var(--accent); }
  .gl-inline { font-family: 'DM Sans', sans-serif; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; outline: none; min-width: 0; }
  .gl-inline:hover { border-color: var(--border); }
  .gl-inline:focus { border-color: var(--accent); background: var(--surface); }
  .gl-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--ink-faint); background: var(--surface); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; padding: 0; }
  .gl-check.on { background: var(--accent); border-color: var(--accent); }
  .gl-ms { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .gl-ms-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .gl-grip { border: none; background: none; cursor: grab; color: var(--ink-faint); font-size: 14px; letter-spacing: -2px; width: 20px; height: 28px; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .gl-grip:hover { color: var(--ink-light); }
  .gl-ms.dragging { opacity: 0.45; }
  .gl-ms-drop { height: 3px; border-radius: 2px; background: var(--accent); margin: -2px 0; }
  .gl-caret { border: none; background: none; cursor: pointer; color: var(--ink-light); font-size: 11px; width: 22px; height: 28px; padding: 0; }
  .gl-task { display: flex; align-items: center; gap: 8px; min-height: 38px; border-top: 1px solid var(--neutral-line); padding: 2px 10px 2px 40px; position: relative; }
  .gl-x { border: none; background: none; cursor: pointer; color: var(--ink-faint); font-size: 13px; padding: 4px 6px; opacity: 0; }
  .gl-task:hover .gl-x, .gl-ms-head:hover .gl-x { opacity: 1; }
  .gl-sched { font-family: 'DM Sans', sans-serif; font-size: 12px; border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; border: 1px dashed var(--ink-faint); background: transparent; color: var(--ink-light); }
  .gl-sched.set { border: none; background: #f3e9f8; color: #6a3a87; font-weight: 600; }
  .gl-pop { position: absolute; z-index: 300; right: 8px; top: calc(100% - 2px); width: 290px; background: var(--paper); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px var(--shadow-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .gl-daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .gl-daybtn { font-family: 'DM Sans', sans-serif; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 0; font-size: 11px; color: var(--ink); cursor: pointer; line-height: 1.3; }
  .gl-daybtn.on { border: 2px solid var(--accent); background: var(--cream); font-weight: 600; }
  .gl-daybtn.today { color: var(--accent); font-weight: 600; }
  /* Timeline */
  .gl-tl-scroll { overflow-x: auto; }
  .gl-tl { display: flex; min-width: 900px; }
  .gl-tl-labels { width: 250px; flex-shrink: 0; border-right: 1px solid var(--grid-line); }
  .gl-tl-area { flex: 1; position: relative; min-width: 640px; }
  .gl-tl-head { height: 38px; border-bottom: 1px solid var(--grid-line); display: flex; align-items: center; }
  .gl-tl-row { position: relative; border-bottom: 1px solid var(--grid-line); }
  .gl-tl-row.goal { height: 46px; }
  .gl-tl-row.ms { height: 34px; }
  .gl-tl-row.task { height: 28px; }
  .gl-tl-lab { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; overflow: hidden; }
  .gl-tl-lab span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gl-tl-bar { position: absolute; border-radius: 9px; cursor: pointer; overflow: hidden; box-sizing: border-box; }
  /* v4.7.0 — drag to reschedule */
  .gl-tl-bar.grab { cursor: grab; touch-action: none; }
  .gl-tl-bar.dragging { cursor: grabbing; overflow: visible; box-shadow: 0 2px 10px rgba(35,30,51,0.28); z-index: 4; }
  .gl-tl-grip { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; }
  .gl-tl-grip.l { left: 0; } .gl-tl-grip.r { right: 0; }
  .gl-tl-bar.grab:hover .gl-tl-grip { background: rgba(255,255,255,0.45); box-shadow: inset 0 0 0 1px rgba(35,30,51,0.22); }
  .gl-tl-drag-tip {
    /* Fixed dark chip, like .undo-toast — var(--ink) flips to near-white in dark mode,
       which left white text on a light pill. Do not swap this back to --ink. */
    position: absolute; top: -4px; z-index: 6; pointer-events: none;
    background: #2a2538; color: #fff; border-radius: 6px; padding: 2px 7px; white-space: nowrap;
    font-family: 'DM Mono', monospace; font-size: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .gl-tl-dia { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); box-sizing: border-box; pointer-events: none; }
  .gl-tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; z-index: 2; }
  .gl-tl-todaytag { position: absolute; top: 3px; font-family: 'DM Mono', monospace; font-size: 9px; line-height: 12px; background: var(--gold); color: var(--ink); padding: 2px 7px; border-radius: 999px; z-index: 3; pointer-events: none; }
  .gl-seg { display: flex; background: var(--cream); border-radius: 10px; padding: 3px; }
  .gl-seg button { font-family: 'DM Sans', sans-serif; border: none; background: transparent; font-size: 13px; padding: 5px 11px; border-radius: 8px; color: var(--ink-light); cursor: pointer; }
  .gl-seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(35,30,51,0.12); }
  .gl-upnext { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .gl-mobile-only { display: none; }
  /* Goal tasks inside the Weekly Planner */
  .gl-wtask { border-radius: var(--radius-md); margin-bottom: 8px; padding: 7px 8px; font-size: 12px; position: relative; cursor: grab; border: 1px solid transparent; }
  .gl-wtask .gl-wtask-row { display: flex; align-items: flex-start; gap: 6px; }
  .gl-wtask .gl-wtask-title { flex: 1; min-width: 0; font-weight: 500; font-size: 11px; line-height: 1.3; word-break: break-word; }
  .gl-wtask.done .gl-wtask-title { text-decoration: line-through; opacity: 0.55; }
  .gl-wtask-rule { display: block; margin: 4px 0 0 20px; font-size: 10.5px; font-weight: 600; line-height: 1.3; }
  .gl-wtask-rule .gl-bar { height: 4px; margin-top: 3px; }
  .gl-rule { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; margin: 2px 0 6px; background: var(--tint); border: 1px solid var(--neutral-line); border-radius: 8px; }
  .gl-rule-label { font-size: 11px; color: var(--ink-faint); font-family: 'DM Mono', monospace; }
  .gl-rule-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .gl-wtask-pill { display: inline-block; margin: 4px 0 0 20px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .gl-wtask-more { border: none; background: none; cursor: pointer; color: var(--ink-light); font-size: 13px; padding: 0 2px; line-height: 1; opacity: 0; }
  .gl-wtask:hover .gl-wtask-more { opacity: 1; }
  .gl-wtask .task-check { margin-top: 1px; }
  .gl-wtask-menu { position: absolute; z-index: 400; top: 100%; right: 0; width: 220px; background: var(--paper); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px var(--shadow-lg); padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: default; }
  .gl-next { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; width: 100%; font-family: 'DM Sans', sans-serif; color: var(--ink); }
  .gl-next:hover { box-shadow: 0 2px 8px var(--shadow-md); }
  .gl-next.late { background: #fdf3f1; border-color: #f0c9c3; }
  /* Mobile "More" sheet */
  .more-sheet-overlay { position: fixed; inset: 0; background: rgba(35,30,51,0.35); z-index: 95; }
  .more-sheet { position: fixed; left: 0; right: 0; bottom: 56px; z-index: 96; background: var(--paper); border-radius: 18px 18px 0 0; padding: 10px 16px 12px; box-shadow: 0 -8px 24px rgba(35,30,51,0.18); }
  .more-sheet-btn { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; border: none; background: transparent; font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink); text-align: left; cursor: pointer; border-bottom: 1px solid var(--neutral-line); }
  .more-sheet-btn:last-child { border-bottom: none; }
  .more-sheet-btn.active { color: var(--accent); font-weight: 600; }
  .mobile-bottom-nav-btn svg { display: block; }
  @media (max-width: 767px) {
    .gl-wrap { flex-direction: column; padding: 12px; gap: 12px; overflow: visible; padding-bottom: 80px; }
    .gl-side { width: auto; overflow: visible; }
    .gl-side.collapsed { width: auto; padding: 16px; overflow: visible; }
    .gl-side.collapsed .gl-side-body { display: flex; }
    .gl-side.collapsed .gl-side-strip { display: none; }
    .gl-main { overflow: visible; }
    .gl-desktop-only { display: none !important; }
    .gl-mobile-only { display: flex; }
    .gl-x, .gl-wtask-more { opacity: 1; }
    .gl-wtask .gl-wtask-title { font-size: 15px; }
    .gl-wtask { padding: 10px 10px; cursor: default; }
    .gl-wtask-pill { font-size: 11px; }
    .gl-pop { position: fixed; left: 12px; right: 12px; top: auto; bottom: 72px; width: auto; }
    .gl-wtask-menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: 72px; width: auto; padding: 12px; }
    .gl-task { padding-left: 14px; }
    .gl-ms-head > input.gl-inline { flex-basis: calc(100% - 70px) !important; }
    .gl-input, .gl-inline { font-size: 16px; } /* 16px prevents iOS auto-zoom */
  }
  @media (min-width: 768px) { .more-sheet, .more-sheet-overlay { display: none !important; } }
  /* ═══════════════════════════════════════════════════════════════
     v4.4.0 DARK MODE — "Dusk Violet" dark. Active when <html data-theme="dark">
     (set by the head script + App). Light mode is untouched by this block.
     ═══════════════════════════════════════════════════════════════ */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --cream: #14121b;
    --paper: #1d1b25;
    --surface: #26232f;
    --ink: #e8e6ef;
    --ink-light: #aeacb8;
    --ink-faint: #75727f;
    --accent: #876cca;
    --accent-light: #302844;
    --gold: #e5b15b;
    --gold-light: #2d220f;
    --border: #383541;
    --shadow: rgba(0,0,0,0.25);
    --shadow-md: rgba(0,0,0,0.35);
    --shadow-lg: rgba(0,0,0,0.45);
    --card-shadow: 0 1px 3px rgba(0,0,0,0.35);
    --red-light: #381f1b; --blue-light: #152839; --purple-light: #2c2135;
    --orange-light: #362113; --teal-light: #0d2d25;
    --tint: #3a3154;
    --neutral-bg: #312f37;
    --neutral-line: #29282e;
    --grid-line: #5b5965;
    --tile-empty: #2e2b37;
    --tile-multi: #6b6880;
    --tile-num: #8e8b99;
    --hc-pct: 58%;
    --gl-ink-pct: 55%; --gl-ink-to: #fff;
    /* v4.5.0 dark task / event palettes (same order and color families as TASK_COLORS / EVENT_COLORS) */
    --tc-0: #1f542e; --tc-1: #6d323f; --tc-2: #5e4f07; --tc-3: #1f4a73; --tc-4: #4e3c6f; --tc-5: #683c0b; --tc-6: #005648; --tc-7: #5e3661; --tc-8: #3a5018; --tc-9: #6e3429; --tc-10: #005168; --tc-11: #515413; --tc-12: #673352; --tc-13: #684a09; --tc-14: #00555a; --tc-15: #6c371d; --tc-16: #384475; --tc-17: #6e3236; --tc-18: #5a4f12; --tc-19: #3e5520; --tc-20: #66402c; --tc-21: #005660;
    --ec-0: #582d42; --ec-1: #43345c; --ec-2: #223e61; --ec-3: #0b4834; --ec-4: #544310; --ec-5: #593215; --ec-6: #00474e; --ec-7: #4f2f51; --ec-8: #31441a; --ec-9: #5c2c31; --ec-10: #333962; --ec-11: #4e4612; --ec-12: #5b301c; --ec-13: #004845; --ec-14: #5a2c3c; --ec-15: #234725;
    --prio-bg: #4a2228;
  }
  /* v4.5.0: task / event colors come from --tc-N / --ec-N (see taskBg/eventBg); custom colors keep a light dim */
  [data-theme="dark"] .task-ck { background: rgba(0,0,0,0.20); }
  [data-theme="dark"] .task-ck-pill { background: rgba(255,255,255,0.14); }
  [data-theme="dark"] .task-ck-box { border-color: rgba(255,255,255,0.35); }
  [data-theme="dark"] .task-ck-add-box { border-color: rgba(255,255,255,0.3); }
  [data-theme="dark"] .task-card.custom-color { background-image: linear-gradient(rgba(20,18,27,0.35), rgba(20,18,27,0.35)); }
  /* Status chips and notices that had light pastel fills */
  [data-theme="dark"] .gl-health.ontrack { color: #7fd1a3; background: #16301f; }
  [data-theme="dark"] .gl-health.atrisk { color: #e5b15b; background: #2d220f; }
  [data-theme="dark"] .gl-health.behind { color: #f08a7e; background: #381f1b; }
  [data-theme="dark"] .gl-sched.set { background: #302844; color: #c9b8f5; }
  [data-theme="dark"] .gl-next.late { background: #2a1a1a; border-color: #5a2e2a; }
  [data-theme="dark"] .gl-chip.on { background: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .modal-btn.danger { background: #381f1b; color: #f08a7e; }
  [data-theme="dark"] .month-event-item.pending:hover { background: #3a2d14; }
  [data-theme="dark"] .pages-folder-row.swipe-reveal { background: #381f1b; }
  /* Generic dark-on-light hairlines become light-on-dark */
  [data-theme="dark"] .cal-day:hover,
  [data-theme="dark"] .monthly-cell:hover { background: #262138; }
  [data-theme="dark"] .monthly-cal-grid { background: #2a2832; border-color: #2a2832; }
  [data-theme="dark"] ::placeholder { color: var(--ink-faint); }
  .theme-btn { min-width: 0; }
  @media (max-width: 767px) { .auth-btn.theme-btn { display: none; } }

  /* ── v5.16.0 TIME BLOCKS ── */
  .tb-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .tb-switch button { border: none; background: transparent; padding: 4px 12px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--ink-light); cursor: pointer; }
  .tb-switch button.on { background: var(--accent); color: #fff; }
  .tb-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .tb-viewbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--border); flex-shrink: 0; }

    res = await fetch(APP_CONFIG.API_URL + path, {

      body: body === undefined ? undefined : (typeof body === 'string' ? body : JSON.stringify(body)),

    const msg = code === 'doc_too_large' ? 'One item is too large to save (over 2 MB) — remove pasted images'

async function completeSignInFromRedirect() {
  const m = window.location.hash.match(/^#lp_oauth=(.*)$/);
  if (!m) return null;
  history.replaceState(null, '', window.location.pathname + window.location.search);
  const p = new URLSearchParams(decodeURIComponent(m[1]));
  const fail = (code) => { const e = new Error(SIGNIN_ERRORS[code] || ('Sign-in failed (' + code + ')')); e.signIn = true; throw e; };

  try {
    res = await fetch(APP_CONFIG.API_URL + '/auth/exchange', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: p.get('code'), redirect_uri: APP_CONFIG.REDIRECT_URI }),

          this.setBase(d.c, d.i, d.v, d.x ? null : JSON.stringify(d.d), !!d.x);
          (changes[d.c] || (changes[d.c] = {}))[d.i] = value;
        }
        for (const c of Object.keys(changes)) this.apply(c, changes[c]);
        this.cursor = r.cursor;
        more = !!r.more;
      }
      this.offline = false;
      this.persist();
      if (merged) { this.status('merged'); this.scheduleFlush(300); }
      else if (this.pendingCount() && !this.flushing && this.failures) this.flush();
    } catch (e) {
      if (e.isAuth) this.onAuthLost?.(e);
    } finally { this.pulling = false; }
  },

  // Forget everything stored on this device for this app (sign-out / different account).
  wipeLocal() {
    for (const k of ['sync_meta', 'sync_outbox']) lsDel(k);
    try {
      const pre = APP_CONFIG.STORAGE_PREFIX;
      const keep = new Set(['session', 'email', 'profile', 'gtoken', 'gtoken_exp', 'oauth_state'].map(k => pre + k));
      // Collect first, then remove: browsers may reorder keys while items are being removed.
      const doomed = [];
      for (let n = 0; n < localStorage.length; n++) {
        const k = localStorage.key(n);
        if (k && k.startsWith(pre) && !keep.has(k)) doomed.push(k);
      }
      doomed.forEach(k => localStorage.removeItem(k));
    } catch {}
    this.base = {}; this.outbox = {}; this.seen = {}; this.cursor = 0; this.ready = false;
  },
};

// Like useStorage, but synced to the server. The localStorage copy is an instant-start cache.
function useSynced(key, init) {
  const [val, set] = useStorage(lsKey(key), init);
  Sync.register(key, init, set);
  useEffect(() => { Sync.capture(key, val); }, [val]);
  return [val, set];
}

// ── CALENDAR HELPERS ──
async function pushEventToCalendar(event, dateKey) {
  const token = getToken();
  if (!token) throw new Error('Not signed in to Google — please sign in and try again');
  const dateObj = new Date(dateKey + 'T00:00:00');
  const dateStr = dateKey; // YYYY-MM-DD
  let start, end;
  if (event.eventTime) {
    start = { dateTime: `${dateStr}T${event.eventTime}:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
    end = { dateTime: `${dateStr}T${tbEndClock(event.eventTime, event.durMin)}:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
  } else {
    const nextDay = new Date(dateObj); nextDay.setDate(nextDay.getDate() + 1);
    const nextStr = fmt(nextDay);
    start = { date: dateStr };
    end = { date: nextStr };
  }
  const inviteeList = (event.invitees||[]).filter(Boolean);
  const body = {
    summary: event.title || 'Untitled Event',
    description: event.details || '',
    start, end,
    extendedProperties: { private: { plannerId: event.id } },
    ...(inviteeList.length > 0 ? { attendees: inviteeList.map(email=>({email})) } : {}),
  };
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.clone().json(); detail = j?.error?.message || ''; } catch {}
    console.error('Calendar push failed:', res.status, detail);
    throw new Error(`Calendar error ${res.status}${detail ? ': ' + detail : ''}`);
  }
  const created = await res.json();
  console.log('Calendar event created:', created.id);
  return created.id;
}

async function deleteEventFromCalendar(gcalId) {
  const token = getToken();

async function respondToCalendarInvite(gcalId, response) {

async function updateEventInCalendar(gcalId, event, dateKey) {
  const token = getToken();
  if (!token || !gcalId) return;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const dateStr = dateKey;
  let start, end;
  if (event.eventTime) {
    start = { dateTime: `${dateStr}T${event.eventTime}:00`, timeZone: tz };
    end   = { dateTime: `${dateStr}T${tbEndClock(event.eventTime, event.durMin)}:00`, timeZone: tz };
  } else {
    const nextDay = new Date(dateStr + 'T00:00:00'); nextDay.setDate(nextDay.getDate() + 1);
    start = { date: dateStr };
    end   = { date: fmt(nextDay) };
  }
  // Use PATCH (not PUT) — PATCH merges fields rather than replacing the entire event.
  // PUT would wipe any attendees/fields not included in the body.
  const inviteeList = (event.invitees||[]).filter(Boolean);
  const body = {
    summary: event.title || 'Untitled Event',
    description: event.details || '',
    start,
    end,
    // Only include attendees if we have them — PATCH won't remove existing ones if omitted
    ...(inviteeList.length > 0 ? { attendees: inviteeList.map(email=>({email})) } : {}),
  };
  console.log('updateEventInCalendar PATCH body:', JSON.stringify({
    gcalId, summary: body.summary, attendees: body.attendees||'(not included)', start, end
  }));
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalId}?sendUpdates=all`, {
    method: 'PATCH',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    console.error('updateEventInCalendar failed:', res.status, err?.error?.message);
  } else {
    console.log('updateEventInCalendar succeeded:', res.status);
  }
}

async function calendarRequest(url, opts = {}) {

    console.error('Calendar API error', res.status, detail, url);

  }
  return res;

// Pull events from Google Calendar that don't exist in local data (constructive only)
async function pullNewFromCalendar(weekData) {
  const token = getToken();
  if (!token) return null;
  const now = new Date();
  const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
  const oneYearFwd = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
  const baseParams = `timeMin=${oneYearAgo.toISOString()}&timeMax=${oneYearFwd.toISOString()}&singleEvents=true&maxResults=2500&showHiddenInvitations=true&fields=items(id,summary,description,start,end,extendedProperties,attendees,organizer),nextPageToken`;

  // Paginate through ALL results — maxResults=2500/page means a single request covers
  // most calendars, but we keep paginating via nextPageToken for very large ones.
  let gcalEvents = [];
  let pageToken = null;
  do {
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?${baseParams}${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) {
      let detail = '';
      try { const j = await res.clone().json(); detail = j?.error?.message || ''; } catch {}
      console.error('Calendar pull failed:', res.status, detail);
      throw new Error(`Calendar error ${res.status}${detail ? ': ' + detail : ''}`);
    }
    const data = await res.json();
    gcalEvents = gcalEvents.concat(data.items || []);
    pageToken = data.nextPageToken || null;
  } while (pageToken);

  console.log('Calendar pull: fetched', gcalEvents.length, 'events total');

  // Build a map of gcalId → local task for quick lookup
  const gcalIdToTask = {}; // gcalId → {task, wk, dayKey}
  const existingPlannerIds = new Set();
  Object.entries(weekData).forEach(([wk, wd]) => {
    Object.entries(wd.tasks || {}).forEach(([dayKey, tasks]) => {
      tasks.filter(t => t.isEvent).forEach(t => {
        existingPlannerIds.add(t.id);
        if (t.gcalId) gcalIdToTask[t.gcalId] = {task: t, wk, dayKey};
      });
    });
  });

  const newWeekData = JSON.parse(JSON.stringify(weekData));
  let added = 0, updated = 0, durFixed = 0;
  const addedDates = [];

  gcalEvents.forEach(ev => {
    const newDateStr = ev.start?.date || ev.start?.dateTime?.slice(0, 10);
    if (!newDateStr) {
      console.warn('Calendar sync: skipping event with no start date', ev.id, ev.summary);
      return;
    }
    const newTimeStr = ev.start?.dateTime ? ev.start.dateTime.slice(11, 16) : '';
    // v5.16.0: real length of a timed event, in minutes (same-day events only; otherwise left to the default)
    let newDur = 0;
    if (ev.start?.dateTime && ev.end?.dateTime && ev.end.dateTime.slice(0, 10) === newDateStr) {
      const a = tbMin(newTimeStr), b = tbMin(ev.end.dateTime.slice(11, 16));
      if (a != null && b != null && b > a) newDur = b - a;
    }

    if (gcalIdToTask[ev.id]) {
      // Event exists in app — update title, details, time, and date if changed
      const {task, wk, dayKey} = gcalIdToTask[ev.id];
      const changed = task.title !== (ev.summary||'') ||
        task.details !== (ev.description||'') ||
        task.eventTime !== newTimeStr ||
        dayKey !== newDateStr;
      if (!changed) {
        // Only the length differs: store it in place (no move, no "updated" count)
        if (newDur && (task.durMin || 0) !== newDur) {
          const tl = newWeekData[wk].tasks[dayKey] || [];
          const ti = tl.findIndex(t => t.id === task.id);
          if (ti >= 0) { tl[ti] = { ...tl[ti], durMin: newDur }; durFixed++; }
        }
        console.log('Calendar sync: already up-to-date', ev.id, ev.summary, 'on', dayKey);
        return;
      }
      updated++;
      // Remove from old location
      newWeekData[wk].tasks[dayKey] = (newWeekData[wk].tasks[dayKey] || []).filter(t => t.id !== task.id);
      // Insert at new location
      const newDateObj = new Date(newDateStr + 'T00:00:00');
      const newWeekKey = fmt(getWeekStart(newDateObj));
      if (!newWeekData[newWeekKey]) newWeekData[newWeekKey] = {proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{}};
      if (!newWeekData[newWeekKey].tasks[newDateStr]) newWeekData[newWeekKey].tasks[newDateStr] = [];
      // Find my responseStatus if I'm an attendee
      const myEmail = typeof getSavedEmail === 'function' ? getSavedEmail() : null;
      const myAttendee = myEmail && (ev.attendees||[]).find(a => a.email?.toLowerCase()===myEmail.toLowerCase());
      const responseStatus = myAttendee?.responseStatus || null;
      newWeekData[newWeekKey].tasks[newDateStr].push({
        ...task, title: ev.summary||'', details: ev.description||'', eventTime: newTimeStr,
        ...(newDur ? { durMin: newDur } : {}),
        responseStatus, calendarInvite: !!myAttendee,
      });
    } else {
      // Net new event — add it
      const plannerId = ev.extendedProperties?.private?.plannerId;
      if (plannerId && existingPlannerIds.has(plannerId)) {
        console.log('Calendar sync: skipping (plannerId match)', ev.id, ev.summary);
        return; // already tracked
      }
      added++;
      addedDates.push(newDateStr);
      const newDateObj = new Date(newDateStr + 'T00:00:00');
      const newWeekKey = fmt(getWeekStart(newDateObj));
      if (!newWeekData[newWeekKey]) newWeekData[newWeekKey] = {proverb:'',toCreate:[],weekGoals:[],people:[],beWord:'',proud:'',story:'',tasks:{}};
      if (!newWeekData[newWeekKey].tasks[newDateStr]) newWeekData[newWeekKey].tasks[newDateStr] = [];
      const myEmail2 = typeof getSavedEmail === 'function' ? getSavedEmail() : null;
      const myAttendee2 = myEmail2 && (ev.attendees||[]).find(a => a.email?.toLowerCase()===myEmail2.toLowerCase());
      const responseStatus2 = myAttendee2?.responseStatus || null;
      newWeekData[newWeekKey].tasks[newDateStr].push({
        id: 'gcal_' + ev.id, gcalId: ev.id,
        title: ev.summary||'', details: ev.description||'',
        done: false, expanded: false, colorIndex: 3,
        isEvent: true, eventTime: newTimeStr, ...(newDur ? { durMin: newDur } : {}),
        responseStatus: responseStatus2, calendarInvite: !!myAttendee2,
      });
    }
  });

  return { added, updated, durFixed, newWeekData, addedDates };
}

function useStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); }
      catch { try { localStorage.removeItem(key); } catch {} }   // never leave a stale copy behind
      return next;
    });
  }, [key]);
  return [val, set];
}

function SortableChecklist({ items, onUpdate, onAdd, onDelete, onReorder, placeholder }) {
  const [dragId, setDragId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const [pendingFocusId, setPendingFocusId] = useState(null);
  const inputRefs = useRef({});

  function handleKeyDown(e, item, idx) {
    if (e.key === 'Enter') {
      e.preventDefault();
      // Generate the new id here so we can focus it after render
      const newId = Date.now().toString();
      setPendingFocusId(newId);
      onAdd(item.id, newId);
    }
  }

  function handleBlur(item) {
    if (!item.name.trim()) {
      onDelete(item.id);
    }
  }

  function handleDragStart(e, id) {
    setDragId(id);
    e.dataTransfer.effectAllowed = 'move';
  }
  function handleDragOver(e, id) {
    e.preventDefault();
    if (id !== dragId) setDragOverId(id);
  }
  function handleDrop(e, id) {
    e.preventDefault();
    if (dragId && id !== dragId) onReorder(dragId, id);
    setDragId(null); setDragOverId(null);
  }
  function handleDragEnd() { setDragId(null); setDragOverId(null); }

  // Focus the newly added item once its ref is registered
  useEffect(() => {
    if (pendingFocusId && inputRefs.current[pendingFocusId]) {
      inputRefs.current[pendingFocusId].focus();
      setPendingFocusId(null);
    }
  });

  // Auto-size all textareas on mount and whenever items change
  useEffect(() => {
    Object.values(inputRefs.current).forEach(el => {
      if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    });
  }, [items]);

  return (
    <>
      {items.map((item, idx) => (
        <div key={item.id}
          className={`checklist-item ${item.done?'checked':''} ${dragOverId===item.id?'drag-over':''} ${dragId===item.id?'dragging':''}`}
          draggable
          onDragStart={e=>handleDragStart(e,item.id)}
          onDragOver={e=>handleDragOver(e,item.id)}
          onDrop={e=>handleDrop(e,item.id)}
          onDragEnd={handleDragEnd}>
          <span className="checklist-drag-handle">⣿</span>
          <div className={`check-box ${item.done?'checked':''}`} onClick={()=>onUpdate(item.id,{done:!item.done})} />
          <textarea
            ref={el=>inputRefs.current[item.id]=el}
            className="checklist-input"
            placeholder={placeholder}
            value={item.name}
            rows={1}
            onChange={e=>{
              onUpdate(item.id,{name:e.target.value});
              e.target.style.height='auto';
              e.target.style.height=e.target.scrollHeight+'px';
            }}
            onKeyDown={e=>handleKeyDown(e,item,idx)}
            onBlur={()=>handleBlur(item)}
          />
          <button className="delete-item-btn" onClick={()=>onDelete(item.id)}>✕</button>
        </div>
      ))}
    </>
  );
}

// ─────────────────────────────────────────────
// WEEKLY REVIEW (v4.7.0)
// A four-step guided close-out of the displayed week: how it went → where unfinished tasks go →
// a goals check-in → reflect and set next week's top 3. Reads the week it is given, so reviewing
// an older week works the same way. Writes go through the Weekly Planner's own task helpers, so
// cross-week moves, calendar sync and Undo all behave exactly as they do elsewhere.
// ─────────────────────────────────────────────
function WeekReview({ weekStart, wd, goals, setGoals, habitGoals, habitCompletions, fitnessLog,
                      fitnessExercises, mctx, onMoveTask, onDeleteTask, onAddTask, onSetWD, onNavWeek,
                      onGoToWeek, onOpenGoal, onClose }) {
  const [step, setStep] = useState(1);
  const [custom, setCustom] = useState(null);     // id of the row whose date picker is open
  const [top3, setTop3] = useState(['', '', '']);
  const [goalDraft, setGoalDraft] = useState({}); // goalId -> text of the task being added
  // Switching weeks: the drafts belong to the week you were on, so clear them. Keep the step.
  const wkId = fmt(weekStart);
  useEffect(() => { setTop3(['', '', '']); setGoalDraft({}); setCustom(null); }, [wkId]);
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const nextMon = addDays(weekStart, 8);          // weekStart is Sunday, so +8 is next Monday
  const nextMonKey = fmt(nextMon);
  const label = `${fmtDisplay(days[0])} – ${fmtDisplay(days[6])}`;
  // Goal task scheduledDate uses fmtLocal while weekData day keys use fmt; in a negative UTC
  // offset these agree, but match on both so a goal task is never missed. (See KI-4.)
  const dayKeys = days.map(d => fmt(d));
  const inWeek = new Set([...dayKeys, ...days.map(d => fmtLocal(d))]);

  // ── What happened this week ──
  const rows = [];
  dayKeys.forEach((dk, i) => ((wd.tasks || {})[dk] || []).forEach(t => {
    if ((t.title || '').trim()) rows.push({ kind: 'task', id: t.id, dk, dayIdx: i, title: t.title, done: !!t.done, task: t });
  }));
  (goals || []).forEach(g => (g.milestones || []).forEach(m => (m.tasks || []).forEach(t => {
    if (!t.scheduledDate || !inWeek.has(t.scheduledDate)) return;
    const d = parseLocal(t.scheduledDate);
    rows.push({ kind: 'goal', id: t.id, dk: t.scheduledDate, dayIdx: d ? d.getDay() : 0,
      title: t.title || 'Untitled task', done: !!t.done, g, m });
  })));
  const taskRows = rows.filter(r => r.kind === 'task');
  const goalRows = rows.filter(r => r.kind === 'goal');
  const unfinished = rows.filter(r => !r.done);
  const perDay = dayKeys.map((_, i) => rows.filter(r => r.dayIdx === i && r.done).length);
  const busiest = perDay.indexOf(Math.max(...perDay));
  const quietest = perDay.indexOf(Math.min(...perDay));

  const habitStats = (habitGoals || []).map(h => ({ h, ...habitWeekStats(h, habitCompletions, weekStart) }));
  const habitTotal = habitStats.reduce((s, x) => s + x.target, 0);
  const habitHit = habitStats.reduce((s, x) => s + Math.min(x.done, x.target), 0);
  const workouts = dayKeys.filter(dk => ((fitnessLog || {})[dk] || []).length > 0).length;
  const activeGoals = (goals || []).filter(g => g.status === 'active');

  // ── Moving an unfinished task ──
  function place(r, toKey) {
    if (r.kind === 'task') {
      const from = r.dk;
      onMoveTask(from, toKey, r.id);
      Undo.push(`Moved "${r.title.trim().slice(0, 30)}" to ${glShort(toKey)}`, () => onMoveTask(toKey, from, r.id));
    } else {
      const from = r.dk;
      setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: toKey }));
      Undo.push(`Moved "${r.title.trim().slice(0, 30)}" to ${glShort(toKey)}`,
        () => setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: from })));
    }
    setCustom(null);
  }
  function drop(r) {
    if (r.kind === 'task') { onDeleteTask(r.dk, r.id); return; }
    const from = r.dk;
    setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: '' }));
    Undo.push(`Unscheduled "${r.title.trim().slice(0, 30)}"`,
      () => setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: from })));
    setCustom(null);
  }
  function moveAll() {
    const list = [...unfinished];
    list.forEach(r => {
      if (r.kind === 'task') onMoveTask(r.dk, nextMonKey, r.id);
      else setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: nextMonKey }));
    });
    Undo.push(`Moved ${list.length} task${list.length === 1 ? '' : 's'} to ${glShort(nextMonKey)}`, () => list.forEach(r => {
      if (r.kind === 'task') onMoveTask(nextMonKey, r.dk, r.id);
      else setGoals(gs => glPatchTask(gs, r.g.id, r.m.id, r.id, { scheduledDate: r.dk }));
    }));
  }
  function addGoalTask(g) {
    const title = (goalDraft[g.id] || '').trim();
    if (!title) return;
    const m = glNextMilestone(g) || (g.milestones || [])[0];
    if (!m) return;
    const t = { id: glId('t'), title, scheduledDate: fmtLocal(nextMon), done: false, completedAt: null };
    setGoals(gs => glPatchGoal(gs, g.id, gg => glPatchMs(gg, m.id, mm => ({ ...mm, tasks: [...(mm.tasks || []), t] }))));
    setGoalDraft(d => ({ ...d, [g.id]: '' }));
  }
  // Closing by tapping outside after step 1 still counts as having done the review (the moves
  // and edits made along the way are already saved), so the "review due" nudge doesn't return.
  function dismiss() {
    if (step > 1) onSetWD(w => (w.reviewedAt ? w : { ...w, reviewedAt: Date.now() }));
    onClose();
  }
  function finish() {
    // Top 3 become starred tasks at the top of next Monday, in the order they were typed
    top3.map(s => s.trim()).filter(Boolean).reverse().forEach(title => onAddTask(nextMonKey, title, true));
    onSetWD(w => ({ ...w, reviewedAt: Date.now() }));
    onClose();
  }

  // Say plainly which week this is, relative to now — the review can point anywhere (v4.7.1)
  const curWkKey = fmt(getWeekStart(new Date()));
  const weeksBack = Math.round((parseLocal(curWkKey) - parseLocal(wkId)) / 604800000);
  const whichWeek = weeksBack === 0 ? 'This week — still in progress.'
    : weeksBack === 1 ? 'Last week.'
    : weeksBack > 1 ? `${weeksBack} weeks ago.`
    : weeksBack === -1 ? 'Next week — it hasn’t happened yet.'
    : `${-weeksBack} weeks ahead — it hasn’t happened yet.`;

  const heads = [
    ['How the week went', whichWeek],
    ['Unfinished tasks', unfinished.length ? `${unfinished.length} task${unfinished.length === 1 ? '' : 's'} didn't get done. Decide where each goes.` : 'Nothing left over — the whole week is closed out.'],
    ['Goals check-in', 'Work done versus time used, per goal.'],
    ['Reflect and plan', "Saved into this week's notes and next week's top 3."],
  ];
  const nextLabel = ['Next: unfinished tasks', 'Next: goals', 'Next: reflect and plan', 'Finish review'][step - 1];

  return (
    <div className="wr-overlay" onClick={dismiss}>
      <div className="wr-box" role="dialog" aria-label="Weekly review" onClick={e => e.stopPropagation()}>
        <div className="wr-head">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <div className="wr-step">Week review · Step {step} of 4</div>
            {onNavWeek && (
              <div className="wr-weeknav">
                <button type="button" aria-label="Review the week before" onClick={() => onNavWeek(-1)}>‹</button>
                <span className="wk">{label}</span>
                <button type="button" aria-label="Review the week after" onClick={() => onNavWeek(1)}>›</button>
              </div>
            )}
          </div>
          <div className="wr-title">{heads[step - 1][0]}</div>
          <div className="wr-sub">{heads[step - 1][1]}</div>
          {onGoToWeek && weeksBack !== 0 && (
            <button type="button" className="wr-open-wk" onClick={onGoToWeek}>Open this week in the planner</button>
          )}
        </div>
        <div className="wr-body">

          {step === 1 && (<>
            <div className="wr-stats">
              <div className="wr-stat"><b>{taskRows.filter(r => r.done).length}</b><em>of {taskRows.length}</em><span>Tasks done</span></div>
              <div className="wr-stat"><b>{habitTotal ? Math.round(habitHit / habitTotal * 100) : 0}%</b><em>&nbsp;</em><span>Habits completed</span></div>
              <div className="wr-stat"><b>{workouts}</b><em>of 7 days</em><span>Workouts logged</span></div>
              <div className="wr-stat"><b>{goalRows.filter(r => r.done).length}</b><em>of {goalRows.length}</em><span>Goal tasks done</span></div>
            </div>
            {habitStats.length > 0 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                <span className="wr-sec-label">Habits this week</span>
                {habitStats.map(({ h, done, target, pct }) => (
                  <div key={h.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ width: 9, height: 9, borderRadius: '50%', background: h.color || 'var(--accent)', flexShrink: 0 }} />
                    <span style={{ flex: 1, minWidth: 0, fontSize: 13.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{h.name || 'Habit'}</span>
                    <div className="gl-bar" style={{ width: 90, height: 6, flexShrink: 0 }}>
                      <div style={{ width: Math.round(pct * 100) + '%', background: h.color || 'var(--accent)' }} />
                    </div>
                    <span className="gl-mono" style={{ fontSize: 12, color: 'var(--ink-light)', minWidth: 34, textAlign: 'right', flexShrink: 0 }}>{done}/{target}</span>
                  </div>
                ))}
              </div>
            )}
            {rows.some(r => r.done) && (
              <div style={{ fontSize: 13, color: 'var(--ink-light)', lineHeight: 1.6 }}>
                Busiest day: <b style={{ color: 'var(--ink)' }}>{DAYS[busiest]}</b>, with {perDay[busiest]} task{perDay[busiest] === 1 ? '' : 's'} done.
                {busiest !== quietest && <> Quietest: <b style={{ color: 'var(--ink)' }}>{DAYS[quietest]}</b>, with {perDay[quietest]}.</>}
              </div>
            )}
          </>)}

          {step === 2 && (unfinished.length ? (<>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <button className="wr-btn primary" onClick={moveAll}>Move all {unfinished.length} to {DAYS[1]}, {fmtDisplay(nextMon)}</button>
              <span style={{ fontSize: 12.5, color: 'var(--ink-light)' }}>or choose for each task</span>
            </div>
            {unfinished.map(r => {
              const sameDay = fmt(addDays(nextMon, (r.dayIdx + 6) % 7));   // same weekday, next week
              return (
                <div key={r.kind + r.id} className="wr-item">
                  <span className="t">{r.title.trim() || 'Untitled'}</span>
                  <span className="from">{r.kind === 'goal' ? `${r.g.title || 'Goal'} · ` : ''}From {DAYS[r.dayIdx].slice(0, 3)}</span>
                  <button className="wr-mini" onClick={() => place(r, nextMonKey)}>Mon</button>
                  {sameDay !== nextMonKey && <button className="wr-mini" onClick={() => place(r, sameDay)}>{DAYS[r.dayIdx].slice(0, 3)}</button>}
                  {custom === r.kind + r.id ? (
                    <input type="date" className="wr-mini" autoFocus defaultValue={nextMonKey}
                      onChange={e => e.target.value && place(r, e.target.value)} onBlur={() => setCustom(null)} />
                  ) : (
                    <button className="wr-mini" onClick={() => setCustom(r.kind + r.id)}>Pick day</button>
                  )}
                  <button className="wr-mini drop" onClick={() => drop(r)}>Drop</button>
                </div>
              );
            })}
          </>) : (
            <div className="wr-done">Nothing left over. Everything you planned this week is done or already moved.</div>
          ))}

          {step === 3 && (activeGoals.length ? activeGoals.map(g => {
            const h = glHealth(g, glToday());
            const m = glNextMilestone(g);
            return (
              <div key={g.id} className="wr-goal">
                <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
                  <span className="gl-dot" style={{ background: g.color }} />
                  <span style={{ flex: 1, minWidth: 0, fontSize: 15, fontWeight: 600, cursor: 'pointer', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}
                    onClick={() => { onClose(); onOpenGoal(g.id); }}>{g.title || 'Untitled goal'}</span>
                  <GlHealthPill h={h} />
                </div>
                {[['Work done', h.p], ['Time used', h.used]].map(([lab, v]) => (
                  <div key={lab} style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
                    <span style={{ fontSize: 12, color: 'var(--ink-light)', width: 72, flexShrink: 0 }}>{lab}</span>
                    <div className="gl-bar" style={{ flex: 1, height: 7, background: glTint(g.color, 0.15) }}>
                      <div style={{ width: Math.round(v * 100) + '%', background: lab === 'Work done' ? g.color : glTint(g.color, 0.45) }} />
                    </div>
                    <span className="gl-mono" style={{ fontSize: 12, color: 'var(--ink-light)', minWidth: 34, textAlign: 'right', flexShrink: 0 }}>{Math.round(v * 100)}%</span>
                  </div>
                ))}
                <GlLinksRow goal={g} habitGoals={habitGoals} fitnessExercises={fitnessExercises} mctx={mctx}
                  habitCompletions={habitCompletions} fitnessLog={fitnessLog} weekStart={weekStart} />
                {m && <div style={{ fontSize: 12.5, color: 'var(--ink-light)' }}>Next: {m.title || 'Untitled milestone'}{m.dueDate ? ` · due ${glShort(m.dueDate)}` : ''}</div>}
                <div style={{ display: 'flex', gap: 7 }}>
                  <input className="wr-in" style={{ flex: 1, minHeight: 34, fontSize: 13 }}
                    placeholder={(g.milestones || []).length ? 'Add a task for next week…' : 'Add a milestone first'}
                    disabled={!(g.milestones || []).length} value={goalDraft[g.id] || ''}
                    onChange={e => setGoalDraft(d => ({ ...d, [g.id]: e.target.value }))}
                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addGoalTask(g); } }} />
                  <button className="wr-mini" disabled={!(goalDraft[g.id] || '').trim()} onClick={() => addGoalTask(g)}>Add</button>
                </div>
              </div>
            );
          }) : (
            <div className="wr-done">No active goals. Create one on the Goals tab and it shows up here.</div>
          ))}

          {step === 4 && (<>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              <span className="wr-sec-label">This week, I was proud that I:</span>
              <textarea className="wr-ta" placeholder="Write about your proudest moment…" value={wd.proud || ''}
                onChange={e => { const v = e.target.value; onSetWD(w => ({ ...w, proud: v })); }} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              <span className="wr-sec-label">Best story this week</span>
              <textarea className="wr-ta" placeholder="What's the best story from this week?" value={wd.story || ''}
                onChange={e => { const v = e.target.value; onSetWD(w => ({ ...w, story: v })); }} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <span className="wr-sec-label">Top 3 for next week</span>
              {[0, 1, 2].map(i => (
                <input key={i} className="wr-in" placeholder={`${i + 1}.`} value={top3[i]}
                  onChange={e => setTop3(t => { const n = [...t]; n[i] = e.target.value; return n; })} />
              ))}
              <span style={{ fontSize: 11.5, color: 'var(--ink-faint)' }}>★ Added to the top of {DAYS[1]}, {fmtDisplay(nextMon)} when you finish.</span>
            </div>
          </>)}

        </div>
        <div className="wr-foot">
          {step > 1
            ? <button className="wr-btn ghost" onClick={() => setStep(s => s - 1)}>‹ Back</button>
            : <button className="wr-btn ghost" onClick={onClose}>Close</button>}
          <div className="wr-dots" aria-hidden="true">{[1, 2, 3, 4].map(i => <i key={i} className={i <= step ? 'on' : ''} />)}</div>
          <button className="wr-btn primary" onClick={() => step < 4 ? setStep(s => s + 1) : finish()}>{nextLabel}</button>
        </div>
      </div>
    </div>
  );
}

function WeeklyPlanner({ weekData, setWeekData, pagesData, setPagesData, onGoToHabit, calHeaderColor, setCalHeaderColor, habitGoals, habitCompletions, setHabitCompletions, habitQty, setHabitQty, habitNotes, setHabitNotes, peopleDirectory, setPeopleDirectory, goals, setGoals, onOpenGoal, fitnessLog, fitnessExercises, mctx, reviewOpen, setReviewOpen, repeatSeries, seriesRun }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [weekStart, setWeekStartRaw] = useState(() => {
    const saved = parseLocal(sessionStorage.getItem('lp_weekStart'));
    return saved ? getWeekStart(saved) : getWeekStart(today);
  });
  const setWeekStart = (v) => setWeekStartRaw(prev => {
    const next = typeof v === 'function' ? v(prev) : v;
    sessionStorage.setItem('lp_weekStart', fmtLocal(next));
    return next;
  });
  const weekKey = fmt(weekStart);
  const weekDataRef = useRef(weekData);
  useEffect(() => { weekDataRef.current = weekData; }, [weekData]);

  // Auto-focus newly created task title
  // Both desktop grid and mobile day view render today's tasks simultaneously and share
  // task ids — we use separate ref maps and pick from whichever view is visible.
  useEffect(() => {
    if (pendingTaskFocus.current) {
      const {id} = pendingTaskFocus.current;
      const isMobileView = window.matchMedia('(max-width: 767px)').matches;
      const el = isMobileView
        ? (taskTitleRefsMobile.current[id] || taskTitleRefs.current[id])
        : (taskTitleRefs.current[id] || taskTitleRefsMobile.current[id]);
      if (el) {
        el.focus();
        pendingTaskFocus.current = null;
      } else {
        setTimeout(() => {
          const isMobile = window.matchMedia('(max-width: 767px)').matches;
          const el2 = isMobile
            ? (taskTitleRefsMobile.current[id] || taskTitleRefs.current[id])
            : (taskTitleRefs.current[id] || taskTitleRefsMobile.current[id]);
          if (el2) { el2.focus(); pendingTaskFocus.current = null; }
        }, 50);
      }
    }
  });
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileDayIndex, setMobileDayIndexRaw] = useState(() => {
    const saved = sessionStorage.getItem('lp_mobileDayIndex');
    return saved !== null ? parseInt(saved, 10) : today.getDay();
  }); // 0=Sun
  const setMobileDayIndex = (v) => setMobileDayIndexRaw(prev => {
    const next = typeof v === 'function' ? v(prev) : v;
    sessionStorage.setItem('lp_mobileDayIndex', String(next));
    return next;
  });
  const [swipeNav, setSwipeNav] = useState(() => {
    const v = localStorage.getItem('lp_weeklySwipeNav');
    return v === null ? false : v === 'true';
  });
  const toggleSwipeNav = () => setSwipeNav(v => {
    const next = !v;
    localStorage.setItem('lp_weeklySwipeNav', String(next));
    return next;
  });
  const [sheetOpen, setSheetOpen] = useState(false);
  const [wkView, setWkView] = useWeekView();   // v5.16.0: 'list' | 'blocks' (per device)
  const [showPeoplePicker, setShowPeoplePicker] = useState(false);
  const [showRepeatCleanup, setShowRepeatCleanup] = useState(false);
  const [repeatScope, setRepeatScope] = useState(null); // {kind:'delete'|'apply', task, dayKey, rule?}
  const [seriesPrompt, setSeriesPrompt] = useState(null);  // v5.4.0: offer to copy an edit to the rest of a repeating series
  const seriesEditRef = useRef(null);                      // edit waiting for blur: {repeatId, dayKey, id, patch}
  const seriesTimerRef = useRef(null);
  const [reviewWeek, setReviewWeek] = useState(null);   // week-start Date the review is looking at
  const pendingTaskFocus = useRef(null); // {id, dayKey} — task to focus after render
  const taskTitleRefs = useRef({}); // id -> input ref (desktop)
  const taskTitleRefsMobile = useRef({}); // id -> input ref (mobile)
  const [taskClipboard, setTaskClipboard] = useState(null); // copied task object
  const [ctxMenu, setCtxMenu] = useState(null); // {x,y,onCopy,onPaste,hasCopied}

  // Per-week data — now uses shared weekData prop

  function getWD() { return weekData[weekKey] || { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} }; }
  function setWD(fn) {
    setWeekData(wd => {
      const cur = wd[weekKey] || { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} };
      return { ...wd, [weekKey]: typeof fn === 'function' ? fn(cur) : fn };
    });
  }

  const wd = getWD();
  // ── Weekly Review week targeting (v4.7.0) ──
  // The review can look at ANY week, not just the displayed one, so `reviewWeek` is its own state.
  // Default when opening: the week that just ended if you're sitting in a barely-started current
  // week (Sunday or Monday); otherwise the week you're looking at. Arrows in the review move it.
  function emptyWeekObj() { return { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} }; }
  function wdFor(ws) { return weekData[fmt(ws)] || emptyWeekObj(); }
  function setWDFor(ws, fn) {
    const wk = fmt(ws);
    setWeekData(all => ({ ...all, [wk]: typeof fn === 'function' ? fn(all[wk] || emptyWeekObj()) : fn }));
  }
  function defaultReviewWeek() {
    const now = new Date();

    const justStarted = [0, 1].includes(now.getDay());          // Sunday or Monday
    const viewingCurrent = weekKey === fmt(getWeekStart(now));
    return (viewingCurrent && justStarted) ? addDays(weekStart, -7) : weekStart;
  }
  useEffect(() => { setReviewWeek(reviewOpen ? defaultReviewWeek() : null); }, [reviewOpen]);
  // The button is "due" while the week on offer hasn't been reviewed yet
  const reviewTarget = reviewOpen && reviewWeek ? reviewWeek : defaultReviewWeek();
  const reviewDue = !wdFor(reviewTarget).reviewedAt;

  // Tasks: { [dayKey]: [{id, title, details, done, color, expanded, order}] }
  function getTasks(dayKey) { return (wd.tasks||{})[dayKey] || []; }
  function getDayNote(dayKey) { return (wd.dayNotes||{})[dayKey] || ''; }
  function setDayNote(dayKey, note) {
    setWD(w => ({...w, dayNotes: {...(w.dayNotes||{}), [dayKey]: note}}));
  }
  // Reads from ref — safe to call from debounced callbacks where closure may be stale
  function getTasksFresh(wk, dayKey) {
    return ((weekDataRef.current[wk]||{}).tasks||{})[dayKey] || [];
  }
  function setTasks(dayKey, fn) {
    setWD(w => {
      const current = (w.tasks||{})[dayKey] || [];
      return { ...w, tasks: { ...(w.tasks||{}), [dayKey]: typeof fn==='function' ? fn(current) : fn } };
    });
  }
  // v4.7.1 — same as setTasks/getTasks but resolving the week from the day itself rather than
  // assuming the displayed week. The Weekly Review can point at a week other than the one on
  // screen, and setWD/getTasks would silently read and write the wrong bucket.
  function weekKeyOf(dayKey) { return fmt(getWeekStart(parseLocal(dayKey) || new Date(dayKey))); }
  function getTasksAnyWeek(dayKey) { return (((weekDataRef.current[weekKeyOf(dayKey)]||{}).tasks)||{})[dayKey] || []; }
  function setTasksAnyWeek(dayKey, fn) {
    const wk = weekKeyOf(dayKey);
    setWeekData(all => {
      const week = all[wk] || { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} };
      const current = (week.tasks||{})[dayKey] || [];
      return { ...all, [wk]: { ...week, tasks: { ...(week.tasks||{}), [dayKey]: typeof fn==='function' ? fn(current) : fn } } };
    });
  }

  // Apply a repeat rule to a task (see repeatApply). split=true starts a new series from this task.
  function applyRepeatRule(task, dayKey, rule, split) {
    // v5.6.0: new and generated repeating tasks are stored once as a series; old materialized series keep the legacy path
    const ser = task.repeatId && (repeatSeries || {})[task.repeatId];
    if (seriesRun && (!task.repeatId || ser)) {
      let src = task, dk = dayKey;
      if (ser && !split) {                                   // "all": the rule belongs to the series, so change it at its first task
        const a = getTasksAnyWeek(ser.anchor).find(t => t.repeatId === task.repeatId);
        if (a) { src = a; dk = ser.anchor; }
      }
      seriesRun('Repeat rule changed', (st, se) => repeatApplySeries(st, se, src, dk, rule));
      return;
    }
    const todayKey = fmtLocal(new Date());
    const before = weekData;
    const res = repeatApply(before, task, dayKey, rule, split, todayKey);
    const touched = Object.keys(res.wd).filter(k => res.wd[k] !== before[k]);
    setWeekData(wd => { const o = { ...wd }; touched.forEach(k => { o[k] = res.wd[k]; }); return o; });
    // Undo puts back only the weeks the rule change touched, so edits made elsewhere in the meantime stay
    Undo.push('Repeat rule changed', () => setWeekData(wd => {
      const o = { ...wd };
      touched.forEach(k => { if (before[k] === undefined) delete o[k]; else o[k] = before[k]; });
      return o;
    }));
  }
  // Changing the rule of a task that already has other copies asks which ones to change
  function requestApplyRepeat(task, dayKey, rule) {
    if (task.repeatId && collectInstances(t => t.repeatId === task.repeatId).length > 1) {
      setRepeatScope({ kind: 'apply', task, dayKey, rule });
    } else {
      applyRepeatRule(task, dayKey, rule, false);
    }
  }
  function runRepeatScope(sc, choice) {
    const { task, dayKey } = sc;
    if (sc.kind === 'delete') {
      if (choice === 'one') deleteTask(dayKey, task.id);
      else if (choice === 'following') deleteTaskAndFuture(dayKey, task.id);
      else deleteRepeatGroup(null, task.repeatId, task.title, task.repeat && task.repeat.days);
    } else {
      applyRepeatRule(task, dayKey, sc.rule, choice === 'following');
    }
  }

  // Scan all weekData and group repeat task instances.
  // New tasks: keyed by repeatId. Legacy tasks (no repeatId): keyed by title+days combo.
  function getRepeatGroups() {
    const groups = {}; // key -> { key, title, days, endDate, count, instances:[{wk,dk,id}] }
    Object.entries(weekData).forEach(([wk, wkData]) => {
      Object.entries((wkData.tasks)||{}).forEach(([dk, tasks]) => {
        (tasks||[]).forEach(t => {
          if (!t.repeat?.days?.length && !t.repeatId) return; // not a repeat task
          const key = t.repeatId
            ? `id:${t.repeatId}`
            : `legacy:${t.title}:${JSON.stringify((t.repeat?.days||[]).slice().sort())}`;
          if (!groups[key]) {
            groups[key] = {
              key, title: t.title||'(untitled)',
              days: t.repeat?.days || [],
              endDate: t.repeat?.endDate || '',
              rule: t.repeat || null,
              repeatId: t.repeatId || null,
              instances: [],
            };
          }
          groups[key].instances.push({ wk, dk, id: t.id });
        });
      });
    });
    return Object.values(groups).filter(g => g.instances.length > 0)
      .sort((a,b) => a.title.localeCompare(b.title));
  }

  // "Stop repeating": keep this task as a one-off, end the series from the next day on
  function stopRepeating(task, dayKey) {
    const rid = task.repeatId;
    if (seriesRun && rid && (repeatSeries || {})[rid]) {
      seriesRun('Stopped repeating', (st, se) => repeatSeriesStop(st, se, rid, dayKey, task));
      return;
    }
    if (!rid) { setTasks(dayKey, ts => ts.map(t => t.id === task.id ? { ...t, repeat: null } : t)); return; }
    const removed = collectInstances(t => t.repeatId === rid, dayKey).filter(x => x.dk > dayKey);
    if (removed.length) Undo.push('Stopped repeating', () => removed.forEach(r => insertTaskBack(r.wk, r.dk, r.task, r.idx)));
    const prevDay = fmtLocal(addDays(parseLocal(dayKey), -1));
    setWeekData(wd => {
      const draft = JSON.parse(JSON.stringify(wd));
      Object.keys(draft).forEach(wk => {
        const tasks = draft[wk] && draft[wk].tasks; if (!tasks) return;
        Object.keys(tasks).forEach(dk => {
          if (dk > dayKey) { tasks[dk] = tasks[dk].filter(t => t.repeatId !== rid); return; }
          tasks[dk] = tasks[dk].map(t => {
            if (t.repeatId !== rid) return t;
            if (dk === dayKey && t.id === task.id) { const { repeat, repeatId, ...plain } = t; return plain; }
            return (dk < dayKey && t.repeat && t.repeat.endType === 'never') ? { ...t, repeat: { ...t.repeat, endType: 'date', endDate: prevDay } } : t;
          });
        });
      });
      return draft;
    });
  }
  // v5.6.0: old repeating tasks (a stored copy on every day) -> compact series
  function previewLegacyConvert() { return repeatConvertLegacy(weekData, repeatSeries || {}, fmtLocal(new Date())); }
  function runLegacyConvert() {
    let res = null;
    if (seriesRun) seriesRun('Converted repeating tasks', (st, se) => { res = repeatConvertLegacy(st, se, fmtLocal(new Date())); return res.converted.length ? res : null; });
    return res;
  }

  // Delete ALL instances of a repeat group (regardless of date — used by cleanup tool)
  function deleteRepeatGroup(groupKey, repeatId, title, days) {
    if (seriesRun && repeatId && (repeatSeries || {})[repeatId]) {
      seriesRun('Deleted repeating task', (st, se) => repeatSeriesDelete(st, se, repeatId, null));
      return;
    }
    {
      const sig = JSON.stringify((days||[]).slice().sort());
      const removed = collectInstances(t => repeatId
        ? t.repeatId === repeatId
        : (t.title === title && JSON.stringify((t.repeat?.days||[]).slice().sort()) === sig));
      if (removed.length) Undo.push(`Deleted ${removed.length} repeating task${removed.length===1?'':'s'}`, () => {
        removed.forEach(r => insertTaskBack(r.wk, r.dk, r.task, r.idx));
      });
    }
    setWeekData(wd => {
      const draft = JSON.parse(JSON.stringify(wd));
      Object.keys(draft).forEach(wk => {
        const tasks = draft[wk]?.tasks;
        if (!tasks) return;
        Object.keys(tasks).forEach(dk => {
          tasks[dk] = tasks[dk].filter(t => {
            if (repeatId) return t.repeatId !== repeatId;
            // Legacy match: same title and same days set
            const sameDays = JSON.stringify((t.repeat?.days||[]).slice().sort()) === JSON.stringify((days||[]).slice().sort());
            return !(t.title === title && sameDays);
          });
        });
      });
      return draft;
    });
  }

  function addTask(dayKey, afterId) {
    const id = Date.now().toString();
    pendingTaskFocus.current = {id, dayKey};
    if (afterId) {
      setTasks(dayKey, t => {
        const idx = t.findIndex(x=>x.id===afterId);
        const next = [...t];
        next.splice(idx+1, 0, {id, title:'', details:'', done:false, expanded:false, colorIndex: pickTaskColorIndex(t)});
        return next;
      });
    } else {
      setTasks(dayKey, t => [...t, {id, title:'', details:'', done:false, expanded:false, colorIndex: pickTaskColorIndex(t)}]);
    }
  }
  function updateTask(dayKey, id, patch) {
    // Pure state update — no calendar sync, safe to call on every keystroke
    setTasks(dayKey, t => t.map(x => x.id===id ? {...x,...patch} : x));
    // Sync back to pagesData if this is a project task
    // Read from weekDataRef (always current) rather than getTasks (stale at call time)
    const allDayTasks = ((weekDataRef.current[weekKey]||{}).tasks||{})[dayKey] || [];
    const task = allDayTasks.find(t => t.id===id);
    if (task?.isProjectTask && task?.projectDocId && setPagesData) {
      const syncFields = ['done','title','details','priority'];
      if (Object.keys(patch).some(k => syncFields.includes(k))) {
        setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : {
          ...doc, tasks: (doc.tasks||[]).map(t => t.id===id ? {...t,...patch} : t)
        }));
      }
    }

    // For non-text fields (isEvent toggle, eventTime), sync immediately with debounce
    const immediateFields = ['eventTime', 'isEvent', 'durMin'];
    if (Object.keys(patch).some(k => immediateFields.includes(k))) {
      syncTaskToCalendar(dayKey, id, patch);
    }
    // title and details are synced on blur via onBlurSync — not here

    // Repeating task: remember what changed so we can offer to copy it to the rest of the series (v5.4.0)
    if (task && task.repeatId) {
      const cp = {};
      Object.keys(patch).forEach(k => { if (SERIES_EDIT_FIELDS.includes(k)) cp[k] = patch[k]; });
      if (Object.keys(cp).length) {
        const cur = seriesEditRef.current;
        const same = cur && cur.repeatId === task.repeatId && cur.id === id;
        seriesEditRef.current = { repeatId: task.repeatId, dayKey, id, patch: { ...(same ? cur.patch : {}), ...cp } };
        // Text waits for blur; clicking a colour, priority or time asks right away
        if (Object.keys(cp).some(k => k !== 'title' && k !== 'details')) {
          clearTimeout(seriesTimerRef.current);
          seriesTimerRef.current = setTimeout(flushSeriesPrompt, 350);
        }
      }
    }
  }
  // Show the "apply to the rest?" bar for the edit waiting in seriesEditRef
  function flushSeriesPrompt() {
    clearTimeout(seriesTimerRef.current);
    const e = seriesEditRef.current;
    if (!e) return;
    seriesEditRef.current = null;
    if (typeof e.patch.title === 'string' && !e.patch.title.trim()) return;      // emptied title: the card is about to be removed
    const count = (fromDk) => collectInstances(t => t.repeatId === e.repeatId && t.id !== e.id && !t.done, fromDk)
      .filter(x => !fromDk || x.dk > e.dayKey).length;
    const following = count(e.dayKey), all = count(null);
    if (!all) return;
    const t = getTasksAnyWeek(e.dayKey).find(x => x.id === e.id);
    setSeriesPrompt({ ...e, following, all, label: ((t && t.title) || '').trim() || 'this task' });
  }
  // Copy the edit onto the other unfinished copies. 'following' = later ones only; 'all' = every unfinished copy.
  function applySeriesEdit(sp, scope) {
    const ser = (repeatSeries || {})[sp.repeatId];
    if (seriesRun && ser) {
      const edited = getTasksAnyWeek(sp.dayKey).find(t => t.id === sp.id) || null;
      seriesRun(scope === 'all' ? 'Updated the whole series' : 'Updated this and following', (st, se) =>
        scope === 'all' ? repeatSeriesEditAll(st, se, sp.repeatId, sp.patch, sp.id)
                        : repeatSeriesEditFollowing(st, se, sp.repeatId, sp.dayKey, sp.patch, edited));
      setSeriesPrompt(null);
      return;
    }
    const before = weekDataRef.current;
    const out = { ...before };
    const touched = [], cal = [];
    Object.entries(before).forEach(([wk, w]) => {
      const tasks = (w && w.tasks) || {};
      let nt = null;
      Object.entries(tasks).forEach(([dk, ts]) => {
        if (scope === 'following' && dk <= sp.dayKey) return;
        let changed = false;
        const nts = (ts || []).map(t => {
          if (t.repeatId !== sp.repeatId || t.id === sp.id || t.done) return t;
          changed = true;
          const u = { ...t, ...sp.patch };
          if (u.isEvent && u.gcalId) cal.push({ task: u, dk });
          return u;
        });
        if (changed) { if (!nt) nt = { ...tasks }; nt[dk] = nts; }
      });
      if (nt) { out[wk] = { ...w, tasks: nt }; touched.push(wk); }
    });
    if (!touched.length) { setSeriesPrompt(null); return; }
    setWeekData(wd => { const o = { ...wd }; touched.forEach(k => { o[k] = out[k]; }); return o; });
    Undo.push(scope === 'all' ? 'Updated the whole series' : 'Updated this and following', () => setWeekData(wd => {
      const o = { ...wd };
      touched.forEach(k => { o[k] = before[k]; });
      return o;
    }));
    // Copies that are already Google Calendar events get the change too (one after another, best effort)
    if (cal.length && getToken()) (async () => {
      for (const c of cal) { try { await updateEventInCalendar(c.task.gcalId, c.task, c.dk); } catch (err) { console.error('Calendar update failed:', err); } }
    })();
    setSeriesPrompt(null);
  }

  function syncTaskToCalendar(dayKey, id, patch = {}) {
    // Always reads fresh state from ref so we get the latest title/details/time
    const task0 = getTasksFresh(weekKey, dayKey).find(t => t.id===id);
    // v5.16.0: the ref still holds the pre-edit task when this runs straight after updateTask, so merge the
    // time fields from the patch (otherwise Google Calendar was sent the OLD time/length).
    const task = (task0 && ('eventTime' in patch || 'durMin' in patch)) ? { ...task0, ...('eventTime' in patch ? { eventTime: patch.eventTime } : {}), ...('durMin' in patch ? { durMin: patch.durMin } : {}) } : task0;
    if (!task || !getToken()) return;

    if (task.isEvent) {
      if (task.gcalId) {
        updateEventInCalendar(task.gcalId, task, dayKey)
          .catch(e => console.error('Calendar update failed:', e));
      } else {
        // No gcalId yet — push as new event
        pushEventToCalendar(task, dayKey)
          .then(gcalId => {
            if (gcalId) setTasks(dayKey, ts => ts.map(x => x.id===id ? {...x, gcalId} : x));
          })
          .catch(e => console.error('Calendar push failed:', e));
      }
    } else if (patch.isEvent === false && task.gcalId) {
      // Toggled from event to task — remove from calendar
      deleteEventFromCalendar(task.gcalId).catch(()=>{});
      setTasks(dayKey, ts => ts.map(x => x.id===id ? {...x, gcalId: null} : x));
    }
  }
  // Put a deleted task back (used by Undo). Only inserts if it isn't already there.
  function insertTaskBack(wk, dayKey, task, idx) {
    setWeekData(wd => {
      const week = wd[wk] || { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} };
      const list = (week.tasks||{})[dayKey] || [];
      if (list.some(t => t.id === task.id)) return wd;
      const next = [...list];
      next.splice(Math.min(idx, next.length), 0, task);
      return { ...wd, [wk]: { ...week, tasks: { ...(week.tasks||{}), [dayKey]: next } } };
    });
  }
  // Every instance (from fromDayKey on, if given) that matches, with where it lives
  function collectInstances(matcher, fromDayKey) {
    const out = [];
    Object.entries(weekDataRef.current).forEach(([wk, w]) => {
      Object.entries((w && w.tasks) || {}).forEach(([dk, ts]) => {
        if (fromDayKey && dk < fromDayKey) return;
        (ts||[]).forEach((t, i) => { if (matcher(t)) out.push({ wk, dk, idx: i, task: t }); });
      });
    });
    return out;
  }
  function deleteTask(dayKey, id) {
    // Week comes from the day, not from what's on screen — the Weekly Review may be reviewing
    // a different week than the planner is showing (v4.7.1).
    const wk = weekKeyOf(dayKey);
    const dayTasks = getTasksAnyWeek(dayKey);
    const idx = dayTasks.findIndex(t => t.id===id);
    const task = dayTasks[idx];
    const prevSched = task?.isProjectTask
      ? (((pagesData||[]).find(d => d.id === task.projectDocId)?.tasks||[]).find(t => t.id===id)?.scheduledDate || dayKey)
      : null;
    if (task && task.gcalId && getToken()) deleteEventFromCalendar(task.gcalId).catch(()=>{});
    // If this is a project task, clear its scheduledDate in pagesData (removes from planner but keeps in doc)
    if (task?.isProjectTask && task?.projectDocId && setPagesData) {
      setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : {
        ...doc, tasks: (doc.tasks||[]).map(t => t.id===id ? {...t, scheduledDate:''} : t)
      }));
    }
    setTasksAnyWeek(dayKey, t => t.filter(x=>x.id!==id));
    // Offer Undo unless it was an empty, just-created card
    if (task && ((task.title||'').trim() || (task.details||'').trim())) {
      Undo.push(`Deleted "${(task.title||'task').trim().slice(0,40) || 'task'}"`, () => {
        insertTaskBack(wk, dayKey, { ...task, gcalId: null }, idx);
        if (task.isProjectTask && task.projectDocId && setPagesData) {
          setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : {
            ...doc, tasks: (doc.tasks||[]).map(t => t.id===id ? {...t, scheduledDate: prevSched} : t)
          }));
        }
        // The calendar event was removed with the task — put it back
        if (task.gcalId && task.isEvent && getToken()) {
          pushEventToCalendar(task, dayKey).then(gcalId => {
            if (!gcalId) return;
            setWeekData(wd => {
              const week = wd[wk]; if (!week) return wd;
              return { ...wd, [wk]: { ...week, tasks: { ...(week.tasks||{}), [dayKey]: ((week.tasks||{})[dayKey]||[]).map(x => x.id===id ? {...x, gcalId} : x) } } };
            });
          }).catch(e => console.error('Calendar re-push failed:', e));
        }
      });
    }
  }

  // Delete this instance and all future instances of a repeat task (same repeatId, on or after dayKey)
  function deleteTaskAndFuture(dayKey, id) {
    const task = getTasks(dayKey).find(t => t.id===id);
    if (!task) return;
    const repeatId = task.repeatId;
    if (seriesRun && repeatId && (repeatSeries || {})[repeatId]) {
      seriesRun('Deleted this and following', (st, se) => repeatSeriesDelete(st, se, repeatId, dayKey));
      return;
    }
    const legacyTitle = task.title;
    const legacyDays = (task.repeat?.days||[]).slice().sort();
    {
      const removed = collectInstances(t => repeatId
        ? t.repeatId === repeatId
        : (t.title === legacyTitle && JSON.stringify((t.repeat?.days||[]).slice().sort()) === JSON.stringify(legacyDays)), dayKey);
      if (removed.length) Undo.push(`Deleted ${removed.length} repeating task${removed.length===1?'':'s'}`, () => {
        removed.forEach(r => insertTaskBack(r.wk, r.dk, r.task, r.idx));
      });
    }
    setWeekData(wd => {
      const draft = JSON.parse(JSON.stringify(wd));
      Object.keys(draft).forEach(wk => {
        const tasks = draft[wk]?.tasks;
        if (!tasks) return;
        Object.keys(tasks).forEach(dk => {
          if (dk < dayKey) {
            // Keep earlier copies — but a "never ends" series must now end the day before, or it would be topped up again
            if (repeatId && tasks[dk].some(t => t.repeatId === repeatId && t.repeat && t.repeat.endType === 'never')) {
              const prevDay = fmtLocal(addDays(parseLocal(dayKey), -1));
              tasks[dk] = tasks[dk].map(t => (t.repeatId === repeatId && t.repeat && t.repeat.endType === 'never')
                ? { ...t, repeat: { ...t.repeat, endType: 'date', endDate: prevDay } } : t);
            }
            return;
          }
          tasks[dk] = tasks[dk].filter(t => {
            if (repeatId) return t.repeatId !== repeatId;
            // Legacy: match by title + days
            const sameDays = JSON.stringify((t.repeat?.days||[]).slice().sort()) === JSON.stringify(legacyDays);
            return !(t.title === legacyTitle && sameDays);
          });
        });
      });
      return draft;
    });
  }

  const weekDays = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const weekLabel = `${fmtDisplay(weekDays[0])} – ${fmtDisplay(weekDays[6])}`;

  // People to Connect With — new directory-backed model
  // Each week entry: { id, personId?, name?(legacy), days:[], note:'' }
  function handleAddPeople(selectedIds, newNames) {
    const now = Date.now();
    // Create new directory entries for new names
    const newDirEntries = newNames.map((name,i) => ({id:'p'+(now+i), name}));
    if (newDirEntries.length) setPeopleDirectory(d => [...(d||[]), ...newDirEntries]);
    // Build week entries for both selected existing + new
    const allEntries = [
      ...selectedIds.map((personId,i) => ({id:(now+1000+i).toString(), personId, days:[], note:''})),
      ...newDirEntries.map((dir,i) => ({id:(now+2000+i).toString(), personId:dir.id, days:[], note:''})),
    ];
    setWD(w => ({...w, people:[...(w.people||[]), ...allEntries]}));
    setShowPeoplePicker(false);
  }
  function updatePerson(id,patch) { setWD(w=>({...w, people:(w.people||[]).map(p=>p.id===id?{...p,...patch}:p)})); }
  // Remove an item from one of this week's lists (people / toCreate / goals) with Undo
  function removeFromWeekList(key, id, labelFor) {
    const list = Array.isArray(getWD()[key]) ? getWD()[key] : [];
    const idx = list.findIndex(x => x.id === id);
    const item = list[idx];
    const wk = weekKey;
    setWD(w => ({...w, [key]: (Array.isArray(w[key]) ? w[key] : []).filter(x => x.id !== id)}));
    const label = item ? labelFor(item) : null;
    if (!label) return;
    Undo.push(label, () => {
      setWeekData(wd => {
        const week = wd[wk] || { proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} };
        const cur = Array.isArray(week[key]) ? week[key] : [];
        if (cur.some(x => x.id === id)) return wd;
        const next = [...cur];
        next.splice(Math.min(idx, next.length), 0, item);
        return { ...wd, [wk]: { ...week, [key]: next } };
      });
    });
  }
  function deletePerson(id) {
    removeFromWeekList('people', id, p => {
      const nm = (peopleDirectory||[]).find(d => d.id === p.personId)?.name || p.name || 'person';
      return `Removed ${nm}`;
    });
  }
  function reorderPeople(fromId, toId) {
    setWD(w=>{
      const list = [...(w.people||[])];
      const from = list.findIndex(p=>p.id===fromId);
      const to = list.findIndex(p=>p.id===toId);
      if (from===-1||to===-1) return w;
      const [item] = list.splice(from,1);
      list.splice(to,0,item);
      return {...w, people:list};
    });
  }

  function addCreate() { setWD(w=>({...w, toCreate:[...(Array.isArray(w.toCreate)?w.toCreate:[]),{id:Date.now().toString(),name:'',done:false}]})); }
  function updateCreate(id,patch) { setWD(w=>({...w, toCreate:(Array.isArray(w.toCreate)?w.toCreate:[]).map(c=>c.id===id?{...c,...patch}:c)})); }
  function deleteCreate(id) { removeFromWeekList('toCreate', id, c => (c.name||'').trim() ? `Removed "${c.name.trim().slice(0,40)}"` : null); }

  function addGoal(afterId, newId) {
    const newItem = {id: newId || Date.now().toString(), name:'', done:false};
    setWD(w=>{
      const list = w.goals||[];
      if (!afterId) return {...w, goals:[...list, newItem]};
      const idx = list.findIndex(g=>g.id===afterId);
      const next = [...list];
      next.splice(idx+1, 0, newItem);
      return {...w, goals:next};
    });
  }
  function updateGoal(id,patch) { setWD(w=>({...w, goals:(w.goals||[]).map(g=>g.id===id?{...g,...patch}:g)})); }
  function deleteGoal(id) { removeFromWeekList('goals', id, g => (g.name||'').trim() ? `Removed "${g.name.trim().slice(0,40)}"` : null); }
  function reorderGoals(fromId, toId) {
    setWD(w=>{
      const list = [...(w.goals||[])];
      const from = list.findIndex(g=>g.id===fromId);
      const to = list.findIndex(g=>g.id===toId);
      if (from===-1||to===-1) return w;
      const [item] = list.splice(from,1);
      list.splice(to,0,item);
      return {...w, goals:list};
    });
  }

  const [dragging, setDragging] = useState(null); // {dayKey, id}
  // Goal tasks (v4.2.0): read from `goals`, never copied into weekData. Keys are local dates.
  const [dragGoal, setDragGoal] = useState(null); // {goalId, msId, taskId} while dragging a goal task
  const goalTasksByDay = React.useMemo(() => glTasksByDay(goals), [goals]);
  function setGoalTask(it, patch) { if (setGoals) setGoals(gs => glPatchTask(gs, it.goalId, it.msId, it.taskId, patch)); }
  function renderGoalTasks(localKey, desktop) {
    const list = goalTasksByDay[localKey] || [];
    if (!list.length) return null;
    return (
      <GlDaySection key={'gls-'+localKey} dayKey={localKey} done={list.filter(x => x.task.done).length} total={list.length}>
        {renderGoalTaskCards(list, desktop)}
      </GlDaySection>
    );
  }
  function renderGoalTaskCards(list, desktop) {
    return list.map(({goal, ms, task}) => {
      const ref = {goalId: goal.id, msId: ms.id, taskId: task.id};
      return (
        <GlWeekTask key={'gt-'+task.id} item={{goal, ms, task}}
          rule={task.rule ? glTaskRule(task, {fitnessLog, fitnessExercises}) : null}
          onToggle={()=>setGoalTask(ref, {done: !task.done})}
          onMove={d=>setGoalTask(ref, {scheduledDate: d})}
          onOpen={()=>onOpenGoal && onOpenGoal(goal.id)}
          onDragStart={desktop ? ()=>{ setDragging(null); setDragGoal(ref); } : undefined}
          onDragEnd={desktop ? ()=>setDragGoal(null) : undefined} />
      );
    });
  }
  const [dragOver, setDragOver] = useState(null);  // {dayKey, id}

  function reorderTasks(dayKey, fromId, toId) {
    if (fromId === toId) return;
    setTasks(dayKey, tasks => {
      const from = tasks.findIndex(t => t.id === fromId);
      const to = tasks.findIndex(t => t.id === toId);
      if (from === -1 || to === -1) return tasks;
      const next = [...tasks];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  }

  // Add a task to the TOP of a day (used by the Weekly Review's top 3). star shows a ★ on the card.
  function prependTask(dayKey, title, star) {
    const wk = fmt(getWeekStart(parseLocal(dayKey) || new Date(dayKey)));
    const emptyWeek = () => ({ proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} });
    setWeekData(allWD => {
      const week = allWD[wk] || emptyWeek();
      const list = (week.tasks || {})[dayKey] || [];
      const t = { id: Date.now().toString()+Math.random().toString(36).slice(2,5), title, details:'', done:false,
        expanded:false, colorIndex: pickTaskColorIndex(list), isEvent:false, eventTime:'', gcalId:null, star: !!star };
      return { ...allWD, [wk]: { ...week, tasks: { ...(week.tasks||{}), [dayKey]: [t, ...list] } } };
    });
  }

  function moveTaskBetweenDays(fromDayKey, toDayKey, taskId, targetId, patch) {
    // Capture task reference for calendar sync (needs to happen outside updater)
    const taskForSync0 = getTasks(fromDayKey).find(t => t.id === taskId);
    const taskForSync = taskForSync0 && patch ? { ...taskForSync0, ...patch } : taskForSync0;   // v5.16.0: optional patch applied as the task moves (time blocks)
    // NOTE: weekData is keyed by week-start date, then by day within that week.
    // fromDayKey and toDayKey can belong to DIFFERENT weeks (e.g. reschedule
    // across a week boundary), so each day must be resolved to its own week key
    // and both written. Writing everything under the currently-displayed week
    // (the old bug) silently stranded the task under a day-string that the
    // destination week never looks up, making it appear to vanish.
    const emptyWeek = () => ({ proverb:'', toCreate:[], people:[], beWord:'', proud:'', story:'', tasks:{} });
    const fromWk = fmt(getWeekStart(parseLocal(fromDayKey) || new Date(fromDayKey)));
    const toWk = fmt(getWeekStart(parseLocal(toDayKey) || new Date(toDayKey)));
    setWeekData(allWD => {
      const fromWD = allWD[fromWk] || emptyWeek();
      const srcList = (fromWD.tasks || {})[fromDayKey] || [];
      // Find task from FRESH state — if already moved (double-fire guard), bail out
      const task0 = srcList.find(t => t.id === taskId);
      if (!task0) return allWD;
      const task = patch ? { ...task0, ...patch } : task0;
      const srcTasks = srcList.filter(t => t.id !== taskId);
      const nextFromWD = { ...fromWD, tasks: { ...fromWD.tasks, [fromDayKey]: srcTasks } };
      // If destination is the same week, chain off nextFromWD so the removal isn't lost
      const toWD = toWk === fromWk ? nextFromWD : (allWD[toWk] || emptyWeek());
      const dstList = (toWD.tasks || {})[toDayKey] || [];
      // If task somehow already in destination, bail out (idempotency guard)
      if (dstList.some(t => t.id === taskId)) return allWD;
      const dstTasks = [...dstList];
      const insertAt = targetId ? dstTasks.findIndex(t => t.id === targetId) : dstTasks.length;
      dstTasks.splice(insertAt === -1 ? dstTasks.length : insertAt, 0, task);
      const nextToWD = { ...toWD, tasks: { ...toWD.tasks, [toDayKey]: dstTasks } };
      if (toWk === fromWk) return { ...allWD, [fromWk]: nextToWD };
      return { ...allWD, [fromWk]: nextFromWD, [toWk]: nextToWD };
    });
    // Sync date change to Google Calendar
    if (taskForSync?.isEvent && taskForSync?.gcalId && getToken()) {
      updateEventInCalendar(taskForSync.gcalId, taskForSync, toDayKey)
        .catch(e => console.error('Calendar move failed:', e));
    }
  }

  const mobileDayKey = fmt(weekDays[mobileDayIndex]);
  const mobileDayTasks = getTasks(mobileDayKey);
  const mobileDayDate = weekDays[mobileDayIndex];

  // Mobile touch drag for task reordering
  const mobileTouchDragId = useRef(null);
  const mobileTouchDragEl = useRef(null);
  const mobileTasksContainerRef = useRef(null);
  const [mobileDragOverId, setMobileDragOverId] = useState(null);

  // Native touch drag: all 3 events passive:false so both scroll-block AND
  // text-selection-block work. Only activates when touch starts on .mobile-drag-handle.
  useEffect(() => {
    const el = mobileTasksContainerRef.current;
    if (!el) return;
    function onTStart(e) {
      if (!e.target.closest('.mobile-drag-handle')) return;
      e.preventDefault(); // prevents text selection from the very first touch
      const row = e.target.closest('[data-task-id]');
      if (!row) return;
      mobileTouchDragId.current = row.getAttribute('data-task-id');
      mobileTouchDragEl.current = row;
      row.style.opacity = '0.45';
    }
    function onTMove(e) {
      if (!mobileTouchDragId.current) return;
      e.preventDefault(); // prevents scroll while dragging
      const t = e.touches[0];
      const over = document.elementFromPoint(t.clientX, t.clientY);
      const row = over?.closest('[data-task-id]');
      setMobileDragOverId(row ? row.getAttribute('data-task-id') : null);
    }
    function onTEnd(e) {
      if (!mobileTouchDragId.current) return;
      const t = e.changedTouches[0];
      const over = document.elementFromPoint(t.clientX, t.clientY);
      const targetRow = over?.closest('[data-task-id]');
      const targetId = targetRow ? targetRow.getAttribute('data-task-id') : null;
      if (targetId && targetId !== mobileTouchDragId.current) {
        reorderTasks(mobileDayKey, mobileTouchDragId.current, targetId);
      }
      if (mobileTouchDragEl.current) mobileTouchDragEl.current.style.opacity = '';
      setMobileDragOverId(null);
      mobileTouchDragId.current = null;
      mobileTouchDragEl.current = null;
    }
    el.addEventListener('touchstart', onTStart, {passive: false});
    el.addEventListener('touchmove',  onTMove,  {passive: false});
    el.addEventListener('touchend',   onTEnd,   {passive: false});
    return () => {
      el.removeEventListener('touchstart', onTStart);
      el.removeEventListener('touchmove',  onTMove);
      el.removeEventListener('touchend',   onTEnd);
    };
  }, [mobileDayKey]);

  // ── v5.16.0 TIME BLOCKS (week/day views; see the block comment above TbGrid) ──
  const tbFocusRef = useRef(null);
  function tbDayModel(d) {
    const dk = fmt(d), lk = fmtLocal(d);
    const items = [], untimed = [];
    getTasks(dk).forEach(t => {
      const s = tbMin(tbTaskStart(t));
      if (s == null) { untimed.push(t); return; }
      items.push({ k: 't:' + t.id, kind: 'task', id: t.id, start: s, dur: Math.max(5, Math.min(tbTaskDur(t), 1440 - s)), title: t.title, done: !!t.done, event: !!t.isEvent,
        bg: t.customColor ? t.customColor + '55' : paletteBg(t.isEvent, t.colorIndex) });
    });
    const gl = goalTasksByDay[lk] || [];
    gl.forEach(({ goal, ms, task }) => {
      const s = tbMin(task.startTime); if (s == null) return;
      items.push({ k: 'g:' + task.id, kind: 'goal', id: task.id, ref: { goalId: goal.id, msId: ms.id, taskId: task.id }, start: s, dur: Math.max(5, Math.min(task.durMin > 0 ? task.durMin : 30, 1440 - s)),
        title: task.title, done: !!task.done, event: false, color: goal.color || 'var(--accent)' });
    });
    const dailyHabits = (habitGoals || []).filter(g => g.schedule === 'daily');
    return { key: dk, lkey: lk, date: d, today: isSameDay(d, today), items, untimed,
      goalsTotal: gl.length, goalsDone: gl.filter(x => x.task.done).length,
      habitsTotal: dailyHabits.length, habitsDone: dailyHabits.filter(g => ((habitCompletions || {})[dk] || []).includes(g.id)).length };
  }
  function tbFindGoalTask(ref) {
    const g = (goals || []).find(x => x.id === ref.goalId); const m = g && (g.milestones || []).find(x => x.id === ref.msId);
    return m && (m.tasks || []).find(x => x.id === ref.taskId);
  }
  function tbPlace(it, fromKey, toKey, start, dur) {
    if (it.kind === 'goal') {
      setGoalTask(it.ref, { scheduledDate: fmtLocal(parseLocal(toKey)), startTime: tbStr(start), durMin: dur });
      return;
    }
    const patch = it.event ? { eventTime: tbStr(start), durMin: dur } : { startTime: tbStr(start), durMin: dur };
    if (fromKey === toKey) { updateTask(fromKey, it.id, patch); return; }
    const task = getTasks(fromKey).find(t => t.id === it.id);
    moveTaskBetweenDays(fromKey, toKey, it.id, null, patch);
    if (task && task.isProjectTask && task.projectDocId && setPagesData) {
      setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : { ...doc, tasks: (doc.tasks||[]).map(t => t.id === it.id ? { ...t, scheduledDate: toKey } : t) }));
    }
  }
  function tbToggleDone(it, dayKey) {
    if (it.kind === 'goal') setGoalTask(it.ref, { done: !it.done });
    else updateTask(dayKey, it.id, { done: !it.done });
  }
  function tbDropMin(dayKey, min) {
    if (dragGoal) {
      const gt = tbFindGoalTask(dragGoal);
      setGoalTask(dragGoal, { scheduledDate: fmtLocal(parseLocal(dayKey)), startTime: tbStr(min), durMin: (gt && gt.durMin > 0) ? gt.durMin : 30 });
      setDragGoal(null); return;
    }
    if (dragging) {
      const t = getTasks(dragging.dayKey).find(x => x.id === dragging.id);
      if (t) tbPlace({ kind: 'task', id: t.id, event: !!t.isEvent }, dragging.dayKey, dayKey, min, tbTaskDur(t));
      setDragging(null); setDragOver(null);
    }
  }
  function tbCreateTimed(dayKey, min) {
    const id = Date.now().toString();
    tbFocusRef.current = id;
    setTasks(dayKey, t => [...t, { id, title: '', details: '', done: false, expanded: false, colorIndex: pickTaskColorIndex(t), startTime: tbStr(min), durMin: 30 }]);
    return { kind: 'task', id };
  }
  function tbPruneEmpty(ref, dayKey) {
    if (!ref || ref.kind !== 'task') return;
    const t = getTasks(dayKey).find(x => x.id === ref.id);
    if (t && !(t.title || '').trim() && !(t.details || '').trim() && !(Array.isArray(t.items) && t.items.length)) deleteTask(dayKey, ref.id);
  }
  function tbItemExists(ref, dayKey) {
    if (!ref) return false;
    if (ref.kind === 'goal') return !!(goalTasksByDay[fmtLocal(parseLocal(dayKey))] || []).some(x => x.task.id === ref.id);
    return getTasks(dayKey).some(x => x.id === ref.id);
  }
  function tbTaskCard(task, dk, forceOpen) {
    return (
      <TaskCard key={task.id} task={task} forceOpen={forceOpen}
        onUpdate={p => { if (forceOpen && Object.keys(p).length === 1 && 'expanded' in p) return; updateTask(dk, task.id, p); }}
        onBlurSync={() => syncTaskToCalendar(dk, task.id)}
        onBlurEdit={flushSeriesPrompt}
        onDelete={() => deleteTask(dk, task.id)}
        onDeleteFuture={taskIsRepeating(task) ? () => deleteTaskAndFuture(dk, task.id) : null}
        onAskScope={taskIsRepeating(task) ? () => setRepeatScope({ kind: 'delete', task, dayKey: dk }) : null}
        dayKey={dk}
        titleRef={el => { if (el && tbFocusRef.current === task.id) { tbFocusRef.current = null; setTimeout(() => { try { el.focus(); } catch (x) {} }, 30); } }}
        deleteIfEmpty={() => { if (!task.title.trim() && !forceOpen) deleteTask(dk, task.id); }}
        onApplyRepeat={rule => requestApplyRepeat(task, dk, rule)}
        onStopRepeat={() => stopRepeating(task, dk)}
        isDragOver={false}
        onDragStart={() => setDragging({ dayKey: dk, id: task.id })}
        onDragOver={() => {}}
        onDragEnd={() => { setDragging(null); setDragOver(null); }}
        onDrop={() => {}}
        onReschedule={toDayKey => {
          moveTaskBetweenDays(dk, toDayKey, task.id, null);
          if (task.isProjectTask && task.projectDocId && setPagesData) {
            setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : { ...doc, tasks: (doc.tasks||[]).map(t => t.id === task.id ? { ...t, scheduledDate: toDayKey } : t) }));
          }
        }}
        weekDays={weekDays}
        currentDayKey={dk} />
    );
  }
  function tbGoalRows(lk, desktop, onlyId) {
    const list = (goalTasksByDay[lk] || []).filter(x => !onlyId || x.task.id === onlyId);
    return list.map(({ goal, ms, task }) => {
      const ref = { goalId: goal.id, msId: ms.id, taskId: task.id };
      return (
        <div key={'tg-' + task.id} className="tb-goalrow">
          {renderGoalTaskCards([{ goal, ms, task }], desktop)}
          <TbTimeRow start={task.startTime} dur={task.durMin} onChange={p => setGoalTask(ref, p)} />
        </div>
      );
    });
  }
  const tbRender = {
    renderHabits: m => <DailyHabitsSection forceOpen dayKey={m.key}
      habitGoals={habitGoals} habitCompletions={habitCompletions} setHabitCompletions={setHabitCompletions}
      habitQty={habitQty} setHabitQty={setHabitQty} habitNotes={habitNotes} setHabitNotes={setHabitNotes} />,
    renderGoals: (m, desktop) => <div className="tb-goals">{tbGoalRows(m.lkey, desktop !== false)}</div>,
    renderNoTime: m => (
      <div className="tb-notime">
        {m.untimed.length === 0 && <div className="tb-empty">Nothing without a time. Tasks you add here stay untimed until you give them one.</div>}
        {m.untimed.map(t => tbTaskCard(t, m.key, false))}
        <button className="add-task-btn" onClick={() => addTask(m.key)}>+</button>
      </div>
    ),
    renderItem: (ref, dk) => {
      if (!ref) return null;
      if (ref.kind === 'goal') {
        const lk = fmtLocal(parseLocal(dk));
        const f = (goalTasksByDay[lk] || []).find(x => x.task.id === ref.id);
        if (!f) return null;
        const gref = { goalId: f.goal.id, msId: f.ms.id, taskId: f.task.id };
        return (
          <div className="tb-goalrow">
            {renderGoalTaskCards([f], true)}
            <TbTimeRow start={f.task.startTime} dur={f.task.durMin} onChange={p => setGoalTask(gref, p)} />
            <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
              <button className="tb-link" onClick={() => setGoalTask(gref, { startTime: '' })}>Remove time</button>
              {onOpenGoal && <button className="tb-link" onClick={() => onOpenGoal(f.goal.id)}>Open goal →</button>}
            </div>
          </div>
        );
      }
      const t = getTasks(dk).find(x => x.id === ref.id);
      if (!t) return null;
      return (
        <div>
          {tbTaskCard(t, dk, true)}
          {!t.isEvent && <button className="tb-link" style={{ marginTop: 6 }} onClick={() => updateTask(dk, t.id, { startTime: '' })}>Remove time (keep task)</button>}
        </div>
      );
    },
  };
  const tbCommon = {
    ...tbRender, view: wkView, setView: setWkView, dropActive: !!(dragging || dragGoal),
    toggleDone: tbToggleDone, place: tbPlace, dropMin: tbDropMin, createTimed: tbCreateTimed, pruneEmpty: tbPruneEmpty, itemExists: tbItemExists,
    scrollKey: weekKey, dayName: m => DAYS[m.date.getDay()],
  };
  const tbWeekModels = wkView === 'blocks' ? weekDays.map(tbDayModel) : [];
  const tbWeekCtx = wkView === 'blocks' ? { ...tbCommon, days: tbWeekModels, range: tbRangeOf(tbWeekModels), headerBg: themeColor(calHeaderColor) } : null;
  const tbDayM = wkView === 'blocks' ? tbDayModel(weekDays[mobileDayIndex]) : null;
  const tbDayCtx = wkView === 'blocks' ? { ...tbCommon, day: tbDayM, range: tbRangeOf([tbDayM]), scrollKey: mobileDayKey } : null;

  const sidebarContent = (
    <>
      <div className="week-nav">
        <button className="nav-arrow" onClick={()=>setWeekStart(ws=>addDays(ws,-7))}>‹</button>
        <span className="week-nav-label">{weekLabel}</span>
        <button className="nav-arrow" onClick={()=>setWeekStart(ws=>addDays(ws,7))}>›</button>
      </div>
      <div style={{margin:'0 0 8px'}}><TbViewSwitch view={wkView} onChange={setWkView} /></div>
      {/* v4.7.0 — Weekly Review. Highlighted Sat–Mon, when closing out a week is the natural thing to do. */}
      <button className={`wr-review-btn ${reviewDue ? 'due' : ''}`} onClick={()=>setReviewOpen(true)}
        title={`Reviews ${fmtDisplay(reviewTarget)} – ${fmtDisplay(addDays(reviewTarget, 6))}`}>
        <span aria-hidden="true">{reviewDue ? '◷' : '✓'}</span>
        {reviewDue ? 'Weekly review' : 'Review again'}
        {fmt(reviewTarget) !== weekKey && (
          <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",opacity:0.7}}>{fmtDisplay(reviewTarget)}</span>
        )}
      </button>
      <a className="sidebar-link daily" href="https://penzu.com">✍️ Daily Pages</a>
      <div className="sidebar-section">
        <div className="sidebar-section-title">Proverb of the Week</div>
        <textarea className="sidebar-textarea" placeholder="Write a quote to meditate on…"
          value={wd.proverb||''} onChange={e=>setWD(w=>({...w,proverb:e.target.value}))} rows={3} />
      </div>
      {onOpenGoal && <GlNextUp goals={goals} weekKeys={weekDays.map(fmtLocal)} onOpenGoal={onOpenGoal} />}
      <div className="sidebar-section">
        <div className="checklist-header">
          <div className="sidebar-section-title">Weekly Goals:</div>
          <button className="add-btn" onClick={()=>addGoal(null)}>+</button>
        </div>
        <SortableChecklist
          items={wd.goals||[]}
          onUpdate={updateGoal}
          onAdd={addGoal}
          onDelete={deleteGoal}
          onReorder={reorderGoals}
          placeholder="Goal…"
        />
      </div>

      <div className="sidebar-section">
        <div className="checklist-header">
          <div className="sidebar-section-title">People to Connect With</div>
          <button className="add-btn" onClick={()=>setShowPeoplePicker(true)} title="Add person">+</button>
        </div>
        <PeopleChecklist
          items={wd.people||[]}
          weekDays={weekDays}
          onUpdate={updatePerson}
          onDelete={deletePerson}
          onReorder={reorderPeople}
          directory={peopleDirectory||[]}
          onRenameDirectory={(personId, newName) =>
            setPeopleDirectory(d => d.map(p => p.id===personId ? {...p, name:newName} : p))
          }
        />
        {(wd.people||[]).length === 0 && (
          <div style={{fontSize:11,color:'var(--ink-faint)',fontStyle:'italic',padding:'2px 4px'}}>
            Press + to add people
          </div>
        )}
      </div>
      <div className="sidebar-section">
        <div className="sidebar-section-title">Be-Word of the Week</div>
        <textarea className="sidebar-textarea" placeholder="Your be-word and how to apply it…"
          value={wd.beWord||''} onChange={e=>setWD(w=>({...w,beWord:e.target.value}))} rows={10} />
      </div>
      <div className="sidebar-section" style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
        <button onClick={()=>setShowRepeatCleanup(true)}
          style={{width:'100%',padding:'6px 10px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',
                  background:'var(--paper)',color:'var(--ink-light)',fontSize:11,cursor:'pointer',
                  fontFamily:"'DM Sans',sans-serif",textAlign:'left'}}>
          🔁 Manage repeat tasks…
        </button>
      </div>
    </>
  );

  return (
    <div className="main-content">
      {/* DESKTOP SIDEBAR */}
      <div className={`sidebar-wrap ${sidebarCollapsed ? 'collapsed' : ''}`}>
        <div className="sidebar">{sidebarContent}</div>
        <div className="sidebar-toggle-strip" onClick={()=>setSidebarCollapsed(c=>!c)}
          title={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}>
          <div className="sidebar-toggle-btn">{sidebarCollapsed ? '›' : '‹'}</div>
          <span className="sidebar-collapsed-label">Weekly</span>
        </div>
      </div>


      {/* MAIN */}
      <div className="main-panel weekly-main-panel">
        {wkView === 'blocks' ? (
        <div className="weekly-calendar tb-cal"><TbWeek ctx={tbWeekCtx} /></div>
        ) : (
        <div className="weekly-calendar">
          <div className="cal-scroll-wrapper">
            <div className="cal-grid">
              {weekDays.map((d,i)=>(
                <div key={'h'+i} className={`cal-header-cell ${isSameDay(d,today)?'today':''}`}
                  style={{background: themeColor(calHeaderColor)}}>
                  <div className="day-name">{DAYS[d.getDay()]}</div>
                  <div className="day-date">{d.getDate()}</div>
                  {i===6 && (
                    <div className="cal-hdr-color-wrap">
                      <ColorPickerPopover color={calHeaderColor} onChange={setCalHeaderColor} />
                    </div>
                  )}
                </div>
              ))}
              {weekDays.map((d,i)=>{
                const dk = fmt(d);
                const tasks = getTasks(dk);
                return (
                  <div key={'b'+i} className={`cal-day ${isSameDay(d,today)?'today':''}`}
                    onDragOver={e=>e.preventDefault()}
                    onDrop={e=>{
                      e.preventDefault();
                      if(dragGoal) { setGoalTask(dragGoal, {scheduledDate: fmtLocal(d)}); setDragGoal(null); setDragOver(null); return; }
                      if(!dragging) return;
                      if(dragging.dayKey === dk) {
                        if(!dragOver || dragOver.dayKey !== dk) reorderTasks(dk, dragging.id, null);
                      } else {
                        moveTaskBetweenDays(dragging.dayKey, dk, dragging.id, null);
                      }
                      setDragging(null); setDragOver(null);
                    }}>
                    <DailyHabitsSection dayKey={dk}
                      habitGoals={habitGoals} habitCompletions={habitCompletions} setHabitCompletions={setHabitCompletions}
                      habitQty={habitQty} setHabitQty={setHabitQty} habitNotes={habitNotes} setHabitNotes={setHabitNotes} />
                    {renderGoalTasks(fmtLocal(d), true)}
                    {tasks.map(task=>(
                      <TaskCard key={task.id} task={task}
                        onUpdate={p=>updateTask(dk,task.id,p)}
                        onBlurSync={()=>syncTaskToCalendar(dk,task.id)}
                        onBlurEdit={flushSeriesPrompt}
                        onDelete={()=>deleteTask(dk,task.id)}
                        onDeleteFuture={taskIsRepeating(task) ? ()=>deleteTaskAndFuture(dk,task.id) : null}
                        onAskScope={taskIsRepeating(task) ? ()=>setRepeatScope({kind:'delete',task,dayKey:dk}) : null}
                        dayKey={dk}
                        onEnterKey={()=>addTask(dk,task.id)}
                        titleRef={el=>taskTitleRefs.current[task.id]=el}
                        deleteIfEmpty={()=>{if(!task.title.trim())deleteTask(dk,task.id);}}
                        onCopy={()=>setTaskClipboard({...task, gcalId:null, id:null})}
                        hasCopied={!!taskClipboard}
                        onPasteBelow={()=>{
                          if(!taskClipboard) return;
                          const newId = Date.now().toString();
                          setTasks(dk, t => {
                            const idx = t.findIndex(x=>x.id===task.id);
                            const cloned = {...taskClipboard, id:newId, gcalId:null};
                            const next = [...t];
                            next.splice(idx+1, 0, cloned);
                            return next;
                          });
                        }}
                        onShowCtxMenu={(x,y,cp,pp,hp)=>setCtxMenu({x,y,onCopy:cp,onPaste:pp,hasCopied:hp})}
                        onApplyRepeat={(rule)=>requestApplyRepeat(task,dk,rule)}
                        onStopRepeat={()=>stopRepeating(task,dk)}
                        isDragOver={dragOver?.dayKey===dk && dragOver?.id===task.id}
                        onDragStart={()=>setDragging({dayKey:dk, id:task.id})}
                        onDragOver={()=>setDragOver({dayKey:dk, id:task.id})}
                        onDragEnd={()=>{ setDragging(null); setDragOver(null); }}
                        onDrop={()=>{
                          if(dragGoal) { setGoalTask(dragGoal, {scheduledDate: fmtLocal(d)}); setDragGoal(null); setDragOver(null); return; }
                          if(dragging) {
                            if(dragging.dayKey === dk) reorderTasks(dk, dragging.id, task.id);
                            else moveTaskBetweenDays(dragging.dayKey, dk, dragging.id, task.id);
                          }
                          setDragging(null); setDragOver(null);
                        }}
                        onReschedule={(toDayKey)=>{
                          moveTaskBetweenDays(dk,toDayKey,task.id,null);
                          if(task.expanded) updateTask(toDayKey,task.id,{expanded:false});
                          // If it's a project task, also update scheduledDate in pagesData
                          if(task.isProjectTask && task.projectDocId && setPagesData) {
                            setPagesData(p => p.map(doc => doc.id !== task.projectDocId ? doc : {
                              ...doc, tasks: (doc.tasks||[]).map(t => t.id===task.id ? {...t, scheduledDate:toDayKey} : t)
                            }));
                          }
                        }}
                        weekDays={weekDays}
                        currentDayKey={dk} />
                    ))}
                    <button className="add-task-btn" onClick={()=>addTask(dk)}>+</button>
                    <DayNote dayKey={dk} note={getDayNote(dk)} onChange={note=>setDayNote(dk,note)} />
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        )}

        <div className="week-review">
          <div className="review-section">
            <div className="review-label">This week, I was proud that I:</div>
            <textarea className="review-textarea" placeholder="Write about your proudest moment…"
              value={wd.proud||''} onChange={e=>{setWD(w=>({...w,proud:e.target.value}));e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
              onFocus={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}} />
          </div>
          <div className="review-section">
            <div className="review-label">Best Story This Week</div>
            <textarea className="review-textarea" placeholder="What's the best story from this week?"
              value={wd.story||''} onChange={e=>{setWD(w=>({...w,story:e.target.value}));e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
              onFocus={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}} />
          </div>
        </div>
      </div>

      {/* MOBILE: Day view */}
      {(() => {
        const swipe = useSwipe(
          () => setMobileDayIndex(i => { if(i===6){setWeekStart(ws=>addDays(ws,7));return 0;} return i+1; }),
          () => setMobileDayIndex(i => { if(i===0){setWeekStart(ws=>addDays(ws,-7));return 6;} return i-1; })
        );
        return (
      <div className="mobile-day-view" {...(swipeNav ? swipe : {})}>
        <div className="mobile-day-nav">
          <button className="nav-arrow" onClick={()=>setMobileDayIndex(i=>{
            if(i===0){setWeekStart(ws=>addDays(ws,-7));return 6;}
            return i-1;
          })}>‹</button>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{textAlign:'center'}}>
              <div className="mobile-day-label">{DAYS[mobileDayDate.getDay()]}</div>
              <div className="mobile-day-date">{MONTHS[mobileDayDate.getMonth()].slice(0,3)} {mobileDayDate.getDate()}</div>
            </div>
            <button onClick={toggleSwipeNav} title={swipeNav ? 'Swipe navigation on — tap to disable' : 'Swipe navigation off — tap to enable'}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:16,opacity:swipeNav?1:0.35,padding:'2px 4px',lineHeight:1}}>
              👆
            </button>
            <button onClick={()=>setWkView(wkView==='blocks'?'list':'blocks')} title={wkView==='blocks' ? 'Showing time blocks — tap for the task list' : 'Show time blocks'}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:16,opacity:wkView==='blocks'?1:0.35,padding:'2px 4px',lineHeight:1}}>
              ⏱
            </button>

// REPEAT CLEANUP MODAL
// Lists all repeat task groups across all weeks; lets user delete entire groups at once.
// ─────────────────────────────────────────────
const DAY_LABELS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
// v5.4.0 — after editing one copy of a repeating task: "apply to the rest?" The edit is already on this
// task; dismissing the bar (or ignoring it) leaves the other copies untouched.
function SeriesEditToast({ sp, onPick, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 15000); return () => clearTimeout(t); }, [sp]);
  const name = sp.label.length > 28 ? sp.label.slice(0, 27) + '…' : sp.label;
  return (
    <div className="undo-toast series-toast" role="status" aria-live="polite">
      <span className="undo-toast-label">Changed “{name}” on this day only</span>
      {sp.following > 0 && <button type="button" className="undo-toast-btn" onClick={() => onPick('following')}>This and following ({sp.following})</button>}
      <button type="button" className="undo-toast-btn" onClick={() => onPick('all')}>All ({sp.all + 1})</button>
      <button type="button" className="undo-toast-btn" aria-label="Keep only this one" style={{padding:'0 10px'}} onClick={onClose}>✕</button>
    </div>
  );
}
// "Change which tasks?" — asked before deleting a repeating task, or before changing its repeat rule
function RepeatScopeModal({ scope, onPick, onClose }) {
  const isDelete = scope.kind === 'delete';
  const opts = isDelete
    ? [['one', 'Only this task', 'Just this one. The rest stay as they are.'],
       ['following', 'This and following', 'This one and every later one. Earlier ones stay.'],
       ['all', 'All tasks in the series', 'Every past and future one.']]
    : [['following', 'This and following', 'Starts a new series from here. Earlier ones keep their old settings.'],
       ['all', 'All tasks in the series', 'Keeps one series; unfinished later tasks are rewritten to match.']];
  const [choice, setChoice] = useState(isDelete ? 'one' : 'following');
  const title = (scope.task.title || 'This task').trim() || 'This task';
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" role="dialog" aria-label="Change which tasks?" style={{maxWidth:420,gap:12}} onClick={e=>e.stopPropagation()}>
        <div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:'var(--ink)'}}>
            {isDelete ? 'Delete which tasks?' : 'Change which tasks?'}
          </div>
          <div style={{fontSize:12,color:'var(--ink-light)',marginTop:4,lineHeight:1.5}}>
            “{title}” — {repeatSummary(scope.task.repeat, scope.dayKey) || 'repeats'}. You're on {scope.dayKey}.
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {opts.map(([val, label, desc]) => (
            <label key={val} className={`rp-scope-opt ${choice===val?'on':''}`}>
              <input type="radio" name="repeat-scope" checked={choice===val} onChange={()=>setChoice(val)} />
              <span style={{display:'flex',flexDirection:'column',gap:2}}>
                <span style={{fontSize:14,fontWeight:600,color:'var(--ink)'}}>{label}</span>
                <span style={{fontSize:12,color:'var(--ink-light)',lineHeight:1.4}}>{desc}</span>
              </span>
            </label>
          ))}
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} style={{minHeight:44,padding:'0 18px',borderRadius:10,border:'1px solid var(--border)',background:'none',cursor:'pointer',fontSize:14,color:'var(--ink)'}}>Cancel</button>
          <button onClick={()=>onPick(choice)}
            style={{minHeight:44,padding:'0 22px',borderRadius:10,border:'none',cursor:'pointer',fontSize:14,fontWeight:700,color:'#fff',
                    background: isDelete ? 'var(--red)' : 'var(--accent)'}}>
            {isDelete ? 'Delete' : 'Apply'}
          </button>
        </div>
      </div>
    </div>
  );
}

function RepeatCleanupModal({ groups, onDeleteGroup, onClose, previewConvert, onConvert }) {
  const [convMsg, setConvMsg] = useState('');

  const [deletedKeys, setDeletedKeys] = useState(new Set());

  const visible = groups.filter(g => !deletedKeys.has(g.key));
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{maxWidth:460,maxHeight:'80vh',display:'flex',flexDirection:'column'}}

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:'var(--ink)'}}>

          <button onClick={onClose}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'var(--ink-faint)',lineHeight:1}}>✕</button>

            {conv.converted.length > 0 && <>
              <div style={{marginBottom:6}}><b>{conv.converted.length}</b> older repeating task{conv.converted.length!==1?'s are':' is'} stored as a copy on every day
                ({conv.converted.reduce((a,c)=>a+c.copies,0)} copies). They can be switched to the compact form, which keeps your edits and deleted days

            </>}

          </div>
        )}
        <div style={{flex:1,overflowY:'auto'}}>
          {visible.length === 0 && (
            <div style={{textAlign:'center',color:'var(--ink-faint)',fontSize:13,padding:'24px 0'}}>

          {visible.map(g => {

              <div key={g.key}

                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--ink)',
                               overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {g.title||'(untitled)'}
                  </div>
                  <div style={{fontSize:10,color:'var(--ink-light)',marginTop:2}}>

                    {' · '}<span style={{color:'var(--ink-faint)'}}>{g.instances.length} instance{g.instances.length!==1?'s':''}</span>
                  </div>
                </div>
                {isConfirming ? (
                  <div style={{display:'flex',gap:4,flexShrink:0}}>

                               background:'var(--red)',color:'white',fontSize:11,fontWeight:600}}>

// ─────────────────────────────────────────────
// PEOPLE CHECKLIST — replaces SortableChecklist for "People to Connect With"
// Each entry: { id, personId, name(fallback), days:[], note }
// ─────────────────────────────────────────────
function PeopleChecklist({ items, weekDays, onUpdate, onDelete, onReorder, directory, onRenameDirectory }) {
  const [dragId, setDragId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const [expandedIds, setExpandedIds] = useState({});
  const [confirmId, setConfirmId] = useState(null);

  function getPersonName(item) {
    if (item.personId && directory) {
      const dir = directory.find(p => p.id === item.personId);
      if (dir) return dir.name;
    }
    return item.name || '';
  }

  function isDone(item) {
    return Array.isArray(item.days) ? item.days.length > 0 : !!item.done;
  }

  function getDays(item) {
    return Array.isArray(item.days) ? item.days : [];
  }

  function handleCheckToggle(item) {
    // Checked → clear all days. Unchecked → add today's day index.
    if (isDone(item)) {
      onUpdate(item.id, { days: [], done: false });
    } else {
      const todayIdx = new Date().getDay();
      onUpdate(item.id, { days: [todayIdx], done: true });
    }
  }

  function toggleDay(item, dayIdx) {
    const days = getDays(item);
    const next = days.includes(dayIdx)
      ? days.filter(d => d !== dayIdx)
      : [...days, dayIdx].sort((a,b) => a-b);
    onUpdate(item.id, { days: next, done: next.length > 0 });
  }

  function handleDelete(e, id) {
    e.stopPropagation();
    if (confirmId === id) { onDelete(id); setConfirmId(null); }
    else setConfirmId(id);
  }

  if (!items || items.length === 0) return null;

  return (
    <div>
      {items.map(item => {
        const done = isDone(item);
        const days = getDays(item);
        const isExpanded = !!expandedIds[item.id];
        const confirming = confirmId === item.id;
        const name = getPersonName(item);
        return (
          <div key={item.id}
            className={`checklist-item ${done?'checked':''} ${dragOverId===item.id?'drag-over':''} ${dragId===item.id?'dragging':''}`}
            style={{flexDirection:'column', alignItems:'stretch', padding:0, gap:0, marginBottom:2}}
            draggable
            onDragStart={e=>{ setDragId(item.id); e.dataTransfer.effectAllowed='move'; }}
            onDragOver={e=>{ e.preventDefault(); if(item.id!==dragId) setDragOverId(item.id); }}
            onDrop={e=>{ e.preventDefault(); if(dragId&&dragId!==item.id) onReorder(dragId,item.id); setDragId(null); setDragOverId(null); }}
            onDragEnd={()=>{ setDragId(null); setDragOverId(null); }}
            onMouseLeave={()=>setConfirmId(null)}>
            {/* Main row */}
            <div style={{display:'flex', alignItems:'center', gap:6, padding:'5px 6px'}}>
              <span className="checklist-drag-handle" style={{opacity:0.4, marginTop:0}}>⣿</span>
              <div className={`check-box ${done?'checked':''}`}
                onClick={()=>handleCheckToggle(item)} />
              <span style={{
                flex:1, fontSize:12.5, fontFamily:"'DM Sans',sans-serif",
                color: done ? 'var(--ink-faint)' : 'var(--ink)',
                textDecoration: done ? 'line-through' : 'none',
                minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
              }}>
                {name || <span style={{color:'var(--ink-faint)',fontStyle:'italic'}}>Unnamed</span>}
              </span>
              {days.length > 0 && (
                <span title="Days connected this week"
                  style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--accent)',flexShrink:0,fontWeight:700}}>
                  {days.length}×
                </span>
              )}
              <button
                style={{background:'none',border:'none',cursor:'pointer',fontSize:10,color:'var(--ink-faint)',padding:'0 2px',flexShrink:0,lineHeight:1}}
                onClick={e=>{e.stopPropagation();setExpandedIds(ex=>({...ex,[item.id]:!ex[item.id]}));}}>
                {isExpanded ? '▲' : '▼'}
              </button>
              <button className="delete-item-btn"
                style={{opacity:confirming?1:undefined,color:confirming?'var(--red)':undefined,fontSize:confirming?11:14}}
                onClick={e=>handleDelete(e,item.id)}>
                {confirming ? 'Delete?' : '✕'}
              </button>
            </div>
            {/* Expanded: name edit + day-dots + note */}
            {isExpanded && (
              <div style={{padding:'5px 10px 9px', borderTop:'1px solid var(--border)'}}
                onClick={e=>e.stopPropagation()}>
                {onRenameDirectory && item.personId && (
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>Name:</div>
                    <input
                      style={{width:'100%',fontSize:12.5,fontFamily:"'DM Sans',sans-serif",
                        border:'1px solid var(--border)',borderRadius:4,padding:'3px 7px',
                        outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
                      value={name}
                      onChange={e=>onRenameDirectory(item.personId, e.target.value)}
                      onClick={e=>e.stopPropagation()}
                    />
                  </div>
                )}
                <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>Days connected:</div>
                <div style={{display:'flex',gap:3,marginBottom:8}}>
                  {['S','M','T','W','T','F','S'].map((d,i) => {
                    const active = days.includes(i);
                    return (
                      <button key={i}
                        className={`task-repeat-day-btn ${active?'active':''}`}
                        style={{width:22,height:22,fontSize:9}}
                        onClick={()=>toggleDay(item, i)}>
                        {d}
                      </button>
                    );
                  })}
                </div>
                <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>Note:</div>
                <textarea rows={2}
                  style={{width:'100%',fontSize:12,fontFamily:"'DM Sans',sans-serif",
                    border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',
                    resize:'vertical',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
                  placeholder="How did you connect?"
                  value={item.note||''}
                  onChange={e=>onUpdate(item.id,{note:e.target.value})}
                />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

const DAY_OPEN_LS = 'dayOpen';

function useDayOpen(section, dayKey) {

    const h = () => bump();

    return () => window.removeEventListener('lp-dayopen', h);
  }, []);

    if (!dayKey) return;
    const m = readDayOpen();
    const d = { ...(m[dayKey] || {}) };

    if (Object.keys(d).length) m[dayKey] = d; else delete m[dayKey];

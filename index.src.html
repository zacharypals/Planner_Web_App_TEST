  const [stopConfirm, setStopConfirm] = useState(false);
  const [repeatDraft, setRepeatDraft] = useState(null); // rule being edited in the Repeat panel (not saved until Apply)
  const [rescheduleWeekOffset, setRescheduleWeekOffset] = useState(0);
  const longPressTimer = useRef(null);
  const ckFocusRef = useRef(null);          // v5.9.0: id of a checklist item to focus once it renders
  const ckItems = Array.isArray(task.items) ? task.items : [];
  const showChecklist = !task.isEvent && !task.isProjectTask;

  // Auto-grow textarea
  useEffect(() => {
    if (textareaRef.current) {
      textareaRef.current.style.height = 'auto';
      textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
    }
  }, [task.details, task.expanded]);

  // Auto-grow title textarea so wrapped titles are fully visible
  useEffect(() => {
    if (titleTextareaRef.current) {
      titleTextareaRef.current.style.height = 'auto';
      titleTextareaRef.current.style.height = titleTextareaRef.current.scrollHeight + 'px';
    }
  }, [task.title]);

  // Reset reschedule week preview whenever the card collapses
  useEffect(() => {
    if (!task.expanded) setRescheduleWeekOffset(0);
  }, [task.expanded]);

  // Cancel confirm if mouse leaves card
  function handleMouseLeave() { setConfirming(false); }

  function handleDeleteClick(e) {
    e.stopPropagation();
    // Repeating task: ask which tasks to delete (this / this and following / all)
    if (onDeleteFuture && onAskScope) { onAskScope(); return; }
    if (!onDeleteFuture) {
      // Non-repeat task: standard two-click confirm
      if (confirming) { onDelete(); } else { setConfirming(true); }
    } else {
      // Repeat task: first click arms confirm, second click is handled by the two-button UI
      if (!confirming) setConfirming(true);
    }
  }

  // Mobile long-press delete — only when onReschedule prop present (mobile context)
  function handleCardTouchStart(e) {
    if (['INPUT','TEXTAREA','BUTTON','SELECT'].includes(e.target.tagName)) return;
    longPressTimer.current = setTimeout(() => { setMobileConfirming(true); }, 600);
  }
  function handleCardTouchEnd() {
    if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
  }
  function handleCardTouchMove() {
    if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
  }

  return (
    <div className={`task-card ${task.done?'done':''} ${isDragOver?'drag-over':''} ${task.isEvent?'is-event':''} ${task.customColor && !(task.isProjectTask && task.priority)?'custom-color':''}`}
      style={{
        background: task.isProjectTask && task.priority
          ? 'var(--prio-bg)'
          : task.customColor
            ? task.customColor + '55'
            : paletteBg(task.isEvent, task.colorIndex),
        opacity: isDragOver ? 0.5 : 1,
        borderLeft: task.isProjectTask && task.priority ? '3px solid #dc2626' : undefined,
      }}
      onContextMenu={e=>{
        e.preventDefault(); e.stopPropagation();
        if(onShowCtxMenu) onShowCtxMenu(e.clientX, e.clientY, onCopy, onPasteBelow, hasCopied);
      }}
      draggable
      onDragStart={onDragStart}
      onDragOver={e=>{e.preventDefault();onDragOver();}}
      onDragEnd={onDragEnd}
      onDrop={e=>{e.preventDefault();e.stopPropagation();onDrop();}}
      onMouseLeave={handleMouseLeave}
      onTouchStart={onReschedule ? handleCardTouchStart : undefined}
      onTouchEnd={onReschedule ? handleCardTouchEnd : undefined}
      onTouchMove={onReschedule ? handleCardTouchMove : undefined}>
      {confirming && onDeleteFuture ? (
        // Repeat task: offer "Just this" vs "All future"
        <div className="task-delete-repeat-confirm" onClick={e=>e.stopPropagation()}>
          <button className="task-delete-repeat-btn" onClick={e=>{e.stopPropagation();onDelete();}}>Just this</button>
          <button className="task-delete-repeat-btn all" onClick={e=>{e.stopPropagation();onDeleteFuture();}}>All future</button>
          <button className="task-delete-repeat-cancel" onClick={e=>{e.stopPropagation();setConfirming(false);}}>✕</button>
        </div>
      ) : (
        <button
          className={`task-delete-btn ${confirming?'confirming':''}`}
          title={confirming ? 'Click again to confirm delete' : 'Delete task'}
          onClick={handleDeleteClick}>
          {confirming ? 'Delete?' : '✕'}
        </button>
      )}
      <div className="task-card-header">
        {task.isProjectTask ? (
          <span className="task-type-btn event" title={`From project: ${task.projectTitle||''}`}
            style={{cursor:'default',fontSize:14}}>📝</span>
        ) : (
          <button
            className={`task-type-btn ${task.isEvent?'event':''}`}
            title={task.isEvent ? 'Event — click to make Task' : 'Task — click to make Event'}
            onClick={e=>{e.stopPropagation();onUpdate({isEvent:!task.isEvent});}}>
            {task.isEvent ? '📅' : '⠿'}
          </button>
        )}
        {task.isEvent && task.calendarInvite && task.responseStatus==='needsAction' && (
          <span className="invite-badge needsAction" style={{fontSize:8,padding:'1px 4px'}}>📨</span>
        )}
        {/* v4.7.0 — set by the Weekly Review's top 3; click to clear */}
        {task.star && (
          <span title="Top 3 for this week — click to unstar" onClick={e=>{e.stopPropagation();onUpdate({star:false});}}
            style={{fontSize:11,color:'var(--gold)',cursor:'pointer',flexShrink:0,lineHeight:1}}>★</span>
        )}
        <div className={`task-check ${task.done?'done':''}`}
          style={{borderColor: task.done ? '#6a50a7' : undefined, color: task.done ? '#6a50a7' : undefined, background: task.done ? '#f1edff' : undefined}}
          onClick={()=>onUpdate({done:!task.done})} />
        <div style={{flex:1,minWidth:0}}>
          <textarea
            ref={el=>{titleTextareaRef.current=el; if(titleRef)titleRef(el);}}
            className="task-title-input"
            placeholder={task.isEvent ? 'Event…' : 'Task…'}
            autoCapitalize="sentences"
            rows={1}
            value={task.title}
            onChange={e=>{let v=e.target.value.replace(/\n/g,''); if(task.title===''&&v.length===1) v=v.toUpperCase(); onUpdate({title:v});}}
            onBlur={()=>{
              if(onBlurSync && task.isEvent) onBlurSync();
              if(onBlurEdit) onBlurEdit();
              if(deleteIfEmpty) deleteIfEmpty();
            }}
            onKeyDown={e=>{
              if(e.key==='Enter'){
                e.preventDefault();
                if(!task.isEvent && !task.isProjectTask && onEnterKey) onEnterKey();
              }
            }}
            onClick={e=>e.stopPropagation()}
            readOnly={!!task.isProjectTask}
            style={{...(task.isProjectTask ? {cursor:'default'} : {}), width:'100%'}}
          />
          {task.isProjectTask && task.projectTitle && (
            <div className="project-task-badge" title={`From: ${task.projectTitle}`}>
              {task.projectTitle}
            </div>
          )}
        </div>
        {task.isProjectTask && (
          <button
            onClick={e=>{e.stopPropagation();onUpdate({priority:!task.priority});}}
            title={task.priority ? 'Mark normal priority' : 'Mark as priority'}
            style={{
              background:'none', border:'none', cursor:'pointer', fontSize:14,
              color: task.priority ? '#dc2626' : 'var(--ink-faint)',
              padding:'0 2px', transition:'color 0.15s', flexShrink:0,
            }}>
            {task.priority ? '★' : '☆'}
          </button>
        )}
        {mobileConfirming && onReschedule ? (
          <>
            {onDeleteFuture ? (
              onAskScope ? (
                <button className="task-mobile-delete-btn"
                  onClick={e=>{e.stopPropagation();setMobileConfirming(false);onAskScope();}}>
                  Delete…
                </button>
              ) : (
              <>
                <button className="task-mobile-delete-btn"
                  onClick={e=>{e.stopPropagation();setMobileConfirming(false);onDelete();}}>
                  Just this
                </button>
                <button className="task-mobile-delete-btn"
                  style={{background:'#8b4aac'}}
                  onClick={e=>{e.stopPropagation();setMobileConfirming(false);onDeleteFuture();}}>
                  All future
                </button>
              </>
              )
            ) : (
              <button className="task-mobile-delete-btn"
                onClick={e=>{e.stopPropagation();onDelete();}}>
                Delete?
              </button>
            )}
            <button onClick={e=>{e.stopPropagation();setMobileConfirming(false);}}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:13,
                      color:'var(--ink-faint)',padding:'0 4px',flexShrink:0}}>✕</button>
          </>
        ) : (
          <>
          {showChecklist && !open && ckItems.length > 0 && (() => {
            const d = ckItems.filter(i => i.done).length;
            return <span className={`task-ck-pill ${d === ckItems.length ? 'all-done' : ''}`} title="List items checked">{d}/{ckItems.length}</span>;
          })()}
          <button className="task-expand-btn"
            onClick={()=>{setMobileConfirming(false);onUpdate({expanded:!task.expanded});}}>
            {open ? '▲' : '▼'}
          </button>
          </>
        )}
      </div>
      {open && (
        <div className="task-details">
          <textarea ref={textareaRef} className="task-details-input" placeholder="Details…"
            value={task.details||''} onChange={e=>onUpdate({details:e.target.value})}
            onBlur={()=>{ if(onBlurSync && task.isEvent) onBlurSync(); if(onBlurEdit) onBlurEdit(); }}
            rows={2} />
          {showChecklist && ckItems.length > 0 && (
            <TaskChecklist items={ckItems} focusRef={ckFocusRef} onChange={items => onUpdate({ items })} />
          )}
          <div style={{paddingTop:4}} onClick={e=>e.stopPropagation()}>
            <TbTimeRow start={task.isEvent ? (task.eventTime||'') : (task.startTime||'')}
              dur={task.durMin}
              defaultDur={task.isEvent ? 60 : 30}
              clearable={!task.isEvent}
              onChange={p => {
                if (task.isEvent) onUpdate({ ...(('startTime' in p) ? { eventTime: p.startTime } : {}), ...(('durMin' in p) ? { durMin: p.durMin } : {}) });
                else onUpdate(p);
              }} />
          </div>
          {task.isEvent && (
            <div style={{paddingTop:5}} onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginBottom:3}}>Invite (emails):</div>
              <input type="text" placeholder="friend@email.com, other@…"
                value={(task.invitees||[]).join(', ')}
                onChange={e=>onUpdate({invitees:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})}
                style={{width:'100%',fontSize:11,fontFamily:"'DM Sans',sans-serif",
                  border:'1px solid var(--border)',borderRadius:4,padding:'4px 7px',
                  background:'var(--surface)',color:'var(--ink)',outline:'none',boxSizing:'border-box'}}
              />
            </div>
          )}
          {task.isEvent && task.calendarInvite && (
            <div style={{paddingTop:6,borderTop:'1px solid rgba(0,0,0,0.07)',marginTop:4}} onClick={e=>e.stopPropagation()}>
              {task.responseStatus==='needsAction' ? (<>
                <div style={{fontSize:10,color:'var(--gold)',fontFamily:"'DM Mono',monospace",marginBottom:5}}>📨 You've been invited — respond:</div>
                <div className="invite-response-btns">
                  <button className="invite-btn accept" onClick={e=>{
                    e.stopPropagation();
                    respondToCalendarInvite(task.gcalId,'accepted')
                      .then(()=>onUpdate({responseStatus:'accepted'}))
                      .catch(err=>alert('Could not respond: '+err.message));
                  }}>✓ Accept</button>
                  <button className="invite-btn tentative" onClick={e=>{
                    e.stopPropagation();
                    respondToCalendarInvite(task.gcalId,'tentative')
                      .then(()=>onUpdate({responseStatus:'tentative'}))
                      .catch(err=>alert('Could not respond: '+err.message));
                  }}>? Maybe</button>
                  <button className="invite-btn decline" onClick={e=>{
                    e.stopPropagation();
                    respondToCalendarInvite(task.gcalId,'declined')
                      .then(()=>onUpdate({responseStatus:'declined'}))
                      .catch(err=>alert('Could not respond: '+err.message));
                  }}>✗ Decline</button>
                </div>
              </>) : (
                <div style={{fontSize:10,fontFamily:"'DM Mono',monospace"}}>
                  <span className={`invite-badge ${task.responseStatus||'needsAction'}`}>
                    {task.responseStatus==='accepted'?'✓ accepted':task.responseStatus==='declined'?'✗ declined':task.responseStatus==='tentative'?'? maybe':'📨 invited'}
                  </span>
                </div>
              )}
            </div>
          )}
          {/* v5.8.1: per-task color picker removed — colors are auto-assigned */}
          {/* ── Repeat ── */}
          {!task.isProjectTask && (() => {
            const hasRule = taskIsRepeating(task);
            const dk = dayKey || '';
            const dd = repeatDraft;
            const open = repeatOpen && !!dd;
            const set = patch => setRepeatDraft(d => ({ ...d, ...patch }));
            const complete = open && repeatIsComplete(dd);
            const anchorDate = parseLocal(dk);
            const upcoming = complete && dk ? repeatDates(dd, dk, dk, '', 4).slice(0, 4) : [];
            const unitWord = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' }[dd && dd.freq] || 'week';
            const ordinalLabel = anchorDate ? `The ${repeatOrdinal(Math.ceil(anchorDate.getDate() / 7))} ${DAYS[anchorDate.getDay()]}` : 'The same weekday';
            return (
            <div style={{paddingTop:6,borderTop:'1px solid rgba(0,0,0,0.07)',marginTop:6}} onClick={e=>e.stopPropagation()}>
              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <button
                  className={`task-repeat-toggle ${hasRule ? 'active' : ''}`}
                  onClick={e=>{
                    e.stopPropagation();
                    if (open) { setRepeatOpen(false); }
                    else {
                      const saved = normalizeRepeat(task.repeat);
                      setRepeatDraft(saved && hasRule ? { ...saved } : defaultRepeat(dk));
                      setRepeatOpen(true);
                    }
                  }}>
                  🔁 Repeat {open ? '▲' : '▼'}
                </button>
                {showChecklist && ckItems.length === 0 && (
                  <button type="button" className="task-repeat-toggle" title="Add a checklist to this task"
                    onClick={e=>{ e.stopPropagation(); const id = newCkId(); ckFocusRef.current = id; onUpdate({ items: [{ id, text: '', done: false }] }); }}>
                    ☐ + List
                  </button>
                )}
                {hasRule && task.repeat && (
                  <span className="task-repeat-badge">{repeatSummary(task.repeat, dk)}</span>
                )}
                {/* Stop repeating: this task stays, later copies go (v5.6.1) */}
                {hasRule && onStopRepeat && (stopConfirm ? (
                  <span style={{marginLeft:'auto',display:'inline-flex',gap:6,alignItems:'center',fontSize:11}}>
                    <span style={{color:'var(--ink-light)'}}>Remove later copies?</span>
                    <button data-testid="stop-yes" onClick={e=>{e.stopPropagation();setStopConfirm(false);setRepeatOpen(false);onStopRepeat();}}
                      style={{background:'none',border:'1px solid #fca5a5',borderRadius:4,cursor:'pointer',fontSize:11,color:'#ef4444',padding:'1px 8px',fontWeight:600}}>Stop</button>
                    <button onClick={e=>{e.stopPropagation();setStopConfirm(false);}}
                      style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--ink-faint)',padding:'0 2px'}}>Cancel</button>
                  </span>
                ) : (
                  <button data-testid="stop-repeat" onClick={e=>{e.stopPropagation();setStopConfirm(true);}}
                    style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--ink-faint)',padding:'0 2px',marginLeft:'auto'}}>
                    ⏹ Stop repeating
                  </button>
                ))}
              </div>
              {open && (
                <div className="rp-panel">
                  <div className="rp-seg" role="group" aria-label="Repeat frequency">
                    {[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']].map(([v,l]) => (
                      <button key={v} className={dd.freq===v?'active':''}
                        onClick={e=>{e.stopPropagation(); set({ freq: v, days: v==='weekly' && !dd.days.length ? [anchorDate ? anchorDate.getDay() : 1] : dd.days }); }}>{l}</button>
                    ))}
                  </div>
                  <div className="rp-row">
                    <label htmlFor={`rp-int-${task.id}`}>Every</label>
                    <input id={`rp-int-${task.id}`} className="rp-num" type="number" inputMode="numeric" min="1" max="99" value={dd.interval}
                      onChange={e=>set({ interval: Math.max(1, Math.min(99, parseInt(e.target.value, 10) || 1)) })} />
                    <span>{unitWord}{dd.interval === 1 ? '' : 's'}</span>
                  </div>
                  {dd.freq === 'weekly' && (
                    <div className="rp-days" role="group" aria-label="Days of the week">
                      {['S','M','T','W','T','F','S'].map((d,i)=>(
                        <button key={i} aria-label={DAYS[i]} aria-pressed={dd.days.includes(i)}
                          className={`task-repeat-day-btn ${dd.days.includes(i)?'active':''}`}
                          onClick={e=>{
                            e.stopPropagation();
                            set({ days: dd.days.includes(i) ? dd.days.filter(x=>x!==i) : [...dd.days,i].sort((x,y)=>x-y) });
                          }}>{d}</button>
                      ))}
                    </div>
                  )}
                  {dd.freq === 'monthly' && (
                    <div style={{display:'flex',flexDirection:'column'}}>
                      {[['date', `Day ${anchorDate ? anchorDate.getDate() : ''} of the month`],['nth', ordinalLabel],['last','The last day of the month']].map(([v,l]) => (
                        <label key={v} className="rp-radio"><input type="radio" name={`rp-mm-${task.id}`} checked={dd.monthMode===v} onChange={()=>set({ monthMode: v })} />{l}</label>
                      ))}
                    </div>
                  )}
                  <div style={{display:'flex',flexDirection:'column'}}>
                    <div className="rp-label">Ends</div>
                    <label className="rp-radio"><input type="radio" name={`rp-end-${task.id}`} checked={dd.endType==='never'} onChange={()=>set({ endType: 'never' })} />Never</label>
                    <label className="rp-radio"><input type="radio" name={`rp-end-${task.id}`} checked={dd.endType==='date'} onChange={()=>set({ endType: 'date' })} />On
                      <input type="date" className="rp-date" aria-label="End date" value={dd.endDate} onClick={e=>e.stopPropagation()}
                        onChange={e=>set({ endType: 'date', endDate: e.target.value })} /></label>
                    <label className="rp-radio"><input type="radio" name={`rp-end-${task.id}`} checked={dd.endType==='count'} onChange={()=>set({ endType: 'count' })} />After
                      <input type="number" inputMode="numeric" className="rp-num" aria-label="Number of times" min="2" max="400" value={dd.count}
                        onClick={e=>e.stopPropagation()}
                        onChange={e=>set({ endType: 'count', count: Math.max(2, Math.min(400, parseInt(e.target.value, 10) || 2)) })} />times</label>
                  </div>
                  <div className="rp-summary">{repeatSummary({ ...dd, anchor: dk }, dk)}</div>
                  {upcoming.length > 0 && (
                    <div className="rp-next"><b>Next:</b> {upcoming.map(u => { const d = parseLocal(u); return `${DAYS[d.getDay()].slice(0,3)}, ${fmtDisplay(d)}`; }).join(' · ')}</div>
                  )}
                  <div className="rp-actions">
                    <button className="rp-apply" disabled={!complete}
                      onClick={e=>{
                        e.stopPropagation();
                        onApplyRepeat && onApplyRepeat({ ...dd });
                        setRepeatOpen(false);
                      }}>{task.repeatId ? 'Apply…' : 'Apply'}</button>
                    {!complete && <span className="rp-next">{dd.freq==='weekly' && !dd.days.length ? 'Pick at least one day' : 'Pick an end date'}</span>}
                  </div>
                </div>
              )}
            </div>
            );
          })()}

          {/* ── Reschedule (pick a day, incl. other weeks) ── */}
          {onReschedule && weekDays && (() => {
            const previewDays = rescheduleWeekOffset === 0
              ? weekDays
              : weekDays.map(d => addDays(d, rescheduleWeekOffset * 7));
            const rangeStart = previewDays[0], rangeEnd = previewDays[6];
            const sameMonth = rangeStart.getMonth() === rangeEnd.getMonth();
            const weekLabel = sameMonth
              ? `${MONTHS[rangeStart.getMonth()].slice(0,3)} ${rangeStart.getDate()}–${rangeEnd.getDate()}`
              : `${MONTHS[rangeStart.getMonth()].slice(0,3)} ${rangeStart.getDate()} – ${MONTHS[rangeEnd.getMonth()].slice(0,3)} ${rangeEnd.getDate()}`;
            const today = new Date(); today.setHours(0,0,0,0);
            return (
              <div style={{paddingTop:6,borderTop:'1px solid rgba(0,0,0,0.07)',marginTop:6}} onClick={e=>e.stopPropagation()}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',rowGap:3,marginBottom:5}}>
                  <div style={{fontSize:9,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",whiteSpace:'nowrap'}}>📅 Move to:</div>
                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                    {rescheduleWeekOffset !== 0 && (
                      <button onClick={e=>{e.stopPropagation();setRescheduleWeekOffset(0);}}
                        style={{background:'none',border:'none',cursor:'pointer',fontSize:8,
                                color:'var(--accent)',fontFamily:"'DM Mono',monospace",
                                textDecoration:'underline',padding:'0 2px',whiteSpace:'nowrap'}}>
                        This week
                      </button>
                    )}
                    <button onClick={e=>{e.stopPropagation();setRescheduleWeekOffset(o=>o-1);}}
                      style={{background:'none',border:'1px solid var(--border)',borderRadius:3,
                              cursor:'pointer',fontSize:9,color:'var(--ink-light)',flexShrink:0,
                              width:15,height:15,lineHeight:1,padding:0}}>‹</button>
                    <span style={{fontSize:8,color:'var(--ink)',fontFamily:"'DM Mono',monospace",
                                  fontWeight:600,textAlign:'center',whiteSpace:'nowrap'}}>
                      {weekLabel}
                    </span>
                    <button onClick={e=>{e.stopPropagation();setRescheduleWeekOffset(o=>o+1);}}
                      style={{background:'none',border:'1px solid var(--border)',borderRadius:3,
                              cursor:'pointer',fontSize:9,color:'var(--ink-light)',flexShrink:0,
                              width:15,height:15,lineHeight:1,padding:0}}>›</button>
                  </div>
                </div>
                <div style={{display:'flex',gap:2,width:'100%'}}>
                  {previewDays.map((d,i)=>{
                    const dk = fmt(d);
                    const isCurrentDay = rescheduleWeekOffset === 0 && dk === currentDayKey;
                    const isToday = d.getTime() === today.getTime();
                    return (
                      <button key={i}
                        onClick={e=>{
                          e.stopPropagation();
                          if (isCurrentDay) return;
                          onReschedule(dk);
                          setRescheduleWeekOffset(0);
                        }}
                        title={`${DAYS[d.getDay()]} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`}
                        style={{
                          flex:'1 1 0', minWidth:0, height:30, borderRadius:6, border:'1.5px solid',
                          borderColor: isCurrentDay ? 'var(--accent)' : (isToday ? 'var(--gold)' : 'var(--border)'),
                          background: isCurrentDay ? 'var(--accent)' : 'var(--surface)',
                          color: isCurrentDay ? 'white' : 'var(--ink-light)',
                          fontFamily:"'DM Mono',monospace", fontSize:8, fontWeight:600,
                          cursor: isCurrentDay ? 'default' : 'pointer',
                          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                          gap:1, transition:'all 0.12s', padding:0, overflow:'hidden',
                        }}>
                        <span>{DAYS[d.getDay()].slice(0,1)}</span>
                        <span style={{fontSize:8,opacity:isCurrentDay?0.9:0.7}}>{d.getDate()}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })()}
          {/* Mobile delete — only in expanded section, only in mobile context */}
          {onReschedule && (
            <div style={{paddingTop:8,marginTop:6,borderTop:'1px solid rgba(0,0,0,0.07)',display:'flex',justifyContent:'flex-end'}}
              onClick={e=>e.stopPropagation()}>
              {mobileConfirming ? (
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <button className="task-mobile-delete-btn"
                    onClick={e=>{e.stopPropagation();if (onDeleteFuture && onAskScope) { setMobileConfirming(false); onAskScope(); } else onDelete();}}>
                    {onDeleteFuture && onAskScope ? 'Delete…' : 'Delete?'}
                  </button>
                  <button onClick={e=>{e.stopPropagation();setMobileConfirming(false);}}
                    style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--ink-faint)',padding:'0 4px'}}>✕</button>
                </div>
              ) : (
                <button onClick={e=>{e.stopPropagation();setMobileConfirming(true);}}
                  style={{background:'none',border:'1px solid #fca5a5',borderRadius:4,cursor:'pointer',
                          fontSize:11,color:'#ef4444',padding:'3px 10px',fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
                  Delete
                </button>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Streak badge: 🔥N (days) or 🔥Nw plus "2/3" this-week progress for × per week habits
function HabitStreakChip({ goal, streak, completions }) {
  const wp = habitWeekProgress(goal, completions, new Date());
  const weekly = !!(goal.freq && goal.freq.type === 'perWeek');
  return (
    <>
      {wp && <span title="Done this week" style={{marginRight:4}}>{wp.done}/{wp.n}</span>}
      <span title={weekly ? 'Current streak (weeks)' : 'Current streak'} style={{color:'var(--gold)'}}>🔥{streak}{weekly ? 'w' : ''}</span>
    </>
  );
}

// "How often" editor shown in a habit's expanded section: every day / certain days / × per week,
// plus a rest-day toggle for the selected day (rest days never break a streak).
function HabitFreqEditor({ goal, onChange, dayKey }) {
  const type = (goal.freq && goal.freq.type) || 'daily';
  const days = (goal.freq && goal.freq.days) || [];
  const n = (goal.freq && goal.freq.n) || 3;
  const restDates = goal.restDates || [];
  const isRest = restDates.includes(dayKey);
  const dayDate = parseLocal(dayKey);
  const dayLabel = dayDate ? `${DAYS[dayDate.getDay()].slice(0,3)} ${fmtDisplay(dayDate)}` : dayKey;
  function pick(t) {
    if (t === 'daily') onChange({ freq: undefined });
    else if (t === 'days') onChange({ freq: { type: 'days', days: days.length ? days : [1,3,5] } });
    else onChange({ freq: { type: 'perWeek', n } });
  }
  const label = { fontSize:10, color:'var(--ink-faint)', fontFamily:"'DM Mono',monospace", flexShrink:0 };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:6}} onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
        <span style={label}>How often:</span>
        <div className="habit-schedule-selector">
          {[['daily','Every day'],['days','Certain days'],['perWeek','× a week']].map(([val,lab]) => (
            <button key={val} className={`habit-schedule-btn ${type===val?'active':''}`}
              onClick={e=>{e.stopPropagation();pick(val);}}>{lab}</button>
          ))}
        </div>
      </div>
      {type === 'days' && (
        <div className="task-repeat-days">
          {['S','M','T','W','T','F','S'].map((d,i)=>(
            <button key={i} aria-label={DAYS[i]} className={`task-repeat-day-btn ${days.includes(i)?'active':''}`}
              onClick={e=>{
                e.stopPropagation();
                const next = days.includes(i) ? days.filter(x=>x!==i) : [...days,i].sort((a,b)=>a-b);
                onChange({ freq: { type: 'days', days: next } });
              }}>{d}</button>
          ))}
        </div>
      )}
      {type === 'perWeek' && (
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="habit-schedule-btn" aria-label="Fewer times a week"
            onClick={e=>{e.stopPropagation();onChange({ freq: { type:'perWeek', n: Math.max(1, n-1) } });}}>−</button>
          <span style={{fontSize:12,fontFamily:"'DM Sans',sans-serif",color:'var(--ink)'}}>{n} time{n===1?'':'s'} a week</span>
          <button className="habit-schedule-btn" aria-label="More times a week"
            onClick={e=>{e.stopPropagation();onChange({ freq: { type:'perWeek', n: Math.min(7, n+1) } });}}>+</button>
        </div>
      )}
      {type !== 'perWeek' && (
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <span style={label}>Rest day:</span>
          <button className={`habit-schedule-btn ${isRest?'active':''}`}
            onClick={e=>{
              e.stopPropagation();
              onChange({ restDates: isRest ? restDates.filter(d=>d!==dayKey) : [...restDates, dayKey].sort() });
            }}>{isRest ? `✓ ${dayLabel} is a rest day` : `Make ${dayLabel} a rest day`}</button>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// HABIT TRACKER
// ─────────────────────────────────────────────
function HabitTracker({ onGoToPlanner, onGoToMetrics, goals, setGoals, completions, setCompletions, metrics, setMetrics, qty, setQty, notes, setNotes, fitnessLog, fitnessExercises, countdowns, setCountdowns }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [selectedDate, setSelectedDateRaw] = useState(() => {
    const saved = parseLocal(sessionStorage.getItem('lp_habitDate'));
    return saved || today;
  });
  const setSelectedDate = (v) => setSelectedDateRaw(prev => {
    const next = typeof v === 'function' ? v(prev) : v;
    sessionStorage.setItem('lp_habitDate', fmtLocal(next));
    return next;
  });
  const [view, setViewRaw] = useState(() => sessionStorage.getItem('lp_habitView') || 'monthly'); // daily, weekly, monthly, yearly
  const setView = (v) => { sessionStorage.setItem('lp_habitView', v); setViewRaw(v); };
  const [filterGoal, setFilterGoal] = useState(null); // null = all
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [expandedGoals, setExpandedGoals] = useState({}); // {goalId: bool} for sidebar
  const [dragGoalId, setDragGoalId] = useState(null);
  const [dragOverGoalId, setDragOverGoalId] = useState(null);
  // Countdown state
  const [sheetOpen, setSheetOpen] = useState(false);
  const [addingCountdown, setAddingCountdown] = useState(false);
  const [newCdTitle, setNewCdTitle] = useState('');
  const [newCdStart, setNewCdStart] = useState(fmt(new Date()));
  const [newCdEnd, setNewCdEnd] = useState('');
  const [newCdColor, setNewCdColor] = useState(COUNTDOWN_COLORS[0]);

  function saveCountdown() {
    if (!newCdTitle.trim() || !newCdEnd) return;
    const cd = { id: 'cd'+Date.now(), title: newCdTitle.trim(), startDate: newCdStart, endDate: newCdEnd, color: newCdColor };
    setCountdowns(cs => [...cs, cd]);
    setNewCdTitle(''); setNewCdEnd(''); setNewCdStart(fmt(new Date())); setNewCdColor(COUNTDOWN_COLORS[0]);
    setAddingCountdown(false);
  }
  function deleteCountdown(id) {
    const idx = (countdowns||[]).findIndex(c => c.id === id);
    const cd = (countdowns||[])[idx];
    setCountdowns(cs => cs.filter(c => c.id !== id));
    if (cd) Undo.push(`Deleted countdown "${(cd.title||'countdown').slice(0,40)}"`, () => {
      setCountdowns(cs => {
        if ((cs||[]).some(c => c.id === id)) return cs;
        const next = [...(cs||[])];
        next.splice(Math.min(idx, next.length), 0, cd);
        return next;
      });
    });
  }

  function renderCountdownCards() {
    if (!countdowns || countdowns.length === 0) return null;
    return countdowns.map(cd => {
      const end = parseLocal(cd.endDate);
      const start = cd.startDate ? parseLocal(cd.startDate) : null;
      const daysLeft = Math.ceil((end - today) / 86400000);
      const isDone = daysLeft <= 0;
      const pct = start ? Math.min(100, Math.max(0, (today - start) / (end - start) * 100)) : null;
      const color = cd.color || COUNTDOWN_COLORS[0];
      const [ey, em, ed] = cd.endDate.split('-').map(Number);
      const endDisplay = MONTHS[em-1].slice(0,3)+' '+ed+', '+ey;
      const totalDays = start ? Math.round((end - start) / 86400000) : null;
      return (
        <div key={cd.id} className="countdown-card" style={{borderLeftColor: color}}>
          <button className="countdown-delete" onClick={()=>deleteCountdown(cd.id)}>✕</button>
          <div className="countdown-card-row">
            <div>
              <div className={`countdown-number${isDone?' done':''}`} style={{color: isDone?'var(--gold)':color}}>
                {isDone ? '🎉' : daysLeft}
              </div>
              <div className="countdown-unit">{isDone ? 'done!' : 'days left'}</div>
            </div>
            <div className="countdown-info">
              <div className="countdown-title">{cd.title}</div>
              <div className="countdown-dates">
                {start ? `${cd.startDate} → ` : ''}{endDisplay}
                {totalDays ? ` (${totalDays}d)` : ''}
              </div>
            </div>
          </div>
          {pct !== null && (
            <div className="countdown-progress-bg">
              <div className="countdown-progress-fill" style={{width: pct+'%', background: color}}/>
            </div>
          )}
        </div>
      );
    });
  }

  function renderCountdownAddForm() {
    return addingCountdown ? (
      <div className="countdown-add-form">
        <input
          placeholder="Title (e.g. 100 Days of Practice)"
          value={newCdTitle} onChange={e=>setNewCdTitle(e.target.value)}
          style={{width:'100%',fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',
            borderRadius:4,padding:'4px 7px',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
          onKeyDown={e=>e.key==='Enter'&&saveCountdown()}
        />
        <div style={{display:'flex',gap:6}}>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
            <label style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.05em'}}>Start</label>
            <input type="date" value={newCdStart} onChange={e=>setNewCdStart(e.target.value)}
              style={{width:'100%',fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',outline:'none',background:'var(--surface)',boxSizing:'border-box'}}/>
          </div>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
            <label style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.05em'}}>End *</label>
            <input type="date" value={newCdEnd} onChange={e=>setNewCdEnd(e.target.value)}
              style={{width:'100%',fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'3px 5px',outline:'none',background:'var(--surface)',boxSizing:'border-box'}}/>
          </div>
        </div>
        <div style={{display:'flex',gap:4,alignItems:'center'}}>
          {COUNTDOWN_COLORS.map(c=>(
            <div key={c} className={`countdown-color-swatch${newCdColor===c?' selected':''}`}
              style={{background:c}} onClick={()=>setNewCdColor(c)}/>
          ))}
        </div>
        <div style={{display:'flex',gap:6}}>
          <button onClick={saveCountdown} disabled={!newCdTitle.trim()||!newCdEnd}
            style={{flex:1,background:newCdTitle.trim()&&newCdEnd?'var(--accent)':'var(--border)',color:newCdTitle.trim()&&newCdEnd?'white':'var(--ink-faint)',
              border:'none',borderRadius:4,padding:'5px 0',cursor:newCdTitle.trim()&&newCdEnd?'pointer':'default',
              fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>Save</button>
          <button onClick={()=>{setAddingCountdown(false);setNewCdTitle('');setNewCdEnd('');}}
            style={{background:'none',border:'1px solid var(--border)',borderRadius:4,padding:'5px 10px',
              cursor:'pointer',fontSize:12,fontFamily:"'DM Sans',sans-serif",color:'var(--ink-light)'}}>Cancel</button>
        </div>
      </div>
    ) : (
      <button onClick={()=>setAddingCountdown(true)}
        style={{width:'100%',background:'none',border:'1px dashed var(--border)',borderRadius:'var(--radius-sm)',
          padding:'5px 0',cursor:'pointer',fontSize:11,color:'var(--ink-faint)',fontFamily:"'DM Sans',sans-serif",
          marginBottom:8,transition:'all 0.15s'}}
        onMouseEnter={e=>{e.target.style.borderColor='var(--accent)';e.target.style.color='var(--accent)';}}
        onMouseLeave={e=>{e.target.style.borderColor='var(--border)';e.target.style.color='var(--ink-faint)';}}>
        + Add countdown
      </button>
    );
  }

  // ── Fitness → Habit sync is handled at App level ──────────────────────

  function isCompleted(goalId, dateKey) {
    return (completions[dateKey]||[]).includes(goalId);
  }
  function toggleCompletion(goalId, dateKey) {
    setCompletions(c => {
      const arr = c[dateKey]||[];
      const has = arr.includes(goalId);
      return { ...c, [dateKey]: has ? arr.filter(x=>x!==goalId) : [...arr, goalId] };
    });
  }

  // Metrics helpers (weight/cals per day)
  function getMetric(field) { return (metrics[selectedDayKey] || {})[field] || ''; }
  function setMetric(field, val) {
    setMetrics(m => ({...m, [selectedDayKey]: {...(m[selectedDayKey]||{}), [field]: val}}));
  }

  // Qty helpers (amount per goal per day) — line-item aware
  function getRawQty(goalId) { return (qty[selectedDayKey] || {})[goalId]; }
  function getQtyItems(goalId) { return normalizeQty(getRawQty(goalId)); }
  function getQty(goalId) {
    const total = qtyTotal(getRawQty(goalId));
    return total === 0 ? '' : String(total);
  }
  function setGoalQty(goalId, val) {
    // For single-entry habits: write as LineItem[] with one item preserving any existing note
    const existing = getQtyItems(goalId);
    const note = existing.length > 0 ? existing[0].note : '';
    const n = parseFloat(val);
    const items = (val === '' || isNaN(n)) ? [] : [{id: existing.length > 0 ? existing[0].id : genLiId(), amount:n, note, ts: existing.length > 0 ? existing[0].ts : Date.now()}];
    setQty(q => ({...q, [selectedDayKey]: {...(q[selectedDayKey]||{}), [goalId]: items}}));
  }
  function addQtyEntry(goalId, amount, note) {
    const n = parseFloat(amount);
    if (isNaN(n) || n === 0) return;
    const existing = getQtyItems(goalId);
    const newItem = {id: genLiId(), amount: n, note: note||'', ts: Date.now()};
    setQty(q => ({...q, [selectedDayKey]: {...(q[selectedDayKey]||{}), [goalId]: [...existing, newItem]}}));
  }
  function removeQtyEntry(goalId, liId) {
    const updated = getQtyItems(goalId).filter(li => li.id !== liId);
    setQty(q => ({...q, [selectedDayKey]: {...(q[selectedDayKey]||{}), [goalId]: updated}}));
  }
  function updateQtyEntry(goalId, liId, patch) {
    const updated = getQtyItems(goalId).map(li => li.id === liId ? {...li, ...patch} : li);
    setQty(q => ({...q, [selectedDayKey]: {...(q[selectedDayKey]||{}), [goalId]: updated}}));
  }
  function getNote(goalId) { return (notes[selectedDayKey] || {})[goalId] || ''; }
  function setGoalNote(goalId, val) {
    setNotes(n => ({...n, [selectedDayKey]: {...(n[selectedDayKey]||{}), [goalId]: val}}));
  }
  function reorderGoals(fromId, toId) {
    setGoals(gs => {
      const from = gs.findIndex(g => g.id === fromId);
      const to   = gs.findIndex(g => g.id === toId);
      if (from === -1 || to === -1) return gs;
      const next = [...gs];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  }

  function addGoal() {
    const id = 'g'+Date.now();
    setGoals(g=>[...g, {id, name:'New Goal', color: GOAL_COLORS[g.length % GOAL_COLORS.length]}]);
  }
  function updateGoal(id, patch) { setGoals(g=>g.map(x=>x.id===id?{...x,...patch}:x)); }
  function deleteGoal(id) {
    const idx = goals.findIndex(x => x.id === id);
    const habit = goals[idx];
    setGoals(g=>g.filter(x=>x.id!==id));
    // Completions are kept in their own data, so restoring the habit brings its history back too
    if (habit) Undo.push(`Deleted habit "${(habit.name||'habit').slice(0,40)}"`, () => {
      setGoals(gs => {
        if (gs.some(x => x.id === id)) return gs;
        const next = [...gs];
        next.splice(Math.min(idx, next.length), 0, habit);
        return next;
      });
    });
  }

  // Count completions for a goal in current view window
  function countInView(goalId) {
    let dates = [];
    if (view==='daily') { dates=[fmt(selectedDate)]; }
    else if (view==='weekly') {
      const ws=getWeekStart(selectedDate);
      dates=Array.from({length:7},(_,i)=>fmt(addDays(ws,i)));
    }
    else if (view==='monthly') {
      const d=new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
      const m=d.getMonth();
      while(d.getMonth()===m) { dates.push(fmt(d)); d.setDate(d.getDate()+1); }
    }
    else { // yearly
      const d=new Date(selectedDate.getFullYear(),0,1);
      while(d.getFullYear()===selectedDate.getFullYear()) { dates.push(fmt(d)); d.setDate(d.getDate()+1); }
    }
    return dates.filter(dk=>isCompleted(goalId,dk)).length;
  }

  // Sum qty for a goal across all dates in the current view window
  function qtyRollup(goalId) {
    let dates = [];
    if (view==='daily') { dates=[fmt(selectedDate)]; }
    else if (view==='weekly') {
      const ws=getWeekStart(selectedDate);
      dates=Array.from({length:7},(_,i)=>fmt(addDays(ws,i)));
    }
    else if (view==='monthly') {
      const d=new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
      const m=d.getMonth();
      while(d.getMonth()===m) { dates.push(fmt(d)); d.setDate(d.getDate()+1); }
    }
    else { // yearly
      const d=new Date(selectedDate.getFullYear(),0,1);
      while(d.getFullYear()===selectedDate.getFullYear()) { dates.push(fmt(d)); d.setDate(d.getDate()+1); }
    }
    return dates.reduce((sum, dk) => {
      const v = qtyTotal((qty[dk]||{})[goalId]);
      return sum + v;
    }, 0);
  }

  function calcStreak(goalId) {
    // Handles every-day, certain-days and × per week habits, plus rest days (see habitStreak)
    const goal = goals.find(g => g.id === goalId) || { id: goalId };
    return habitStreak(goal, completions, new Date());
  }

  const selectedDayKey = fmt(selectedDate);

  const displayGoals = filterGoal ? goals.filter(g=>g.id===filterGoal) : goals;

  return (
    <div className="main-content">
      {/* SIDEBAR — collapsible */}
      <div className={`sidebar-wrap ${sidebarCollapsed ? 'collapsed' : ''}`}>
      <div className="sidebar habit-sidebar">
        <div className="date-nav">
          <button className="nav-arrow" onClick={()=>setSelectedDate(d=>addDays(d,-1))}>‹</button>
          <span className="date-nav-label">
            {DAYS[selectedDate.getDay()].slice(0,3)}, {MONTHS[selectedDate.getMonth()].slice(0,3)} {selectedDate.getDate()}, {selectedDate.getFullYear()}
          </span>
          <button className="nav-arrow" onClick={()=>setSelectedDate(d=>addDays(d,1))}>›</button>
        </div>

        {/* Weight + Cal/Pts fields */}
        <div style={{display:'flex',gap:8,marginBottom:12,padding:'8px 0',borderBottom:'1px solid var(--border)',alignItems:'flex-end'}}>          <div style={{flex:1,display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Weight</label>
            <input type="number" step="0.1"
              className="goal-name-input"
              style={{width:'100%',textAlign:'center',fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:600}}
              placeholder="—"
              value={getMetric('weight')}
              onChange={e=>setMetric('weight', e.target.value)}
              onClick={e=>e.stopPropagation()}
            />
          </div>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Cal/Pts</label>
            <input type="number" step="1"
              className="goal-name-input"
              style={{width:'100%',textAlign:'center',fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:600}}
              placeholder="—"
              value={getMetric('cals')}
              onChange={e=>setMetric('cals', e.target.value)}
              onClick={e=>e.stopPropagation()}
            />
          </div>
          <button
            onClick={onGoToMetrics}
            title="View Metrics Charts"
            style={{background:'none',border:'1px solid var(--border)',borderRadius:6,cursor:'pointer',
                    padding:'4px 7px',fontSize:15,color:'var(--accent)',flexShrink:0,marginBottom:1}}>
            📈
          </button>
        </div>

        <div className="checklist-header" style={{marginBottom:8}}>
          <div>
            <div className="sidebar-section-title">Countdowns</div>
          </div>
          <button className="add-btn" onClick={()=>setAddingCountdown(a=>!a)}>+</button>
        </div>
        {renderCountdownCards()}
        {renderCountdownAddForm()}

        <div className="checklist-header" style={{marginBottom:8}}>
          <div>
            <div className="sidebar-section-title">Habits</div>
            <div style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",marginTop:1}}>click row to filter</div>
          </div>
          <button className="add-btn" onClick={addGoal}>+</button>
        </div>

        {goals.map(goal=>{
          const isExpanded = !!expandedGoals[goal.id];
          const isDragOver = dragOverGoalId === goal.id;
          return (
          <div key={goal.id}
            className={`goal-item ${filterGoal===goal.id?'selected':''} ${isDragOver?'drag-over':''}`}
            style={{
              flexDirection:'column', alignItems:'stretch', padding:0,
              borderColor: filterGoal===goal.id ? goal.color : isDragOver ? 'var(--accent)' : undefined,
              background: filterGoal===goal.id ? goal.color+'15' : undefined,
              opacity: dragGoalId === goal.id ? 0.4 : 1,
            }}
            draggable
            onDragStart={e=>{ e.stopPropagation(); setDragGoalId(goal.id); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',goal.id); }}
            onDragEnd={()=>{ setDragGoalId(null); setDragOverGoalId(null); }}
            onDragOver={e=>{ e.preventDefault(); e.stopPropagation(); setDragOverGoalId(goal.id); }}
            onDrop={e=>{ e.preventDefault(); e.stopPropagation(); if(dragGoalId && dragGoalId!==goal.id) reorderGoals(dragGoalId, goal.id); setDragGoalId(null); setDragOverGoalId(null); }}
          >
            {/* Main row */}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',cursor:'pointer'}}
              onClick={()=>setFilterGoal(filterGoal===goal.id?null:goal.id)}
              title={filterGoal===goal.id?'Click to show all goals':'Click to filter by this goal'}>
              <ColorPicker value={goal.color} onChange={c=>{updateGoal(goal.id,{color:c});}} />
              <div className={`goal-check ${isCompleted(goal.id,selectedDayKey)?'checked':''}`}
                style={{color:hcText(goal.color)}}
                onClick={e=>{e.stopPropagation();toggleCompletion(goal.id,selectedDayKey);}} />
              <input className="goal-name-input" value={goal.name}
                onChange={e=>updateGoal(goal.id,{name:e.target.value})}
                onClick={e=>e.stopPropagation()} />
              <span className="goal-count" style={{flexShrink:0}}>
                {countInView(goal.id)}
                <span style={{margin:'0 3px',opacity:0.6}}>·</span>
                <HabitStreakChip goal={goal} streak={calcStreak(goal.id)} completions={completions} />
              </span>
              <button
                style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--ink-faint)',padding:'0 2px',flexShrink:0}}
                onClick={e=>{e.stopPropagation();setExpandedGoals(ex=>({...ex,[goal.id]:!ex[goal.id]}));}}
                title="Qty & notes">
                {isExpanded ? '▲' : '▼'}
              </button>
              <button className="delete-item-btn" style={{opacity:0}} onClick={e=>{e.stopPropagation();deleteGoal(goal.id);}}
                onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=0}>✕</button>
            </div>
            {/* Expanded section */}
            {isExpanded && (
              <div style={{padding:'4px 8px 8px 8px',display:'flex',flexDirection:'column',gap:6,borderTop:'1px solid var(--border)'}}
                onClick={e=>e.stopPropagation()}>
                {/* Schedule */}
                <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",flexShrink:0}}>Weekly view:</span>
                  <div className="habit-schedule-selector">
                    <button className={`habit-schedule-btn ${goal.schedule==='daily'?'active':''}`} style={{minHeight:44,padding:'0 14px'}}
                      aria-pressed={goal.schedule==='daily'}
                      onClick={e=>{e.stopPropagation();updateGoal(goal.id,{schedule:goal.schedule==='daily'?undefined:'daily'});}}>
                      {goal.schedule==='daily' ? '✓ Shown daily' : 'Show daily'}
                    </button>
                  </div>
                </div>
                {/* How often (every day / certain days / × a week) + rest day */}
                <HabitFreqEditor goal={goal} dayKey={selectedDayKey} onChange={patch=>updateGoal(goal.id, patch)} />
                {/* Link to fitness exercise */}
                {fitnessExercises && fitnessExercises.length > 0 && (
                  <div style={{display:'flex',flexDirection:'column',gap:3}}>
                    <span style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace"}}>Link exercises (any qualifies):</span>
                    <div style={{display:'flex',flexDirection:'column',gap:2,maxHeight:80,overflowY:'auto',
                      border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',background:'var(--surface)'}}>
                      {fitnessExercises.map(e => {
                        const ids = goal.linkedExerciseIds || (goal.linkedExerciseId ? [goal.linkedExerciseId] : []);
                        const checked = ids.includes(e.id);
                        return (
                          <label key={e.id} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',
                            fontSize:11,fontFamily:"'DM Sans',sans-serif",color:'var(--ink)'}}
                            onClick={ev=>ev.stopPropagation()}>
                            <input type="checkbox" checked={checked}
                              onChange={ev=>{
                                const cur = goal.linkedExerciseIds || (goal.linkedExerciseId ? [goal.linkedExerciseId] : []);
                                const next = ev.target.checked ? [...cur, e.id] : cur.filter(x=>x!==e.id);
                                updateGoal(goal.id, {linkedExerciseIds: next, linkedExerciseId: undefined});
                              }}
                              style={{margin:0,cursor:'pointer'}}/>
                            {e.name}
                          </label>
                        );
                      })}
                    </div>
                  </div>
                )}
                {/* Multi-entry toggle */}
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace",flexShrink:0}}>Multi-entry:</span>
                  <button
                    onClick={e=>{e.stopPropagation();updateGoal(goal.id,{multiEntry:!goal.multiEntry});}}
                    style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,padding:'1px 8px',borderRadius:10,border:'1px solid var(--border)',background:goal.multiEntry?'var(--accent)':'var(--cream)',color:goal.multiEntry?'white':'var(--ink-light)',cursor:'pointer',lineHeight:1.6}}
                    title="Allow multiple line-item entries per day">
                    {goal.multiEntry ? 'On' : 'Off'}
                  </button>
                  <button
                    onClick={e=>{e.stopPropagation();updateGoal(goal.id,{qtyMode:(goal.qtyMode||'qty')==='qty'?'$':'qty'});}}
                    style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,padding:'1px 6px',borderRadius:10,border:'1px solid var(--border)',background:(goal.qtyMode||'qty')==='$'?'var(--gold)':'var(--cream)',color:(goal.qtyMode||'qty')==='$'?'white':'var(--ink-light)',cursor:'pointer',flexShrink:0,lineHeight:1.6}}
                    title="Toggle between Qty and $ mode">
                    {(goal.qtyMode||'qty')==='$' ? '$' : 'Qty'}
                  </button>
                </div>
                <QtySection goal={goal} items={getQtyItems(goal.id)} getQty={getQty}
                  setGoalQty={setGoalQty} addQtyEntry={addQtyEntry}
                  removeQtyEntry={removeQtyEntry} updateQtyEntry={updateQtyEntry} />
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  <span style={{fontSize:10,color:'var(--ink-faint)',fontFamily:"'DM Mono',monospace"}}>Notes:</span>
                  <textarea
                    rows={2}
                    style={{width:'100%',fontSize:12,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',resize:'vertical',outline:'none',background:'var(--surface)',color:'var(--ink)',boxSizing:'border-box'}}
                    placeholder="Notes for today…"
                    value={getNote(goal.id)}
                    onChange={e=>setGoalNote(goal.id, e.target.value)}
                    onClick={e=>e.stopPropagation()}
                  />
                </div>
              </div>
            )}
          </div>
          );
        })}

        <div style={{flex:1}}/>
        <div className="sidebar-links">
          <button className="sidebar-link planner" onClick={onGoToPlanner}>📅 Weekly Planner</button>
        </div>
      </div>{/* end habit-sidebar */}
      <div className="sidebar-toggle-strip" onClick={()=>setSidebarCollapsed(c=>!c)}
        title={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}>
        <div className="sidebar-toggle-btn">{sidebarCollapsed ? '›' : '‹'}</div>
        <span className="sidebar-collapsed-label">Habits</span>
      </div>
      </div>{/* end sidebar-wrap */}

      {/* MAIN */}
      <div className="habit-main">
        <div className="habit-header-row">
          <div className="view-tabs">
            {['daily','weekly','monthly','yearly'].map(v=>(
              <button key={v} className={`view-tab ${view===v?'active':''}`}
                onClick={()=>setView(v)}>
                {v.charAt(0).toUpperCase()+v.slice(1)}
              </button>
            ))}
          </div>
          <div style={{flex:1}}/>
        </div>

        {/* GOAL FILTER CHIPS */}
        <div className="goal-filter-row">
          <div className={`goal-filter-chip ${!filterGoal?'active':''}`} onClick={()=>setFilterGoal(null)}>
            All
          </div>
          {goals.map(g=>(
            <div key={g.id} className={`goal-filter-chip ${filterGoal===g.id?'active':''}`}
              onClick={()=>setFilterGoal(filterGoal===g.id?null:g.id)}
              style={filterGoal===g.id?{}:{borderColor:g.color, color:hcText(g.color)}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:g.color,display:'inline-block'}}/>
              {g.name}
            </div>
          ))}
        </div>

        {/* Nav arrows — above calendar, centered */}
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',padding:'4px 0 8px',borderBottom:'1px solid var(--border)',marginBottom:'8px'}}>
          <HabitNavArrows view={view} date={selectedDate} onChange={setSelectedDate}/>
        </div>

        {/* Qty rollup banner — shown when a single habit is filtered and it has a qty mode */}
        {filterGoal && (() => {
          const fg = goals.find(g => g.id === filterGoal);
          if (!fg || view === 'daily') return null;
          const total = qtyRollup(filterGoal);
          if (total === 0) return null;
          const isDollar = (fg.qtyMode || 'qty') === '$';
          const displayVal = isDollar
            ? '$' + (Number.isInteger(total) ? total.toLocaleString() : total.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}))
            : (Number.isInteger(total) ? total.toLocaleString() : parseFloat(total.toFixed(4)).toString());

            <div style={{
              display:'flex',alignItems:'baseline',justifyContent:'center',gap:8,
              padding:'8px 16px',marginBottom:10,
              background: fg.color + '12',

            }}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:26,fontWeight:700,color:fg.color,lineHeight:1}}>
                {displayVal}
              </span>
              <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:'var(--ink-faint)',letterSpacing:'0.03em'}}>
                total · {viewLabel}
              </span>
            </div>
          );
        })()}

        {view==='monthly' && <>
          <MonthlyView date={selectedDate} selected={selectedDate} goals={displayGoals} completions={completions}
            qty={qty} notes={notes}
            onDayClick={setSelectedDate} today={today} />
          <div className="habit-selected-date-mobile">
            {DAYS[selectedDate.getDay()]}, {MONTHS[selectedDate.getMonth()]} {selectedDate.getDate()}
          </div>
          <HabitChecklist date={selectedDate} goals={goals} completions={completions}
            onToggle={toggleCompletion} onAdd={addGoal} onDelete={deleteGoal} onRename={updateGoal}
            onReorder={reorderGoals}
            onGoToMetrics={onGoToMetrics}
            getMetric={getMetric} setMetric={setMetric}
            getQty={getQty} setGoalQty={setGoalQty} getQtyItems={getQtyItems} addQtyEntry={addQtyEntry} removeQtyEntry={removeQtyEntry} updateQtyEntry={updateQtyEntry}
            getNote={getNote} setGoalNote={setGoalNote}
            countInView={countInView} calcStreak={calcStreak}
            fitnessExercises={fitnessExercises} />
        </>}
        {view==='weekly' && <>
          <WeeklyHabitView date={selectedDate} selected={selectedDate} goals={displayGoals} completions={completions} today={today} qty={qty} notes={notes} onDayClick={setSelectedDate} />
          <div className="habit-selected-date-mobile">
            {DAYS[selectedDate.getDay()]}, {MONTHS[selectedDate.getMonth()]} {selectedDate.getDate()}
          </div>
          <HabitChecklist date={selectedDate} goals={goals} completions={completions}
            onToggle={toggleCompletion} onAdd={addGoal} onDelete={deleteGoal} onRename={updateGoal}
            onReorder={reorderGoals}
            onGoToMetrics={onGoToMetrics}
            getMetric={getMetric} setMetric={setMetric}
            getQty={getQty} setGoalQty={setGoalQty} getQtyItems={getQtyItems} addQtyEntry={addQtyEntry} removeQtyEntry={removeQtyEntry} updateQtyEntry={updateQtyEntry}
            getNote={getNote} setGoalNote={setGoalNote}
            countInView={countInView} calcStreak={calcStreak}
            fitnessExercises={fitnessExercises} />
        </>}
        {view==='yearly' && <>
          <YearlyView date={selectedDate} selected={selectedDate} goals={displayGoals} completions={completions} today={today} onDayClick={setSelectedDate} />
          <div className="habit-selected-date-mobile">
            {DAYS[selectedDate.getDay()]}, {MONTHS[selectedDate.getMonth()]} {selectedDate.getDate()}
          </div>
          <HabitChecklist date={selectedDate} goals={goals} completions={completions}
            onToggle={toggleCompletion} onAdd={addGoal} onDelete={deleteGoal} onRename={updateGoal}
            onReorder={reorderGoals}
            onGoToMetrics={onGoToMetrics}
            getMetric={getMetric} setMetric={setMetric}
            getQty={getQty} setGoalQty={setGoalQty} getQtyItems={getQtyItems} addQtyEntry={addQtyEntry} removeQtyEntry={removeQtyEntry} updateQtyEntry={updateQtyEntry}
            getNote={getNote} setGoalNote={setGoalNote}
            countInView={countInView} calcStreak={calcStreak}
            fitnessExercises={fitnessExercises} />
        </>}
        {view==='daily' && <DailyView date={selectedDate} goals={displayGoals} completions={completions}
          onToggle={(gid)=>toggleCompletion(gid,fmt(selectedDate))} />}
      </div>

      {/* Mobile FAB + sheet for countdowns */}
      <div className={`mobile-sheet-overlay ${sheetOpen?'open':''}`} onClick={()=>setSheetOpen(false)} />

    </div>
  );

// ── QtySection — reusable qty entry UI (single or multi-entry) ──
function QtySection({ goal, items, getQty, setGoalQty, addQtyEntry, removeQtyEntry, updateQtyEntry }) {
  const [showItems, setShowItems] = useState(false);
  const [addAmount, setAddAmount] = useState('');
  const [addNote, setAddNote] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editAmount, setEditAmount] = useState('');
  const [editNote, setEditNote] = useState('');
  const isDollar = (goal.qtyMode || 'qty') === '$';
  const prefix = isDollar ? '$' : '';
  const totalVal = qtyTotal(items);
  const displayTotal = totalVal === 0 ? '' : (isDollar
    ? '$' + (Number.isInteger(totalVal) ? totalVal.toLocaleString() : totalVal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}))
    : String(parseFloat(totalVal.toFixed(4))));

  function commitAdd() {
    const n = parseFloat(addAmount);
    if (isNaN(n) || n === 0) return;
    addQtyEntry(goal.id, n, addNote.trim());
    setAddAmount(''); setAddNote('');
  }
  function startEdit(li) {
    setEditingId(li.id); setEditAmount(String(li.amount)); setEditNote(li.note||'');
  }
  function commitEdit() {
    const n = parseFloat(editAmount);
    if (!isNaN(n)) updateQtyEntry(goal.id, editingId, {amount:n, note:editNote.trim()});
    setEditingId(null);
  }

  if (!goal.multiEntry) {
    // Single-entry: plain editable field with mode indicator
    return (
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,padding:'1px 6px',borderRadius:10,border:'1px solid var(--border)',background:isDollar?'var(--gold)':'var(--cream)',color:isDollar?'white':'var(--ink-light)',flexShrink:0,lineHeight:1.6}}>
          {isDollar ? '$' : 'Qty'}
        </span>
        <input type="number" min="0" step="any" inputMode="decimal"
          className="habit-qty-input"
          placeholder="—"
          value={getQty(goal.id)}
          onChange={e=>setGoalQty(goal.id, e.target.value)}
          onClick={e=>e.stopPropagation()}
          style={{width:70}}
        />
      </div>
    );
  }

  // Multi-entry mode
  return (
    <div style={{display:'flex',flexDirection:'column',gap:4}} onClick={e=>e.stopPropagation()}>
      {/* Header row: mode toggle, total, expand toggle */}
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <button
          onClick={e=>{e.stopPropagation();}}
          style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:700,padding:'1px 6px',borderRadius:10,border:'1px solid var(--border)',background:isDollar?'var(--gold)':'var(--cream)',color:isDollar?'white':'var(--ink-light)',cursor:'default',flexShrink:0,lineHeight:1.6}}
          title="Mode indicator">
          {isDollar ? '$' : 'Qty'}
        </button>
        <span style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:700,color:'var(--ink)',minWidth:40}}>
          {displayTotal || '—'}
        </span>
        {items.length > 0 && (
          <button onClick={e=>{e.stopPropagation();setShowItems(s=>!s);}}
            style={{fontSize:14,color:'var(--ink-faint)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px',lineHeight:1}}>
            {showItems ? '▲' : `▾ ${items.length} item${items.length>1?'s':''}`}
          </button>
        )}
      </div>
      {/* Line items list */}
      {showItems && items.length > 0 && (
        <div style={{display:'flex',flexDirection:'column',gap:4,paddingLeft:4,borderLeft:'2px solid var(--border)'}}>
          {items.map(li => (
            <div key={li.id} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
              {editingId===li.id ? (
                <>
                  <input type="number" min="0" step="any" inputMode="decimal" value={editAmount}
                    onChange={e=>setEditAmount(e.target.value)}
                    style={{width:60,fontSize:13,fontFamily:"'DM Mono',monospace",border:'1px solid var(--border)',borderRadius:3,padding:'2px 5px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}
                    autoFocus />
                  <input type="text" value={editNote} onChange={e=>setEditNote(e.target.value)}
                    placeholder="note…"
                    style={{flex:1,fontSize:13,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:3,padding:'2px 5px',background:'var(--surface)',color:'var(--ink)',outline:'none',minWidth:0}}
                    onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditingId(null);}} />
                  <button onClick={commitEdit} style={{fontSize:14,background:'var(--accent)',color:'white',border:'none',borderRadius:4,padding:'3px 8px',cursor:'pointer',fontFamily:"'DM Mono',monospace",flexShrink:0}}>✓</button>
                </>
              ) : (
                <>
                  <span style={{fontFamily:"'DM Mono',monospace",fontWeight:700,color:'var(--ink)',flexShrink:0}}>{prefix}{li.amount}</span>
                  {li.note && <span style={{fontFamily:"'DM Sans',sans-serif",color:'var(--ink-light)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{li.note}</span>}
                  {!li.note && <span style={{flex:1}}/>}
                  <button onClick={()=>startEdit(li)} style={{fontSize:16,background:'none',border:'none',cursor:'pointer',color:'var(--ink-faint)',padding:'2px 4px',flexShrink:0,lineHeight:1}} title="Edit">✎</button>
                  <button onClick={()=>removeQtyEntry(goal.id,li.id)} style={{fontSize:16,background:'none',border:'none',cursor:'pointer',color:'var(--ink-faint)',padding:'2px 4px',flexShrink:0,lineHeight:1}} title="Remove">✕</button>
                </>
              )}
            </div>
          ))}
        </div>
      )}
      {/* Add new entry row */}
      <div style={{display:'flex',alignItems:'center',gap:4}}>
        <input type="number" min="0" step="any" inputMode="decimal"
          value={addAmount}
          onChange={e=>setAddAmount(e.target.value)}
          placeholder={prefix+'0'}
          onKeyDown={e=>{if(e.key==='Enter')commitAdd();}}
          style={{width:60,fontSize:11,fontFamily:"'DM Mono',monospace",border:'1px solid var(--border)',borderRadius:3,padding:'2px 4px',background:'var(--surface)',color:'var(--ink)',outline:'none'}}
        />
        <input type="text" value={addNote} onChange={e=>setAddNote(e.target.value)}
          placeholder="note (optional)"
          onKeyDown={e=>{if(e.key==='Enter')commitAdd();}}
          style={{flex:1,fontSize:11,fontFamily:"'DM Sans',sans-serif",border:'1px solid var(--border)',borderRadius:3,padding:'2px 4px',background:'var(--surface)',color:'var(--ink)',outline:'none',minWidth:0}}
        />
        <button onClick={e=>{e.stopPropagation();commitAdd();}}
          style={{fontSize:13,background:'var(--accent)',color:'white',border:'none',borderRadius:4,padding:'2px 8px',cursor:'pointer',fontWeight:700,flexShrink:0,lineHeight:1.5}}
          title="Add entry">+</button>
      </div>
    </div>
  );
}

function HabitChecklist({ date, goals, completions, onToggle, onAdd, onDelete, onRename, onReorder, onGoToMetrics, getMetric, setMetric, getQty, setGoalQty, getQtyItems, addQtyEntry, removeQtyEntry, updateQtyEntry, getNote, setGoalNote, countInView, calcStreak, fitnessExercises }) {
  const dk = fmt(date);
  const [confirmId, setConfirmId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [expandedGoals, setExpandedGoals] = useState({});
  const editRef = useRef();

  // Auto-focus when a new goal is added (it will be the last one with empty name)
  useEffect(() => {
    if (goals.length > 0) {
      const last = goals[goals.length - 1];
      if (last.name === 'New Goal') {
        setEditingId(last.id);
      }
    }
  }, [goals.length]);

  useEffect(() => {
    if (editingId && editRef.current) {
      editRef.current.focus();
      editRef.current.select();
      // Scroll the input into view after a short delay so the mobile keyboard has time
      // to appear and resize the viewport before we ask the browser to scroll.
      setTimeout(() => {
        editRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 150);
    }
  }, [editingId]);

  function handleDelete(e, id) {
    e.stopPropagation();
    if (confirmId === id) { onDelete(id); setConfirmId(null); }
    else setConfirmId(id);
  }

  // Touch drag for reordering — uses native non-passive listener so preventDefault works
  const touchDragId = useRef(null);
  const touchDragEl = useRef(null);
  const itemsContainerRef = useRef(null);

  useEffect(() => {
    const el = itemsContainerRef.current;
    if (!el) return;
    function handleTouchMove(e) {
      if (touchDragId.current) e.preventDefault();
    }
    el.addEventListener('touchmove', handleTouchMove, {passive: false});
    return () => el.removeEventListener('touchmove', handleTouchMove);
  }, []);

  function onHandleTouchStart(e, id) {
    touchDragId.current = id;
    touchDragEl.current = e.currentTarget.closest('[data-goal-id]');
    if (touchDragEl.current) touchDragEl.current.style.opacity = '0.5';
    e.stopPropagation();
  }
  function onHandleTouchEnd(e) {
    if (!touchDragId.current) return;
    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const targetRow = el?.closest('[data-goal-id]');
    const targetId = targetRow?.getAttribute('data-goal-id');
    if (targetId && targetId !== touchDragId.current && onReorder) {
      onReorder(touchDragId.current, targetId);
    }
    if (touchDragEl.current) touchDragEl.current.style.opacity = '';
    touchDragId.current = null;
    touchDragEl.current = null;
    e.stopPropagation();
  }

  return (
    <div className="monthly-habit-checklist">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div className="monthly-habit-checklist-title" style={{marginBottom:0}}>
          {DAYS[date.getDay()]}, {MONTHS[date.getMonth()].slice(0,3)} {date.getDate()}
        </div>
        <button className="add-btn" onClick={onAdd} title="Add habit">+</button>
      </div>

      {/* Weight + Cal/Pts — shown in mobile only (desktop sidebar already has these) */}
      {setMetric && (
        <div className="mhc-metrics-row" style={{alignItems:'flex-end'}}>

function HabitNavArrows({view, date, onChange}) {
  const label = view==='yearly' ? date.getFullYear().toString()
    : view==='monthly' ? `${MONTHS[date.getMonth()]} ${date.getFullYear()}`
    : view==='weekly' ? (() => {
        const ws=getWeekStart(date);
        return `${fmtDisplay(ws)} – ${fmtDisplay(addDays(ws,6))}`;
      })()
    : `${DAYS[date.getDay()].slice(0,3)}, ${MONTHS[date.getMonth()].slice(0,3)} ${date.getDate()}, ${date.getFullYear()}`;

  function prev() {
    if(view==='daily') onChange(d=>addDays(d,-1));
    else if(view==='weekly') onChange(d=>addDays(d,-7));
    else if(view==='monthly') onChange(d=>new Date(d.getFullYear(),d.getMonth()-1,1));
    else onChange(d=>new Date(d.getFullYear()-1,d.getMonth(),d.getDate()));
  }
  function next() {
    if(view==='daily') onChange(d=>addDays(d,1));
    else if(view==='weekly') onChange(d=>addDays(d,7));
    else if(view==='monthly') onChange(d=>new Date(d.getFullYear(),d.getMonth()+1,1));
    else onChange(d=>new Date(d.getFullYear()+1,d.getMonth(),d.getDate()));
  }
  return (
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <button className="nav-arrow" onClick={prev}>‹</button>
      <span style={{fontFamily:"'DM Mono',monospace",fontSize:13,color:'var(--ink-light)',minWidth:160,textAlign:'center'}}>{label}</span>
      <button className="nav-arrow" onClick={next}>›</button>
    </div>
  );
}

// Renders habit bars in a day cell (full-width solid bars)
function HabitDotsForDay({dayKey, goals, completions}) {
  if(!goals.length) return null;
  return (
    <div className="habit-dots-row">
      {goals.map(g=>{
        const done=(completions[dayKey]||[]).includes(g.id);
        return (
          <div key={g.id} className="habit-dot-wrapper" style={{width:'100%'}}>
            <div className="habit-bar" style={{
              background: done ? g.color : 'transparent',
              border: done ? 'none' : '1px solid var(--border)',
              width:'100%',
              opacity: done ? 0.85 : 0.35
            }} />
          </div>
        );
      })}
    </div>
  );
}

function MonthlyView({date, selected, goals, completions, onDayClick, today, qty, notes}) {
  const year=date.getFullYear(), month=date.getMonth();
  const firstDay=new Date(year,month,1);
  const startPad=firstDay.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  const cells = [];
  for(let i=0;i<startPad;i++) cells.push({day:null,date:addDays(firstDay,i-startPad)});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,date:new Date(year,month,d)});
  while(cells.length%7!==0) cells.push({day:null,date:null});

  return (
    <div style={{display:'flex',flexDirection:'column'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gridTemplateRows:'auto',gap:2,alignContent:'start'}}>
        {DAYS.map(d=><div key={d} className="month-day-header">{d}</div>)}
        {cells.map((c,i)=>{
          if(!c.date) return <div key={i} style={{background:'var(--cream)',borderRadius:6,minHeight:70}}/>;
          const dk=fmt(c.date);
          const isToday=isSameDay(c.date,today);
          const otherMonth=c.date.getMonth()!==month;
          return (
            <div key={i} className={`month-day-cell ${otherMonth?'other-month':''} ${isToday?'today-cell':''} ${isSameDay(c.date,selected)?'selected-day':''}`}
              onClick={()=>onDayClick(new Date(c.date))} style={{cursor:'pointer'}}>
              <div className="month-day-num">{isToday?c.date.getDate():c.date.getDate()}</div>
              <HabitDotsForDay dayKey={dk} goals={goals} completions={completions} />
              {goals.length === 1 && (() => {
                const g = goals[0];
                const done = (completions[dk]||[]).includes(g.id);
                const qtyRaw = qty ? (qty[dk]||{})[g.id] : null;
                const qtyVal = qtyRaw != null ? qtyTotal(qtyRaw) : 0;
                const liNotes = qtyRaw ? normalizeQty(qtyRaw).map(li=>li.note).filter(Boolean) : [];
                const notesVal = notes ? (notes[dk]||{})[g.id] || '' : '';
                const noteLines = notesVal.split('\n').slice(0,4).filter(l=>l.trim());
                if (!done && !qtyVal && !noteLines.length) return null;
                const qtyDisplay = qtyVal ? ((g.qtyMode||'qty')==='$' ? '$'+qtyVal : String(qtyVal)) : '';
                return (
                  <div style={{marginTop:2,padding:'1px 3px'}}>
                    {qtyDisplay && <div style={{fontSize:9,fontFamily:"'DM Mono',monospace",color:hcText(g.color),fontWeight:700,lineHeight:1.3}}>{qtyDisplay}</div>}
                    {liNotes.map((n,i)=>(
                      <div key={i} style={{fontSize:8,fontFamily:"'DM Sans',sans-serif",color:'var(--ink-light)',lineHeight:1.3,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{n}</div>
                    ))}
                    {noteLines.map((l,i)=>(
                      <div key={'n'+i} style={{fontSize:8,fontFamily:"'DM Sans',sans-serif",color:'var(--ink-light)',lineHeight:1.3,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{l}</div>
                    ))}
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const ws=getWeekStart(date);
  const days=Array.from({length:7},(_,i)=>addDays(ws,i));

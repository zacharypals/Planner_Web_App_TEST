// APP ROOT
// ─────────────────────────────────────────────
// Synced app data is created with useSynced(key, init) below; each one uploads and syncs itself.

// ─────────────────────────────────────────────
// GOALS (v4.2.0)
// goals: [{ id, title, why, color, status:'active'|'parked'|'done', startDate, targetDate,
//           notesPageId, showCountdown, retro, createdAt, completedAt,
//           milestones:[{ id, title, startDate, dueDate, done, completedAt,
//                         tasks:[{ id, title, scheduledDate, done, completedAt }] }] }]
// Goal tasks live ONLY in `goals`. The Weekly Planner shows every task whose scheduledDate falls
// in the visible week; checking it off or moving it edits this record — nothing is copied into
// weekData, so there is nothing to keep in step. Dates are local 'YYYY-MM-DD' (fmtLocal).
// Synced as one document per goal (SYNC_SPLITS.goals = 'list').
// ─────────────────────────────────────────────
const GL_COLORS = ['#8b4aac','#2e7eb8','#1a9c82','#c4960e','#dc4a3a','#2d6b4a','#7c3f6e','#b8682e'];
const GL_SOFT_LIMIT = 5;
function glId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function glToday() { return fmtLocal(new Date()); }
function glDays(a, b) { const da = parseLocal(a), db = parseLocal(b); return (da && db) ? Math.round((db - da) / 86400000) : 0; }
function glAddDays(s, n) { const d = parseLocal(s) || new Date(); d.setDate(d.getDate() + n); return fmtLocal(d); }
function glShort(s) { const d = parseLocal(s); return d ? MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() : ''; }
function glShortDay(s) { const d = parseLocal(s); return d ? DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() : ''; }
function glRgb(hex) {
  let h = (hex || '#7c3f6e').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function glTint(hex, a) { const [r, g, b] = glRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function glInk(hex) { const [r, g, b] = glRgb(hex); return `color-mix(in srgb, rgb(${r},${g},${b}) var(--gl-ink-pct), var(--gl-ink-to))`; } // darker shade for text on a tint (lighter in dark mode, v4.4.0)
// v4.4.0: text drawn in a user-picked color (habit names, chips) — lightened in dark mode so it stays readable
function hcText(c) { return c ? `color-mix(in srgb, ${c} var(--hc-pct), #fff)` : c; }
function glMsProgress(m) { if (m.done) return 1; const t = m.tasks || []; return t.length ? t.filter(x => x.done).length / t.length : 0; }
function glProgress(g) {
  if (g.status === 'done') return 1;
  const ms = g.milestones || [];
  return ms.length ? ms.reduce((s, m) => s + glMsProgress(m), 0) / ms.length : 0;
}
function glTaskCounts(g) {
  let total = 0, done = 0;
  (g.milestones || []).forEach(m => (m.tasks || []).forEach(t => { total++; if (t.done) done++; }));
  return { total, done };
}
function glMsOverdue(m, today) { return !m.done && !!m.dueDate && m.dueDate < today; }
function glNextMilestone(g) {
  const open = (g.milestones || []).filter(m => !m.done);
  open.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
  return open[0] || null;
}
// Health = work done vs. time used. An overdue milestone caps a goal at "At risk";
// a passed target date with work left is "Behind".
function glHealth(g, today) {
  today = today || glToday();
  const p = glProgress(g);
  const span = glDays(g.startDate, g.targetDate);
  const used = span > 0 ? Math.min(1, Math.max(0, glDays(g.startDate, today) / span)) : 0;
  const base = { p, used, daysLeft: g.targetDate ? glDays(today, g.targetDate) : null };
  if (g.status === 'done') return { ...base, key: 'done', label: 'Done' };
  if (g.status === 'parked') return { ...base, key: 'parked', label: 'Parked' };
  if (g.startDate && today < g.startDate) return { ...base, key: 'upcoming', label: 'Upcoming' };
  if (g.targetDate && today > g.targetDate) return { ...base, key: 'behind', label: 'Behind' };
  const late = (g.milestones || []).some(m => glMsOverdue(m, today));
  if (p >= used - 0.10 && !late) return { ...base, key: 'ontrack', label: 'On track' };
  if (p >= used - 0.25) return { ...base, key: 'atrisk', label: 'At risk' };
  return { ...base, key: 'behind', label: 'Behind' };
}
function glPatchGoal(gs, gid, fn) { return gs.map(g => g.id === gid ? fn(g) : g); }
function glPatchMs(g, mid, fn) { return { ...g, milestones: (g.milestones || []).map(m => m.id === mid ? fn(m) : m) }; }
// v5.11.0: the stamp for checking or unchecking a task by hand. Unchecking something the log checked for you
// pauses its rule (ruleHold) so the rule can't simply re-check it; editing the rule clears the pause.
function glDoneExtra(item, done) {
  const e = { completedAt: done ? Date.now() : null, autoDone: false };
  if (!done && item && item.rule && item.autoDone) e.ruleHold = true;
  return e;
}
function glPatchTask(gs, gid, mid, tid, patch) {
  return glPatchGoal(gs, gid, g => glPatchMs(g, mid, m => ({
    ...m, tasks: (m.tasks || []).map(t => t.id === tid ? { ...t, ...patch, ...(('done' in patch) ? glDoneExtra(t, patch.done) : {}) } : t),
  })));
}
function glTasksByDay(goals) {   // 'YYYY-MM-DD' → [{ goal, ms, task }]
  const out = {};
  (goals || []).forEach(g => (g.milestones || []).forEach(m => (m.tasks || []).forEach(t => {
    if (t.scheduledDate) (out[t.scheduledDate] || (out[t.scheduledDate] = [])).push({ goal: g, ms: m, task: t });
  })));
  return out;
}
function glNewGoal(goals) {
  const used = new Set((goals || []).map(g => g.color));
  const color = GL_COLORS.find(c => !used.has(c)) || GL_COLORS[(goals || []).length % GL_COLORS.length];
  const t = glToday();
  return { id: glId('gl'), title: '', why: '', color, status: 'active', startDate: t, targetDate: glAddDays(t, 90),
    notesPageId: null, showCountdown: false, retro: '', createdAt: Date.now(), completedAt: null, milestones: [] };
}
function glNewMilestone(g) {
  const ms = g.milestones || [];
  const last = ms[ms.length - 1];
  const start = last && last.dueDate ? glAddDays(last.dueDate, 1) : (g.startDate || glToday());
  let due = glAddDays(start, 13);
  if (g.targetDate && due > g.targetDate) due = g.targetDate < start ? start : g.targetDate;
  return { id: glId('ms'), title: '', startDate: start, dueDate: due, done: false, completedAt: null, tasks: [] };
}

function GlHealthPill({ h }) { return <span className={`gl-health ${h.key}`}>{h.label}</span>; }

// ── Linked habits & training (v4.7.0) ──
// Read-only roll-up of the habits and exercises a goal is built on. Shown in the goal detail,
// on the goal card and in the Weekly Review. Does not feed glProgress — milestones still do that.
// Tiny trend line for a measurement (v4.8.0)
function GlSpark({ vals, color }) {
  if (!vals || vals.length < 3) return null;
  const w = 64, h = 18, lo = Math.min(...vals), hi = Math.max(...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 2 - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - 4)).toFixed(1)}`).join(' ');
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true" style={{ flexShrink: 0 }}>
    <polyline fill="none" stroke={color || 'currentColor'} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" points={pts} /></svg>;
}
function GlLinksRow({ goal, habitGoals, fitnessExercises, habitCompletions, fitnessLog, weekStart, compact, mctx }) {
  const links = glLinks(goal, habitGoals, fitnessExercises, habitCompletions, fitnessLog, weekStart, mctx);
  if (!links.length) return null;
  const c = goal.color || '#7c3f6e';
  if (compact) {
    return (
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 6 }}>
        {links.map(l => (
          <span key={l.kind + l.id} className="gl-chip" style={{ cursor: 'default', fontSize: 11, padding: '3px 8px' }}>
            {l.kind === 'metric' ? l.icon : l.kind === 'habit' ? '◷' : '◆'} {l.name} · {l.detail}
          </span>
        ))}
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {links.map(l => l.kind === 'metric' ? (
        // Measurements get two lines: name + value, then progress bar + trend
        <div key={l.kind + l.id} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span aria-hidden="true" style={{ fontSize: 12, color: 'var(--ink-faint)', width: 12, flexShrink: 0 }}>{l.icon}</span>
            <span style={{ flex: 1, minWidth: 0, fontSize: 13, color: 'var(--ink)' }}>{l.name}</span>
            <span className="gl-mono" style={{ fontSize: 11, color: 'var(--ink-light)', textAlign: 'right' }}>{l.detail}</span>
          </div>
          {(l.pct != null || l.spark.length > 2) && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingLeft: 22 }}>
              {l.pct != null
                ? <div className="gl-bar" style={{ flex: 1, height: 6, background: glTint(c, 0.15) }}><div style={{ width: Math.round(l.pct * 100) + '%', background: c }} /></div>
                : <div style={{ flex: 1 }} />}
              <GlSpark vals={l.spark} color={c} />
            </div>
          )}
        </div>
      ) : (
        <div key={l.kind + l.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span aria-hidden="true" style={{ fontSize: 11, color: 'var(--ink-faint)', width: 12, flexShrink: 0 }}>{l.kind === 'habit' ? '◷' : '◆'}</span>
          <span style={{ flex: 1, minWidth: 0, fontSize: 13, color: 'var(--ink)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.name}</span>
          <div className="gl-bar" style={{ width: 70, height: 6, flexShrink: 0, background: glTint(c, 0.15) }}>
            <div style={{ width: Math.round(l.pct * 100) + '%', background: c }} />
          </div>
          <span className="gl-mono" style={{ fontSize: 11, color: 'var(--ink-light)', flexShrink: 0, minWidth: 96, textAlign: 'right' }}>{l.detail}</span>
          {l.kind === 'habit' && l.streak > 0 && (
            <span className="gl-mono" title={l.perWeek ? 'Current streak (weeks)' : 'Current streak'}
              style={{ fontSize: 11, color: 'var(--gold)', flexShrink: 0 }}>🔥{l.streak}{l.perWeek ? 'w' : ''}</span>
          )}
        </div>
      ))}
    </div>
  );
}

  const habitIds = goal.linkedHabitIds || [];
  const exIds = goal.linkedExerciseIds || [];
  const metricIds = goal.linkedMetrics || [];
  const toggle = (key, id) => onChange(g => {
    const cur = g[key] || [];
    return { ...g, [key]: cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id] };
  });
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        <span style={{ fontSize: 11, color: 'var(--ink-faint)', fontFamily: "'DM Mono',monospace" }}>Measurements</span>
        {!metricIds.includes('weight') && <span style={{ fontSize: 11, color: 'var(--ink-light)' }}>Link Weight to also let a milestone complete itself from your weight.</span>}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
          {Object.entries(GL_METRICS).map(([id, mm]) => (
            <button key={id} className={`gl-chip ${metricIds.includes(id) ? 'on' : ''}`}

          ))}
        </div>
      </div>
      {(habitGoals || []).length > 0 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
          <span style={{ fontSize: 11, color: 'var(--ink-faint)', fontFamily: "'DM Mono',monospace" }}>Habits</span>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {habitGoals.map(h => (
              <button key={h.id} className={`gl-chip ${habitIds.includes(h.id) ? 'on' : ''}`}
                aria-pressed={habitIds.includes(h.id)} onClick={() => toggle('linkedHabitIds', h.id)}>{h.name || 'Habit'}</button>

        </div>
      )}
      {(fitnessExercises || []).length > 0 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
          <span style={{ fontSize: 11, color: 'var(--ink-faint)', fontFamily: "'DM Mono',monospace" }}>Exercises</span>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, maxHeight: 132, overflowY: 'auto' }}>
            {fitnessExercises.map(ex => (
              <button key={ex.id} className={`gl-chip ${exIds.includes(ex.id) ? 'on' : ''}`}

            ))}

}

// Day picker used to schedule a goal task onto a day (Goals tab and Weekly Planner menu).
function GlSchedulePicker({ value, onPick, onClose, extra, anchor }) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const [weekStart, setWeekStart] = useState(() => getWeekStart(parseLocal(value) || today));
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const end = days[6];
  // v5.7.1: when opened from a task row (no anchor given) float the picker at fixed coordinates so the milestone card's
  // overflow can't clip it; it opens below the row, or above it when there isn't room, and follows scrolling.
  const popRef = useRef(null);
  const [pos, setPos] = useState(null);
  React.useLayoutEffect(() => {
    if (anchor) return;
    const place = () => {
      const el = popRef.current; const row = el && el.parentElement; if (!el || !row) return;
      if (window.innerWidth <= 767) { setPos(null); return; }           // phones use the bottom-sheet style
      const r = row.getBoundingClientRect(), h = el.offsetHeight, w = el.offsetWidth || 290;
      const vw = window.innerWidth, vh = window.innerHeight;
      let top = r.bottom - 2;
      if (top + h > vh - 8) top = r.top - h + 2;
      top = Math.max(8, Math.min(top, vh - h - 8));
      const left = Math.max(8, Math.min(r.right - 8 - w, vw - w - 8));
      setPos(p => (p && p.top === top && p.left === left) ? p : { top, left });
    };
    place();
    window.addEventListener('scroll', place, true); window.addEventListener('resize', place);
    return () => { window.removeEventListener('scroll', place, true); window.removeEventListener('resize', place); };
  }, [anchor, weekStart]);
  const label = `${MONTHS[weekStart.getMonth()].slice(0, 3)} ${weekStart.getDate()} – ${weekStart.getMonth() === end.getMonth() ? '' : MONTHS[end.getMonth()].slice(0, 3) + ' '}${end.getDate()}`;
  return (
    <>
      <div style={{ position: 'fixed', inset: 0, zIndex: 299 }} onClick={e => { e.stopPropagation(); onClose(); }} />
      <div className="gl-pop" ref={popRef} style={anchor ? { position: 'fixed', top: anchor.top, left: anchor.left, right: 'auto' }
        : pos ? { position: 'fixed', top: pos.top, left: pos.left, right: 'auto' } : undefined} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <button className="gl-btn ghost" aria-label="Previous week" onClick={() => setWeekStart(w => addDays(w, -7))}>‹</button>
          <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-light)' }}>Week of {label}</span>
          <button className="gl-btn ghost" aria-label="Next week" onClick={() => setWeekStart(w => addDays(w, 7))}>›</button>
        </div>
        <div className="gl-daygrid">
          {days.map(d => {
            const k = fmtLocal(d);
            return (
              <button key={k} className={`gl-daybtn ${k === value ? 'on' : ''} ${isSameDay(d, today) ? 'today' : ''}`}
                onClick={() => { onPick(k); onClose(); }}>
                {DAYS[d.getDay()]}<br />{d.getDate()}
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
          <input type="date" className="gl-input" style={{ flex: 1, padding: '5px 8px', fontSize: 12 }} aria-label="Pick a date"
            value={value || ''} onChange={e => { if (e.target.value) { onPick(e.target.value); onClose(); } }} />
          {value && <button className="gl-btn ghost" style={{ fontSize: 12 }} onClick={() => { onPick(null); onClose(); }}>Unschedule</button>}
        </div>
        {extra}
      </div>
    </>
  );
}

// ── Goal task as it appears inside the Weekly Planner (desktop column + mobile day view) ──
// v4.5.0: collapsible "Goals" section under Habits in the week grid / mobile day view (collapsed by default, like Habits)
function GlDaySection({ dayKey, done, total, children }) {
  const [goalsOpen, toggleGoalsOpen] = useDayOpen('goals', dayKey);
  const collapsed = !goalsOpen;
  return (
    <div className="habit-task-section gl-day-section">
      <div className="habit-task-label" onClick={toggleGoalsOpen}>
        <span style={{fontSize:8}}>{collapsed ? '▸' : '▾'}</span>
        <span>Goals</span>
        <span style={{marginLeft:'auto', fontSize:9, fontWeight:700, opacity:0.8}}>{done}/{total}</span>
      </div>
      {!collapsed && <div className="gl-day-section-body">{children}</div>}
    </div>
  );
}

function GlWeekTask({ item, rule, onToggle, onMove, onOpen, onDragStart, onDragEnd }) {
  const { goal, ms, task } = item;
  const [menu, setMenu] = useState(false);   // false | { anchor }
  function openMenu(e) {
    e.stopPropagation();
    if (window.matchMedia('(max-width: 767px)').matches) { setMenu({ anchor: null }); return; }
    const r = e.currentTarget.getBoundingClientRect();
    const left = Math.max(8, Math.min(r.right - 290, window.innerWidth - 300));
    const top = r.bottom + 330 > window.innerHeight ? Math.max(8, r.top - 330) : r.bottom + 4;
    setMenu({ anchor: { top, left } });
  }
  const c = goal.color || '#7c3f6e';
  return (
    <div className={`gl-wtask ${task.done ? 'done' : ''}`}
      style={{ background: glTint(c, 0.12), borderColor: glTint(c, 0.3) }}
      draggable={!!onDragStart}
      onDragStart={onDragStart ? e => { e.stopPropagation(); try { e.dataTransfer.setData('text/plain', 'goal-task'); e.dataTransfer.effectAllowed = 'move'; } catch {} onDragStart(); } : undefined}
      onDragEnd={onDragEnd}
      title={`${goal.title || 'Goal'} › ${ms.title || 'Milestone'}`}>
      <div className="gl-wtask-row">
        <div className={`task-check ${task.done ? 'done' : ''}`} role="checkbox" aria-checked={!!task.done}
          style={{ color: c, borderColor: c, background: task.done ? glTint(c, 0.18) : undefined }}
          onClick={e => { e.stopPropagation(); onToggle(); }} />
        <div className="gl-wtask-title">{task.title || 'Untitled task'}</div>
        <button className="gl-wtask-more" aria-label="Goal task options" onClick={openMenu}>⋯</button>
      </div>
      <span className="gl-wtask-pill" style={{ color: glInk(c), background: glTint(c, 0.18) }}>◆ {goal.title || 'Goal'}</span>
      {rule && (
        <span className="gl-wtask-rule" style={{ color: rule.ready ? glInk(c) : 'var(--ink-light)' }}
          title={task.ruleHold ? 'Auto-check is paused because you unchecked this' : 'Checks itself off from your Fitness log'}>
          {rule.ready
            ? <>↻ {mRound(rule.value)} / {mRound(rule.target)} {rule.unit}{task.done && task.autoDone ? ' · auto' : ''}{task.ruleHold ? ' · paused' : ''}</>
            : <>↻ {rule.why}</>}
          {rule.ready && !task.done && rule.value > 0 && (
            <div className="gl-bar" style={{ background: glTint(c, 0.15) }}><div style={{ width: Math.round(rule.pct * 100) + '%', background: c }} /></div>
          )}
        </span>
      )}
      {menu && (
        <GlSchedulePicker value={task.scheduledDate} onPick={onMove} onClose={() => setMenu(false)} anchor={menu.anchor}
          extra={<button className="gl-btn" style={{ fontSize: 12 }} onClick={() => { setMenu(false); onOpen(); }}>Open goal ›</button>} />
      )}
    </div>
  );
}

// ── "Goals · next up" block for the Weekly Planner sidebar ──
function GlNextUp({ goals, weekKeys, onOpenGoal }) {
  const today = glToday();
  const active = (goals || []).filter(g => g.status === 'active');
  if (!active.length) return null;
  const inWeek = new Set(weekKeys);
  return (
    <div className="sidebar-section">
      <div className="checklist-header">
        <div className="sidebar-section-title">Goals · next up</div>
        <button className="add-btn" title="Open Goals" onClick={() => onOpenGoal(null)}>›</button>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {active.map(g => {
          const m = glNextMilestone(g);
          const late = m && glMsOverdue(m, today);
          const thisWeek = (g.milestones || []).reduce((n, mm) => n + (mm.tasks || []).filter(t => !t.done && inWeek.has(t.scheduledDate)).length, 0);
          return (
            <button key={g.id} className={`gl-next ${late ? 'late' : ''}`} onClick={() => onOpenGoal(g.id)}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 12, fontWeight: 600 }}>
                <span className="gl-dot" style={{ background: g.color, width: 8, height: 8 }} />
                <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m ? (m.title || 'Untitled milestone') : (g.title || 'Untitled goal')}</span>
              </div>
              <div style={{ fontSize: 11, marginTop: 2, paddingLeft: 15, color: late ? '#b03a2e' : 'var(--ink-light)', fontWeight: late ? 600 : 400 }}>
                {g.title || 'Goal'}
                {m ? (late ? ` · ${glDays(m.dueDate, today)}d overdue` : m.dueDate ? ` · due ${glShort(m.dueDate)}` : '') : ' · no open milestones'}
                {thisWeek ? ` · ${thisWeek} this week` : ''}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Timeline range per zoom level ──
function glRange(zoom, offset) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  if (zoom === 'day') {                                      // v5.8.0: 10 days, starting 2 days before today; ‹ › move a week
    const start = addDays(now, -2 + offset * 7);
    const cols = Array.from({ length: 10 }, (_, i) => { const d = addDays(start, i); return { start: d, label: DAYS[d.getDay()].slice(0, 3) + '\n' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() }; });
    return { start, end: addDays(start, 10), cols, day: true };
  }
  if (zoom === 'week') {
    const start = addDays(getWeekStart(now), -7 + offset * 28);
    const cols = Array.from({ length: 10 }, (_, i) => { const d = addDays(start, i * 7); return { start: d, label: MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() }; });
    return { start, end: addDays(start, 70), cols };
  }
  const per = zoom === 'year' ? 3 : 1;
  const count = { month: 6, quarter: 12, year: 8 }[zoom] || 6;
  const shift = ({ month: 3, quarter: 6, year: 12 }[zoom] || 3) * offset;
  let s = zoom === 'year' ? new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1) : new Date(now.getFullYear(), now.getMonth(), 1);
  s = new Date(s.getFullYear(), s.getMonth() + shift, 1);
  const cols = Array.from({ length: count }, (_, i) => {
    const d = new Date(s.getFullYear(), s.getMonth() + i * per, 1);
    const label = zoom === 'year'
      ? `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}`
      : MONTHS[d.getMonth()].slice(0, 3).toUpperCase() + ((i === 0 || d.getMonth() === 0) ? ' ' + d.getFullYear() : '');
    return { start: d, label };
  });
  return { start: s, end: new Date(s.getFullYear(), s.getMonth() + count * per, 1), cols };
}

function GlTimeline({ goals, onOpenGoal, onChangeGoal }) {
  const today = glToday();
  const [zoom, setZoom] = useState(() => sessionStorage.getItem('lp_glZoom') || 'month');
  const [offset, setOffset] = useState(0);
  const [show, setShow] = useState('active');   // 'active' | 'all' | <goalId>
  const [collapsed, setCollapsed] = useState({});
  const [msOpen, setMsOpen] = useState({});   // v5.15.0 — milestone ids whose tasks are showing (collapsed by default)
  const range = glRange(zoom, offset);
  const total = range.end - range.start;

  // ── Drag to reschedule (v4.7.0) ──
  // Bars move whole; their left/right edges resize one end. Snaps to whole days. Live values are
  // kept in a ref so the window listeners never close over stale state; `drag` only mirrors it
  // for rendering the preview. Committing pushes an Undo entry.
  const areaRef = useRef(null);
  const dragRef = useRef(null);
  const suppressClick = useRef(false);
  const [drag, setDrag] = useState(null);
  const canDrag = !!onChangeGoal;
  function glShift(s, e, d) {
    if (!d || !d.days) return [s, e];
    if (d.kind === 'move') return [glAddDays(s, d.days), glAddDays(e, d.days)];
    if (d.kind === 'start') { const ns = glAddDays(s, d.days); return [ns > e ? e : ns, e]; }
    const ne = glAddDays(e, d.days); return [s, ne < s ? s : ne];
  }
  // The live drag for this bar, or null
  function dragOn(gid, mid) {
    const d = drag;
    return (d && d.moved && d.gid === gid && d.mid === mid) ? d : null;
  }
  function beginDrag(e, kind, gid, mid, s0, e0) {
    if (!canDrag || !s0 || !e0 || (e.button != null && e.button !== 0)) return;
    const el = areaRef.current;
    if (!el) return;
    e.preventDefault(); e.stopPropagation();
    const w = el.getBoundingClientRect().width;
    const totalDays = total / 86400000;
    dragRef.current = { kind, gid, mid, s0, e0, x0: e.clientX, days: 0, moved: false,
      pxPerDay: (w && totalDays) ? w / totalDays : 0 };
    setDrag({ ...dragRef.current });
  }
  useEffect(() => {
    if (!drag) return;
    const onMove = ev => {
      const d = dragRef.current;
      if (!d || !d.pxPerDay) return;
      const dx = ev.clientX - d.x0;
      const days = Math.round(dx / d.pxPerDay);
      const moved = d.moved || Math.abs(dx) > 3;
      if (days === d.days && moved === d.moved) return;
      d.days = days; d.moved = moved;
      setDrag({ ...d });
    };
    const onUp = () => {
      const d = dragRef.current;
      dragRef.current = null;
      setDrag(null);
      if (!d || !d.moved) return;
      suppressClick.current = true;
      setTimeout(() => { suppressClick.current = false; }, 0);
      const [ns, ne] = glShift(d.s0, d.e0, d);
      if (ns === d.s0 && ne === d.e0) return;
      const { gid, mid, s0, e0 } = d;
      const put = (a, b) => onChangeGoal(gid, g => mid
        ? glPatchMs(g, mid, m => ({ ...m, startDate: a, dueDate: b }))
        : { ...g, startDate: a, targetDate: b });
      put(ns, ne);
      Undo.push(mid ? 'Moved milestone dates' : 'Moved goal dates', () => put(s0, e0));
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, [!!drag]);
  const openGoal = gid => { if (!suppressClick.current) onOpenGoal(gid); };
  // Grab handles drawn inside a bar, for resizing one end
  function dragHandles(gid, mid, s0, e0) {
    if (!canDrag || !s0 || !e0) return null;
    return (
      <>
        <div className="gl-tl-grip l" onPointerDown={e => beginDrag(e, 'start', gid, mid, s0, e0)} />
        <div className="gl-tl-grip r" onPointerDown={e => beginDrag(e, 'end', gid, mid, s0, e0)} />
      </>
    );
  }
  const pct = (s, endOfDay) => { const d = parseLocal(s); if (!d) return null; if (endOfDay) d.setDate(d.getDate() + 1); return (d - range.start) / total * 100; };
  const clip = (a, b) => { if (a == null || b == null) return null; const l = Math.max(0, a), r = Math.min(100, b); return r > l ? { left: l, width: r - l } : null; };

  const shown = goals.filter(g => show === 'active' ? g.status === 'active' : show === 'all' ? g.status !== 'done' : g.id === show);
  const rows = [];
  shown.forEach(g => {
    rows.push({ type: 'goal', g });
    if (!collapsed[g.id]) (g.milestones || []).forEach(m => {
      rows.push({ type: 'ms', g, m });
      if (msOpen[m.id]) (m.tasks || []).forEach(t => rows.push({ type: 'task', g, m, t }));
    });
  });
  const todayPct = pct(today);
  const endCol = range.cols[range.cols.length - 1];
  const rangeLabel = range.day
    ? `${MONTHS[range.start.getMonth()].slice(0, 3)} ${range.start.getDate()} – ${MONTHS[endCol.start.getMonth()].slice(0, 3)} ${endCol.start.getDate()}, ${endCol.start.getFullYear()}`
    : `${MONTHS[range.start.getMonth()].slice(0, 3)} ${range.start.getFullYear()} – ${MONTHS[endCol.start.getMonth()].slice(0, 3)} ${endCol.start.getFullYear()}`;
  function setZ(z) { sessionStorage.setItem('lp_glZoom', z); setZoom(z); setOffset(0); }

  return (
    <section className="gl-card gl-desktop-only" style={{ overflow: 'hidden', flexShrink: 0 }}>
      <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: 10, padding: '12px 16px', borderBottom: '1px solid var(--border)' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
          <span className="gl-h2">Timeline</span>
          <span className="gl-mono" style={{ fontSize: 12, color: 'var(--ink-light)' }}>{rangeLabel}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: 'var(--ink-light)' }}>Show
            <select className="gl-input" style={{ padding: '5px 8px' }} value={show} onChange={e => setShow(e.target.value)}>
              <option value="active">All active goals</option>
              <option value="all">Active + parked</option>
              {goals.map(g => <option key={g.id} value={g.id}>{g.title || 'Untitled goal'}</option>)}
            </select>
          </label>
          <button className="gl-btn" aria-label="Earlier" onClick={() => setOffset(o => o - 1)}>‹</button>
          <button className="gl-btn" onClick={() => setOffset(0)}>Today</button>
          <button className="gl-btn" aria-label="Later" onClick={() => setOffset(o => o + 1)}>›</button>
          <div className="gl-seg" role="group" aria-label="Zoom">
            {['day', 'week', 'month', 'quarter', 'year'].map(z => (
              <button key={z} className={zoom === z ? 'on' : ''} aria-pressed={zoom === z} onClick={() => setZ(z)}>{z[0].toUpperCase() + z.slice(1)}</button>
            ))}
          </div>
        </div>
      </div>
      {!rows.length ? (
        <div style={{ padding: '28px 16px', fontSize: 13, color: 'var(--ink-light)', textAlign: 'center' }}>
          {goals.length ? 'No goals match this filter.' : 'Create a goal to see it on the timeline.'}
        </div>
      ) : (
      <div className="gl-tl-scroll">
        <div className="gl-tl">
          <div className="gl-tl-labels">
            <div className="gl-tl-head gl-label" style={{ padding: '0 14px' }}>Goal / milestone / task</div>
            {rows.map(r => r.type === 'task' ? (
              <div key={r.t.id} className="gl-tl-row task gl-tl-lab" style={{ paddingLeft: 60 }}>
                <span aria-hidden="true" style={{ color: r.t.done ? 'var(--accent)' : 'var(--ink-faint)', width: 12 }}>{r.t.done ? '✓' : '○'}</span>
                <span className="t" style={{ fontSize: 12.5, color: r.t.done ? 'var(--ink-light)' : 'var(--ink)', textDecoration: r.t.done ? 'line-through' : 'none', cursor: 'pointer' }}
                  onClick={() => onOpenGoal(r.g.id)}>{r.t.title || 'Untitled task'}</span>
                {!r.t.scheduledDate && !r.t.done && <span style={{ fontSize: 11, color: 'var(--ink-faint)', whiteSpace: 'nowrap' }}>not scheduled</span>}
              </div>
            ) : r.type === 'goal' ? (
              <div key={r.g.id} className="gl-tl-row goal gl-tl-lab" style={{ background: glTint(r.g.color, 0.05) }}>
                <button className="gl-caret" aria-label={collapsed[r.g.id] ? 'Expand' : 'Collapse'}
                  onClick={() => setCollapsed(c => ({ ...c, [r.g.id]: !c[r.g.id] }))}>{collapsed[r.g.id] ? '▸' : '▾'}</button>
                <span className="gl-dot" style={{ background: r.g.color }} />
                <span className="t" style={{ fontWeight: 600, cursor: 'pointer', fontSize: 14 }} onClick={() => onOpenGoal(r.g.id)}>{r.g.title || 'Untitled goal'}</span>
                <span className="gl-mono" style={{ fontSize: 11, color: 'var(--ink-light)' }}>{Math.round(glProgress(r.g) * 100)}%</span>
              </div>
            ) : (
              <div key={r.m.id} className="gl-tl-row ms gl-tl-lab" style={{ paddingLeft: 10 }}>
                {(r.m.tasks || []).length > 0
                  ? <button className="gl-caret" aria-expanded={!!msOpen[r.m.id]} aria-label={msOpen[r.m.id] ? 'Hide tasks' : 'Show tasks'} style={{ flexShrink: 0 }}
                      onClick={() => setMsOpen(o => ({ ...o, [r.m.id]: !o[r.m.id] }))}>{msOpen[r.m.id] ? '▾' : '▸'}</button>
                  : <span aria-hidden="true" style={{ width: 22, flexShrink: 0 }} />}
                <span aria-hidden="true" style={{ color: r.m.done ? 'var(--accent)' : glMsOverdue(r.m, today) ? 'var(--red)' : r.g.color, width: 12 }}>{r.m.done ? '✓' : '◆'}</span>
                <span className="t" style={{ color: r.m.done ? 'var(--ink-light)' : glMsOverdue(r.m, today) ? '#b03a2e' : 'var(--ink)', textDecoration: r.m.done ? 'line-through' : 'none', cursor: 'pointer' }}
                  onClick={() => onOpenGoal(r.g.id)}>{r.m.title || 'Untitled milestone'}</span>
                {glMsOverdue(r.m, today)
                  ? <span style={{ fontSize: 11, fontWeight: 600, color: '#b03a2e' }}>Overdue</span>
                  : (r.m.tasks || []).length > 0 && <span className="gl-mono" style={{ fontSize: 11, color: 'var(--ink-light)' }}>{(r.m.tasks || []).filter(t => t.done).length}/{r.m.tasks.length}</span>}
              </div>
            ))}
          </div>
          <div className="gl-tl-area" ref={areaRef}>
            {range.day && range.cols.filter(c => c.start.getDay() === 0 || c.start.getDay() === 6).map((c, i) => (
              <div key={'we' + i} aria-hidden="true" data-testid="tl-weekend" style={{ position: 'absolute', top: 0, bottom: 0, left: ((c.start - range.start) / total * 100) + '%', width: (86400000 / total * 100) + '%', background: 'rgba(0,0,0,0.035)' }} />
            ))}
            {range.cols.slice(1).map((c, i) => (
              <div key={i} aria-hidden="true" style={{ position: 'absolute', top: 0, bottom: 0, left: ((c.start - range.start) / total * 100) + '%', width: 1, background: 'var(--grid-line)' }} />
            ))}
            <div className="gl-tl-head" style={{ position: 'relative' }}>
              {range.cols.map((c, i) => (
                <span key={i} className="gl-mono" style={{ position: 'absolute', bottom: 6, left: `calc(${(c.start - range.start) / total * 100}% + 8px)`, fontSize: 11, color: 'var(--ink-light)', whiteSpace: range.day ? 'pre' : 'nowrap', lineHeight: range.day ? 1.2 : undefined }}>{range.day && fmtLocal(c.start) === today ? c.label.split('\n')[1] : c.label}</span>
              ))}
            </div>
            {rows.map(r => {
              if (r.type === 'task') {
                const { g, t } = r;
                const c = t.scheduledDate ? pct(t.scheduledDate) : null;
                const mid = c == null ? null : c + (86400000 / total * 100) / 2;
                const lateT = !t.done && t.scheduledDate && t.scheduledDate < today;
                return (
                  <div key={t.id} className="gl-tl-row task">
                    {mid != null && mid >= 0 && mid <= 100 && (
                      <div className="gl-tl-dia" onClick={() => openGoal(g.id)} title={`${t.title || 'Task'} · ${glShortDay(t.scheduledDate)}${t.done ? ' · done' : lateT ? ' · late' : ''}`}
                        style={{ width: 9, height: 9, top: 9.5, left: `calc(${mid}% - 4.5px)`, pointerEvents: 'auto', cursor: 'pointer', zIndex: 1,
                          background: lateT ? 'var(--red)' : g.color, opacity: t.done ? 0.45 : 1 }} />
                    )}
                  </div>
                );
              }
              if (r.type === 'goal') {
                const g = r.g;
                const d = dragOn(g.id, null);
                const [gs, ge] = glShift(g.startDate, g.targetDate, d);
                const s = pct(gs), e = pct(ge, true);
                const bar = clip(s, e);
                const fill = (s != null && e != null) ? clip(s, s + (e - s) * glProgress(g)) : null;
                const dia = e != null && e - 0.0001 <= 100 && e >= 0 ? e : null;
                const grab = canDrag && g.startDate && g.targetDate;
                return (
                  <div key={g.id} className="gl-tl-row goal" style={{ background: glTint(g.color, 0.04) }}>
                    {bar && <div className={`gl-tl-bar${grab ? ' grab' : ''}${d ? ' dragging' : ''}`} onClick={() => openGoal(g.id)}
                      onPointerDown={e2 => beginDrag(e2, 'move', g.id, null, g.startDate, g.targetDate)}
                      title={grab ? `${g.title || 'Goal'}: ${glShort(gs)} – ${glShort(ge)} · drag to move, drag an edge to resize` : `${g.title || 'Goal'}: ${glShort(gs)} – ${glShort(ge)}`}
                      style={{ top: 13, height: 20, left: bar.left + '%', width: bar.width + '%', background: glTint(g.color, 0.2) }}>
                      {dragHandles(g.id, null, g.startDate, g.targetDate)}
                    </div>}
                    {fill && <div className="gl-tl-bar" style={{ top: 13, height: 20, left: fill.left + '%', width: fill.width + '%', background: g.color, borderRadius: '9px 0 0 9px', pointerEvents: 'none' }} />}
                    {dia != null && <div className="gl-tl-dia" style={{ top: 17.5, left: `calc(${dia}% - 5.5px)`, background: 'var(--surface)', border: `2px solid ${g.color}`, pointerEvents: 'none' }} />}
                    {d && <span className="gl-tl-drag-tip" style={{ left: Math.max(0, Math.min(86, bar ? bar.left : 0)) + '%' }}>{glShort(gs)} – {glShort(ge)}</span>}
                  </div>
                );
              }
              const { g, m } = r;
              const md = dragOn(g.id, m.id);
              const [mS, mE] = glShift(m.startDate || m.dueDate, m.dueDate, md);
              const late = glMsOverdue(m, today);
              const current = !m.done && !late && (!m.startDate || m.startDate <= today);
              const s = pct(mS), e = pct(mE, true);
              const bar = clip(s, e);
              const mGrab = canDrag && m.startDate && m.dueDate;
              const st = m.done ? { background: g.color, opacity: 0.55 }
                : late ? { background: 'rgba(220,74,58,0.12)', border: '1.5px solid var(--red)' }
                : current ? { background: glTint(g.color, 0.16), border: `1.5px solid ${g.color}` }
                : { background: glTint(g.color, 0.08), border: `1.5px dashed ${glTint(g.color, 0.55)}` };
              const prog = glMsProgress(m);
              const dia = !m.done && e != null && e >= 0 && e <= 100 ? e : null;
              return (
                <div key={m.id} className="gl-tl-row ms">
                  {bar && (
                    <div className={`gl-tl-bar${mGrab ? ' grab' : ''}${md ? ' dragging' : ''}`} onClick={() => openGoal(g.id)}
                      onPointerDown={e2 => beginDrag(e2, 'move', g.id, m.id, m.startDate, m.dueDate)}
                      title={mGrab ? `${m.title || 'Milestone'}: ${glShort(mS)} – ${glShort(mE)} · drag to move, drag an edge to resize` : `${m.title || 'Milestone'}: ${glShort(mS)} – ${glShort(mE)}`}
                      style={{ top: 10, height: 14, left: bar.left + '%', width: bar.width + '%', ...st }}>
                      {current && prog > 0 && <div style={{ width: (prog * 100) + '%', height: '100%', background: glTint(g.color, 0.45), pointerEvents: 'none' }} />}
                      {dragHandles(g.id, m.id, m.startDate, m.dueDate)}
                    </div>
                  )}
                  {dia != null && <div className="gl-tl-dia" style={{ top: 11.5, left: `calc(${dia}% - 5.5px)`, pointerEvents: 'none',
                    background: late ? 'var(--red)' : current ? g.color : 'var(--surface)', border: late || current ? 'none' : `2px solid ${g.color}` }} />}
                  {md && <span className="gl-tl-drag-tip" style={{ left: Math.max(0, Math.min(86, bar ? bar.left : 0)) + '%' }}>{glShort(mS)} – {glShort(mE)}</span>}
                </div>
              );
            })}
            {todayPct != null && todayPct >= 0 && todayPct <= 100 && (
              <>
                <div className="gl-tl-today" style={{ left: todayPct + '%' }} />
                <span className="gl-tl-todaytag" style={{ left: `calc(${todayPct}% + 4px)` }}>TODAY</span>
              </>
            )}
          </div>
        </div>
      </div>
      )}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, padding: '10px 16px', borderTop: '1px solid var(--border)', fontSize: 12, color: 'var(--ink-light)' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 18, height: 8, borderRadius: 4, background: '#6a50a7', opacity: 0.55 }} />Done</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 18, height: 8, borderRadius: 4, border: '1.5px solid #6a50a7', boxSizing: 'border-box' }} />In progress</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 18, height: 8, borderRadius: 4, border: '1.5px dashed #6a50a7', boxSizing: 'border-box' }} />Upcoming</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 18, height: 8, borderRadius: 4, border: '1.5px solid var(--red)', boxSizing: 'border-box' }} />Overdue</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 8, height: 8, transform: 'rotate(45deg)', background: '#6a50a7' }} />Task on its day (▸ beside a milestone)</span>
        <span style={{ marginLeft: 'auto' }}>{canDrag ? 'Click to open · drag a bar to move it · drag an edge to resize' : 'Click a bar or name to open the goal'}</span>
      </div>
    </section>
  );
}

// Editor for a task or milestone rule (v5.11.0): what counts, how it is measured, the target, and (milestones) the window.
// `status` comes from glTaskRule / glMsRule; `onPatch` merges into the rule and clears any pause.
function GlRuleEditor({ rule, scope, status, held, done, auto, fctx, onPatch, onRemove }) {
  const exs = (fctx && fctx.fitnessExercises) || [];
  const subs = ruleSubs(exs);
  const src = rule.src || { exerciseIds: [], subs: [] };
  const subOn = name => (src.subs || []).some(x => ruleSubKey(x) === ruleSubKey(name));
  const toggleSub = name => onPatch({ src: { ...src, subs: subOn(name) ? (src.subs || []).filter(x => ruleSubKey(x) !== ruleSubKey(name)) : [...(src.subs || []), name] } });
  const toggleEx = id => { const cur = src.exerciseIds || []; onPatch({ src: { ...src, exerciseIds: cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id] } }); };
  const isHab = ruleSource(rule) === 'habits';
  const habs = (fctx && fctx.habitGoals) || [];
  const habIds = (src.habitIds || []);
  const toggleHab = id => onPatch({ src: { ...src, habitIds: habIds.includes(id) ? habIds.filter(x => x !== id) : [...habIds, id] } });
  const setSource = source => { if (source !== ruleSource(rule)) onPatch({ ...glNewRule(source), target: rule.target, window: rule.window }); };
  const spec = GL_RULE_MEASURES[rule.measure] || GL_RULE_MEASURES[isHab ? 'h-days' : 'dist-sum'];
  const match = ruleMatchSet(rule, exs);
  const matched = exs.filter(e => match.has(e.id));
  const cardioOnly = matched.length > 0 && matched.every(e => e.category === 'Cardio');
  const noCardio = matched.length > 0 && !matched.some(e => e.category === 'Cardio');
  const distLike = spec.day === 'dist' || spec.day === 'distMax' || spec.day === 'mins';
  const strengthLike = spec.day === 'reps' || spec.day === 'weightMax';
  let warn = '';
  if (isHab) warn = '';
  else if (distLike && noCardio) warn = "None of these are Cardio exercises, so they don't log miles or minutes.";
  else if (strengthLike && cardioOnly) warn = "Cardio exercises don't log reps or weight.";
  let note = '';
  if (held) note = 'Auto-check is paused because you unchecked it. Change the rule to turn it back on.';
  else if (done && auto) note = `Completed automatically${status && status.metOn ? ' · ' + glShortDay(status.metOn) : ''}.`;
  else if (status) {
    if (!status.ready) note = status.why + '.';
    else if (status.notStarted) note = `Starts counting ${glShort(status.from)}.`;
    else if (status.weekly) note = `This week ${mRound(status.value)} of ${mRound(status.target)} ${status.unit}. Best week so far ${mRound(status.best)}.`;
    else note = `Now ${mRound(status.value)} of ${mRound(status.target)} ${status.unit}.`;
  }
  return (
    <div className="gl-rule">
      {scope === 'ms' && (
        <div className="gl-rule-row">
          <span className="gl-rule-label" style={{ minWidth: 62 }}>Reads from</span>
          <button className={`gl-chip ${!isHab ? 'on' : ''}`} aria-pressed={!isHab} onClick={() => setSource('fitness')}>Fitness log</button>
          <button className={`gl-chip ${isHab ? 'on' : ''}`} aria-pressed={isHab} onClick={() => setSource('habits')}>Habits</button>
        </div>
      )}
      {isHab ? (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        <span className="gl-rule-label">What counts</span>
        <div className="gl-rule-row">
          <span className="gl-rule-label" style={{ minWidth: 62 }}>Habit</span>
          {habs.map(h => <button key={h.id} className={`gl-chip ${habIds.includes(h.id) ? 'on' : ''}`}
            aria-pressed={habIds.includes(h.id)} onClick={() => toggleHab(h.id)}>{h.name || 'Habit'}</button>)}
          {!habs.length && <span style={{ fontSize: 11, color: 'var(--ink-light)' }}>No habits yet. Add one in the Habit Tracker.</span>}
        </div>
      </div>
      ) : (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        <span className="gl-rule-label">What counts</span>
        <div className="gl-rule-row">
          <span className="gl-rule-label" style={{ minWidth: 62 }}>Subcategory</span>
          {subs.map(s => <button key={s} className={`gl-chip ${subOn(s) ? 'on' : ''}`} aria-pressed={subOn(s)} onClick={() => toggleSub(s)}>{s}</button>)}
          {!subs.length && <span style={{ fontSize: 11, color: 'var(--ink-light)' }}>None yet. Tag exercises with one (Fitness → ⚙ library) to count them together, or pick exercises below.</span>}
        </div>
        {exs.length > 0 && (
          <div className="gl-rule-row" style={{ maxHeight: 96, overflowY: 'auto' }}>
            <span className="gl-rule-label" style={{ minWidth: 62 }}>Exercise</span>
            {exs.map(ex => <button key={ex.id} className={`gl-chip ${(src.exerciseIds || []).includes(ex.id) ? 'on' : ''}`}
              aria-pressed={(src.exerciseIds || []).includes(ex.id)} onClick={() => toggleEx(ex.id)}>{ex.name || 'Exercise'}</button>)}
          </div>
        )}
      </div>
      )}
      <div className="gl-rule-row">
        <select className="gl-input" style={{ padding: '4px 6px', fontSize: 12 }} aria-label="What to measure" value={rule.measure}
          onChange={e => onPatch({ measure: e.target.value })}>
          {Object.entries(GL_RULE_MEASURES).filter(([k, v]) => (v.src === 'habits') === isHab).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <span style={{ fontSize: 12, color: 'var(--ink-light)' }}>at least</span>
        <input type="number" min="0" step="0.1" inputMode="decimal" className="gl-input" style={{ padding: '4px 6px', fontSize: 12, width: 70 }}
          aria-label="Target" placeholder="target" value={rule.target} onChange={e => onPatch({ target: e.target.value })} />
        <span style={{ fontSize: 12, color: 'var(--ink-light)' }}>{spec.unit}</span>
        {scope === 'ms'
          ? <select className="gl-input" style={{ padding: '4px 6px', fontSize: 12 }} aria-label="Time window" value={rule.window === 'week' ? 'week' : 'since'}
              onChange={e => onPatch({ window: e.target.value })}>
              <option value="since">since this milestone started</option>
              <option value="week">in a single Sun–Sat week</option>
            </select>
          : <span style={{ fontSize: 12, color: 'var(--ink-light)' }}>on this task's day</span>}
      </div>
      {note && <span style={{ fontSize: 11.5, color: 'var(--ink-light)' }}>{note}</span>}
      {warn && <span style={{ fontSize: 11.5, color: '#b03a2e' }}>{warn}</span>}
      <div className="gl-rule-row" style={{ justifyContent: 'space-between' }}>
        <span style={{ fontSize: 11, color: 'var(--ink-faint)' }}>{isHab ? 'A day counts when any chosen habit is checked off. Checking or unchecking by hand always wins.' : 'Counts completed sets only. Checking or unchecking by hand always wins.'}</span>
        <button className="gl-btn ghost" style={{ fontSize: 12 }} onClick={onRemove}>Remove auto-check</button>
      </div>
    </div>
  );
}

// One milestone in the goal editor: header row plus (when open) its tasks.
function GlMilestoneEditor({ m, goal, mctx, color, open, onToggleOpen, onChange, onDelete, onGripDown, dragging }) {
  const today = glToday();
  const [newTask, setNewTask] = useState('');
  const [focusId, setFocusId] = useState(null);
  const [picker, setPicker] = useState(null);   // task id whose schedule picker is open
  const [msRuleShut, setMsRuleShut] = useState(false);   // v5.12.1 — milestone rule editor collapsed (rule kept)
  const [ruleOpen, setRuleOpen] = useState(null);   // task id whose auto-check rule editor is open (v5.11.0)
  const tasks = m.tasks || [];
  const late = glMsOverdue(m, today);
  const fctx = { fitnessLog: mctx && mctx.fitnessLog, fitnessExercises: mctx && mctx.fitnessExercises, habitGoals: mctx && mctx.habitGoals, habitCompletions: mctx && mctx.habitCompletions, habitQty: mctx && mctx.habitQty };
  function setTask(tid, patch) {
    onChange(mm => ({ ...mm, tasks: (mm.tasks || []).map(t => t.id === tid ? { ...t, ...patch, ...(('done' in patch) ? glDoneExtra(t, patch.done) : {}) } : t) }));
  }
  function setTaskRule(tid, patch) {
    onChange(mm => ({ ...mm, tasks: (mm.tasks || []).map(t => t.id === tid ? { ...t, rule: { ...(t.rule || glNewRule()), ...patch }, ruleHold: false } : t) }));
  }
  function removeTaskRule(tid) {
    setRuleOpen(null);
    onChange(mm => ({ ...mm, tasks: (mm.tasks || []).map(t => { if (t.id !== tid) return t; const { rule, ruleHold, ...rest } = t; return rest; }) }));
  }
  const msRule = m.rule ? glMsRule(m, goal, fctx, today) : null;
  const setMsRule = patch => onChange(mm => ({ ...mm, rule: { ...(mm.rule || glNewRule()), ...patch }, ruleHold: false }));
  // v5.14.0 — which auto-complete links this goal offers, and how to switch each on/off for just this milestone.
  // A milestone with neither link set is a plain manual one and shows no extra rows (only the chips on the add-task line).
  const wtOffered = !!((goal && (goal.linkedMetrics || []).includes('weight')) || m.metric);
  const trOffered = true;   // v5.15.1 — training/habits auto-check is always offered (no per-goal switch)
  function enableWeight() {
    const asOf = new Date(); asOf.setHours(0, 0, 0, 0);
    const cur = mctx ? smoothWeight(mctx.metrics, asOf, goal && goal.startDate) : { n: 0, avg: null };
    // Default the value to the chart's weight target (one source of truth); direction from where you started
    const tgt = mctx ? mNum(mctx.weightTarget) : null;
    const b = mctx && goal ? weightBaseline(mctx.metrics, goal.startDate, asOf) : null;
    const ref = b ? b.value : cur.avg;
    const op = ref !== null && tgt !== null && ref < tgt ? '>=' : '<=';
    onChange(mm => ({ ...mm, metric: { id: 'weight', op, value: tgt !== null ? String(tgt) : '' }, metricHold: false }));
  }
  // Dropping a link keeps the milestone's done state; the auto flag goes only when no other link is left to own it
  const dropRule = mm => { const { rule, ruleHold, ...rest } = mm; if (!rest.metric) delete rest.autoDone; return rest; };
  const dropWeight = mm => { const { metric, metricHold, ...rest } = mm; if (!rest.rule) delete rest.autoDone; return rest; };
  function addTask(title, afterId) {
    const t = { id: glId('gt'), title: title || '', scheduledDate: null, done: false, completedAt: null };
    onChange(mm => {
      const list = [...(mm.tasks || [])];
      const i = afterId ? list.findIndex(x => x.id === afterId) : -1;
      if (i >= 0) list.splice(i + 1, 0, t); else list.push(t);
      return { ...mm, tasks: list };
    });
    return t.id;
  }
  return (
    <div className={`gl-ms${dragging ? ' dragging' : ''}`} style={{ borderColor: open ? color : late ? '#f0c9c3' : undefined, borderWidth: open ? 2 : 1 }}>
      <div className="gl-ms-head" style={{ background: open ? glTint(color, 0.06) : late ? '#fdf3f1' : undefined }}>
        {onGripDown && <button className="gl-grip" aria-label="Drag to reorder milestone" title="Drag to reorder" onPointerDown={onGripDown}>⋮⋮</button>}
        <button className="gl-caret" aria-label={open ? 'Collapse milestone' : 'Expand milestone'} onClick={onToggleOpen}>{open ? '▾' : '▸'}</button>
        <button className={`gl-check ${m.done ? 'on' : ''}`} aria-label={m.done ? 'Mark milestone not done' : 'Mark milestone done'}
          onClick={() => onChange(mm => ({ ...mm, done: !mm.done, completedAt: !mm.done ? Date.now() : null,
            // Reopening a weight milestone by hand must stick, or the next check would just re-complete it
            ...(mm.done && mm.metric ? { metricHold: true, autoDone: false } : {}),
            // Same for a training rule that completed it (v5.11.0); checking by hand clears the auto flag
            ...(mm.done && mm.rule && mm.autoDone ? { ruleHold: true, autoDone: false } : {}),
            ...(!mm.done ? { autoDone: false } : {}) }))}>{m.done ? '✓' : ''}</button>
        <input className="gl-inline" style={{ flex: '1 1 160px', fontSize: 14, fontWeight: open ? 600 : 500, textDecoration: m.done ? 'line-through' : 'none', color: m.done ? 'var(--ink-light)' : late ? '#b03a2e' : 'var(--ink)' }}
          placeholder="Milestone name" value={m.title} autoFocus={!m.title}
          onChange={e => onChange(mm => ({ ...mm, title: e.target.value }))} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginLeft: 'auto' }}>
          <input type="date" className="gl-input" style={{ padding: '4px 6px', fontSize: 12 }} aria-label="Milestone start"
            value={m.startDate || ''} onChange={e => onChange(mm => ({ ...mm, startDate: e.target.value || null }))} />
          <span style={{ color: 'var(--ink-faint)' }}>–</span>
          <input type="date" className="gl-input" style={{ padding: '4px 6px', fontSize: 12, borderColor: late ? 'var(--red)' : undefined }} aria-label="Milestone due date"
            value={m.dueDate || ''} onChange={e => onChange(mm => ({ ...mm, dueDate: e.target.value || null }))} />
        <span className="gl-mono" style={{ fontSize: 12, color: 'var(--ink-light)', minWidth: 34, textAlign: 'right' }}>{tasks.filter(t => t.done).length}/{tasks.length}</span>
        <button className="gl-x" aria-label="Delete milestone" onClick={() => {
          if (tasks.length && !window.confirm(`Delete "${m.title || 'this milestone'}" and its ${tasks.length} task${tasks.length === 1 ? '' : 's'}?`)) return;
          onDelete();
        }}>✕</button>
        </div>
      </div>
      {open && (
        <div>
          {/* v4.8.0 — complete this milestone from my weight. v5.7.0: only offered when the goal links Weight
              (Links → Measurements) or this milestone already uses it */}
          {m.metric && (() => {
            const asOf = new Date(); asOf.setHours(0, 0, 0, 0);
            const c = m.metric;
            const cur = mctx ? smoothWeight(mctx.metrics, asOf, goal && goal.startDate) : { n: 0, avg: null };
            const setMetric = patch => onChange(mm => ({ ...mm, metric: { ...mm.metric, ...patch }, metricHold: false }));
            return (
              <div className="gl-task" style={{ flexWrap: 'wrap', rowGap: 6 }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--ink)', minHeight: 32 }}>
                  ⚖ Completes automatically from my weight
                </span>
                {c && (
                  <>
                    <select className="gl-input" style={{ padding: '4px 6px', fontSize: 12 }} aria-label="Direction" value={c.op}
                      onChange={e => setMetric({ op: e.target.value })}>
                      <option value="<=">drops to</option>
                      <option value=">=">rises to</option>
                    </select>
                    <input type="number" step="0.1" inputMode="decimal" className="gl-input" style={{ padding: '4px 6px', fontSize: 12, width: 78 }}
                      aria-label="Weight to reach" placeholder="weight" value={c.value}
                      onChange={e => setMetric({ value: e.target.value })} />
                    <button type="button" className="gl-sched" style={{ marginLeft: 'auto' }} aria-label="Remove weight auto-complete" onClick={() => onChange(dropWeight)}>Remove</button>
                    <span style={{ fontSize: 11.5, color: 'var(--ink-light)', flexBasis: '100%', paddingLeft: 24 }}>
                      {m.metricHold ? 'Auto-complete is paused because you reopened this. Change the number to turn it back on.'
                        : m.autoDone && m.done ? 'Completed automatically.'
                        : cur.avg !== null ? `Now ${mRound(cur.avg)} (7-day average).`
                        : `Needs ${GL_MIN_READINGS} weigh-ins in 7 days since the goal started${cur.n ? ` — has ${cur.n}` : ''}. One reading never counts.`}
                    </span>
                  </>
                )}
              </div>
            );
          })()}
          {/* v5.11.0 — complete this milestone from my training (Fitness log). v5.12.0: offered when the goal has the
              "Auto-check → Fitness log" switch on (Habits & training → Edit), or when this milestone already has a rule */}
          {m.rule && (
            <div className="gl-task" style={{ flexWrap: 'wrap', rowGap: 6 }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--ink)', minHeight: 32 }}>
                ↻ Completes automatically from my training or habits
              </span>
              {m.rule && (
                <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
                  <button type="button" className="gl-sched set" aria-expanded={!msRuleShut} aria-label={msRuleShut ? 'Show auto-check rule' : 'Hide auto-check rule'}
                    onClick={() => setMsRuleShut(v => !v)}>{msRuleShut ? '▾ Show rule' : '▴ Hide rule'}</button>
                  <button type="button" className="gl-sched" aria-label="Remove auto-check" onClick={() => { setMsRuleShut(false); onChange(dropRule); }}>Remove</button>
                </div>
              )}
              {m.rule && !msRuleShut && <GlRuleEditor rule={m.rule} scope="ms" status={msRule} held={!!m.ruleHold} done={!!m.done} auto={!!m.autoDone}
                fctx={fctx} onPatch={setMsRule}
                onRemove={() => { setMsRuleShut(false); onChange(dropRule); }} />}
            </div>
          )}
          {tasks.map(t => { const tst = t.rule ? glTaskRule(t, fctx) : null; return (
            <div key={t.id} className="gl-task" style={ruleOpen === t.id ? { flexWrap: 'wrap', rowGap: 6 } : undefined}>
              <button className={`gl-check ${t.done ? 'on' : ''}`} aria-label={t.done ? 'Mark task not done' : 'Mark task done'}
                onClick={() => setTask(t.id, { done: !t.done })}>{t.done ? '✓' : ''}</button>
              <input className="gl-inline" style={{ flex: 1, fontSize: 14, textDecoration: t.done ? 'line-through' : 'none', color: t.done ? 'var(--ink-light)' : 'var(--ink)' }}
                placeholder="Task" value={t.title} autoFocus={focusId === t.id}
                onChange={e => setTask(t.id, { title: e.target.value })}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); setFocusId(addTask('', t.id)); } }}
                onBlur={() => { if (!t.title.trim()) onChange(mm => ({ ...mm, tasks: (mm.tasks || []).filter(x => x.id !== t.id) })); }} />
              <button className={`gl-sched ${t.scheduledDate ? 'set' : ''}`}
                style={t.scheduledDate ? { background: glTint(color, 0.14), color: glInk(color) } : undefined}
                onClick={() => setPicker(p => p === t.id ? null : t.id)}>
                {t.scheduledDate ? glShortDay(t.scheduledDate) : '+ Schedule'}
              </button>
              {(
                <button className={`gl-sched ${t.rule ? 'set' : ''}`} aria-expanded={ruleOpen === t.id} aria-label="Check off automatically from my Fitness log"
                  title="Check this off automatically from my Fitness log"
                  style={t.rule ? { background: glTint(color, 0.14), color: glInk(color) } : undefined}
                  onClick={() => { if (!t.rule) setTask(t.id, { rule: glNewRule() }); setRuleOpen(p => p === t.id ? null : t.id); }}>
                  {t.rule ? `↻ ${tst && tst.ready ? mRound(tst.value) + '/' + mRound(tst.target) : 'auto'}` : '↻'}
                </button>
              )}
              <button className="gl-x" aria-label="Delete task" onClick={() => onChange(mm => ({ ...mm, tasks: (mm.tasks || []).filter(x => x.id !== t.id) }))}>✕</button>
              {picker === t.id && <GlSchedulePicker value={t.scheduledDate} onPick={d => setTask(t.id, { scheduledDate: d })} onClose={() => setPicker(null)} />}
              {ruleOpen === t.id && t.rule && <GlRuleEditor rule={t.rule} scope="task" status={tst} held={!!t.ruleHold} done={!!t.done} auto={!!t.autoDone}
                fctx={fctx} onPatch={p => setTaskRule(t.id, p)} onRemove={() => removeTaskRule(t.id)} />}
            </div>
          ); })}
          <div className="gl-task" style={{ flexWrap: 'wrap', rowGap: 4 }}>
            <span style={{ width: 18, textAlign: 'center', color: 'var(--ink-faint)' }}>+</span>
            <input className="gl-inline" style={{ flex: '1 1 160px', fontSize: 14 }} placeholder="Add a task — press Enter" value={newTask}
              onChange={e => setNewTask(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && newTask.trim()) { e.preventDefault(); addTask(newTask.trim()); setNewTask(''); } }} />
            {/* v5.14.0 — turn on an auto-complete link for just this milestone; the rows above appear once it is on */}
            {((wtOffered && !m.metric) || (trOffered && !m.rule)) && (
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginLeft: 'auto' }}>
                {wtOffered && !m.metric && <button type="button" className="gl-sched" title="Complete this milestone automatically from my weight" onClick={enableWeight}>⚖ Auto from weight</button>}
                {trOffered && !m.rule && <button type="button" className="gl-sched" title="Complete this milestone automatically from my training or habits"
                  onClick={() => { setMsRuleShut(false); onChange(mm => ({ ...mm, rule: glNewRule(), ruleHold: false })); }}>↻ Auto from training or habits</button>}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function GlDetail({ goal, onChange, onDelete, onBack, pagesData, onOpenPage, habitGoals, fitnessExercises, habitCompletions, fitnessLog, mctx }) {
  const today = glToday();
  const linkWeekStart = getWeekStart(new Date());
  const [openMs, setOpenMs] = useState(() => { const n = glNextMilestone(goal); return n ? { [n.id]: true } : {}; });
  const [linksOpen, setLinksOpen] = useState(false);
  const h = glHealth(goal, today);
  const counts = glTaskCounts(goal);
  const c = goal.color || '#7c3f6e';
  const ms = goal.milestones || [];
  const pages = (pagesData || []).filter(p => p && p.id);
  function setMs(mid, fn) { onChange(g => glPatchMs(g, mid, fn)); }
  // Drag a milestone by its grip to reorder (pointer events, so it works with a finger or Pencil on the iPad)
  const msListRef = useRef(null);
  const [msDrag, setMsDrag] = useState(null);          // { id, idx } idx = insertion slot among the current list
  function beginMsDrag(e, id) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const slotAt = y => {
      const els = [...(msListRef.current ? msListRef.current.querySelectorAll('[data-msid]') : [])];
      for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return i; }
      return els.length;
    };
    let idx = slotAt(e.clientY);
    setMsDrag({ id, idx });
    const move = ev => { idx = slotAt(ev.clientY); setMsDrag({ id, idx }); };
    const end = (ev, cancel) => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', cn);
      setMsDrag(null);
      if (cancel) return;
      onChange(g => {
        const list = [...(g.milestones || [])];
        const from = list.findIndex(x => x.id === id);
        if (from < 0) return g;
        const to = idx > from ? idx - 1 : idx;
        if (to === from) return g;
        const [it] = list.splice(from, 1); list.splice(Math.max(0, Math.min(list.length, to)), 0, it);
        return { ...g, milestones: list };
      });
    };
    const up = ev => end(ev, false), cn = ev => end(ev, true);
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', cn);
  }
  function addMs() {
    const m = glNewMilestone(goal);
    onChange(g => ({ ...g, milestones: [...(g.milestones || []), m] }));
    setOpenMs(o => ({ ...o, [m.id]: true }));
  }
  const healthText = h.key === 'done' ? 'Goal complete.'
    : h.key === 'parked' ? 'Parked — not counted against your active goals.'
    : h.key === 'upcoming' ? `Starts ${glShort(goal.startDate)}.`
    : h.key === 'behind' && goal.targetDate && today > goal.targetDate ? `Target date passed ${glDays(goal.targetDate, today)} days ago.`
    : `${h.p >= h.used ? 'Ahead of pace' : h.key === 'ontrack' ? 'Roughly on pace' : 'Behind pace'}${ms.some(m => glMsOverdue(m, today)) ? ', with an overdue milestone' : ''}.${h.daysLeft != null ? ` ${h.daysLeft} day${h.daysLeft === 1 ? '' : 's'} to target.` : ''}`;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      <button className="gl-btn ghost" style={{ alignSelf: 'flex-start', paddingLeft: 0 }} onClick={onBack}>‹ All goals</button>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, alignItems: 'flex-start' }}>
        <div className="gl-card" style={{ flex: '999 1 520px', minWidth: 0, overflow: 'visible' }}>
          <div style={{ height: 6, background: c, borderRadius: '16px 16px 0 0' }} />
          <div style={{ padding: '16px 20px 14px', borderBottom: '1px solid var(--border)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <input className="gl-inline" placeholder="Goal name" value={goal.title} autoFocus={!goal.title}
                style={{ flex: 1, fontFamily: "'Playfair Display', serif", fontSize: 26, fontWeight: 600 }}
                onChange={e => onChange(g => ({ ...g, title: e.target.value }))} />
              <GlHealthPill h={h} />
            </div>
            <textarea className="gl-inline" rows={2} placeholder="Why does this matter? (optional)" value={goal.why || ''}
              style={{ width: '100%', resize: 'vertical', fontSize: 14, fontStyle: 'italic', color: 'var(--ink-light)', marginTop: 4, boxSizing: 'border-box' }}
              onChange={e => onChange(g => ({ ...g, why: e.target.value }))} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 8 }}>
              <div className="gl-bar" style={{ flex: 1, height: 8, background: glTint(c, 0.15) }}><div style={{ width: Math.round(glProgress(goal) * 100) + '%', background: c }} /></div>
              <span className="gl-mono" style={{ fontSize: 12, color: 'var(--ink-light)' }}>{Math.round(glProgress(goal) * 100)}% · {counts.done} of {counts.total} tasks</span>
            </div>
          </div>
          <div style={{ padding: '14px 20px 20px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span className="gl-label">Milestones</span>
              <button className="gl-btn" onClick={addMs}>+ Add milestone</button>
            </div>
            {!ms.length && <div style={{ fontSize: 13, color: 'var(--ink-light)', padding: '6px 2px' }}>Break the goal into milestones — checkpoints with dates — then add tasks under each one and schedule them into your weeks.</div>}
            <div ref={msListRef} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {ms.map((m, i) => (
                <React.Fragment key={m.id}>
                  {msDrag && msDrag.idx === i && <div className="gl-ms-drop" data-testid="ms-drop" />}
                  <div data-msid={m.id}>
                    <GlMilestoneEditor m={m} goal={goal} mctx={mctx} color={c} open={!!openMs[m.id]}
                      dragging={!!msDrag && msDrag.id === m.id}
                      onGripDown={ms.length > 1 ? (e => beginMsDrag(e, m.id)) : null}
                      onToggleOpen={() => setOpenMs(o => ({ ...o, [m.id]: !o[m.id] }))}
                      onChange={fn => setMs(m.id, fn)}
                      onDelete={() => onChange(g => ({ ...g, milestones: (g.milestones || []).filter(x => x.id !== m.id) }))} />
                  </div>
                </React.Fragment>

            <span className="gl-label">Health</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 }}>
              <span style={{ width: 72, color: 'var(--ink-light)' }}>Work done</span>
              <div className="gl-bar" style={{ flex: 1, height: 8, background: glTint(c, 0.15) }}><div style={{ width: Math.round(h.p * 100) + '%', background: c }} /></div>
              <span className="gl-mono" style={{ fontSize: 12, width: 36, textAlign: 'right' }}>{Math.round(h.p * 100)}%</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 }}>
              <span style={{ width: 72, color: 'var(--ink-light)' }}>Time used</span>
              <div className="gl-bar" style={{ flex: 1, height: 8 }}><div style={{ width: Math.round(h.used * 100) + '%', background: 'var(--ink-light)' }} /></div>
              <span className="gl-mono" style={{ fontSize: 12, width: 36, textAlign: 'right' }}>{Math.round(h.used * 100)}%</span>
            </div>
            <div style={{ fontSize: 13, color: h.key === 'ontrack' || h.key === 'done' ? '#22573c' : h.key === 'atrisk' ? '#7a4f00' : h.key === 'behind' ? '#b03a2e' : 'var(--ink-light)' }}>{healthText}</div>
          </div>

          <div className="gl-card" style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
            <span className="gl-label">Linked</span>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <select className="gl-input" style={{ flex: 1 }} value={goal.notesPageId || ''} aria-label="Linked notes page"
                onChange={e => { const v = e.target.value || null; onChange(g => ({ ...g, notesPageId: v })); }}>

          {/* v4.7.0 — habits and training this goal is built on */}

              ? <button className="gl-btn primary" style={{ flex: 1, minHeight: 42 }} onClick={() => onChange(g => ({ ...g, status: 'done', completedAt: Date.now() }))}>Mark goal done</button>
              : <button className="gl-btn" style={{ flex: 1, minHeight: 42 }} onClick={() => onChange(g => ({ ...g, status: 'active', completedAt: null }))}>Reopen goal</button>}
            {goal.status === 'active' && <button className="gl-btn" style={{ minHeight: 42 }} onClick={() => onChange(g => ({ ...g, status: 'parked' }))}>Park</button>}
            {goal.status === 'parked' && <button className="gl-btn" style={{ minHeight: 42 }} onClick={() => onChange(g => ({ ...g, status: 'active' }))}>Unpark</button>}
